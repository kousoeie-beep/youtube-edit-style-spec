name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install PyYAML==6.0.3 numpy==2.4.6 pillow==12.3.0
      - name: Validate YAML specifications
        working-directory: youtube-edit-style-spec
        run: python styles/lint.py
      - name: Run overlap QC regression tests
        working-directory: overlap_qc
        run: python -m unittest -v test_overlap_qc.py
      - name: Compile Python tools
        run: >-
          python -m py_compile
          overlap_qc/overlap_qc.py
          overlap_qc/test_overlap_qc.py
          youtube-edit-style-spec/styles/lint.py
          youtube-edit-style-spec/styles/yamledit.py
          youtube-edit-style-spec/verify/measure.py
          youtube-edit-style-spec/verify/yamledit.py
