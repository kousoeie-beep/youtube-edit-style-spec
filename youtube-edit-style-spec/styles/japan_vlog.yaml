style_id: japan_vlog
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: 実測（カット律/視覚リズム/LUFS/LRA/無音=ffmpeg実測・全編） / 推定（配色HEXは360p目視近似、n=1で高予算セレブ系のためインディーvlogとの一般化幅は要注意）

format:
  aspect: 16:9               # 実測（レターボックス約2.35:1シネマ枠を常時付与＝既存資産と一致する演出）
  typical_duration: 8-20分
  cuts_per_min: 10.4          # 実測（scene0.3: 144カット/13.85分。既存資産5.0-5.9より高い＝高予算セレブ系は編集密度が上がる）
  visual_rhythm_per_min: 16.1  # 実測（scene0.08: 223イベント/13.85分）
  camera: mixed                # 実測（固定+緩やかな手持ち・スローパン併用）
  broll_usage: occasional      # 実測（TV映像・部屋のディテール・街歩きインサート）

palette:
  background_hex: "#F2F0EC（ミニマル白グレー室内）"   # 推定
  brand_hex: []                # 装飾色を使わない（既存資産と一致）
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#FFFFFF"      # キャプション白1色/タイムスタンプ白文字
      # （emphasis_rolesの記述から変換・原文にHEX記載なし）
    # 【2026-07-27 重複キーの解消】ここには `color_bg: null` があり、下の adaptive 座布団用
    # `color_bg` に**後勝ちで上書きされて消えていた**（今朝の私の追記が作った事故）。
    # 旧記述の内容（タイムスタンプの半透明グレーピルはHEX未記載＝未マップ）は下へ統合する。
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
      # 推測での黒指定は行わない
    color_accent: null
    cushion_policy: adaptive   # 【2026-07-27 判断・正本どうしの衝突を解消】
      # 実測: グリフ画素単位で背景輝度>0.65 が **24.5%**、
      # **WCAG AA 4.5:1未満のグリフ画素が95.7%**。座標を動かしても改善しなかった。
      # ここは2つの正本が正面衝突していた:
      #   - environment-notes.md: 背景輝度0.65超では座布団が**必須**
      #   - 本スタイルの実測意匠: 縁取りも座布団も**無い**のがVlogの見え方
      # **可読性を優先しつつ意匠を最大限残す**ため、常時ではなく
      # **背景輝度が閾値を超える区間だけ座布団を出す（adaptive）**と決める。
      # - 判定: 字幕のグリフ画素領域の背景輝度が0.65を超える画素が**20%以上**の区間
      # - 出すもの: 不透明度35%程度の黒座布団（縁取りは足さない＝袋文字化しない）
      # - 明るい空・雪・白壁のカットでだけ出るので、Vlogの静かな見え方は保たれる
      # ※閾値20%と不透明度35%は**未計測の導出値**。実素材で調整すること
    color_bg: "rgba(0,0,0,0.35)"   # 【2026-07-27追加】上記adaptive座布団の色。
      # 従来 color_bg が無く「座布団を出そうにも色が定義されていない」状態だった。
      # ※タイムスタンプの「半透明グレーピル」はHEX未記載のため未マップ（旧記述を統合）。
      # ※**この黒座布団は白文字を前提としている**。entertainment_variety の実測で、
      #   暗い文字色に黒座布団を敷くとコントラストが 2.93:1 → **1.03:1 に悪化**した。
      #   本スタイルの字幕は白文字なので黒でよいが、暗い文字のroleには使わないこと
    color_stroke: "none"       # 【2026-07-27】nullから"none"へ。キャプションは「縁取り無し」と
      # 明記されており、これは**意図的に縁取りが無い**という積極的な事実である。
      # nullだと「未計測」「未記入」と区別がつかない（下記の三値規約を参照）
    color_primary: null
    color_glow: null
  emphasis_roles:
    キャプション: 白1色・縁取り無し・柔らかい影のみ
    タイムスタンプ: 半透明グレーピル+白文字

telop_layers:
  - role: timestamp_pill     # 【2026-07-27 role分離修正】旧: role: caption。本ファイルには
    # variant_splitが無く、下記「バイリンガルキャプション」と機能の異なる2装置（時刻表示ピル
    # vs 発話字幕）が同一role名"caption"を共有していた（監査3横断論点・structured
    # fieldに時間的排他性フラグが無いという構造的欠陥の一例）。timestamp_pillへ分離。
    # タイムスタンプ表示: 半透明グレーの小型ピルで時刻を提示（「AM:9:30」）。朝パートで断続的に出現。実測
    size: {width: 320, height: 104}   # 【2026-07-27追加】上帯回避の検算の前提
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit: fade   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    font_px: 48   # 【2026-07-27 R9追加】size.height 104 から逆算（行高70 + padding17×2 = 104）。
      # **書かないと実装者がフォントを発明し、ピルの高さが変わって上帯回避が崩れる**
    padding_px: 17   # 【2026-07-27 R9追加】(104 − 行高70) / 2
    max_width_px: 286   # 【2026-07-27 R9追加】size.width 320 − padding17×2
    char_width_px: 24   # 【2026-07-27 R9追加】実測文言「AM:9:30」は**半角英数字**で、1字の送りは font_px の約半分
    max_chars: 8   # 【2026-07-27 R9追加】8×24 = 192 ≤ 286。「AM:9:30」は7字
    max_lines: 1   # 【2026-07-27 R9追加】1行のピル
    overflow_policy: split_event   # 【2026-07-27 R9追加】max_lines:1 のため
    position: {centerX: 0.1, centerY: 0.199}   # 【2026-07-27 R10】上帯とのすきまが7.3pxだった。0.199 = 214.9px、上端159.9pxですきま29.0px
      # 旧0.15は上帯（y<131px）に**16px侵入し、グリフの11.4%が消失**した
      # （目視でピルの角丸が水平に切り落とされていた）。
      # nameplateと同じ理由で動かすべきだったのに、前回の修正で**このroleだけ置き去り**にした。
      # 0.19 = 205.2px。高さ約104pxとして上端153pxで、上帯下端131px+余白16pxを満たす
    persistent: false
    style: プレーン
    z_order: 1                  # 【2026-07-27 z_order遡及追加】画面左上の断続要素。
      # 他要素（右上ロゴ・下部キャプション）とは領域が分離しており衝突なし
    entrance: fade
  - role: caption            # 【2026-07-27 role分離修正】上記timestamp_pillと同一role名を
    # 共有していたが分離済み。このcaptionは発話字幕として一意になった。位置(0.5,0.87)は
    # timestamp_pill(0.1,0.15)とX/Y双方向で大きく離れており、たとえ同時表示されても
    # pixel衝突は生じない。
    # バイリンガルキャプション: 日本語1行+英語訳1行の2段、下部中央・縁取り無し・薄影のみ。既存資産(日本語単独)より国際発信仕様が拡張された固有観測
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    char_width_px: 92   # 【2026-07-27 R9・掃引】このroleの**折返しを律速するのは和文**なので、
      # 1字の送り = font_px（全角）。欧文が混ざっても実幅はこれより狭くなるので安全側。
      # 「宣言が無い＝既定で全角」と同じ値だが、**掃引したことを明示するために書く**
      # （書かないと「見落としたのか、全角でよいのか」が次の実装者に伝わらない）
      # （バイリンガル字幕だが日本語側が律速する）
    max_chars_total: 32   # 【2026-07-27 R10新設】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値を総量として置く。実測できたら上書きすること
      # 1500 ÷ 92 = 16.30 → 1行16字、2行で32字
    position: {centerX: 0.5, centerY: 0.717}   # 【2026-07-27 再修正・レターボックス対応】
      # 0.87 でも**下の黒帯（y>949px）に食い込む**。2段字幕の高さ約250pxで
      # 下端1064px＝帯に115px埋没し、英語行が丸ごと不可視になっていた。
      # 0.75 = 810px、下端935pxで帯上端949pxの手前に収まる。
      # ※レターボックスにroleが無かったため、この制約が誰にも見えていなかった
    max_width_px: 1500           # 【2026-07-27追加】max_chars:25は和文1875px/英文620pxで
      # **3倍の差**があり、バイリンガル1roleを1つの値で縛れていない。
      # 幅で縛るのが正しい（和文なら実質20字相当）
      # 【旧記述】旧centerY 0.92
      # から変更。本ロールは日本語+英語の2段(2行)構成だが、SKILL.mdのposition解釈規約
      # （複数行は最終行の下端が画面外に出ないよう繰り上げる）で検算すると、
      # 2行分の高さを目安70-80px/行×1.3行間×2行=182-208pxと仮定した場合、
      # 旧centerY0.92では下端=0.92×1080+高さ/2(≈97)=1091.6px となり画面外(1080px)に
      # 約11.6px見切れる。centerYを0.87へ繰り上げ、下端=0.87×1080+97=1036.6pxとし
      # 画面内に収めた（documentary_immersiveの同種修正と同じ考え方）
    persistent: false
    style: プレーン
    # 【2026-07-27 重複キーの解消】ここには以前 `max_width_px: 未計測` があり、
    # 上の `max_width_px: 1500` と**同一エントリに2回**書かれていた。
    # YAMLは後勝ちなので**1500は機械的に存在していなかった**（パーサ実測で確認済み）。
    # 上の1500を正として本行を削除した。以下は旧注記:
      # 折返し幅が無いとmax_charsは「そのフォントサイズでのみ有効な脆い定数」になる。
      # 実素材で折返し幅を測ってから数値に置き換えること（schema.mdの規約）
    max_lines: 2                 # 【2026-07-27追加・実測で必須と判明】行数上限が無かったため、
      # 幅を1500pxに狭めた結果**かえって行数が増えて侵入が悪化**した
      # （1875pxなら3行で31px侵入 → 1500pxで4行86px侵入）。**幅と行数は同時に縛る**。
      # 2行なら下端926pxで下帯上端949pxに対し23pxの余裕がある（実測）
    max_chars: 16                # 【2026-07-27 R5・lintの穴を塞いで検出】旧20は**一度も拘束しない死に値**
      # だった（20字×font92=1840px > max_width_px 1500px で、1行に入るのは16字）。
      # **幅を足したときに文字数を直していなかった**。3スタイルで同型                # 【2026-07-27 修正】旧25は1875px相当で max_width_px 1500 と矛盾。
      # 1500pxの和文は約20字
    z_order: 2                  # 【2026-07-27 z_order遡及追加】発話キャプションとして
      # caption(タイムスタンプ,1)より前面。nameplate(3)より背面
    entrance: fade
    exit: fade
  - role: letterbox          # 【2026-07-27 新設・実害あり】2.35:1シネマ枠の上下黒帯。
    # apply_notes が「16:9素材に上下黒帯を追加するポスト処理を**標準セットに含める**」と
    # 無条件で命じているのに **telop_layers にroleが無く、z_orderもsizeも持てなかった**。
    # 結果、上下131pxのバーが **nameplate を pixel_collision 1.0 で完全に消し**、
    # caption の英語行に100px食い込んで2行目が丸ごと不可視・1行目は水平に半分切断された。
    # レイヤー順の指定も無いため検証者は両解釈を作り分けたが**どちらでも破綻**した。
    # ※本ファイルの破綻は「role数が少ないから安全」ではなく
    #   **「roleを持たない装置があるかどうか」**で決まっていた（3スタイル比較で確認）
    text_content: none   # 【2026-07-27 R8追加】黒帯そのもので文字を持たない。
      # 「size だけあって中身の指定が無い」検査からの明示的な除外
    edge_bleed: true   # 【2026-07-27 R10追加】レターボックスの黒帯そのもの。画面幅いっぱいに敷くのが設計。4辺検算からの明示的な除外
    color_shadow: "none"   # 【2026-07-27 R10追加】黒帯にドロップシャドウは無い。影を数えると下の要素との検算が狂う
    position: {centerX: 0.5, centerY: 0.0606}   # 【2026-07-27 再定義】上帯の中心
      # （131/2 = 65.5px → 65.5/1080 = 0.0606）
    size: {width: 1920, height: 131}   # 【2026-07-27 再定義】**上帯だけ**の寸法。
      # 旧定義は size: 1920x1080（全画面）としていたが、実測で**QCの9ペア全部が
      # bbox_ratio 100%** になり、実害5件と無害4件が同じFAIL行に並んだ。
      # 帯は全画面ではなく上下2本なので、**帯そのものの寸法**で書くのが正しい。
      # こうすれば「帯と交差した要素」だけが衝突として出る
    persistent: true
    style: 帯
    z_order: 9                   # **最前面**。他の全要素より前に置き、
      # 「黒帯に隠れない位置」に他要素を配置する制約として働かせる
    entrance: hard_cut
    entrance_sec: 0
    exit: hard_cut
    exit_sec: 0
  - role: letterbox_bottom   # 【2026-07-27 新設】下帯。上記letterboxと対。
    text_content: none   # 【2026-07-27 R8追加】黒帯そのもので文字を持たない。
      # 「size だけあって中身の指定が無い」検査からの明示的な除外
    edge_bleed: true   # 【2026-07-27 R10追加】同上（下帯）。4辺検算からの明示的な除外
    color_shadow: "none"   # 【2026-07-27 R10追加】黒帯にドロップシャドウは無い。影を数えると下の要素との検算が狂う
    position: {centerX: 0.5, centerY: 0.9394}   # (1080-65.5)/1080
    size: {width: 1920, height: 131}
    persistent: true
    style: 帯
    z_order: 9
    entrance: hard_cut
    entrance_sec: 0
    exit: hard_cut
    exit_sec: 0
    # 【他roleへの制約・2026-07-27 端基準へ書き直し】
    # 上帯は **y < 131px**、下帯は **y > 949px** を占有する。この帯域に要素を置いてはいけない。
    # ※旧記述は「centerY 0.121未満と0.879超が禁止帯」と**中心基準**で書いていたが、
    #   これは schema.md 自身が禁じる書き方（中心と端の取り違え）だった。
    #   実測で**この制約を100%守った実装が5レイヤー中4レイヤーで帯を侵した**。
    # **正しい判定式（要素の端で見る）**:
    #   上帯を侵さない: centerY×1080 − 高さ/2 − フチ幅 − 3(影) ≥ 131 + 16   ※ぼかしは左上にも3px広がる
    #   下帯を侵さない: centerY×1080 + 高さ/2 + フチ幅 + 12(影) ≤ 949 − 16   ※影は右下+12px（2026-07-27 実測で7→12へ訂正）
  - role: nameplate          # ブランドロゴ透かし: 右上に小型ロゴを常時薄く表示。実測
    size: {width: 160, height: 52}   # 【2026-07-27追加】寸法が無いままだと、上帯回避の成立が
      # 実装者の発明値に依存する。**ロゴ高さが84pxを超えると事故が完全再現する**（実測）
    text_content: none   # 【2026-07-27 R9追加】ロゴ画像そのもので文字組みを持たない。「size だけあって中身が無い」検査からの明示的な除外（ブランドロゴ透かし）
    position: {centerX: 0.943, centerY: 0.164}   # 【2026-07-27 R10】上帯（letterbox 下端130.9px）とのすきまが0.9pxだった。
      # 0.164 = 177.1px、上端145.1px…影−3で148.1px＝すきま17.2px
      # 定めているのに機械照合が無く、手検算で毎周どこかが抜けていた。
      # 旧 0.95 は**右4.0px**。0.943 で右17.4px
      # **レターボックスの上帯（y<131px）に完全に飲まれ pixel_collision 1.0 で消滅**した。
      # 0.16 = 172.8px で上帯の下端131pxを回避する
    persistent: true
    style: プレーン
    z_order: 3                  # 【2026-07-27 z_order遡及追加】常駐要素のため最前面。
      # 画面右上の小型透かしで他要素とは領域が分離しており衝突なし

caption_font: |
  未計測（360p目視近似のため原寸不明）。このスタイルは「縁取り無し・柔らかい影のみ」
  という控えめな意匠が特徴のため、chaenデフォルト（フォント92/黒フチ12px）を
  そのまま適用しない。採用すべきデフォルト:
  - バイリンガルキャプション（日本語+英語2段）: 目安70-80px/行相当、黒フチ無し
    （薄い影のみ）。2段構成のため1行あたりのサイズはdocumentary_immersiveのB2系
    （英語圏ミニマル・70-80px推奨）に準じる。
    ※**2026-07-27 更新**: centerYは0.87ではなく**0.75**（レターボックス下帯の回避）。
      旧記述の「centerY0.87計算」は下帯を考慮していなかった。
      **行数上限は2行**（max_lines: 2）。3行以上にすると下帯に食い込む
  - タイムスタンプピル: 目安40-48px相当、半透明グレー地に白文字
  - ブランドロゴ透かし: フォントというよりロゴ画像素材（サイズ未計測）
  いずれも未計測の推定値であり、実装時は完成フレームでの目視比較を必須とする

z_order_policy: |
  【2026-07-27 role分離に伴い更新（監査3対応）】旧「タイムスタンプ表示」はcaptionロールを
  「バイリンガルキャプション」と共有していたが、機能の異なる2装置のため
  timestamp_pillへ分離した（telop_layers本体参照）。位置が大きく離れており
  （X/Y差とも0.3以上）pixel衝突は無い。

  【2026-07-27 全面更新・旧記述は誤りだった】旧記述は
  「3要素（タイムスタンプ=左上0.1,0.15／キャプション=下部中央0.5,0.87／ロゴ=右上0.95,0.05）は
  いずれも異なる領域に固定配置されており相互のpixel衝突は発生しない」としていたが、
  **レターボックスの黒帯を数に入れていなかった**ため誤りだった。
  実測でロゴは pixel_collision 1.0 で完全消失、タイムスタンプは上帯に16px侵入して
  グリフの11.4%が消失、キャプションは英語行が黒帯に消えた。

  **現行の座標（レターボックス対応後）**:
  タイムスタンプ=左上(0.1, 0.19) / バイリンガルキャプション=下部中央(0.5, 0.75) /
  ブランドロゴ=右上(0.95, 0.16) / letterbox上帯(0.5, 0.0606) / 下帯(0.5, 0.9394)。
  **黒帯(z=9)が最前面**であり、他の全要素は y<131 と y>949 を避けて配置する。z_orderはpersistent要素（ロゴ,3）を最前面、
  発話に紐づくバイリンガルキャプション(2)をその次、断続的なタイムスタンプ(1)を
  最背面とした。
  唯一の実装上の注意はバイリンガルキャプション自体の「画面下端見切れ」問題
  （centerY0.92→0.87への修正、上記telop_layers参照）であり、これは他要素との
  衝突ではなくSKILL.mdのposition解釈規約（複数行字幕は下端が画面外に出ないよう
  centerYを繰り上げる）に基づく単独要素の修正である。

animation_dictionary_mapping:
  テロップ: in.fade / out.fade のみ（バウンス・ポップ等の動的アニメ不使用）   # 実測（既存資産と一致）
  カメラ: cam.handheld（緩やかなドリフト）/ cam.pan_lr（スローパン）
  不使用: cam.punch_in_hold / ワイプ / スピードランプ（本編ほぼ実速度）   # 実測

transitions:
  default: hard_cut          # 実測（基本ストレートカット）
  accent: []                 # 本セグメントでは黒フェード等の章境界演出は未検出（既存資産にはdip_to_black記録あり、長尺では出現の可能性）

audio:
  bgm: conditional            # 未確認（本セグメントでは背景音楽の有無を波形単独で断定できず。既存資産のalways運用も参照）
  voice_lufs_target: -22.8    # 実測（ebur128 Integrated）
  lra: 19.0                   # 実測（既存資産13.1-20.7と高い整合＝ラウドネス平坦化しないのがジャンル文法との確認）
  se_style: none               # 実測
  ducking: false               # 未検証

pacing:
  gap_keep_sec: 0.5-1.5        # 実測寄り（silencedetect -35dB/0.5s: 65回/13.85分）
  filler_policy: keep_character   # 実測（行為の始点/終点でカットするアクションベース編集、既存資産と一致）
  hook: cold_open              # 実測（挨拶・自己紹介無しで朝の日常描写から即開始）
  structure: 時系列チャプター進行（起床→TV/身支度→外出→ジム）→静かな場面転換   # 実測

packaging:
  thumbnail_style: 未取得
  chapter_style: 場所・行為単位の時系列進行（既存資産と一致）
  endcard: 未確認（13.85分内では検出なし）

apply_notes: |
  Palmierパイプラインでの適用:
  - cuts_per_min 10.4は既存資産のインディー系vlog(5.0-5.9)より倍近く高い。高予算・著名人系vlogを求められた場合はこのプリセット、素朴な日常系vlogを求められた場合は既存資産vlog_notalking_lifestyle（低カット・BGM常時）を使い分ける。
  - LRA19.0の広いダイナミックレンジは死守すること。自動音声正規化・コンプレッサーを強くかけるとジャンルの「雰囲気」が失われる（chaen式-15〜-18への一律ノーマライズは禁止）。
  - バイリンガルキャプション（日本語+英語の2段）は既存資産に無い固有要素。海外リーチを意図する高予算vlogでは字幕生成パイプラインで2言語同時出力するモードを用意する。
  - レターボックス（2.35:1シネマ枠）は既存資産・本実測共通の演出。適用時は16:9素材に上下黒帯を追加するポスト処理を標準セットに含める。
