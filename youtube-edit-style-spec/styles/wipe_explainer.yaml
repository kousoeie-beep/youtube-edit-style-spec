style_id: wipe_explainer
source: |
  実測サンプル: n=3。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（カット律/視覚リズム/LUFS/LRA/無音回数=ffmpeg実測、PiPボックスの座標・サイズ・
  入退場方式=30fpsフレーム単位+ピクセルスキャンで実測、複数時刻でのボックス境界の
  再現性確認込み） / 推定（配色HEXは360p圧縮のため近似、ボックスの縁取り・ドロップ
  シャドウ有無は360p解像度の制約で確定不可、丸角半径は目視推定）
  **【2026-07-25 n増でn=3へ拡張済み】**「n=1のためジャンル一般化はlow-medium」という
  旧記述は撤回する。WE2・WE3の追加実測により、**再現するのは voice_lufs -16〜-17台と
  「画面共有+PiP」の構造**、**再現しないのはカット率・LRA・2実装混在**と切り分け済み
  （末尾の「n増検証の結果」対照表を参照）。

  【重要な自己修正の記録】実測作業中、`ffmpeg -ss T -i` （入力側シーク）を用いた広域
  タイル生成で、キーフレームスナップにより実際の抽出内容が指定秒数と数秒〜十数秒
  ずれる事例を発見した。これにより当初「t=225に円形アバター名札」「t=270-295に
  B-roll挿入」等の誤読が生じたが、`ffmpeg -i -ss T`（出力側シーク・全編デコード）で
  全て再検証し訂正した。誤読だった「円形アバター名札」はスクリーンショット内アプリUI
  の誤読と判断し、本yamlには含めていない。確信度が低い/未確認の項目は下記
  apply_notesに明記し、捏造していない。

format:
  aspect: "16:9"
  duration_sec: "353-1983（WE1353.4 / WE2929.5 / WE31983.4）"   # 実測（n=3）。
    # 【2026-07-25更新】旧記述は353の単一値だったがn増で大きく幅が出た。
    # **尺はチャンネル差が非常に大きく、目標値として使ってはいけない**
  cuts_per_min: "2.00-17.83（WE117.83 / WE22.00 / WE314.45）"   # 実測（n=3）。
    # 【2026-07-25更新】**n増でチャンネル差が極めて大きいと判明。原本の17.83を目標値にしてはいけない**。
    # 以下は原本(WE1)単体の内訳: hook区間(0-30s)=60.0/分と
    # post-hook本編区間(30-353.4s)=13.91/分に二極化。hookはB-rollフラッシュモンタージュが牽引
  visual_rhythm_per_min: 53.65   # 実測（scene0.08=316回/353.4s）
  camera: mixed               # 実測（2人同時ショット⇔画面共有+PiPワイプの反復、B-roll/宣伝バンパー
    # インサート複数あり）
  broll_usage: occasional      # 実測（AI/金融系ストックのフラッシュモンタージュ1箇所+社宣伝/外部
    # 制作会社宣伝バンパー計2箇所を確認。ワイプ様式そのものとは独立したインサート）

palette:
  background_hex: "煉瓦/グリッド柄のオレンジ系装飾テクスチャ（チャンネルブランドカラーと推定、
    画面共有パートのブラウザウィンドウ背景）"   # 実測目視、360pのため近似
  brand_hex: ["#C1AC20(大型見出しテロップ、ヒストグラム実測)", "#F7E24A(POINTバナー内強調文字、ヒストグラム実測)", "#6BCD6A(CTA/紹介バナー、ヒストグラム実測)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: ["#C1AC20", "#FFFFFF"]  # #C1AC20=大型見出しテロップ文字（brand_hex実測）、
      # #FFFFFF=POINTバナー白文字メイン/CTAバナー白文字・推定（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_bg: ["#000000", "#6BCD6A"]  # #000000=POINTバナー黒背景（emphasis_rolesの記述から変換・原文にHEX記載なし）、
      # #6BCD6A=CTA/紹介バナー背景・明るい緑（brand_hex実測）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: "#F7E24A"    # POINTバナー内のキーワード強調黄文字（brand_hex実測）
    color_stroke: "未計測"      # 【2026-07-27】nullから"未計測"へ。大型見出しテロップの
      # 「濃色縁取り」/POINTバナーの「金/黄縁」は色相のみ言及・HEX不明瞭で、
      # 濃色は黒と断定できず金は白黒以外につき変換不可。
      # **これは「縁取りが無い」ではなく「測れていない」**。nullでは両者が区別できない
    color_primary: null
    color_glow: null
  emphasis_roles:
    大型見出しテロップ: オリーブ黄緑#C1AC20塗り+濃色縁取り（360pのため縁色は目視推定）。画面横断的な超大型文字（1-2文字が画面高の1/3-1/2）
    POINTバナー: 黒背景+金/黄縁の角丸バナー、白文字メイン+黄文字#F7E24A系で一部キーワード強調
    CTA/紹介バナー: 明るい緑#6BCD6A背景、白文字と推定

telop_layers:
  - role: nameplate           # 【変種: PiPパターンAのみ・2026-07-27 監査3レビューで確認】
    # 下記PiPパターンBと同一role名を共有するが、z_order_policyに明記の通りA/Bは時間排他
    # （A=hook区間t≈2.5-10sのみ、B=本編デフォルト）で同時表示されない。正当な変種
    # （パターン）スコープの重複であり分離不要。この時間排他の明記はSKILL.mdの推奨する
    # 「変種固有の装置には対応するroleを作る/同時表示されないなら明示するだけでよい」の
    # 既存の好例（監査3・documentary_narrated_jp横断監査で言及）。
    # ワイプ（PiPパターンA=開幕フチ合わせ成長型）: 画面共有全体に対し
    # 右下フチ合わせ（右端・下端ともに余白ゼロ）で人物映像を重ねる。丸角は左上のみ。
    # hook区間（t≈2.5-10s）でのみ確認、時間経過とともに緩やかに拡大（後述apply_notes）。実測
    layer_kind: video            # 【2026-07-27追加】このroleは**動画レイヤー**であり
      # overlap_qc の検査対象から自動的に除外される（アルファを静的に取れないため）。
      # screen_tutorialの検証では生成20レイヤーに対し element_count=19 となり、
      # **PiP絡みの衝突8件がQCに1件も現れなかった**。QCの盲点は既知でも
      # 「どのroleが盲点に落ちるか」がyamlから読めなかったので機械可読な印を付ける。
      # **このroleは必ずフレーム目視で確認すること**
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    position: {centerX: 0.82, centerY: 0.71}   # t=3.0s実測中心（left64.2%/top43.1%/right100%/bottom100%の中心）
    persistent: true
    style: プレーン
    z_order: 4                  # 【2026-07-27 z_order遡及追加】callout(3)より前面、
      # テロップ群(5-7)より背面。下記z_order_policyの数値対応表を参照。
      # パターンB(同じく4)とは時間排他のため同値でよい
    variant: pip_pattern_A       # 【2026-07-27追加】「【変種: PiPパターンAのみ】」という
      # 日本語コメントは変種スコープを表現できないためフィールド化
    mutually_exclusive_with: nameplate   # 【2026-07-27追加】もう一方のnameplateエントリ
      # （パターンB）と時間排他。A=hook区間t≈2.5-10sのみ / B=本編デフォルト。
      # z_order_policyに「**同時に出してはいけない**」と太字で書きながら
      # フィールドが無く、実装者に届かない状態だった
    entrance: pop            # 実測（フェード/ポップインなし、ハードカット直後に完成形で瞬間出現。
      # 「pop」は辞書上の分類上の割当てで、実際はスケール/透明度アニメーションゼロの「即時出現」）
  - role: nameplate           # 【変種: PiPパターンBのみ・2026-07-27 監査3レビューで確認】
    # 上記PiPパターンAと同一role名を共有するが、両者は時間排他のため同時表示されない。
    # 正当な変種スコープの重複であり分離不要。
    # ワイプ（PiPパターンB=本編フローティングカード型、デフォルト）:
    # 画面共有パネル右下角に軽くオーバーラップする形で浮かぶ、4隅丸角の正方形に近いカード。
    # 右端から6.1%・下端から2.5%の余白あり。t=150/165/180/255/270の5時点で境界が完全固定
    # （誤差1px以内）＝ズーム・移動なしの静的オーバーレイ。本編を通じてのデフォルト実装。実測
    layer_kind: video            # 【2026-07-27追加】このroleは**動画レイヤー**であり
      # overlap_qc の検査対象から自動的に除外される（アルファを静的に取れないため）。
      # screen_tutorialの検証では生成20レイヤーに対し element_count=19 となり、
      # **PiP絡みの衝突8件がQCに1件も現れなかった**。QCの盲点は既知でも
      # 「どのroleが盲点に落ちるか」がyamlから読めなかったので機械可読な印を付ける。
      # **このroleは必ずフレーム目視で確認すること**
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    position: {centerX: 0.827, centerY: 0.778}   # 実測（left71.4%/top58.1%/right93.9%/bottom97.5%の中心）
    persistent: true
    style: プレーン
    z_order: 4                  # 【2026-07-27 z_order遡及追加】パターンA(同じく4)とは
      # 時間排他のため同値。詳細は下記z_order_policy
    variant: pip_pattern_B       # 【2026-07-27追加】本編のデフォルト実装
    mutually_exclusive_with: nameplate   # 【2026-07-27追加】パターンAと時間排他
    entrance: pop            # 実測（同上、ハードカット直後に瞬間出現）
  - role: keyword              # 大型見出しテロップ: 1-2文字の超大型文字（画面高の1/3-1/2）を
    # オリーブ黄緑#C1AC20+濃色縁取りで画面横断的に配置。画面共有パートに重ねて表示。実測
    max_width_px: 非該当          # 【2026-07-27追加】このroleだけは折返し幅が
      # 拘束条件にならない。1-2文字を**画面高の1/3-1/2**まで拡大する意匠であり、
      # 効いているのは幅ではなく高さだから。他roleとは前提が違う点に注意
    max_lines: 1         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 見出し/バッジ系は1行が前提（2行になると帯の高さが倍になり近接要素を潰す）。
      # 収まらない文言は行を増やすのではなく**文言を短くする**こと
    variant_constraint: 本roleはPiPパターンB（本編）区間でのみ使用する   # 【2026-07-27追加】
      # caption/sidebar には硬い制約を入れたのに、**同じ理由で衝突するこのroleが
      # 散文のままだった**。font 567px時の右端は1338pxで、
      # パターンAのPiP（左端1188px）と **150×561px＝17.4%** 交差する（実測）
    mutually_exclusive_with: [caption, sidebar, callout]   # 【2026-07-27追加・実測で構造的衝突が確定】
      # 【2026-07-27 追記】calloutを追加した。再検証で「caption/sidebar側に相互記載が無い」
      # 「callout×keywordが未宣言」と指摘されたため。**排他は必ず両側に書く**
      # （片側だけだと、もう一方のroleだけ読んだ実装者に伝わらない）
      # z_order_policyの数値表は実装時に一意に効いたが、**効いた結果として実害が出た**:
      #   - keyword(5) < POINTバナー(6) → 大型見出しの**下半分が破壊**（pixel 99.1%）
      #   - keyword(5) < CTA帯(7)      → 上1/3が**切り落とし**（pixel 1.0）
      # 後者は z_order_policy が一言も触れていないのに、座標から衝突が構造的に確定していた
      # （CTA下端629 > keyword上端463）。
      # 大型見出しは画面高の1/3-1/2を占めるため、**下部の帯類とは共存できない**。
      # z_orderの前後を入れ替えても「どちらかが読めない」ことに変わりはないので
      # 排他にする。共起させたい場合はkeywordのサイズを大幅に落とす＝別の意匠になる
    max_chars: 2                # 【2026-07-27 追加】散文で「1-2文字の超大型文字」と
      # 実測されていたのに機械可読な制約が無かった（documentary_immersiveで同じ欠落が
      # 実害を出したため横断掃引して発見）。3文字以上にすると画面高の1/3-1/2という
      # サイズが維持できず別の意匠になる
    stroke_px: 12   # 【2026-07-27 R6追加・実測で確定】袋文字の縁幅。**フォントサイズに比例させない**（絶対値）。
      # 「11.5」という出どころ不明の値は12pxの丸め損ないだった。
      # 実測: 縁12px+ぼかし影で下方向の張り出し**22px**（yamlの23.5と1.5px差でほぼ正しい）。
      # **R5の「実測16px」の方が誤り**で、影をぼかさずに測った値と1pxの差もなく一致した。
      # 比率解釈（12/92を外挿して74px）を採ると張り出し84pxで**下へ61px切断**する。
      # 解釈を固定しないと下端が**62px振れる**
    overflow_policy: split_event   # 【2026-07-27 R6 一括掃引】`max_lines: 1` だけでは折返しは止まらない。
      # 折返し器は max_chars で改行するので**結果の各行は制約を満たしたまま2行になる**
      # （ai_tool_avatarで実測。**documentary_immersive が退行したという私の当初の報告は誤り**で、
      #  R6のFAILは検証者が意図的に作った違反対照窓＝14字「max_lines:1 違反の対照」だった。
      #  掃引そのものは正しい——10ファイルが本当にこのフィールドを欠いていた）。
      # 超過は折り返さず**複数のテロップイベントへ分割する**
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit: fade   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.4, centerY: 0.7}   # 目視（左寄り〜画面中央下部、テロップ内容により変動）
    persistent: false
    style: 袋文字
    z_order: 5                  # 【2026-07-27 z_order遡及追加】テロップ群の最背面。
      # POINTバナー(6)と共起した場合は本要素が背面に回る（下記z_order_policy参照）
    entrance: fade            # 推定（フェードイン基調、複数文字が段階的に追記される「毎回」→
      # 「毎回毎回」のような積み増し表示を確認。ポップ/スライド等の動きは未確認）
  - role: caption              # POINTバナー: 黒背景+金/黄縁の角丸バナー、chatGPTスタディモードの
    # 要点まとめに使用。実測
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit: fade   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.5, centerY: 0.836}   # 【2026-08-01 R12】下 14.5px → 18.3px。4辺検算が `size` 宣言ありのroleしか見ておらず、11周この役は一度も検査されていなかった
      # 【2026-07-27 見切れ修正】
      # 2行化で高さ256pxになり、0.88のままだと**下端が5px切れた**（実レンダで確認）。
      # 0.84 = 907.2px、2行256px+フチ11.5px+影12px（2026-07-27 R3訂正。旧「7px」は実測で+11〜12pxと判明）で下端1058.7px（画面内）
    variant_constraint: 本roleはPiPパターンB（本編）区間でのみ使用する   # 【2026-07-27追加】
      # **max_width_px 790 はパターンB（左端1371px）からしか逆算していなかった**。
      # パターンA（hook・フチ合わせ成長型、左端は成長後で1188px）では
      # **172×271px＝21.6%でPiPの人物の顔を覆う**（実測）。
      # 幅をパターンAにも合わせると424pxになり、POINTバナーとして成立しない。
      # → **hook区間（t≈2.5-10s＝パターンA）ではPOINTバナーを出さない**運用とする。
      # 原本でもhookは高速B-rollモンタージュでPOINTバナーは使われていない
    max_width_px: 790            # 【2026-07-27 再修正】1400では**PiPを避けられない**。
      # 再検証で27字が2行1288pxに収まったものの、**PiPとの重なりが31.0%へ拡大**した
      # （前回15.9%）。PiPパターンBの左端は1371pxなので、
      # 右端を1355px以下に収めるには**幅790px以下**が必要（実測から導出）。
      # 1400px指定は「収まった」ように見えて実は悪化させていた
    max_lines: 2                 # 【2026-07-27追加】幅を狭めると行数が増える。
      # 幅と行数は必ず同時に縛る（japan_vlogで同じ失敗をした）
    mutually_exclusive_with: keyword   # 【2026-07-27追加】上記keywordからの相互記載
    persistent: false
    style: 帯
    z_order: 6                  # 【2026-07-27 z_order遡及追加】大型見出し(5)より前面。
      # 情報量のある要素を優先して読ませる判断（下記z_order_policy参照）
    entrance: fade            # 推定
  - role: sidebar              # CTA/紹介バナー: 明るい緑の帯、「スタディツール紹介」「チャンネル
    # 登録・GOODボタンよろしくお願いします！」等。実測
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit: fade   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.5, centerY: 0.44}   # 【2026-07-27 衝突修正】2行化で高さ258pxになり
      # 0.5のままだと下端629pxがPiP上端627pxに食い込む。
      # 0.44 = 475.2px、下端604.2pxでPiP上端627pxの手前に収まる
    max_width_px: 1500           # 【2026-07-27】折返し幅が無く実測で**1708px＝画面幅の88.9%**
      # まで伸びていた。CTA帯として左右に余白を残す
    variant_constraint: 本roleはPiPパターンB（本編）区間でのみ使用する   # 【2026-07-27追加】
      # captionと同じ理由。パターンAでは 527×188px でPiPを覆う（実測）
    max_lines: 2                 # 【2026-07-27追加】1500pxに縛った結果1行→2行になり
      # 高さが154→258pxへ増え、**PiP重なりが0.5%→9.4%に悪化**した（実測）
    mutually_exclusive_with: keyword   # 【2026-07-27追加】上記keywordからの相互記載
    persistent: false
    style: 帯
    z_order: 7                  # 【2026-07-27 z_order遡及追加】CTA/紹介バナーは画面中央を
      # 占有し視線を独占させる装置のため最前面
    entrance: fade            # 推定
  - role: callout              # 【2026-07-25 追加】UI要素への赤系コールアウト
    # n増検証で「使わない」という原本(n=1)の記述が誤りと判明したのに、本文だけ訂正して
    # telop_layersへのrole追加を怠っていたため補完する（適用検証の横断監査で発覚）。
    # 実測: WE2=赤矢印 / WE3=赤矩形枠。画面共有中のUI要素を指し示す。
    # screen_tutorialで確定した「操作対象=赤」の文法と整合する。
    # ※原本(WE1)はこれを使わないが、それはチャンネル固有の癖であってジャンルの型ではない
    position: {centerX: null, centerY: null}   # 指し示す対象のUI座標に依存するため固定値なし
    persistent: false
    style: 赤矩形枠 / 赤矢印（線幅は画面高の0.4-0.6%目安・未計測）
    mutually_exclusive_with: keyword   # 【2026-07-27追加】大型見出し(keyword)と排他。
      # **排他は必ず両側に書く**（片側だけだと、もう一方のroleだけ読んだ実装者に伝わらない）
    z_order: 3                 # ワイプ(PiP)より背面、画面共有映像より前面
    # 【2026-07-27 実測で判明した制約】この順序により **PiPの下にあるUI要素は
    # 原理的に指せない**（callout(3) < PiP(4)）。実測で callout×PiPパターンB が
    # bbox 65.2% 重なり、**赤枠が幅65pxの破片**になった。
    # PiPは右下フチ合わせ〜右下カードなので、**右下領域のUIをコールアウトの
    # 対象にしない**こと。**境界の数値（2026-07-27 追加）**:
    # パターンA（hook）= **x≥1188・y≥421**、パターンB（本編）= x≥1371・y≥627。
    # ※パターンAの値は2026-07-27に訂正。旧記述の x≥1233・y≥466 は**成長前の値**で、
    #   パターンAは時間とともに拡大するため**45px過小申告**していた。成長後の値を採る。
    # この矩形に入るUIは指せない。対照実験で、従った側は赤画素の**80.7%が可視**、
    # 破った側は**19.5%**しか残らず矢印が完全消失した（実測）。どうしても必要ならPiPを一時的に消すか反対側へ寄せる。
    # ※PiPは layer_kind: video のため overlap_qc の検査対象外。
    #   この衝突はQCに1件も現れない（自前検算と目視でのみ発見できる）
    entrance: hard_cut         # 未計測（推定。fade_sec=0と仮定）
    exit: hard_cut             # 未計測（推定）

caption_font: |
  未計測（360p素材のため原寸不明。**このスタイルは他の14ファイルと違い caption_font が
  丸ごと欠落していた**のを2026-07-27の横断監査で発見し補完した）。
  採用すべきデフォルト:
  - caption（POINTバナー・黒背景+金/黄縁の角丸バナー、白文字+黄文字強調）:
    chaenデフォルト（フォント92/黒フチ12px）をベースに、バナー内に収めるため
    やや小さめの目安60-72px相当
  - keyword（大型見出しテロップ）: **1-2文字がグリフ実高で画面高の1/3-1/2**。
    1080pなら **font 401-567px**（2026-07-27 **再訂正**。実測で交わりを直接求めた）。
    ※前回「378-567px」としたが**下限が外れていた**。378pxのグリフ実高は
      349-358px＝**32.3-33.15%H**で、1/3（360px＝33.33%）に**全6文字で届かない**。
      原因は「480→457px（比率0.952）」からの線形外挿で、実測は480→**452px（0.9417）**と
      **外挿元の比率が過大**だった。二分探索で360pxに達するfontは
      脳390 / 覚醒380 / 最速382 / 登録382 / 国401 で、**全語を満たす下限は401px**。
    ※**字形による構造的な穴がある**: 「一」のような横棒中心の字は
      font 567 で 76px＝7.0%H、**font 900 でも118px＝10.9%H**にしかならず、
      **どんなサイズでも1/3に到達しない**（2026-07-27 数値ラベルを訂正。
      旧記述は「font 900 で76px」としていたが76pxは font 567 の値だった。結論は不変）。
      ※**`font.getbbox()` を寸法の逆算に使ってはいけない**（「一」に限らない）。
      フォントの設計上のボックスを返すため実インクと乖離する。「一」では
      実インク118pxに対し **410px＝3.5倍** を返した（実測）。必ず実描画の画素で測ること。
      1文字見出しに横棒字を使う場合、この比率制約は適用できない。
    旧記述の「360-540px」は**下限が自己矛盾**していた。font 360pxのグリフ実高は
    **342px＝31.7%H** で、同ファイルが要求する「1/3以上」を満たさない。
    **フォント指定値とグリフ実高は違う**ので、比率制約から逆算するときは
    必ず getmetrics() の実測を通すこと。
    また上限567pxをcenterY 0.7のまま使うと切断されうる。
    ※**2026-07-27 再検証では切断は再現しなかった**（実測下端1070/1080）。
      （旧記述の「18.5px切断」は上記の通り誤った和だった）
      原因は**グリフ単体要素の垂直アンカー規約が未定義**なこと。
      「centerYがグリフの幾何中心なのか、ベースラインなのか、外接矩形の中心なのか」で
      下端が動く。**振れ幅は十数pxではなく実測247px**（**font 567 の場合**。mm下端1054.0 / 幾何中心1022.5 / ベースライン807.0。フォントサイズに比例するので他サイズでは値が変わる）。
      2026-07-27の再検証では下端1051/1080で切断は起きなかったが、
      **既定アンカーが未指定のままなので実装者によって結果が変わる**。**この規約が決まるまで、上限付近のフォントを使う場合は
      必ず実フレームで下端を確認すること**（計算では判定できない）。
    ※旧記述は「ドロップシャドウが切れる」としていたがこれは**旧上限540pxでの挙動**（影2.5px）。
      567pxでは**袋文字の黒フチ11.5px＋影12px＝23.5px**が切れる。
      # 【2026-07-27 R5 訂正】旧記述の「＝18.5px」は**影7px時代の和**（11.5+7）で、
      # 影を12へ直したときに**和を更新し忘れていた**（2周にわたり残存し、
      # 直上270行目もこの18.5を引用していた）。
      # ※さらに実測の張り出しは**16px**で、23.5とも18.5とも一致しない。
      #   「11.5」という縁幅の出どころが**どのフィールドにも無い**のが根本原因。
      #   実素材で縁幅を測り `stroke_px` としてフィールド化すること。
      #   同注記の「下端1055.3（黒フチ下端1040）」「余裕39」も実測1052.0/40と合わない
      centerY 0.66 なら下端1055.3pxで**切断ゼロ**（黒フチ下端1040px、余裕39px）。実測済み。
    ※「1/3-1/2」は**グリフ実高**の基準であり、袋文字のフチ込みでは測らない
    （同じ実装で41.7%と53.5%になり合否が反転する）。他スタイルとは桁が違う点に注意
    （このスタイル最大の意匠であり、小さくすると別物になる）
  - sidebar（CTA/紹介バナー・緑帯）: 目安56-72px相当
  - nameplate（PiPワイプ）: 映像素材でありフォント指定は非該当
  keyword以外は未計測の推定値であり、実装時は完成フレームでの目視比較を必須とする

z_order_policy: |
  【2026-07-27 追加】このスタイルは要素数が少なく同時表示も限定的だが、
  監査で「PiPパターンA/Bが時間的に排他なのに両方 persistent: true」という
  意味論的な誤用が指摘されている。実装時の解釈を固定する:

  - **PiPパターンA(開幕フチ合わせ成長型)とB(本編フローティングカード型)は時間排他**。
    A=hook区間(t≈2.5-10s)のみ、B=本編のデフォルト。**同時に出してはいけない**。
    両方が `persistent: true` なのは「各区間内では常駐」という意味であって
    「全編で常駐」ではない（yamlの表現力の限界。実装時はこの注記に従うこと）
  - 重なり順（2026-07-27に数値を確定。1-2は画面共有映像/ベース素材の予約席）:
    画面共有映像(1-2・予約席) < callout(3・UI要素を指す) < PiPワイプ(4・A/Bは時間排他で同値)
    < 大型見出しテロップ(5) < POINTバナー(6) < CTA/紹介バナー(7・最前面)
  - **大型見出し(5)とPOINTバナー(6)の前後関係は、共起時に情報量のある方を読ませる判断**で
    決めた（共起条件そのものは未文書化＝下記の通り実フレーム確認が必要）。
    共起させない設計にするのが第一選択であり、この数値は「万一重なったときの保険」である
  - **大型見出しテロップは画面高の1/3-1/2を占める**ため、POINTバナー(centerY 0.88)や
    PiP(centerY 0.71-0.78)と共起すると衝突しうる。**共起条件は未文書化**であり、
    実装時は同時刻に両方を出さない設計にするか、出す場合は実フレームで目視確認すること

animation_dictionary_mapping:
  ワイプ(PiP)の入退場: 即時出現/即時消滅（ハードカット直後に完成形、フェード・ポップ・スライド
    等のトランジションは一切検出されず）   # 実測（30fpsフレーム単位で確認）
  ワイプ(PiP)⇔2人同時ショットの切替: ハードカット（別トラックの排他的切替、クロスフェード無し）   # 実測
  ワイプ(PiP)パターンAのみ: 緩やかなパンチイン（右下アンカーでの拡大、5-7秒程度かけて幅35.8%→
    38.1%・高さ56.9%→61%へ成長。画面共有背景のブラウザウィンドウ自体も同じ比率で拡大する
    ことを確認しており、フレーム全体に対するズームである可能性が高い）   # 実測（要因は推定、
    # 「PiPが元の画面録画に埋め込み済みで、その録画全体に後編集でパンチインをかけている」
    # 仮説が最も整合的だが未確定）
  大型見出しテロップ: in.fade（複数文字の積み増し表示あり） / 消滅は未確認   # 推定
  不使用: crop_zoom等の映像ズーム語彙をワイプ自体には未使用（パターンAの「成長」はワイプ単体の
    # スケールアニメではなく画面全体パンチインと解釈、上記参照）

transitions:
  default: hard_cut          # 実測（全編でディゾルブ・ワイプ形状トランジション未検出）
  accent: []                 # 実測範囲では装飾トランジション無し

audio:
  bgm: conditional            # 推定（LRA12.0LU・無音ほぼ皆無というパターンから軽いBGMベッドの
    # 可能性はあるが聴取未実施。confidence: low）
  voice_lufs_target: -16.4    # 実測（Integrated、全編）
  lra: 12.0                   # 実測
  true_peak: -4.1             # 実測（dBFS）
  se_style: unknown            # 未検証
  ducking: false               # 未検証（推定）

pacing:
  gap_keep_sec: 0-0.3          # 実測（silencedetect -35dB/0.5s基準で全編2回のみ検出、いずれも
    # 1秒未満＝ほぼ完全に無音を詰める早口解説型）
  filler_policy: unknown        # 未検証（口語の残し方は今回未確認）
  hook: cold_open              # 実測（0秒から2人同時ショットで即発話開始、フック区間が高速
    # B-rollモンタージュ+ロゴバンパーで15-20秒程度続いた後、本編に入る構成）
  operation_wait_policy: N/A    # 本ジャンルはPC操作解説ではないため非該当

packaging:
  thumbnail_style: 未取得
  chapter_style: 未取得（章立てを示す常駐要素は本実測範囲では未確認）
  endcard: true               # 実測（3人の写真+感謝メッセージ+おすすめ動画導線2枠+
    # チャンネル登録訴求。本編中盤には別途、宣伝バンパー2種類とサムネ風CTAスライドを確認
    # したが、これらはendcardとは別のインサート）

apply_notes: |
  chaen-youtube-editパイプラインでの適用方法（こうすけの「完コピ」要求への対応指針）:

  【ワイプ実装は2パターンを使い分ける必要がある】本ジャンルの最大の特徴は、同一動画内に
  性質の異なる2つのPiP実装が混在すること。「完コピ」を目指すなら、どちらを再現対象にする
  かをkousukeに確認するか、用途に応じて使い分けるのが安全。
  1. **フチ合わせ成長型（パターンA）**: 右端・下端がフレーム端に完全フラッシュ（余白ゼロ）、
     丸角は左上のみ。実装は`overlay`フィルタで人物クロップをx=in_w-ow, y=in_h-ohに固定配置
     すればよいが、時間経過での緩やかな拡大（パンチイン）を再現する場合は、SKILL.md既存の
     「時間可変式のcropフィルタ（tを含む明示式）」を画面共有ベース映像全体に適用したうえで、
     人物PiPをそのベース映像に事前合成してからパンチインをかける（PiPを独立レイヤーとして
     後からズーム対象外にする実装は本ジャンルの観測と矛盾するため避ける）。
  2. **フローティングカード型（パターンB、本編のデフォルト）**: 4隅丸角・右下に余白ありで
     浮かぶ正方形に近いカード（幅22.5%×高さ39.4%、centerX82.7%/centerY77.8%）。既存の
     PiP合成実装（`overlay`フィルタでx/y固定・角丸マスク）をそのまま流用可能。**ズーム・
     移動は一切無し**（5時点で境界完全固定を確認済み）なので、実装は最もシンプルな固定
     オーバーレイでよい。呼び出し時に特に指定が無い場合は、このパターンBをデフォルト
     採用することを推奨する（本編を通じての使用頻度が高く、かつ実装がシンプルで再現性が
     高いため）。
  - 角丸の半径は360p実測のため中confidence（パターンA:ボックス幅の7-10%程度、パターンB:
    ボックス幅の20-25%程度・squircle的な大きめの丸み）。実装時は高解像度素材（1080p以上）
    で追加検証してから確定値を採用することを推奨する。
  - 縁取り・ドロップシャドウの有無は360p解像度の制約で確定できなかった（未確認）。実装時に
    kousukeへ「縁取りをつけるか」を確認するか、まずは無しで実装し目視比較することを推奨。

  【入退場アニメーション】ワイプの出現・消滅、および2人同時ショットとの切替は、確認できた
  全事例で**ハードカット即時出現/消滅**（フェード・ポップイン・スライド等のトランジション
  演出は一切無し）。実装はPalmierのトラック単位でのクリップ差し替え、またはoverlayの
  enable='between(t,..)' による即時表示切替で十分。screen_tutorial.yamlのST2型
  （顔出しワイプ⇄画面共有のハードカット）と同じ設計思想。

  【画面共有コンテンツの見せ方】フルウィンドウ表示（部分クロップではなく、ブラウザウィンドウ
  ごと、traffic-lightボタン・URLバー・サイドバー込みで表示）。screen_tutorialの
  framing_mode: full_source〜app_windowに近い。

  **【重要・2026-07-25 n増検証で訂正】UI要素へのコールアウトは「使う」が正しい。**
  当初n=1（WE1）の観測から「一度も確認されず＝callout_mode: none相当」と記述していたが、
  同ジャンル2本の追加実測で **2本とも赤系コールアウトを確認**（WE2=赤矢印、
  WE3/アドネス=赤矩形枠）。これはWE11本限定の観測をジャンル一般化してしまった誤りで
  あり、**このスタイルを適用する際は赤系コールアウトを使ってよい**（screen_tutorialで確定した
  「操作対象=赤」の文法と整合する）。WE1が使わなかったのはチャンネル固有の癖と解釈する。

  【2人同時ショットについて】画面冒頭・本編中の「2人並び」ショットは、当初split-screen
  （左右分割合成）と想定していたが、精密検証の結果、背景（コンクリート壁・斜め光条）が
  2人にまたがって連続しており、**継ぎ目のない1枚のワイドショット**と判明した。分割線・
  境界エフェクトの実装は不要（単純に2人が並んで映る通常のワイドショット素材を使えばよい）。

  【n増検証の結果・2026-07-25】同ジャンル2本を追加実測しn=1→n=3に拡張した。
  追加実測: WE2「Google AI Studioの画面シェア」(＜動画ID非公開＞・929.5秒・実デコード96%)、
  WE3/アドネス「東大生が実演解説」(＜動画ID非公開＞・1983.4秒・実デコード99%)。
  ※候補5本のうちメンタエクセル(GTWAxYLNuHE)・ひかりのai_news_weekly系サンプル(vZgLhMfvcUo)は
