style_id: documentary_narrated_jp
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（cuts_per_min/visual_rhythm_per_min/LUFS/LRA/TruePeak/無音回数=D1・D2両本で
  ffmpeg実測、telop_layers・配色・構成=D1・D2両本ともタイル絵コンテ目視で確認）/
  推定（テロップの入退場アニメーション種別=静止画タイルサンプリングのため断定不可、
  BGM有無・フォント名=聴取/解像度の制約で未検証、n=2かつ**D1とD2は視覚文法・音響設計とも
  全く異質な2つの下位フォーマット**であるため「日本語ナレーション系」全体への一般化は
  低い）

  【最重要の自己検証: D1とD2は同一グループに括るべきか要再検討】D1(D1=日本の民放ニュース
  ドキュメンタリー枠)とD2(D2=海外制作の日本語吹替/翻訳ドキュメンタリー)は、
  「日本語ナレーションで進行する」という表層的な共通点はあるが、テロップ文法・音響設計
  ともに別ジャンルと呼べるほど異なることをタイル目視・数値実測の両面で確認した。
  D1は日本のTV局報道フォーマット（局ロゴバグ・氏名年齢下三分の一・事実要約テロップ）、
  D2は英語圏ドキュメンタリーの構造をそのまま翻訳した二言語字幕システム（英語原文+日本語訳の
  二段字幕）。この違いは捏造ではなく実測結果であり、詳細はstructure_grammar/apply_notes参照。

format:
  aspect: "16:9"
  duration_sec: "1480-2505（D1=1479.8/D2=2504.5）"   # 実測
  cuts_per_min: "5.75-11.30（D1=5.75/D2=11.30）"   # 実測
  visual_rhythm_per_min: "8.59-22.16（D1=8.59/D2=22.16）"   # 実測。D1は10本中最も
    # visual_rhythmが低い（静的な報道素材・インタビューの多用が要因と推定）
  camera: "mixed（D1実測: 警察・現場の報道クルー撮影素材、住民インタビュー、法廷スケッチ
    的な静止画、記者スタンドアップリポートが中心。再現ドラマ/演者を使った再現映像は
    確認されず＝実写報道素材のみで構成。D2実測: 俳優による再現ドラマ映像(暗い岩山・
    たいまつ・氷河のような環境で古代人を演じる)、専門家インタビュー(本棚背景の
    トーキングヘッド)、CG/イラストによる科学的説明図解の3種が反復）"
  broll_usage: "frequent（両本とも。D1=事件現場の空撮・焼け跡・裁判所外観等の報道映像、
    D2=氷河のミイラ実物ショット・地図アニメーション・出土品CG）"

palette:
  background_hex: "D1実測: 局ロゴ・タイトルはやや彩度の高い水色/オレンジの幾何学模様
    （オープニングのカレイドスコープ演出）。本編は報道映像そのままで背景色の概念は薄い。
    D2実測: 再現ドラマ部分は青緑〜灰色の低彩度シネマティックグレーディング、
    インタビュー部分は暖色系の書斎/図書館背景"
  brand_hex: ["#FFFFFF(両本共通・字幕/テロップ文字は基本白、実測目視)",
    "#000000系(黒縁取り・両本共通、実測目視)",
    "D1: D1局ロゴバッジは半透明グレー地に白文字(実測目視)",
    "D2: 二言語字幕は色や縁取りをほぼ持たない素の白文字（他ジャンルと比較して最も
    装飾性が低い、実測目視）"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#FFFFFF"      # 両本共通・字幕/テロップ文字は基本白（brand_hex実測）
    color_bg: "#000000"        # D1_事実要約テロップの黒背景バー
      # （emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示・最後の1件】
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応。
      # **これを足すと fact_caption(centerY 0.92) の帯下端が 1075→1082px で画面外になる**
      # （影を数えるか否かで同じyamlから合否が反転していた）。
      # 影を使わない設計にするなら "none" と書くこと。使うなら centerY を下げる必要がある
    color_accent: "#FFFFFF"    # D2_ロワーサードの「細い金/白のアクセント罫線」のうち白部分
      # （brand_hex実測から変換）。金部分は色相のみ言及でHEX未記載のため含めない
    color_stroke: "#000000"    # 黒縁取り・両本共通（brand_hex実測・系）
    color_primary: null        # D1のD1局ロゴバッジは「半透明グレー地」と記載されるが
      # 具体的HEXなし。グレーは白黒以外につき変換不可のため未マップ
    color_glow: null
  emphasis_roles:
    D1_事実要約テロップ: "白文字+黒背景バー（「5人殺害」「2軒放火」等、事件の核心情報を
      画面下部に短く提示）。強調色や縁取りの色分けは無く、情報の直接提示に徹する。実測目視"
    D1_人物名+属性ロワーサード: "白文字（氏名+年齢や続柄、被害者・関係者を示す属性ラベル
      「殺害された」等が上に付く2階建て構造）。D1固有のTV報道フォーマット。実測目視"
    D2_人物名+肩書ロワーサード: "白文字の英語表記名（THIN小型キャップス）+細い金/白の
      アクセント罫線。**日本語訳が別レイヤーで隣接表示される**（「トレイシー・ターナー /
      博物館学芸員・歴史学者」等）。英語原版の意匠に日本語訳を後付けした二重構造で、
      D1とは全く異なる由来のロワーサード文化。実測目視"

telop_layers:
  # ==== D1固有（D1・日本TV報道ドキュメンタリー型） ====
  - role: logo_badge             # 【2026-07-27 role分離修正】旧: role: nameplate。
    # 同一yaml内で「人物名ロワーサード」にも`nameplate`が割り当てられており、常駐局ロゴバッジと
    # いう別装置が同じrole名を共有していた（documentary_immersiveで既に修正済みの
    # logo_badge/person_nameplate分離パターンと全く同型の欠陥。実装者レポート
    # `documentary_narrated_jp.md`が「証言/引用キャプションのz_order=1の理由が不明」等と
    # 併せて指摘）。documentary_immersiveと同じrole名`logo_badge`に統一する。
    # 常駐局ロゴバッジ: 画面右上に半透明グレー地の「D1 NEWS CH」ロゴが本編を通じて常時表示。
    # 実測（hook〜end全区間で確認、end.jpgでは末尾フェードアウトの様子まで連番タイルで確認）
    size: {width: 200, height: 64}   # 【2026-07-27 R3追加】**右23px外**へ出ていた。
      # centerX0.94=1804.8pxでは幅206px以下しか許されない（影12px込み）
    variant: variant_tv_incident          # 【2026-07-27 R3追加】常駐2roleに variant が無く、
      # **D2区間でもD1局ロゴが常駐**していた（実フレームで確認）
    font_px: 27   # 【2026-07-27 R11追加】size 200x64 に "D1 NEWS CH"(11字) を padding8 で収める最大値。
      # font27で幅191px / font28で198px → 超過。
      # **これが無いと R10 で centerX 0.933 により確保した右余裕16.6pxが、
      # 実装者のフォント選択1つで消える**（R11実測: font34を発明したら右余裕7px・
      # 目視で灰色プレートより文字が広くはみ出した）
    padding_px: 8   # 【2026-07-27 R11新設】上の導出が使っている値
    position: {centerX: 0.933, centerY: 0.05}   # 【2026-07-27 R10・4辺検算】右端が3.2pxだった。0.933 = 1791.4px で右16.6px
    persistent: true
    style: プレーン（半透明グレー地）
    z_order: 5                    # 常駐要素として最前面固定
    entrance: hard_cut              # 実測（開始時に完成形で表示。fade_sec=0）
    entrance_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（実測）
    exit: fade                       # 実測（end連番タイルで、ロゴの不透明度が段階的に
      # 下がり最終的に完全に消えるまでの過程を複数フレームで確認）。fade_sec: 2.0（実装検証
      # `documentary_narrated_jp.md`で採用した値。連番タイル間隔からの推定であり、フレーム単位の
      # 実測ではない点に注意。未計測だが「数秒〜10秒程度」という原本の幅の中で実装時に採用した
      # 具体値としてここに記録する）
    exit_sec: 2.0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（実測）
  - role: program_lockup          # 【2026-07-27 role分離修正】旧: role: sidebar。
    # 図解/インフォグラフィック（D2固有、下記`sidebar`role）と同一role名を共有していたため分離。
    # 番組タイトルロックアップ: 画面上部に「つけびの行方」のロゴ+アイコンが本編を通じて常時表示
    # （局ロゴバッジとは別の固定要素）。実測
    variant: variant_tv_incident          # 【2026-07-27 R3追加】上記logo_badgeと同じ理由。
      # 「つけびの行方」のロックアップがD2区間にも出ていた
    position: {centerX: 0.13, centerY: 0.05}
    persistent: true
    style: プレーン
    z_order: 4
    entrance: hard_cut               # 実測（fade_sec=0）
    entrance_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（実測）
    exit: fade                        # 未計測（末尾でロゴバッジと同時にフェードすると推定）。
      # fade_sec: 2.0（logo_badgeと同時にフェードすると推定し同一値を仮採用、未計測）
    exit_sec: 2.0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（推定）
  - role: fact_caption            # 【2026-07-27 role分離修正】旧: role: caption。
    # 「証言/引用キャプション」「英日二段字幕」と同一role名を共有し、3装置が`caption`に
    # 相乗りしていた（実装者レポート`documentary_narrated_jp.md`§yaml不備-4・6で指摘された
    # 座標近接問題の遠因）。事実要約テロップとして分離。
    # 事実要約テロップ: 画面下部左寄せ、白文字+黒背景バーで「5人殺害」「2軒放火」等の核心情報を
    # 短く提示。実測（複数シーンで一貫した書式を確認）
    max_width_px: 480            # 【2026-07-27 R4 再々修正・規約①の適用漏れ】
      # 540は**外形の上限を折返し幅と混同**していた。`max_width_px` は折返し幅なので、
      # 座布団padding24×2を足すと**外形588px→左9px外**になる（実測）。
      # 外形を画面内(左16px+影3px)に保つ上限は538px ＝ 折返し幅 538−48 = 490px。安全側で480。
      # 【旧記述】260は**font 90で2.89字**しかなく
      # 実装不能だった（幅厳守だと黒帯が縦1列の柱になり下247px外、1行厳守だと左189px外。
      # どちらを選んでも破綻）。※「上限538px」は**外形の値**であって折返し幅ではない。
      # 【旧記述】幅の縛りが1つも無く**9字で左に84px流出**した。
      # centerX0.15=288px、右隣の要素との干渉も避けて260pxに抑える
    size: {width: 528, height: 120}   # 【2026-07-27 R5 訂正】実帯高は118pxで宣言116を超えていた
      # （padding を24と仮定した式が実測と2pxずれていた）。120へ
    overflow_policy: split_event   # 【2026-07-27 R5追加】**max_lines:1 なのに未指定だった**
      # （新規約の掃引漏れ）。11字で2行化するので、超過は折り返さず分割する
    font_px: 48
    max_lines: 1                 # 事実要約帯は1行が前提
    max_chars: 10   # 【2026-07-27 R10・境界解の注記】10 × 48 = **480 = max_width_px 480 ちょうど（余裕0px）**。
      # フォントの丸めが1px動けば折り返して max_lines:1 に違反する
      # 導出は「全角1字＝font_px」の最悪ケース。半角や小型キャップスなら実幅はこれより
      # 狭くなるので、この値を守る限り max_width_px を超えることはない（安全側）。480 ÷ font48 = 10.0
    variant: variant_tv_incident   # 【2026-07-27 R8追加】**variant が 8role中2roleにしか無かった**。
      # フィールドどおりに読むと D1 と D2 の装置が同時表示され、幾何交差が6組できる。
      # 実際 lint の矩形交差検査（R8で新設）が person_nameplate × bilingual_nameplate を
      # 678x159px（62%）、person_nameplate × sidebar を 900x194px（100%）で検出した。
      # 排他ではなく**変種スコープ**で解くのが正しい（2本は別の番組）
    char_width_px: 48   # 【2026-07-27 R9・掃引】このroleの**折返しを律速するのは和文**なので、
      # 1字の送り = font_px（全角）。欧文が混ざっても実幅はこれより狭くなるので安全側。
      # 「宣言が無い＝既定で全角」と同じ値だが、**掃引したことを明示するために書く**
      # （書かないと「見落としたのか、全角でよいのか」が次の実装者に伝わらない）
    position: {centerX: 0.15, centerY: 0.90}   # 【2026-07-27 見切れ修正】
      # 0.92 は共通デフォルトのドロップシャドウ（右下に7px張り出す）を数えると
      # 帯下端が **1082px で画面外**になる。影を数えるか否かで同じyamlから合否が反転していた。
      # 0.90 = 972px、帯高さ約80px+影12px（2026-07-27 R3訂正。旧「7px」は実測で+11〜12pxと判明）で下端1019px（画面内）
    mutually_exclusive_with: quote_caption   # 【2026-07-27 訂正・過剰宣言だった】
      # 当初 [person_nameplate, quote_caption] としたが、再検証で
      # **fact_caption × person_nameplate は幾何交差ゼロ**と実測された。
      # 排他は「本当に共存できないペア」だけに絞る。過剰に宣言すると
      # 実装の自由度を理由なく削り、かつ宣言の信頼性が下がる。
      # 【旧記述】導出の経緯:
      # 再実装検証で **fact_caption(0.92) × quote_caption(0.90) は中心間21.6px、
      # pixel_collision 1.000**（不透明黒帯が字幕を100%上書き）と実測された。
      # 本日のrole分離は3つのcaptionに分けながら**このペアを一度も検算していなかった**。
      # 幾何で解こうとすると成立しない: 2行字幕の上端821pxより上に事実帯(高さ約80px)を
      # 置くと中心≤0.708、さらにその上に人物名札(高さ148px)を置くと中心≤0.588となり、
      # ロワーサードが画面中央まで上がってしまう。
      # → **3つが同時に出ることは想定されていない**と解釈する。TVドキュメンタリーの文法
      #   （ナレーション区間=事実帯 / インタビュー区間=名札+発言字幕）とも整合する。
      # ※これは幾何からの**導出であって実測ではない**。実素材で同時表示の有無を確認すること
    persistent: false
    style: 帯
    z_order: 2
    entrance: hard_cut                # 未計測（推定、fade_sec=0と仮定）
    entrance_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（推定）
    exit: hard_cut                     # 未計測（推定、fade_sec=0と仮定）
    exit_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（推定）
  - role: person_nameplate          # 【2026-07-27 role分離修正】旧: role: nameplate。
    # documentary_immersiveと同じrole名`person_nameplate`に統一（logo_badge分離を参照）。
    # 人物名+属性ロワーサード: 「殺害された ○○○○さん」のように、上段に属性ラベル・下段に
    # 氏名を白文字で表示。実測
    font_px_attr: 44             # 【2026-07-27 R3】上段（所属）
    font_px_name: 72             # 【2026-07-27 R3】下段（氏名）
    size: {width: 900, height: 219}   # 【2026-07-27 R10・高さの収容検査を新設したら出た】幅の検査はR4からあったのに
      # **高さには一度も検査が無かった**。箱が中身より低いと、実装者はフォントを落とすか
      # はみ出させるかを勝手に選ぶ。
      # 194 では font_px_attr 44（行高65）+ font_px_name 72（行高106）+ padding24×2 = 219 が入らない
    variant: variant_tv_incident   # 【2026-07-27 R8追加】**variant が 8role中2roleにしか無かった**。
      # フィールドどおりに読むと D1 と D2 の装置が同時表示され、幾何交差が6組できる。
      # 実際 lint の矩形交差検査（R8で新設）が person_nameplate × bilingual_nameplate を
      # 678x159px（62%）、person_nameplate × sidebar を 900x194px（100%）で検出した。
      # 排他ではなく**変種スコープ**で解くのが正しい（2本は別の番組）
    max_width_px: 852   # 【2026-07-27 R9追加】**幅も行数も無制限だった**ため、折返しが1回働いた瞬間に
      # quote_caption とのクリアランス（現行16.62px）が **−33.1pxの衝突**になる（1行増＝下端+52.5px）。
      # 852 = size.width 900 − padding24×2
    padding_px: 24   # 【2026-07-27 R9追加】
    max_lines: 2   # 【2026-07-27 R9追加】上段=所属 / 下段=氏名 の2段構成
    max_chars: 11   # 【2026-07-27 R9追加】852 ÷ font_px_name 72 = 11.8
    char_width_px: 72   # 【2026-07-27 R9追加】和文が律速（全角）
    overflow_policy: shorten_text   # 【2026-07-27 R11訂正】同上。名札は時間分割できない
    max_chars_total: 22   # 【2026-07-27 R10新設】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値を総量として置く。実測できたら上書きすること
      # 852 ÷ 72 = 11.83 → 1行11字、2行で22字
    position: {centerX: 0.5, centerY: 0.624}   # 【2026-07-27 R10・連鎖】quote_caption の高さが236になり上端が812.1pxへ上がったので、
      # 名札も追随させる。0.624 = 673.9px、下端795.4px＝**クリアランス16.7px**。
      # 【この1組で3回連鎖した】size.height 194→219（箱と中身）→ centerY 0.64→0.626（派生値）
      # → quote_caption に stroke_px を足して 234→236（箱と中身）→ centerY 0.624（派生値）
      # そのままにし、さらに quote_caption を 0.87 → 0.865 に上げたため、
      # **宣言クリアランス19.4pxが実測1.5pxになっていた**（19.4 − 12.5 − 5.4 = 1.5 とぴたり一致）。
      # 導出: quote_caption 上端（影込）814.2px − 16px = 798.2px が名札下端の上限。
      # cY×1080 ≤ 798.2 − 219/2 − 12 = 676.7 → 0.626（676.08px）。
      # 名札下端797.58px＝**クリアランス16.62px**、上端563.58pxで画面内
      # **0.67 も効かなかった**（名目107px侵入・pixel 0.855、字幕1行目が判読不能）。
      # 0.67を保つには名札高さ72.8px以下＝1段あたりfont約16pxで**実装不能**だった。
      # 【2026-07-27 R10訂正】ここは「size 900x194 / centerY 0.64 / quote_caption 0.87 /
      # 離隔19.4px」と書いていたが、**4つとも現行値ではない**。
      # 現行は size 900x219（高さの収容検査で194では2段が入らないと判明）/
      # centerY 0.626 / quote_caption 0.865 / 離隔16.62px。
      # 194と0.64のまま quote_caption だけ上げた状態では**実測クリアランスが1.5px**だった
      # 【旧記述】0.67 の導出:
      # 同日の 0.85→0.76 は**効いていなかった**。再実装検証で名札下端900px vs
      # 2行字幕上端821px＝**79px侵入**、目視で両方とも判読不能と実測された。
      # 「2行を見込んだ安全マージン」という当時の判断は実測で否定された。
      # 名札の高さ見積もり(140px想定/実測148px)は妥当で、外れたのは**字幕の行数側**。
      # （旧）0.67 = 中心723.6px、高さ148pxで下端797.6px、2行字幕上端821pxに対し23px。
      #   ※この148pxという高さは実装不能だった（1段あたりfont約16px）。現行は size 900x219。
      # 【旧記述】旧centerY=0.85は
      # 証言/引用キャプション(quote_caption, centerY 0.865・R9で0.90→0.87→0.865)と中心間距離わずか54pxで、SKILL.mdの
      # 検算式で衝突が確定していた（下記z_order_policyに検算過程を記載）。両者ともcenterX=0.5で
      # 完全一致しX方向での分離ができないため、centerYを0.85→0.76へ引き上げて回避した
      # （documentary_immersiveのperson_nameplate修正＝0.86→0.78と同型の対策。ただし
      # documentary_immersiveの修正は後日「nameplate自身の高さを下端計算に含めておらず、
      # 字幕が2行になる場合は依然衝突する」という残存衝突が判明した前例があるため、本ファイルは
      # さらに保守的な0.76を採用し、quote_captionが2行になっても衝突しないよう安全マージンを
      # 多めに確保した。それでも実測ではないため、実装時はoverlap_qc+フレーム目視での
      # 再検証を必須とする）
    persistent: false
    style: プレーン
    z_order: 3
    entrance: hard_cut                 # 未計測（推定、fade_sec=0と仮定）
    entrance_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（推定）
    exit: hard_cut                      # 未計測（推定、fade_sec=0と仮定）
    exit_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（推定）
  - role: quote_caption           # 【2026-07-27 role分離修正】旧: role: caption。
    # 【2026-07-27 追加】max_width_px 1400 / max_lines 2 を設定。
    # person_nameplate **0.64** が成立するのは**字幕が2行までという条件下だけ**で、
    # 4行にすると bbox_ratio 100.0%・目視で両方判読不能になると実測された。
    # **座標だけでは守れないので行数側も縛る**
    # fact_caption/bilingual_captionと同一role名を共有していたため分離。
    # 証言/引用キャプション: インタビュー対象者の発言要旨を白文字で字幕的に表示
