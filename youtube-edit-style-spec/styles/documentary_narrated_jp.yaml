    font_px_en: 44               # 【2026-07-27 R4追加】上段（英語名）
    font_px_ja: 34               # 【2026-07-27 R4追加】下段（日本語訳）。
      # 【2026-07-27 R8訂正】旧記述の「44+34+padding90=168」は誤り。
      # **実行高は 65+50=115px、padding は 53px**（4行上の記述が正）。
