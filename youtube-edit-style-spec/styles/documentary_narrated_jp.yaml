    # 英日二重ロワーサード: 英語原版の人物名+肩書（小型キャップス+細い罫線）に、日本語訳
    # （役職名+氏名のカナ表記）を隣接配置。実測（"TRACEY TURNER / MUSEUM CURATOR & HISTORIAN"と
