apply_notes: |
  youtube-edit-style-specパイプラインでの適用方法・実装上の注意点:

  【最優先: D1系かD2系かを先に判定する】このyamlを『日本語ナレーション系』として
  単一適用すると必ず破綻する。国内TV局が制作した事件/社会派ドキュメンタリー
  （局ロゴ・2階建てロワーサード・事実要約テロップが必要）なのか、海外制作を
  翻訳/吹替したドキュメンタリー（英日二段字幕・ミニマルな装飾）なのかを最初に
  確認すること。

  【無音率の文法差（brief課題1への回答）】D1(8.14%)はA〜C系（最大でもC2の1.22%）と
  比べて桁違いに無音率が高く、この10本の中で唯一『間を意図的に残す』編集文法を持つ。
  一方D2(2.71%)はA〜C系より高いものの、D1ほど極端ではない。**structure_grammarの
  variant_split/silence_ratio_hypothesisで詳述した通り、『日本語＝無音を残す』という
  単純な図式ではなく、『国内TV局制作の報道ドキュメンタリー（D1）＝間を残す』
  『翻訳/吹替ドキュメンタリー（D2）＝制作元のペースを引き継ぐため中間的』という
  より解像度の高い理解が必要**。D1系を適用する場合はfiller_policy/gap_keep_secを
  他ジャンルより明確に緩め（無音を機械的に詰めない）、D2系は中間的な扱いとすること。

  【LUFSは特に慎重に】D2の-29.1LUFSはYouTube推奨-14LUFSから15LU近く乖離しており、
  そのまま完コピするとYouTube上で著しく音量の小さい動画になる。海外制作の
  TV放送規格に準じた控えめなマスタリングをそのまま踏襲したものと推定されるため、
  YouTube向けに新規編集する場合はこの数値を鵜呑みにせず、-14〜-16LUFS程度への
  調整をこうすけに提案すべき（完全コピーを求められた場合を除く）。

  【既存10スタイルとの最大の差分】既存10スタイルは全てYouTubeネイティブの編集文化
  （AI解説・トーク・バラエティ・切り抜き等）に根差しているのに対し、D系（特にD1）は
  日本のTV放送局のニュース/報道ドキュメンタリー文法をそのまま持ち込んだ唯一の
  ジャンル。局ロゴバッジ・2階建てロワーサード・事実要約テロップという意匠は他の
  YouTubeネイティブジャンルには一切存在しない。事件・社会問題を扱う重厚な
  ドキュメンタリー企画で他に類のない差別化価値を持つ。D2は逆に『翻訳された海外制作物』
  という第三の系統として、既存のai_tool_avatar等とも異なる『装飾性を極力削いだ
  字幕システム』という参照価値がある。

  【未確認・今後の検証課題（正直に明記）】
  1. entrance/exitのサブ秒精度検証は未実施（wipe_explainer相当のフレーム単位検証が必要）。
     【2026-07-27追記】logo_badge/program_lockupのexit fade秒数は実装検証
     （`documentary_narrated_jp.md`）が採用した2.0秒をtelop_layersに転記したが、これも
     「連番タイル間隔からの推定」であり実測ではない。次回検証時にフレーム単位で確定させること。
  2. BGM・SE・ducking・filler_policyは聴取未実施のため全て未検証。
  3. n=2（かつD1・D2は実質別ジャンル）のため、『日本語ナレーション系』というジャンル
     全体への一般化はできない。特にD1は国内報道ドキュメンタリー、D2は翻訳版という
     出自が異なる1本ずつのサンプルに過ぎず、それぞれの系統内でのn増検証
     （別のTV局の事件ドキュメンタリー、別の翻訳ドキュメンタリーチャンネル）が
     今後の優先課題。
  4. D1のフォント・配色の一部（万華鏡タイトル演出の正確な配色等）は目視推定にとどまり
     ヒストグラム実測は未実施。

