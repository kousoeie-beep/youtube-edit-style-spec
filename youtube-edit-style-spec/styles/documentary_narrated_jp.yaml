    max_width_px: 1400   # 【2026-07-27追加】折返し幅が無く行数が実装者任せだった
    max_lines: 2         # 【2026-07-27追加】**幅と行数は必ず同時に縛る**
    mutually_exclusive_with: fact_caption   # 【2026-07-27追加・非対称の解消】事実要約帯と排他（中心間21.6px・pixel 1.000で共存不能）。
      # **排他は必ず両側に書く**（片側だけだと、もう一方のroleだけ読んだ実装者に伝わらない）
    font_px: 72                  # 【2026-07-27 R3・検算済みの提案を採用】
    size: {width: 1424, height: 236}   # 【2026-07-27 R10】234 では font72 の行高106×2 + フチ12×2 = 236 が入らない
      # （stroke_px を書いたことで初めて検算できるようになった）
      # 折返し幅1400 + フチ24 = 1424。centerX0.5なので左右とも248pxの余白が残る
    max_chars: 19   # 【2026-07-27 R8追加】max_chars は **8role中0role** で唯一の全欠落だった。
      # 導出は「全角1字＝font_px」の最悪ケース。半角や小型キャップスなら実幅はこれより
      # 狭くなるので、この値を守る限り max_width_px を超えることはない（安全側）。1400 ÷ font72 = 19.4
    variant: variant_tv_incident   # 【2026-07-27 R8追加】**variant が 8role中2roleにしか無かった**。
      # フィールドどおりに読むと D1 と D2 の装置が同時表示され、幾何交差が6組できる。
      # 実際 lint の矩形交差検査（R8で新設）が person_nameplate × bilingual_nameplate を
      # 678x159px（62%）、person_nameplate × sidebar を 900x194px（100%）で検出した。
      # 排他ではなく**変種スコープ**で解くのが正しい（2本は別の番組）
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    char_width_px: 72   # 【2026-07-27 R9・掃引】このroleの**折返しを律速するのは和文**なので、
      # 1字の送り = font_px（全角）。欧文が混ざっても実幅はこれより狭くなるので安全側。
      # 「宣言が無い＝既定で全角」と同じ値だが、**掃引したことを明示するために書く**
      # （書かないと「見落としたのか、全角でよいのか」が次の実装者に伝わらない）
    max_chars_total: 38   # 【2026-07-27 R10新設】char_width_px 72 = font_px（全角ベタ）なので
      # 名目 19×2 = 38字と実容量が一致する。**一致する場合も書く**（一致の確認が記録になる）
    stroke_px: 12   # 【2026-07-27 R10追加】`style: 袋文字` なのに宣言が無かった（investigative.caption には R8 で入っている）
    position: {centerX: 0.5, centerY: 0.864}   # 【2026-07-27 R10】高さが236になったので 0.865 では下余裕15.8px。
      # 0.864 = 933.1px（上端812.1px / 下端1063.1px＝下余裕16.9px）
      # しかも導出がファイル内に存在しなかった（コメントは 0.85 / 高さ268px で計算していた）。
      # 0.865 = 934.2px、size 1424x234 と影12pxで下端1063.2px（下余裕16.8px）
      # 0.90 は **max_lines:2 を入れた後の下端検算をやり直していなかった**。
      # 実測で**下へ26-29px切断**され目視で2行目が切れていた。
      # 2行268px(フチ12px込み)+影12px → 0.85=918px、下端1064px（画面内）
    persistent: false
    style: 袋文字
    z_order: 1                    # 【2026-07-27 注記】旧yamlはこのz_order=1（最背面）の理由が
      # 実装者レポートで「記載順の都合なのか設計意図なのか読み取れない」と指摘されていた。
      # person_nameplateとの座標衝突を上記のcenterY修正（**0.64**。0.76と0.67は撤回済み）で
      # 解消したため、z_orderの前後関係
      # そのものは同時表示時の実害に直結しなくなったが、値自体は変更せず維持する
      # （証言キャプションは他の常駐要素より背面に沈んでよいという原本の設計意図を尊重）。
    entrance: hard_cut                  # 未計測（推定、fade_sec=0と仮定）
    entrance_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（推定）
    exit: hard_cut                       # 未計測（推定、fade_sec=0と仮定）
    exit_sec: 0   # 【2026-07-27フィールド化】値はコメント内にありパーサから見えなかった（推定）
  # ==== D2固有（D2・翻訳/吹替ドキュメンタリー型） ====
