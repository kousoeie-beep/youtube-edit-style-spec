    overflow_policy: split_event   # 【2026-07-27 R4追加】収まらないなら折り返さず分割する         # 【2026-07-27追加】**幅と行数は必ず同時に縛る**（幅だけ縛ると行数が増えて悪化する）
    mutually_exclusive_with: sidebar   # 【2026-07-27追加】図解カードと排他（相互記載）
    font_px_en: 56               # 【2026-07-27 R5追加】**font_px が無く、caption_font が
      # 許す70/70を選ぶと名札クリアランスが **3.2px** に落ちた**（実測3.2pxで一致）。
      # 56/48 なら **30.2px**（R8実測）。
      # 【2026-07-27 R8訂正】旧記述はここを「20.7px」としていたが、
      # それは**56/48へ変更する前の値**で、変更後に派生値を再計算していなかった。
      # 70/70側の3.2pxだけが実測と一致していたことがこれを裏づける。
      # schema.md の「role の font_px は caption_font より優先」に従う
    font_px_ja: 48
    max_chars: 40   # 【2026-07-27 R10】40×35 = 1400 = max_width_px（R9の「43×32=1376で余裕24px」は存在しなかった）
      # 導出は「全角1字＝font_px」の最悪ケース。半角や小型キャップスなら実幅はこれより
      # 狭くなるので、この値を守る限り max_width_px を超えることはない（安全側）。上段EN 1400÷56=25.0 と 下段JA 1400÷48=29.1 のうち**厳しい側**を採る。
      # 二段構成なので片方でも溢れたら破綻するため、min を1行上限とする
    max_chars_ja: 29   # 【2026-07-27 R8追加】下段のみ運用する場合の上限。1400÷48
    variant: variant_translated_documentary   # 【2026-07-27 R8追加】**variant が 8role中2roleにしか無かった**。
      # フィールドどおりに読むと D1 と D2 の装置が同時表示され、幾何交差が6組できる。
      # 実際 lint の矩形交差検査（R8で新設）が person_nameplate × bilingual_nameplate を
      # 678x159px（62%）、person_nameplate × sidebar を 900x194px（100%）で検出した。
      # 排他ではなく**変種スコープ**で解くのが正しい（2本は別の番組）
    char_width_px: 35   # 【2026-07-27 R10訂正】R9の32は**「実測」と書いてあるだけで、測った文字列も px も
      # 字数も無かった**。独立実測（font56・NotoSansJP-Bold・英大文字）:
      #   "THE ICEMAN WAS FOUND IN THE ALPS" 32字 / 1042px = 32.56px/字
      #   "SCIENTISTS EXAMINED THE BODY FOR OVER THIRTY YEARS" 50字 / 1618px = 32.36px/字
      #   "MUSEUM CURATOR AND HISTORIAN OF ANCIENT EUROPE" 46字 / 1574px = 34.22px/字
      # 上限34.22を切り上げて35。**隣の bilingual_nameplate の27が効いて
      # こちらの32が効かなかった差は「測った文字列・実幅px・字数」を書いたかどうかだけ**
    max_chars_total: 72   # 【2026-07-27 R10新設】**欧文は単語の切れ目でしか折り返せない**ため、
      # 平均送り（char_width_px）から出した max_chars × max_lines は総量を保証しない。
      # 保守値として1行ぶんの9割×行数を置く。実測できたら上書きすること
      # 40字 × 0.9 × 2行 = 72字
    size: {width: 1424, height: 262}   # 【2026-07-27 R11・姉妹role】bilingual_nameplate だけが size を持ち、こちらは無かった。
      # 幅 = max_width_px 1400 + フチ12×2、高さ = 行高82（EN font56）+ 行高70（JA font48）
      # + フチ12×2 + 行間16 = 262
    max_lines_en: 1   # 【2026-07-27 R11・姉妹role】上段は必ず1行（bilingual_nameplate と同じ規約）
    max_lines_ja: 1   # 【2026-07-27 R11・姉妹role】下段も必ず1行
    position: {centerX: 0.5, centerY: 0.85}   # 【2026-07-27 内部矛盾の修正】旧yamlは
      # **旧記述**: centerY 0.5（画面垂直中央）と書かれていたが、直上のコメントは「画面下部中央に」と明記しており
      # **同一エントリ内でコメント本文と座標値が矛盾していた**（centerY 0.5は幾何中心であり
      # 「下部」ではない）。コメント本文（実測に基づく記述）を正とし、他ジャンルの発話字幕の
      # 慣例的な位置（0.85-0.90帯）に合わせてcenterYを0.85へ修正した。これにより下記sidebar
      # 【2026-07-27 訂正】旧記述は「（図解/インフォグラフィック、centerY 0.5）との
      # 座標重複も同時に解消される」としていたが、**再検証で反証された**（sidebar × bilingual_caption は pixel 0.9945/0.9872）。現在は sidebar.size 500 + 相互排他で対処している。
      # sidebar × bilingual_caption は 6.3%/0.9945・7.0%/0.9872 で**1pxも改善していない**。
      # 解消していない。bilingual_nameplate 側は排他宣言で対処した（上記参照）。
    persistent: false
    style: 帯なし・直接重畳
    z_order: 1
    entrance: fade                      # 実測寄り（end.jpg連番タイルで、同一テキストの
      # 不透明度が徐々に下がっていく様子を複数フレームで確認）。fade_sec: 未計測
    entrance_sec: 0.35   # 【2026-07-27】旧「未計測」。文字列では実装できず
      # 検証者が値を発明する状態だったため、schema.mdの共通既定値0.35を採用。実素材で要確認
    exit: fade                           # 実測寄り（同上）。fade_sec: 未計測
    exit_sec: 0.35   # 【2026-07-27】旧「未計測」。文字列では実装できず
      # 検証者が値を発明する状態だったため、schema.mdの共通既定値0.35を採用。実素材で要確認
  - role: sidebar                     # 図解/インフォグラフィック: 地図（オーストリア/
      # イタリア国境線+ルート表示）、年代別ピクトグラム円グラフ、地層断面図等のCG図解が
      # 日本語ラベル付きで挿入される。実測（複数種類確認）。【2026-07-27】上記の
      # 【2026-07-27 訂正】「bilingual_caption座標修正により重複懸念は**解消していない**（2026-07-27 R3で再確認。同ファイル内で自ら訂正済み）」という
      # 旧記述は**誤り**。再検証で sidebar × bilingual_caption は pixel_collision
      # 0.9945/0.9872 と実測され、**解消していない**。
      # 前回反証済みの主張を残置していた（同じ主張をしている箇所を全部直す規律の違反）。
      # D2ではこのroleを図解カード専用として保持する（他roleとの重複は解消済みのため
      # 名称変更は不要）。
    # 【2026-07-27 重複キーの解消】ここには `mutually_exclusive_with: bilingual_nameplate`
    # があり、下の `[bilingual_nameplate, bilingual_caption]` に**後勝ちで上書きされていた**。
    # 今回は下が上位集合だったので実害は出なかったが、**私が同じ事故を3度目に作った**。
    size: {width: 1400, height: 500}   # 【2026-07-27 R3】560→500。
      # これで caption との離隔は**37.0px**（2026-07-27 R8実測）。
      # 【R8訂正】R4は「24.5px」としていたが、これも派生値の取り違え。
      # （さらにその前の35.3pxは centerY 0.86 前提の数字で、実際の caption は 0.85 のままだった）
      # 検算上は**排他を外せる**が、下記のとおり保険として残す。
      # ただし排他は保険として残す（外して壊れるより安全側）。
      # 【旧記述】2度報告されて一度も触られなかった衝突:
      # `sidebar × bilingual_caption` は **pixel_collision 1.0・13px侵入**と2度報告されたのに、
      # 私は名札側しか直さず**yamlには「解消済み」という誤った記述を残していた**。
      # centerY0.5=540px、高さ560pxで下端820px。bilingual_caption(0.85=918px・2行268px)の
      # 上端784pxとまだ36px重なるため、**下記の排他に従うこと**（幾何だけでは解けない）
    mutually_exclusive_with: [bilingual_nameplate, bilingual_caption]   # 【2026-07-27追加】
      # 図解カードとバイリンガル要素は幾何で両立しない。D2では排他運用とする
    variant: variant_translated_documentary   # 【2026-07-27 R8追加】**variant が 8role中2roleにしか無かった**。
      # フィールドどおりに読むと D1 と D2 の装置が同時表示され、幾何交差が6組できる。
      # 実際 lint の矩形交差検査（R8で新設）が person_nameplate × bilingual_nameplate を
      # 678x159px（62%）、person_nameplate × sidebar を 900x194px（100%）で検出した。
      # 排他ではなく**変種スコープ**で解くのが正しい（2本は別の番組）
    text_content: none   # 日本語ラベル付きCG図解は素材側へ焼き込む
    position: {centerX: 0.5, centerY: 0.5}
    persistent: false
    style: カード
    z_order: 2
    entrance: fade                       # 推定。fade_sec: 未計測
    entrance_sec: 0.35   # 【2026-07-27】旧「未計測」。文字列では実装できず
      # 検証者が値を発明する状態だったため、schema.mdの共通既定値0.35を採用。実素材で要確認
    exit: hard_cut                        # 推定（次カットへの切り替わりは瞬間的に見える）
    exit_sec: 0   # 【2026-07-27追加】昇格漏れ。他7roleは持つのにこのroleだけ
      # exit_sec が無く、実装者が「書かれていない＝0」なのか「未計測」なのかを
      # 判断できなかった。hard_cutなので0で確定

caption_font: "未計測（原寸解像度非公開）。D1は事実要約テロップ・人物名が基準プリセット既定値
  に近いやや太めの印象、D2の二段字幕は明確に小さく・線も細い（目視相対比較）。
  採用すべきデフォルト: D1系は基準プリセット既定値（フォント90px前後/黒フチ10-12px/
  不透明度100%、背景バー併用）を推奨。D2系は字幕が装飾性を持たないため、フォントは
  小さめ（60-70px相当）・フチなしまたは極細（2-4px）・不透明度100%を推奨、ただし
  背景が明るい場面での可読性確保のため半透明黒座布団の自動追加ロジック
  （ai_tool_avatar既存実装）の流用を検討"

z_order_policy: |
  D1は常駐要素（logo_badge・program_lockup）を最前面固定とし、fact_caption・
  person_nameplate・quote_captionをその下に重ねる。

  【2026-07-27 role分離修正・座標衝突の検算結果】旧yamlは`nameplate`role配下の
  「人物名ロワーサード」と`caption`role配下の「証言/引用キャプション」が中心間距離わずか54px
  （centerY 0.85 vs 0.90）で、実装者レポート`documentary_narrated_jp.md`§yaml不備-4が
  「両者が同時に表示される場面を想定しているのか、別カットとして排他利用を想定しているのか
  yamlに記載が無い」と指摘していた。SKILL.mdの検算式（要素Aの下端 = centerY_A×1080 + 高さA/2
  + フチA、要素Bの上端 = centerY_B×1080 − 高さB/2 − フチB）で検算すると:
    person_nameplate（2段名札・高さ約140px想定）下端 = 0.85×1080 + 70 = 988px
    quote_caption（袋文字・基準プリセット既定値90px前後1行想定）上端 = 0.90×1080 − 55 − 12 = 905px
    → 988 > 905 で**衝突が確定**（約83pxの侵入。X座標が両者ともcenterX 0.5で完全一致しており
    水平方向での回避は不可能）。
  【2026-07-27 R5 更新】対策として person_nameplate の centerY を
  **0.85→0.76→0.67→0.64** と
  2段階で引き上げた。**0.76は実測で効いていなかった**（名札下端900px vs 2行字幕上端821px＝
  79px侵入、目視で両方判読不能）。**0.67も効かなかった**（名目107px侵入・pixel 0.855）。
  現行値は **0.64**（size 900x194 / font_px_attr 44 / font_px_name 72 と対で、
  quote_caption 0.87 との離隔は宣言・実装とも **19.4px**。R4/R5で2周連続して
  実測が宣言と0px差で一致した）。旧記述の「下端803px vs 上端821px＝18px離隔」は
  0.67時代の数字であり、**その0.67自体が名目107px侵入で実測と食い違っていた**。
  0.64へ引き上げた後の再検証で衝突消滅を確認している。この検算は
  高さ・フチの前提値に基づく推定であり実測ではないため、**実装時はoverlap_qc実行＋
  該当フレームの目視確認を必須とする**（documentary_immersiveのperson_nameplate修正が
  後日「フォント2行時に依然7-62px衝突する」残存問題を残した前例があるため、本ファイルの
  0.64という値も「これで確実に安全」と鵜呑みにせず、実装時に再検証すること）。
  **実際に0.76も0.67も鵜呑みにできなかった**。しかも現行の0.64が成立するのは
  「字幕が2行まで」という**未記載の条件下だけ**で、4行字幕を組むと
  bbox_ratio 100.0%・目視で両方判読不能になる（0.76と同じ絵）。
  **真因は座標ではなく max_width_px / max_chars / size の欠落**である。
  【2026-07-27 R8訂正】旧記述の「8role中0roleで未着手」は事実と違った。
  R8実測で **max_width_px 4/8・size 6/8**は記入済み、max_chars が 0/8 だった。
  【2026-07-27 R9】**この訂正は、同じR8の max_chars 追加によって即日で嘘になった**
  （現在 max_chars は 6/8、char_width_px と overflow_policy も掃引済み）。
  「今の充足率」を散文に書くと必ず腐る。数えるのは lint の仕事にする。

  D2は二段字幕(英語+日本語)が同時表示される構造のためz_orderは英語原文を先着（上段）、
  日本語訳を後発（下段）として扱い、図解要素(sidebar)とは同時表示されないため競合しない。
  なお旧yamlのbilingual_caption(旧caption)はcenterY: 0.5（画面垂直中央）とコメント本文
  「画面下部中央に」が矛盾していたため0.85へ修正済み（telop_layers本体参照）。この修正により
  sidebar(図解要素, centerY 0.5)との座標重複も同時に解消された。

dual_mode: "D1・D2はそれぞれ単一フォーマットの継続（モード切替構造ではない）が、
  **D系というグループ自体がD1/D2という2つの全く異なるフォーマットの併存**という
  構造になっている。適用時は個別動画のソース（国内TV局制作か、海外制作の翻訳/吹替か）
  に応じてD1系かD2系のいずれかを選ぶ必要があり、両者を混在させるべきではない。
  詳細はstructure_grammar参照"

animation_dictionary_mapping:
  D1_局ロゴ/番組ロゴの表示: "開始時ハードカット出現、終了時フェードアウト（実測）"
  D1_各種テロップの表示切替: "ハードカット相当と推定（未計測）"
  D2_二段字幕の表示切替: "フェードイン/フェードアウトの併用（end連番タイルで確認、
    実測寄り）。他ジャンルのハードカット主体とは異なり、D2は字幕自体が緩やかに
    現れて消える"
  D2_図解要素の表示: "フェードインと推定（未計測）"
  不使用: "shake/bounce/spring等の派手な動き語彙は両本とも未検出。D1は報道の厳粛さ、
    D2はドキュメンタリーの品位を保つトーンで一貫（推定）"

transitions:
  default: hard_cut               # 両本とも実測範囲でディゾルブ等の装飾トランジションは
    # 本編内では未検出（D1のオープニングのみカレイドスコープ的な万華鏡演出があるが、
    # これは通常カットのトランジションではなくタイトルシーケンス自体の演出）
  accent: "D1: オープニングのカレイドスコープ（万華鏡）演出のみ、本編中には未使用（実測）"

audio:
  bgm: "D1: conditional（推定。報道ドキュメンタリーとして緊張感を出す薄いBGMベッドの
    可能性、聴取未実施）。D2: likely（推定。再現ドラマ部分にシネマティックスコアが
    敷かれている可能性が高いが聴取未実施）"
  voice_lufs_target: "-24.9〜-29.1（D1=-24.9/D2=-29.1、実測Integrated）。
    **10本中で突出して低い（静かな）マスタリング**。特にD2の-29.1LUFSは全10本の中で
    最も静かな値で、YouTube推奨-14LUFSから15LU近く乖離している"
  lra: "3.8〜10.4（D1=10.4/D2=3.8、実測）。D1のLRA=10.4は10本中最大（報道インタビューの
    小声の証言と、事件を報じる緊迫したナレーションの音量差が広いレンジを生んでいると
    推定）。D2のLRA=3.8はむしろ狭く、吹替ナレーションが一定の音量に整えられている
    傾向を示唆"
  true_peak: "-13.8〜-4.0 dBFS（D1=-4.0/D2=-13.8、実測。ebur128 peak=trueより）。
    D2の-13.8dBFSは10本中で最大のヘッドルームを残す極めて控えめなマスタリング"
  se_style: unknown
  ducking: unknown

pacing:
  gap_keep_sec: "実測（silencedetect -35dB/0.5s基準）: D1=92回/120.5秒(8.14%)・
    D2=85回/67.9秒(2.71%)。**D系は2本ともA〜C系（0.13%〜1.22%）より明確に無音率が高く、
    特にD1は10本中唯一無音率が1%を超え8%台に達する外れ値**。詳細は下記apply_notesの
    「無音率の文法差」を参照"
  filler_policy: unknown            # 未検証
  hook: "D1: cold_open寄りだが構成的にはtitle_sequence先行型（実測: 万華鏡演出+
    番組タイトルロゴが数秒表示された後、事件現場の空撮・「5人殺害」テロップという
    具体的な事実提示に入る。前置きの引きが強い報道ドキュメンタリー特有のオープニング）。
    D2: title_first（実測: 再現ドラマの断片的なティザーカットの後、英日バイリンガル
      タイトルカード「ANCIENT BODIES: SECRETS REVEALED / 古代人の遺体を解明せよ」が
      明確に表示されてから本編に入る）"
  operation_wait_policy: N/A

structure_grammar:
  variant_split: "D系は単一スタイルではなく2つの下位フォーマットに分岐する。
    (1) variant_tv_incident（D1=D1型）: 国内民放報道局制作、局ロゴバッジ常駐、
    氏名+属性の2階建てロワーサード、事実要約テロップ、無音率が極めて高い（8.14%）。
    (2) variant_translated_documentary（D2=D2型）: 海外制作ドキュメンタリーの
    日本語翻訳/吹替版、英日二段字幕、装飾性の低いミニマルなテロップ、シネマティックな
    再現ドラマ映像、LUFSが極端に低い（-29.1）。**この2つを『日本語ナレーション系』
    として単一スタイルで適用すると、局ロゴやロワーサードの有無等で破綻する**ため、
    適用時は必ずどちらの変種かを先に判定すること"
  silence_ratio_hypothesis: "brief課題1への回答。D1(8.14%)とD2(2.71%)はいずれもA〜C系
    （0.13%〜1.22%）より無音率が高く、方向性としては『日本語ドキュメンタリーは間を
    残す』という仮説を支持する。ただし度合いに大きな差があり、**D1のみが極端な
    外れ値**である点に注意が必要。D2はD2制作の海外オリジナル版を日本語に
    吹替/翻訳したものであり、編集のカット割り・間の設計自体は制作元（海外）の
    ペースが色濃く残っている可能性が高い。したがって『日本語ナレーション＝間を残す』
    という一般化はD1（生粋の国内TV制作）にのみ強く当てはまり、D2はむしろ
    『翻訳ドキュメンタリー』という別のカテゴリと捉えるべき、というのがタイル目視+
    数値実測を踏まえたこの実測班の見解（確定ではなく仮説にとどまる、n=2のため）"

