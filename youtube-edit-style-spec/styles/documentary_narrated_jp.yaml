      # 幅の検算は切り上げ側（安全）、文字数の上限は実測側（実在の文言が通る）を採る
      # 導出は「全角1字＝font_px」の最悪ケース。半角や小型キャップスなら実幅はこれより
      # 狭くなるので、この値を守る限り max_width_px を超えることはない（安全側）。上段EN 1100÷44=25.0 と 下段JA 1100÷34=32.3 の min。
      # ※R5が記録した「ENの実幅1099pxで余裕1.0px」は**文字数が不明な実測**であり、
