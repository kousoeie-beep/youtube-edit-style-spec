    position: {centerX: 0.7, centerY: 0.3}   # 目視（挿入位置は文脈により可変）
    persistent: false
    style: カード（PC/モニタ風の枠付き）
    z_order: 5                     # 証拠としての独立した映像ソースのため最前面
    entrance: hard_cut               # 未計測（推定）
    exit: hard_cut                    # 未計測（推定）
  - role: watermark               # 【2026-07-26 スキーマ修正で追加】C1(C1): チャンネル名
