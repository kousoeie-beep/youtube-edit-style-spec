      # 「変種混在0」を主張する根拠が無い
    position: {centerX: 0.4, centerY: 0.35}   # 目視（対象文書により大きく可変、固定位置ではない）
    persistent: false
    style: プレーン
    z_order: 4                    # 証拠の核心を示す最重要強調のため、通常キャプションより
      # 前面に配置することを推奨
    entrance: pop                   # 推定
    exit: hard_cut                   # 推定（証拠画面の切り替わりと同時に消えると推定）
  - role: evidence_heading        # 【2026-07-27 role分離修正】旧: role: caption。上記
    # 「発話キーワードキャプション」（C2モードA・トーキングヘッド時）と同一role名を共有して
    # いたが、こちらはC2モードB（証拠提示）専用の別装置であり、機能の異なる2装置が同一role
    # 名に相乗りしていた（監査3・documentary_investigative §b-2で指摘。C2内部で
    # dual_modeにより時間排他ではあるが、SKILL.md項目7の「機能の異なる装置には別role」
    # 原則に従い分離）。
    # 証拠文書見出しキャプション: 「...URES FINANCIAL AUDIT
    # REVIEW」のような文書の要点を白文字太字で証拠画面の上に重畳。黒半透明グラデーション
    # 座布団を伴う。実測
    # 【2026-07-27 R6 撤回】ここに `variant: variant_narrator_only` を付けたが**逆の変種**だった。
    # variant_narrator_only は C1（顔出しゼロ）で、本roleは同ファイルが「**C2モードB専用**」と
    # 明記している。根拠にした dual_mode は**変種軸でなく C2 内部のモード軸**で、軸そのものが違う。
    # しかも lint の「散文に排他とあるのにフィールドが無い」検査は variant があるとスキップするため、
    # **間違った variant を付けたことで検査が黙っただけ**だった（実体は未修正）。
    # 正しくは下記の排他宣言で対処する。
    mutually_exclusive_with: [caption, nameplate]   # 【2026-07-27 R8】dual_mode（モードA=caption+nameplate / モードB=evidence_heading+keyword+sidebar）
      # が含意する排他は **A×Bの総当たり6ペア**。R6は caption×evidence_heading の
      # **1/6 しか塞いでいなかった**。残り5ペアは yaml上「同時表示してよい」と読まれ、
      # R6が指摘した状況が nameplate 側に付け替わって生き残っていた
      # 【旧記述】散文が「dual_modeにより時間排他」と
      # 書いているのに variant フィールドが無く、排他の欠落に見えていた
    font_px: 75   # 【2026-07-27 R8追加】**規定90pxでは折返し幅780に2行で入らない**（実測3行）。
      # 90pxの1行実幅は1568px。780px・2行に収まる最大が **75px**（規定の83%）。
      # yaml本文の「【R9削除】ここには「2行なら90pxのまま収まる（862px/行）」があったが、同一role内で「862 > 780 で自己矛盾」と否定済みの記述だった」は 862 > 780 で自己矛盾だった。
      # 規約⑩により role の font_px が caption_font に優先する
    size: {width: 836, height: 252}   # 【2026-07-27 R9】幅 = 800 + padding18×2。高さは caption と同じ式（lh(75)×2 + フチ×2 + 影）
      # **これを書かないと、次の実装者がまた90pxで組んで3行になる**
      # 【重要】この寸法を書かないと、次の実装者がまた90pxで組んで3行になる
    intentional_overlap_with: [keyword]   # 【2026-07-27 R8追加】赤下線は見出しの座布団の内側に引く装置で、pixel 1.0 は設計どおり。
      # 宣言が無いとQCが毎回FAILを出し本物の衝突が埋もれる（keyword は見出しの**直上**）
    char_width_px: 46   # 【2026-07-27 R8追加】このroleの実測文言は**欧文キャップス**で、1字の送りは
      # font_px より狭い（実測 777px / 17字 = 45.7px）。全角前提の検算だと
      # 17×75=1275 となり正しい値が「死に値」と誤報される。
      # **和文を入れる場合はこの宣言が成り立たない**ので max_chars を 10 に落とすこと
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    stroke_px: 9   # 【2026-07-27 R9追加】**stroke_px が無いのに、size の式が「フチ9」を引用していた**
    max_chars_total: 24   # 【2026-07-27 R11訂正】R10の29は**「実在する欧文見出し1本」でしか成立しない値**だった。
      # 実測（font75 / max_width_px 800 / 6文言）: 25 / 26 / 26 / 29 / 29 / 31字と散り、
      # **6本中3本で29を超える**。最小25の1字下（24）を保守値に採る。
      # **欧文は単語の切れ目でしか折り返せないので、「測った文言の値」を上限にすると
      # 別の文言で必ず割れる**（1本だけ測って決めたのが誤りだった）
      # 名目 17×2 = 34字だが実容量は **29字**（欧文は単語の切れ目でしか折り返せないため、
      # char_width_px 46 という平均送りは幅の検算には使えても容量の保証にならない）。
      # **yaml自身の例示文言33字が3行になり、3行目と赤下線が黒座布団の外へ93px出て
      # 素の映像に載る**（R10目視・QCは exit 0 で素通り）。
      # overflow_policy を発火させるのはこの総量である
    variant: variant_host_investigator   # 【2026-07-27 R10・X3】**variant が9role中0件だった**。同じファイルの散文は
      # 「C1固有の役割（watermark/motion_graphic/statement_card/endcredit）はC2の役割群と
      # 重なりを比較する必要はない」と**変種で分離していると明言している**のに、
      # フィールドに落ちていなかった。narrated が R8 で 8/8 に直した同型が丸ごと未着手。
      # フィールドどおり読むと C1×C2 の装置が同時表示され、実フレーム検査で
      # 「変種混在0」を主張する根拠が無い
    max_chars_total_ja: 20   # 【2026-07-27 R11新設】和文（全角ベタ）は実測20字、21字で3行化。
      # 同roleの max_chars には「和文なら10に落とせ」という注記があるのに、
      # **R10で新設した max_chars_total に同じ注記を付けなかった**（同roleの別フィールドへの追随漏れ）
    position: {centerX: 0.3, centerY: 0.25}
    max_width_px: 800   # 【2026-07-27 R9】**785は inert だった**——折返し結果も破れる条件（font+1で3行）も
      # 780と完全に同じで、1ステップ稼ぐには787px以上が要る。
      # しかも max_chars 17 × char_width_px 46 = 782 vs 785 で**同じ3pxの境界解を
      # 作り直していた**。800なら余裕18px、sidebar 左端1024との余裕も30px
      # 785へ広げても sidebar 左端1024 との余裕は37.5pxあり、他に影響しない
      # （max_lines:1 を守った45px1行版で実測）。しかもこの衝突は sidebar が
      # layer_kind: video のため **QCには一切現れない**。
      # centerX0.3=576px、幅780pxで右端966px。sidebar(centerX0.7=1344px)の
      # 左端を1000pxと仮定して34pxのクリアランス。
      # ※864 は座布団の余白と影を数えずに導出していた            # 【2026-07-27 追加・実害2件を同時に解消する導出値】
      # 幅の上限が無かったため、実測で横幅1753pxまで伸び:
      #   ① 左端が画面外へ **286px切断**された（centerX0.3=576pxに対し半幅876px）
      #   ② 右端が sidebar(インセット映像窓, x1024-1665) に食い込み、
      #      **見出しグリフの29.27%が潰れた**
      # yamlは「768px離隔なら衝突しにくいと考えられる（判定保留）」と書いていたが
      # **実測で反証された**。要素幅が未定義な限り、中心間距離は安全の根拠にならない。
      # 864 = 半幅432px。左端144px（画面内）、右端1008pxで
      # sidebar左端1024pxの手前に収まる。①②が同時に解ける
    max_lines: 2                 # 【2026-07-27 修正】1行だと、yaml例示の文言を規定の90pxで
      # 組むと1724pxになり **780に収めるには45px＝規定の50%**まで落とす必要がある。
      # 【R9削除】ここには「2行なら90pxのまま収まる（862px/行）」があったが、同一role内で「862 > 780 で自己矛盾」と否定済みの記述だった         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 見出し/バッジ系は1行が前提（2行になると帯の高さが倍になり近接要素を潰す）。
      # 収まらない文言は行を増やすのではなく**文言を短くする**こと
    max_chars: 17   # 【2026-07-27 R8追加】font75での2行分割は 17字/12字（実測・最長行777px）。
      # **777 vs 780 は境界解**（余裕3px）。文言を変えるなら再計測すること
      # caption_fontで範囲指定のため字数上限は導出できない
    persistent: false
    style: プレーン（背景に黒半透明グラデーション）
    z_order: 3
    entrance: fade                  # 推定
    exit: fade                       # 推定
  - role: sidebar                # インセット映像窓: 当事者(スキャム関係者)の別撮り映像や
    # Zoom通話風の録画を、画面の一部に小窓（PCモニタ風の枠）として挿入。実測（複数フレームで
    # 確認、「MY LIQUIDITY PARTNER」のロゴが写り込む場面あり）
    position_mode: content_dependent   # 【2026-07-27追加】**この座標は固定値ではない**。挿入する内容・文脈によって位置が変わる。
