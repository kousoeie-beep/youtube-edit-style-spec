style_id: documentary_investigative
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（cuts_per_min/visual_rhythm_per_min/LUFS/LRA/TruePeak/無音回数=C1・C2両本で
  ffmpeg実測）/ 目視実測（telop_layers・配色・構成=**C1・C2の両方**。C2はタイル絵コンテ目視
  ＋ImageMagickクロップによる部分拡大確認、C1は2026-07-25にタイルを追加生成して目視。
  **2本とも視覚確認済み**で、顔出し有無による2分岐が確定している。下記variant_split参照）

  【重要な限定・2026-07-25更新】当初「C1のテロップ文法はC2からの類推（未確認）」としていたが、
  C1のタイルを追加生成して目視した結果、**C1とC2は顔出しの有無という根本的な差がある**ことが
  判明した。「調査考察系」を単一の文法として扱わず、必ず下記の変種を選ぶこと。

variant_split: |
  C系（調査・考察）は話者の顔出し有無で2分岐する。A系と同じ構造の分岐であり、
  **ドキュメンタリー系では「顔出しの有無」がスタイル選定の共通軸**である可能性が高い。

  (1) variant_narrator_only（C1=C1型・顔出しゼロ）
      - **ホストの顔出しが一度も確認されなかった**（ナレーターは完全に画面外）。
        画面は終始「証拠・資料・映像素材」で構成される
      - 証拠の提示物（実測）: ニュース記事のスクリーンショット（見出しをハイライト）、
        ツイートのスクショ（返信スレッド込み）、App Store/eBayの出品ページ、
        ゲームプレイ映像、報道番組のクリップ（下部チャイロン付きのまま引用）
      - 自作モーショングラフィックス: タイトル演出（例「GEARS 2005」）、
        赤マーカー付きの世界地図
      - **チャンネル名ウォーターマークが画面右下に常駐**（実測）
      - **映画式のエンドクレジットカード**（実測: 濃紺背景に NARRATOR / PRODUCERS /
        MOTION GRAPHICS / MUSIC / WRITERS / EDITORS / EXECUTIVE PRODUCERS の
        役割別クレジットを列挙）。他13スタイルに無い固有の締め方
      - 全画面の白文字センター配置による断定的なステートメント（例「Nothing happened.」）
      - 実測値: cuts 3.85/分（**10本中最少**）・リズム15.41・-14.6 LUFS・LRA 2.7・無音0.26%

  (2) variant_host_investigator（C2=C2型・顔出しあり）
      - トーキングヘッド（調査者本人）⇔証拠提示の2モードを往復する
      - 赤下線ハイライト＋文書スクショ＋インセット映像窓で証拠を示す
      - 実測値: cuts 9.29/分・リズム18.34・-18.9 LUFS・LRA 9.6・無音1.22%

  → 数値差（LUFS 4.3LU差、LRA 2.7 vs 9.6）はこの構造差に対応している。
    C1は音声がナレーション一本のため強くコンプレッションされLRAが狭い、
    C2は現場音・通話録音・トーキングヘッドが混在するためLRAが広い、と解釈できる（推定）。

format:
  aspect: "16:9"
  duration_sec: "1074-1910（C1=1074.3/C2=1909.9）"   # 実測
  cuts_per_min: "3.85-9.29（C1=3.85/C2=9.29）"   # 実測。C1は10本中最もカット率が低い
    # （ロングテイクの語り主体と推定）
  visual_rhythm_per_min: "15.41-18.34（C1=15.41/C2=18.34）"   # 実測。カット率の差ほど
    # 開いておらず、C1もソフトなビジュアル変化自体は一定頻度で起きている
  camera: "mixed（C2実測: 対談形式インタビュー(スタジオ/ポッドキャスト風セット)⇔証拠提示
    (ドキュメント/Webサイトのスクリーンショット)⇔スーツ姿の当事者による講演映像⇔
    パーソナリティのトーキングヘッド(サスペンダー姿・デスク+マイク)の4種が頻繁に切り替わる。
    **C1実測（2026-07-25タイル目視）: ホスト撮影なし。ナレーターは終始画面外で、画面は
    証拠・資料・映像素材のみで構成される**）"
  broll_usage: "frequent（C2実測: Forbes記事・企業サイト・監査文書のスクリーンショットが
    証拠として大量に挿入される。これは一般的な「気分転換のB-roll」ではなく、主張の根拠を
    示す本編の主要構成要素として機能している点がA系のB-rollと性質が異なる）"

palette:
  background_hex: "C2実測（目視）: パーソナリティのトーキングヘッド区間は暗色スタジオ背景
    （黒〜濃紺、観葉植物のシルエットが写り込む）。証拠画面区間は素材（Webサイト/文書）の
    配色そのまま"
  brand_hex: ["#E31E24系(赤・証拠テキストの下線ハイライト、目視推定によるクロップ確認)",
    "#FFFFFF(白・証拠文書の要点キャプション文字色、実測目視)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#FFFFFF"      # 証拠文書見出しキャプションの白文字太字（brand_hex実測）。
      # 人物名+肩書ロワーサードの黄色文字は色名のみでHEX未記載のため未マップ
    color_bg: "#000000"        # 証拠文書見出しキャプションの暗転背景+黒半透明グラデーション座布団
      # （emphasis_rolesの記述から変換・原文にHEX記載なし、近似）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # ※この影は4辺の検算で**右下に12px・左上に3px**張り出す（2026-07-27 実測で再訂正）。
      #   当初 offset4+blur3=7px と素朴計算したが、Pillowのぼかしは半径以上に広がり
      #   実測は右下+11〜12px。さらに**ぼかしは左上にも広がる**ので3pxの項が要る。
      #   検算式にこの項が抜けていて常時過小評価していた（schema.md参照）。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: "#E31E24"    # 証拠テキストの下線ハイライト（brand_hex推定・系）
    color_stroke: "#000000"    # 【2026-07-27 R5】caption_font が「黒フチ8-10px」と
      # 指示しているのに null（＝縁取りなし）だった。business_talk で同日に直したのと
      # **完全に同型の欠落**が残っていた。黒で確定
    color_primary: null
    color_glow: null
  emphasis_roles:
    証拠テキストの下線ハイライト: "赤色の下線（取り消し線ではなく単純な下線）で、文書
      スクリーンショット内の金額・利率等の核心的な数値表現の下に引かれる。ImageMagick
      クロップで色・形状ともに明瞭に確認（実測）"
    証拠文書見出しキャプション: "白文字・太字、暗転させた背景の上に重畳（黒半透明の
      グラデーション座布団を併用）。色による意味の使い分けはなく、情報の可読性確保が
      主目的（実測目視）"
    人物名+肩書ロワーサード: "黄色文字（背景は特になし、直接映像に重畳）。
      「DELGADO & VERLIN SANCIANGCO」のような複数人物の連名表記も確認（実測目視）"

telop_layers:
  - role: caption               # 【2026-07-27 role分離修正】旧: 「証拠文書見出しキャプション」
    # と同一role名を共有していたが、下記evidence_headingへ分離済み。このcaptionはC2モードA
    # （トーキングヘッド）専用の発話字幕として一意になった。
    # 発話キーワードキャプション: パーソナリティ・インタビュー
    # 対象者の発話中、画面下部やや左寄りに小さく白文字で1行表示（"MY GOD-GIVEN GIFT
    # WAS THAT" 等の抜き出し）。実測（hook区間で複数確認）
    mutually_exclusive_with: [evidence_heading, keyword, sidebar]   # 【2026-07-27 R8】dual_mode（モードA=caption+nameplate / モードB=evidence_heading+keyword+sidebar）
      # が含意する排他は **A×Bの総当たり6ペア**。R6は caption×evidence_heading の
      # **1/6 しか塞いでいなかった**。残り5ペアは yaml上「同時表示してよい」と読まれ、
      # R6が指摘した状況が nameplate 側に付け替わって生き残っていた
    font_px: 75   # 【2026-07-27 R8追加】evidence_heading と揃えた実測値
    stroke_px: 9   # 【2026-07-27 R8追加】旧記述は「8-10px」のレンジで、幅の発明が残っていた
    size: {width: 1348, height: 252}   # 【2026-07-27 R9訂正】高さ218は**自分で書いた式が返さない値**だった。
      # lh(75)=109.5 ×2 + フチ9×2 + 影15 = **252**。218は式の途中の値
    max_chars: 17   # 【2026-07-27 R8追加】1312 ÷ font75 = 17.5
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    char_width_px: 75   # 【2026-07-27 R9・掃引】このroleの**折返しを律速するのは和文**なので、
      # 1字の送り = font_px（全角）。欧文が混ざっても実幅はこれより狭くなるので安全側。
      # 「宣言が無い＝既定で全角」と同じ値だが、**掃引したことを明示するために書く**
      # （書かないと「見落としたのか、全角でよいのか」が次の実装者に伝わらない）
    max_chars_total: 31   # 【2026-07-27 R10新設】名目 17×2 = 34字だが実容量は **31字**。
      # max_width_px 1312 ÷ char_width_px 75 = 17.49 で**0.49字ぶんを切り捨てている**ため、
      # 2行では1字ぶん足りなくなる
    variant: variant_host_investigator   # 【2026-07-27 R10・X3】**variant が9role中0件だった**。同じファイルの散文は
      # 「C1固有の役割（watermark/motion_graphic/statement_card/endcredit）はC2の役割群と
      # 重なりを比較する必要はない」と**変種で分離していると明言している**のに、
      # フィールドに落ちていなかった。narrated が R8 で 8/8 に直した同型が丸ごと未着手。
      # フィールドどおり読むと C1×C2 の装置が同時表示され、実フレーム検査で
      # 「変種混在0」を主張する根拠が無い
    position: {centerX: 0.362, centerY: 0.857}   # 【2026-07-27 R10・4辺検算】左14.2px・下4.6pxだった。0.362 = 695.0px で左18.0px、
      # 0.857 = 925.6px で下16.4px（上端796.6px）。
      # **これに合わせて nameplate も上げないと4.0pxで接触する**（下記参照）
      # 0.35 だと宣言矩形の左端が **−2.0px（画面外）**。0.36 で左端17.2px。
      # centerY: 高さを252に直した結果、0.881 では下端1077.5pxで余裕2.5px。
      # 0.868 = 937.4px（上端811.4px / 下端1063.4px、下余裕16.6px。
      # nameplate 下端792.6pxに18.8px）
      # §5の下端優先繰り上げが働けば救われるが、それは**宣言値が使われない**という意味で、
      # size も font_px も無いこのroleでは実装者が幾何中心で読んで見切れる。
      # 繰り上げ後の実効値 0.881 をそのまま宣言値にした（実測 T=853 B=1063・下余裕17px）
    max_width_px: 1312           # 【2026-07-27 追加】幅の上限が無く、実測で
      # 左端が **63px切断**された。centerX0.35=672pxなので、
      # 左端を画面内(16px余白)に保つには半幅656px＝幅1312pxが上限になる。
      # ※そもそも下部字幕がcenterX0.35（中央から左寄り）なのは、
      #   長い字幕ほど左に飛び出す構造である。実素材で字幕が長くなるなら
      #   centerXを0.5へ寄せる方が正しい可能性が高い（要実測）
    max_lines: 2         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 実測で、幅だけ縛ると**行数が増えて事態が悪化する**ことが4スタイルで確認された
      # （japan_vlog 3行31px→4行86px侵入 / wipe captionのPiP重なり15.9%→31.0% /
      #  investigativeの見出しが3行化してkeywordを100%被覆）。
      # 3行以上必要な発話は**複数のテロップイベントに分割する**
    persistent: false
    style: 帯なし・直接重畳
    z_order: 1
    entrance: hard_cut           # 未計測（推定、fade_sec=0仮定）
    exit: hard_cut                # 未計測（推定）
  - role: nameplate              # 人物名+肩書ロワーサード: 黄色文字、インタビュー対象者の
    # 初登場時に表示。実測
    size: {width: 716, height: 114}   # 【2026-07-27 R9】旧 {700,98} は **font_px_name 43 の実幅が 700.0px ＝ ちょうど
      # 余裕0.00px**（注記なし）で、しかもフチ0前提だった。716 = 700 + フチ8×2、
      # 114 = 98 + フチ8×2
      # 幅700優先なら実高98（宣言180に−82）、高さ180優先なら実幅1263（宣言700に+563）。
      # 幅を守る側を採り、実測 lh(43)+lh(24)=98 を書く
    max_lines: 2
    mutually_exclusive_with: [evidence_heading, keyword, sidebar]   # 【2026-07-27 R8】dual_mode（モードA=caption+nameplate / モードB=evidence_heading+keyword+sidebar）
      # が含意する排他は **A×Bの総当たり6ペア**。R6は caption×evidence_heading の
      # **1/6 しか塞いでいなかった**。残り5ペアは yaml上「同時表示してよい」と読まれ、
      # R6が指摘した状況が nameplate 側に付け替わって生き残っていた
    font_px_name: 43   # 【2026-07-27 R8追加】箱だけ決めると次の実装者が別のフォントで組んで高さが変わる
    font_px_sub: 24   # 【2026-07-27 R8追加】
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    stroke_px: 8   # 【2026-07-27 R9追加】caption_font の「8-10px」の下限。
      # **フチ0で組むとコントラスト2.5-3.0:1 で WCAG AA 未達**（明るい背景で実測）。
      # ただしフチを足すと旧 size {700,98} を16-20px超過するので size も広げる
    variant: variant_host_investigator   # 【2026-07-27 R10・X3】**variant が9role中0件だった**。同じファイルの散文は
      # 「C1固有の役割（watermark/motion_graphic/statement_card/endcredit）はC2の役割群と
      # 重なりを比較する必要はない」と**変種で分離していると明言している**のに、
      # フィールドに落ちていなかった。narrated が R8 で 8/8 に直した同型が丸ごと未着手。
      # フィールドどおり読むと C1×C2 の装置が同時表示され、実フレーム検査で
      # 「変種混在0」を主張する根拠が無い
    position: {centerX: 0.5, centerY: 0.658}   # 【2026-07-27 R10・4辺検算】caption を 0.857 へ上げたので連立を解き直した。
      # 0.658 = 710.6px、下端779.6px＝caption 上端796.6pxに**クリアランス17.0px**
      # 0.81 は**1行字幕のときだけ成立**していた。max_lines:2 をぴったり守った
      # 2行字幕でも**縦110px重なり名札が完全に消えた**（bbox 87.1%/pixel 0.786）。
      # max_lines を足しただけでは0.81の前提を担保できていなかった。
      # 2行字幕(0.9=972px・高さ268px)の上端838px − 余白16px − 影12px = 名札下端810px。
      # 名札高さ180pxなので中心720px → **centerY 0.667**。安全側で 0.68（734.4px、下端824px）
      # 安全側で **0.67**（723.6px、下端813.6px、字幕上端838pxに24.4pxのクリアランス）   # 【2026-07-27 衝突修正・導出値】
      # 旧0.85は caption(0.90) と**中心間54px**しかなく、実測で
      # **肩書行の不透明画素の95.64%が字幕と重なった**（pixel_collision 0.959）。
      # 目視で名札と字幕の両方が判読不能。z_orderの向きの都合で
      # 今回は「名札が字幕を潰す」方向に出た。
      # documentary_immersive(43px差)と**同型の欠陥の再発**であり、
      # 中心間距離だけを見て「離れている」と判断する誤りが繰り返されている。
      # 0.81 = 中心874.8px、名札高さ99pxで下端924.3px。
      # caption上端940pxに対し15.7pxのクリアランスを確保
    persistent: false
    style: プレーン
    z_order: 2
    entrance: pop                  # 推定（他ジャンルとの類推、サブ秒精度未検証）
    exit: fade                      # 推定
  - role: keyword                # 証拠テキストの赤下線ハイライト: 文書スクリーンショットの
    # 拡大表示に重ねて、金額・利率等の核心語句の下に赤い下線を引く。図形強調のためtelop_layers
    # 本来のテキスト層とは性質が異なるが、機能的に強調テロップと同格として記録
    # （ai_tool_avatar.yamlの赤コールアウト枠と同じ扱い）。実測（クロップ拡大で確認）
    position_mode: anchored_to_target   # 【2026-07-27追加】**この座標は固定値ではない**。指し示す対象（UI要素・チャートの棒・画面内の物体）の
      # 位置に追従する。散文は「対象により可変」「固定位置ではない」と書いているのに
      # positionが固定値1つしか持たず、**散文と構造化フィールドが矛盾**していた。
      # 実害: documentary_cinematicのkeywordが固定値のまま棒グラフを潰し
      # 「労働」の棒を91.8%被覆した。下記positionは代表値であり、
      # 実装は対象の実座標から算出すること
    mutually_exclusive_with: [caption, nameplate]   # 【2026-07-27 R8】dual_mode（モードA=caption+nameplate / モードB=evidence_heading+keyword+sidebar）
      # が含意する排他は **A×Bの総当たり6ペア**。R6は caption×evidence_heading の
      # **1/6 しか塞いでいなかった**。残り5ペアは yaml上「同時表示してよい」と読まれ、
      # R6が指摘した状況が nameplate 側に付け替わって生き残っていた
    intentional_overlap_with: [evidence_heading]   # 【2026-07-27 R8】相互記載
    variant: variant_host_investigator   # 【2026-07-27 R10・X3】**variant が9role中0件だった**。同じファイルの散文は
      # 「C1固有の役割（watermark/motion_graphic/statement_card/endcredit）はC2の役割群と
      # 重なりを比較する必要はない」と**変種で分離していると明言している**のに、
