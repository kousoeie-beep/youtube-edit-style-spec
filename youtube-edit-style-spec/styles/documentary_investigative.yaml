      # 実装者への意味: この要素の下は描画を省略してよい
  - role: endcredit                # 【2026-07-26 スキーマ修正で追加】C1(C1): 映画式
    # エンドクレジットカード。濃紺背景にNARRATOR/PRODUCERS/MOTION GRAPHICS/MUSIC/WRITERS/
    # EDITORS/EXECUTIVE PRODUCERSの役割別クレジットを列挙。他13スタイルに無い固有の締め方。
    # packaging.endcardの記述をtelop_layers側にも反映（実測）
    mutually_exclusive_with: [motion_graphic, statement_card]   # 【2026-07-27 R4】全画面カードは同時に2枚出せない。lintが交差100%として検出
    variant: variant_narrator_only   # 【2026-07-27 R10・X3】**variant が9role中0件だった**。同じファイルの散文は
      # 「C1固有の役割（watermark/motion_graphic/statement_card/endcredit）はC2の役割群と
      # 重なりを比較する必要はない」と**変種で分離していると明言している**のに、
      # フィールドに落ちていなかった。narrated が R8 で 8/8 に直した同型が丸ごと未着手。
      # フィールドどおり読むと C1×C2 の装置が同時表示され、実フレーム検査で
      # 「変種混在0」を主張する根拠が無い
    position: {centerX: 0.5, centerY: 0.5}
    persistent: false
    style: 全画面（濃紺背景+白文字、役割別リスト列挙）
    z_order: 7                       # 動画終端の専用画面のため最前面・単独表示
    entrance: hard_cut               # 未計測（推定）
    exit: hard_cut                    # 動画終了のため退場なし（N/A。フェードアウトの有無は未確認）
    size: {width: 1920, height: 1080}   # 【2026-07-27追加】`opaque_fullscreen: true` を書くなら
      # size の併記が**必須**（schema.mdの規約）。宣言だけでは1ピクセルも覆えず、
      # 実測で被覆率 business_talk 14.4% / educational_explainer 23.1% /
      # screen_tutorial 31.4% となり overlap_qc が全部却下した
    opaque_fullscreen: true   # 【2026-07-27 訂正】当初 `mutually_exclusive_with: all` と
      # 書いたが**誤りだったので撤回した**。再実装検証で、厳格解釈（常駐要素を時間分割で
      # 消す）と緩い解釈（z_orderで覆うだけ）の出力が**1画素も違わない**こと、
      # および**排他宣言を持たない全画面要素も同じく下を消す**ことが実測された。
      # ＝あのフィールドは実装を変えないinertな宣言だった。
      # 遮蔽は「全画面かつ不透明」＋z_orderで自動的に決まるので、
      # **要素自身の性質**として宣言する（フレームを見れば検証できる）。
      # 実装者への意味: この要素の下は描画を省略してよい

caption_font: "未計測（原寸解像度非公開）。証拠見出しキャプションは発話キャプションより
  やや大きい印象（目視相対比較、フォントサイズの実測値なし）。採用すべきデフォルト:
  発話キャプションは基準プリセット既定値よりやや小さめ（フォント70-80px相当・黒フチ8-10px）、
  証拠見出しキャプションは基準プリセット既定値相当（フォント90px前後）を推奨。不透明度は
  いずれも100%、証拠見出しのみ背景に40-50%程度の黒半透明グラデーションを敷く
  （ai_tool_avatarの背景輝度>0.65自動座布団ロジックが流用できる可能性が高い）。
  C1の全画面ステートメント（statement_card）とエンドクレジット（endcredit）は大玉表示のため
  160-200px相当を推奨（documentary_startup_journeyの時間軸カードと同基準、未計測）"

z_order_policy: |
  【2026-07-27 role分離に伴い更新（監査3対応）】旧「証拠文書見出しキャプション」は
  captionロールを「発話キーワードキャプション」と共有していたが、機能の異なる2装置
  （C2モードA専用の発話字幕 / C2モードB専用の証拠見出し）が1roleに相乗りしていたため
  evidence_headingへ分離した（telop_layers本体参照）。

  証拠画面区間（モードB）では複数レイヤー（evidence_heading+赤下線ハイライト(keyword)+
  インセット映像窓(sidebar)）が同時表示される場面を確認。z_orderはリスト順=重なり順を
  基本としつつ、赤下線ハイライト(4)とインセット映像窓(5)は情報の主役としてcaption・
  evidence_headingより前面に配置する。
  【2026-07-27 R9】ここは「evidence_heading(centerX0.3,centerY0.25)と」で**述語なく
  文が切れていた**（一括置換で後半が消えた跡。括弧は釣り合うので lint に出ない）。
  続く内容は下の訂正が引き継いでいるので、切れた書き出しを削除する。
  【2026-07-27 訂正・実測で反証された】旧記述は
  「インセット映像窓(sidebar,centerX0.7,centerY0.3)はX座標が768px相当離れており、
  実寸未計測のため厳密な検算はできない（判定保留）だが、この離隔幅であれば通常サイズの
  要素どうしなら衝突しにくい」としていたが、**再実装検証で見出しグリフの29.27%が潰れた**。
  **中心間距離は要素幅が未定義な限り安全の根拠にならない。**
  以下は反証済みの旧記述（記録として残す）:
  インセット映像窓(sidebar,centerX0.7,centerY0.3)はX座標が768px相当離れているが、
  **この離隔を根拠に「衝突しにくい」と判断してはいけない**（2026-07-27 実測で反証）。
  再実装検証で**見出しグリフの29.27%が潰れ**、さらに max_lines:1 を守った45px1行版でも
  **sidebarに20px食い込む**ことが確認されている。
  **中心間距離は要素幅が未定義な限り安全の根拠にならない。**
  ※この20px衝突は sidebar が layer_kind: video のため **QCには一切現れない**。目視でのみ拾える。赤下線ハイライト(keyword)は
  対象文書内の可変位置（variable）のため固定要素との衝突は原理的に保証できず、実装時に
  個別確認が必要（telop_layers本体のkeywordコメント参照）。

  C1(variant_narrator_only)はC2(variant_host_investigator)と
  同時表示されない別variantのため、C1固有の役割（watermark/motion_graphic/statement_card/
  endcredit）はC2の役割群と重なりを比較する必要はない。C1内部の重なりはウォーターマーク(1)
  ＜モーショングラフィックス(2)＜全画面ステートメント(6)＜エンドクレジット(7)の順で、
  全画面カード系（ステートメント/エンドクレジット）は下層の常駐要素を完全に覆う最前面として
  扱い、表示中は他のC1要素と同時表示しない設計とする

dual_mode: "**明確な2モード切替構造あり**（推定を含むが実測タイルの並びから構造として
  確認）。モードA=トーキングヘッド/インタビュー（発話キーワードキャプション+人物名
  ロワーサードのみ表示）、モードB=証拠提示（見出しキャプション+赤下線ハイライト+
  インセット映像窓が表示され、パーソナリティの顔出しは縮小または非表示）。
  モード切替はハードカットで、実測範囲でクロスフェード等の中間状態は確認されず。
  このモードB「証拠提示」の情報密度がC系（少なくともC2）の最大の個性であり、
  他ジャンルのモード切替（ai_tool_avatar等）が『解説カード⇔画面共有』であるのに対し、
  C系は『語り⇔物的証拠』という調査報道特有の切り替えである点が新規性"

