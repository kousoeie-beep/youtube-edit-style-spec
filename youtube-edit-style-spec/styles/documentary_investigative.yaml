apply_notes: |
  youtube-edit-style-specパイプラインでの適用方法・実装上の注意点:

  【最優先で再現すべきは「モードA/モードB」の証拠提示構造】C2で確認された最大の特徴は、
  発話ベースのトーキングヘッド区間と、文書・スクリーンショット等の物的証拠を赤下線
  ハイライト付きで提示する区間がハードカットで交互に現れる構造。「完コピ」を狙うなら
  まずこの2モードへの素材仕分けが前提になる（ai_tool_avatarのモードA/B分類と同じ
  アプローチが流用可能）。

  【赤下線ハイライトの実装】既存のscreen_tutorial/ai_tool_avatarの「赤系コールアウト」
  実装（矩形枠・矢印）とは異なり、C2は下線のみというシンプルな図形強調。文書スクショの
  該当箇所に赤い横線を重ねるだけで良く、実装コストは低い。

  【LRAの解釈に注意】C1(LRA2.7)とC2(LRA9.6)の差は、単純な「編集技術の違い」ではなく
  『ナレーション主体 vs 対談主体』というコンテンツ形式の違いに起因すると考えられる。
  調査考察系スタイルを適用する際は、対象素材がどちらの形式に近いかを先に判断し、
  LRA目標値を使い分けること。

  【既存10スタイルとの最大の差分】kirinuki（切り抜き・論点見出しチャプター）が
  「証拠提示」に近い方向性を持つが、C2のような『文書スクリーンショット+赤下線+
  インセット映像窓』という調査報道ジャーナリズム特有のビジュアル言語は既存スタイルに
  皆無。詐欺・スキャム暴露系や不正調査系の案件でこのスタイルが最も差別化価値を発揮する。

  【未確認・今後の検証課題（正直に明記）】
  1. ~~C1のタイル絵コンテが存在せず視覚文法が完全に未確認~~
     → **2026-07-25にC1のタイルを追加生成し目視して解消済み**。その結果
       「C2から類推したdual_mode構造がC1にも当てはまるか」という問いには **当てはまらない**
       と答えが出た。C1は**ホストの顔出しがゼロ**で、C2のトーキングヘッド⇔証拠提示という
       2モード往復構造を持たない。**顔出し有無で2分岐する**ことが確定し、C1固有の装置
       （ウォーターマーク常駐／モーショングラフィックス／全画面ステートメント／映画式
       エンドクレジット）にもtelop_layersのroleを追加済み（variant_split参照）
  2. entrance/exitのサブ秒精度検証は未実施（wipe_explainer相当のフレーム単位検証が必要）。**未解決**
  3. BGM・SE・ducking・filler_policyは聴取未実施のため全て未検証。**未解決**
  4. ~~n=2（うち視覚文法確認は実質n=1）~~
     → **視覚文法もn=2に到達済み**（C1/C2の両方を目視確認）。
       ただし **2本が2つの異なる変種に分かれた**ため、**各変種はn=1**という別の限界が残る。
       C1とC2はテーマ（技術社会考察 vs 詐欺暴露）も顔出し有無も異なり、
       **「調査考察系」というジャンル全体への一般化は依然として不可**。
       特定の変種を採用する場合は同型の追加実測を推奨する。
