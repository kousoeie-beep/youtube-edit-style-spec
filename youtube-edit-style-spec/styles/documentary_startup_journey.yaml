    anchor: left   # 【2026-07-27 R8追加】
    margin_left: 24   # 【2026-07-27 R8追加】
    font_px_name: 34   # 【2026-07-27 R9追加】**font_px が無く、size.height 109 × max_lines 2 が課す上限
      # （約37px）を実装者が知る手段が無かった**。R8が発明した44/32は113pxで宣言sizeに入らない。
      # 氏名を44px級で見せたいなら size.height を129へ上げ、**下の連立を解き直すこと**
    font_px_attr: 30   # 【2026-07-27 R9追加】肩書＋年齢。行高44
    padding_px: 8   # 【2026-07-27 R9追加】(110 − 50 − 44)/2 = 8
    position: {centerX: 0.145, centerY: 0.165}   # 【2026-07-27 R9・連立の解き直し】size.width を509へ広げたぶん centerX も再計算。
      # 0.145 = 278.4px、半幅254.5 → **実左端23.9px**（chapter_tag と揃う）。
      # centerY 0.165 = 178.2px（上端120.2px、chapter_tag 下端100.5pxに
      # クリアランス19.7px、下端245.2px）
      # クリアランスが20.2→9.4pxに落ちる。0.165 = 178.2px（上端120.2px、
      # chapter_tag 下端100.5pxに**クリアランス19.7px**、下端245.2px）
      # centerX 0.142 → 実左端23.1px / 実右端531.1px（chapter_tag と左端 x=24 で揃う）
      # 【2026-07-27 R9】chapter_tag を 0.05 へ上げた（上端の7px境界解の解消）ので
      # 0.155 では クリアランスが 20.2 → 9.4px に落ちる。0.165 へ連立を解き直した
      # （R6の0.135は実測0px接触、R8の0.155は chapter_tag 0.04 前提の値）
      # 旧0.09は chapter_tag(0.04) と**共存不能**であることが実レンダリングで確定した。
      # 検算: 中心間距離 = (0.09-0.04)*1080 = 54px。衝突しない条件は
      # (chapter_tag高さ69 + person_status高さ109)/2 = 89px 以下の間隔では不可、つまり89px必要。
      # **person_status単体(109px)だけで上限を超えており、章タグの高さがゼロでも衝突する**
      # （実測 pixel_collision 100.0%）。氏名＋肩書の2行はyaml規定の仕様なので高さは削れない。
      # 【2026-07-27 R9・削除】ここには「0.135 なら実クリアランス13.6pxを確保できる」と
      # あったが、**R8実測ではクリアランス0px（影込み−1.4px）で確保できていなかった**。
      # 現行は 0.165（クリアランス19.7px）。3行上の記述が既にこれを反証している
      # ※旧0.09は厳密な実測ではなく適用検証時の推定値であるため導出し直した。
      #   高解像度素材が手に入ったら再計測すること
    persistent: false             # 章タグと併置する場合は常駐運用もあり（S2bは常駐）
    style: プレーン（小さめ・低コントラストの座布団）
    z_order: 3   # 【2026-07-27 R8・z_order全面付け替え】R6の部分修正は**幾何欠陥をz_order欠陥と読み違えた**もので、
      # person_status を3→6にしても交差は1pxも減らず（pixel 0.9945）、むしろ**前面に回って
      # Q.カードを潰す側になり、opaque_fullscreenの全画面カード(5)まで越えた**。
      # 同時表示しうる全roleに一意な値を振り直し、(a)全画面カードが最前面 (b)同値ゼロ を両立させる
      # **1つ動かすと別の同値を作る**ので、z_orderは全roleを一覧して決めること。
      # 【2026-07-27 R9・R6の記述を削除】ここには「空いている6へ」「人物ステータスを
      # 前面に置く」が残っていたが、**R8でその判断自体が誤診と確定している**
      # （交差は幾何の問題で、zを動かしても1pxも減らなかった）。
      # 撤回済みの指示を残すと、そこだけ読んだ実装者が同じ誤りを再現する
    entrance: hard_cut            # 未計測（推定）
    exit: hard_cut                 # 未計測（推定）
  - role: cta_banner            # 【2026-07-25 適用検証で追加】末尾CTAバナー
    # variant_field_interview の6点セットの1つ。告知＋QRコード等。
    # 実測: S2=自社プログラム告知バナー+QR（水色背景）、S3b=「1日ありがとうございました!」
    size: {width: 900, height: 254}   # 【2026-07-27 R10・高さの収容検査を新設したら出た】幅の検査はR4からあったのに
      # **高さには一度も検査が無かった**。箱が中身より低いと、実装者はフォントを落とすか
      # はみ出させるかを勝手に選ぶ。
      # 250 では font70 の行高103×2 + padding24×2 = 254 が入らない
      # 隣に書いた式 `(801 − 16 − 12 − 648) × 2` は **250** にしかならないのに
      # 値は282と書いていた。282を逆算すると `(801 − 12 − 648) × 2` で
      # **16pxの余白項が自分の計算から落ちていた**。
      # 実測でCTAの下端がちょうど801pxに来て字幕まで3pxしか残らなかった（衝突はしない）。
      # 式どおりの250へ。2行字幕上端801px − 余白16px − 影12px − 中心648px = 125、×2 = 250
    variant: variant_field_interview   # 【2026-07-27 R9追加】末尾CTAは field_interview の6点セットの1つ。
      # これを書かないと build_live の円形PiP と 208×208px（33%）交差する
      # （**QCは pip が layer_kind: video なので overlaps=0 を返す**）
    qr_px: 180   # 【2026-07-27 R9追加】散文が「QRコードを右端に配置可」と書いているのに
      # **QRの寸法がどこにも無く、文字ブロックの幅が決まらなかった**
    font_px: 70   # 【2026-07-27 R9追加】size.height 250 から逆算（行高101×2 + padding24×2 = 250）。【2026-07-27 R9追加】yaml自身が挙げる実測文言から導出した値であって、
    max_width_px: 656   # 【2026-07-27 R9追加】900 − QR180 − gap16 − padding24×2
    max_chars: 9   # 【2026-07-27 R9追加】9×70 = 630 ≤ 656。実測例「1日ありがとうございました!」14字は2行になる
    max_lines: 2   # 【2026-07-27 R9追加】
    padding_px: 24   # 【2026-07-27 R9追加】
    overflow_policy: split_event   # 【2026-07-27 R9追加】3行必要ならバナーを分ける
    char_width_px: 70   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    max_chars_total: 18   # 【2026-07-27 R10】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値。実測できたら上書きすること
      # 656 ÷ 70 = 9.37 → 1行9字、2行で18字
    position: {centerX: 0.5, centerY: 0.548}   # 【2026-07-27 R11】0.54 → 0.548。question_card の箱が168になった連鎖で、
      # 上下2つのすきまを両立させるには 217.2px の帯が要る（16+183+16 = 215）。
      # 上限は caption 箱の上端747.4px − 16 − 127 − 12 = 592.4px → 0.5485。0.548 = 591.8px
      # → cY ≤ 0.5504。0.54で下端720.2px、caption2行上端747.4pxに**クリアランス27.2px**。
      # ※旧0.60の「67pxクリアランス」は**実測16px**で51px乖離していた（4回目の誤導出）
      # 【2026-07-27 R8・撤回済みの導出をすべて削除】この1フィールドの導出を
      # **0.86 → 0.67 → 0.60 → 0.54 と4回外した**。外し方は毎回同じで、
      # 「字幕側の上端」を推定値のまま使い、字幕側を動かした後に再計算しなかった。
      # 撤回した数字（817px / 762px / 24pxクリアランス / 67pxクリアランス）は
      # 混同の元なので本文から削除する。**現行の唯一の導出は上3行**。
      # **caption の centerY / font_px / max_lines / フチ幅のいずれかを動かしたら、
      #   この値も必ず導出し直すこと**（4回とも、これを怠って外した）。
      # 【旧記述】0.86 が構造的に不能だった理由:
      # 旧0.86は caption(0.88) と**構造的に共存不能**だった。
      # 検算: 旧cta中心 0.86*1080 = 928.8px が、1行字幕の実描画帯[897,1011]の**内側**にある。
      # → 高さが0でない限りどんなCTAでも必ず衝突する（実測 pixel_collision 99.88%、
      #   目視で「本日□□□□□□した」と字幕が読めない）。
      # しかもこの衝突は仕様上回避できない。装置①が「**全編**フル字幕（全発話カバー）」で、
      # 装置⑥の実測例S3bが「1日ありがとうございました!」という**発話**だからである。
      # ＝CTA表示中に字幕が出ないケースが存在しない。
      # 【2026-07-27 R9・宣言どおり削除】ここには 0.67 の導出
      # 「723.6px / 高さ139px / 下端793px / 2行字幕の上端817px / 24pxクリアランス」が
      # 残っていた。**14行上で「817px・24pxクリアランスは本文から削除する」と
      # 宣言しておきながら、実体を消していなかった**（R8の取りこぼし）。
      # 宣言と実体が食い違っている状態がいちばん危ない。
      # ※旧0.86は「未計測（推定、CTA帯として下部を想定）」であり実測ではない
    persistent: false
    style: カード（濃色背景+白文字、QRコードを右端に配置可）
    z_order: 6   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    entrance: hard_cut            # 未計測（推定）
    exit: hard_cut                 # 未計測（推定）
  - role: pip                   # 円形webcam PiP（P1で実測）
    # パステルグラデーション背景にプロダクト画面と並置。顔が常に見えることで
    # 「誰が作っているか」を維持する。wipe_explainerの矩形ワイプとは異なり円形
    layer_kind: video            # 【2026-07-27追加】このroleは**動画レイヤー**であり
      # overlap_qc の検査対象から自動的に除外される（アルファを静的に取れないため）。
      # screen_tutorialの検証では生成20レイヤーに対し element_count=19 となり、
      # **PiP絡みの衝突8件がQCに1件も現れなかった**。QCの盲点は既知でも
      # 「どのroleが盲点に落ちるか」がyamlから読めなかったので機械可読な印を付ける。
      # **このroleは必ずフレーム目視で確認すること**
    variant: variant_build_live   # 【2026-07-27 R9追加】上記 nameplate の注記参照
    size: {width: 360, height: 360}   # 【2026-07-27 R9追加】円形PiPの外形。QCの検査外なので寸法を機械で見る唯一の手段
    color_shadow: "none"   # 【2026-07-27 R9追加】画面端にフチ合わせで置く円形PiPは共通デフォルトの影で画面外へ出る
      # （schema.md R8追記。ai_tool_avatar の丸窓PiPで実測済み）
    position: {centerX: 0.72, centerY: 0.45}
    persistent: true
    style: 円形クロップ（縁取りなし）
    z_order: 7   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    entrance: hard_cut            # 実測（動画開始と同時に表示）
    exit: hard_cut

caption_font: |
  未計測（360p素材のため実寸不明）。採用すべきデフォルト:
  - フル字幕型（S2/S3系）: 基準プリセット既定値（フォント92／黒フチ12px）をそのまま採用可
  - シネマティック型（S1/P3系）: ひと回り小さく（70-80px相当）、フチも細め（6-8px）にして
    映像の邪魔をしないこと。**このスタイルでは字幕が主役ではない**
  - 時間軸カード（DAY N / 章カード）: 全画面カードなので160-200px相当の大書き
  **字幕テロップ**の不透明度はいずれも100%（字幕の半透明運用は未確認）。
  ただし **nameplate（番組ロゴの常駐）は半透明白での運用を実測済み**（telop_layers参照）。
  「不透明度100%」は字幕系レイヤーに限った話であり、常駐ロゴには適用されない

z_order_policy: |
  【2026-07-27 再実装検証で全面改訂】yamlだけを読ませて実装・レンダリングさせたところ、
  **本ポリシー自身が定義と矛盾しており、2組が構造的に共存不能**だと判明した。
  以下は実測に基づく訂正後の内容である。

  ■ 訂正1: 「排他だから role 共有でよい」は成立していなかった
  旧記述は「sidebar は章インジケーター(life_chapters)と進捗証拠カード(day_log)で共有する
  が、7変種は排他だから同時表示は起きない。分離不要」としていた。
  しかし**本ポリシー自身が「人物ステータスと章インジケーターを同じ隅に積む場合」と書いており、
  person_status は field_interview 専用 role** である。つまり章インジケーターは
  life_chapters 専用ではなく field_interview でも使う。根拠として挙げたS2bも
  field_interview の実測対象そのものだった。
  → 章インジケーターを **chapter_tag role へ分離**し、variant を
    [variant_life_chapters, variant_field_interview] と明示した。

  ■ 訂正2: 人物ステータスと章タグは旧座標では共存不能だった（pixel_collision 100.0%）
  旧: chapter_tag 0.04 / person_status 0.09 → 中心間54px。
  必要間隔は (69+109)/2 = 89px。**person_status単体109pxで既に上限超過**であり、
  章タグの高さがゼロでも衝突する。person_status を 0.135 へ移動したが、
  **R8実測ではクリアランス0px（影込みで−1.4px）で、13.6pxは確保できていなかった**。
  0.155 へ再移動して20.2pxを確保した。
  「同じ隅に積む場合は縦に並べる」という指示自体は正しかったが、
  **与えられていた0.04と0.09が縦に並べられない値だった**（指示と数値の矛盾）。

  ■ 訂正3: CTAバナーと発話字幕は旧座標では共存不能だった（pixel_collision 99.88%）
  旧 cta_banner 0.86 = 928.8px は、1行字幕の実描画帯[897,1011]の**内側**にあり、
  高さが0でない限り必ず衝突した。しかも装置①が「全編フル字幕（全発話カバー）」、
  装置⑥の実測例が発話そのものなので、**CTA表示中に字幕が出ない状況が存在しない**。
  cta_banner は **0.54**。導出は「caption(0.83)の2行上端 747.4px − 余白16px − 影12px
  − 高さ250/2」で、クリアランス27.2px。
  【R8】旧記述の「0.67へ移動・24pxクリアランス」は**撤回済み**（実測は40pxの重なり）。

  【2026-07-27 R8・全面付け替え】同時表示しうるrole間の同値をゼロにした:
  時間軸カード(9) > 進捗証拠カード(8) > 常駐ロゴ(7) = 円形PiP(7)
    > CTAバナー(6) > 質問カード(5) > 発話字幕(4) > 人物ステータス(3) > 章タグ(2)。
  ※常駐ロゴ(field_interview) と 円形PiP(build_live) は変種が排他なので同値でよい。
  ※R6は person_status を 2→6 に上げたが、**あれは幾何欠陥をz_order欠陥と読み違えた修正**で、
    交差は1pxも減らず（pixel 0.9945）、逆に全画面カード(opaque_fullscreen)まで越えていた。
    重なり自体は座標（0.155 / 0.30）の側で解消してある。
  時間軸カードは全画面を占有するため最前面。他要素は同時表示されない設計にすること
  （カード表示中に字幕が透けると「区切り」の効果が壊れる）。
  **質問カード(5)と発話字幕(4)は同時に出しうる**が、画面上下に分離して配置すること
  （質問カードは上部centerY0.31、字幕は下部centerY0.83）。
  【2026-07-27 R9】旧記述は「(3)と(3)・0.24と0.88」で、z も座標も現行値と違っていた。
  **人物ステータス(3)と章タグ(2)を同じ隅に積む場合**は縦に並べる（S2bの実装がこの形）。
  ただし上記「訂正2」の通り、**旧座標(0.04/0.09)では縦に並べられない**ことが
  実レンダリングで確定している。現行の **0.05 / 0.165** を使うこと
  （【2026-07-27 R11】R10でもここが旧値のまま残り**2周連続**で指摘された。
    散文どおりに 0.04 を採ると chapter_tag の上端が8.2pxの境界解に戻る）
  （0.135はR8実測でクリアランス0px＝接触。影を数えると−1.4pxだった）。
  旧記述の「適用検証でも問題なし」は誤りだった（当時は両者を同時に描画していなかった）。

dual_mode: |
  型Pの画面共有ライブ型（P1）のみ2モード構造を持つ:
  モードA=顔のみ（円形PiPが画面中央・大きめ、語りかけ）、
  モードB=プロダクト画面+円形PiP（PiPは右に退避・小さめ）。
  切替はハードカット。モードA中は字幕なし、モードB中も字幕なし（本人の声のみで進む）。
  他の5変種はモード切替構造を持たない。

animation_dictionary_mapping:
  時間軸カードの出入り: "hard_cut（実測・P2のDAYカード）"
  感情強調テロップ: "pop相当（推定。S3の黄/水色強調は語単位で切り替わる）"
  不使用: "shake/bounce等の派手な動きは6本とも未検出。この系統は落ち着いた語り口が基調"

transitions:
  default: hard_cut
  accent: ["黒フレームを挟んだ区切り（S1の感情ピボット・P2のDAYカード前後で実測）"]

audio:
  bgm: "変種依存（聴取未実施のため推定）。シネマティック型（S1/P3）はLRAが広く（12.4/6.1）
    静かな劇伴が想定される。build in public型（P2）はLRA 6.0で無音0.44%＝音が途切れない"
  voice_lufs_target: |
    -13.1〜-25.9（S2=-13.1 / S3=-15.7 / P2=-17.8 / P1=-20.9 / S1=-24.3 / P3=-25.9）。
    **12.8LUという極端な幅があり、単一の目標値は存在しない**。作り込み度で二極化する:
    - 生々しい型（S2の密着インタビュー / P2のDay連番）: -13〜-18 LUFS（YouTube標準寄り）
    - シネマティック型（S1 / P3）: -24〜-26 LUFS（映画的に小さく、劇場的な余韻を作る）
  lra: "6.0-12.4（P2=6.0 / P3=6.1 / S3=8.4 / S2=10.7 / P1=12.3 / S1=12.4）"
  true_peak: "0.0〜2.4 dBFS（実測。6本ともほぼ0dBFS以上に張り付いており、
    納品時は必ずリミッターで-1.0dBFS以下に抑えること）
    **【2026-07-26 重要】この実測値は0 dBFSを超えており、参考動画側がクリッピングしていることを意味する。**再現目標にしてはいけない。**納品時は必ず -1.0 dBFS 以下に抑えること**（SKILL.mdの納品基準）。ここに記録しているのは「参考動画がそうだった」という事実であって、「そうすべき」という指示ではない。"
  se_style: unknown
  ducking: unknown

pacing:
  gap_keep_sec: |
    実測（silencedetect -35dB/0.5s基準の無音率）: P2=0.44% / S2=1.24% / P3=4.99% /
    P1=5.01% / S1=5.44% / S3=5.44%。
    **既存のドキュメンタリー4系統（A〜C系=0.13-1.22%）より明確に無音率が高い**。
    人が自分の過去や失敗を語る間（ま）を残すのがこの系統の特徴。
    唯一P2（Day連番型）だけが0.44%と詰めており、テンポで引っ張る設計。
  filler_policy: "conservative（言い淀み・沈黙を残す）。ただしP2型のみaggressive。
    **この系統では言い淀みを消しすぎると「作られた話」に見えて応援されなくなる**"
  hook: |
    実測5形態:
    - S1: 静かな日常カット→黒背景テキストカードで問いを提示
    - S2: フック発言の引用テロップを黄縁白抜き太字で全画面（「会社をやっていて良かったなと思う」）
    - S3: 感情の核を最初に置く（「とんでもない失敗を自分はしたんじゃないか」）
    - P1: cold_open（円形PiPで即語り始め、前置きなし）
    - P2: 宣言型（「IS TO LAUNCH AN ACTUAL...」の全画面テキスト→本編）
    **共通するのは「結論や成功」ではなく「痛み・不安・決意」から入ること**
  operation_wait_policy: N/A

structure_grammar:
  variant_split: |
    **第一軸は「発信主体」ではなく「作り込み度」**（実測で設計仮説を修正）。
    6本が6変種に分かれたため、適用時は必ずどれか1つを選ぶこと。

    ■ 生々しい型（応援＝一緒に作る／視聴者は伴走者）
    (1) variant_day_log（P2 Andrew Zacker型）★こうすけ要望の中心
        - **「DAY 3」全画面黒背景+白大文字カード**でエピソードを刻む。赤い数字も併用
        - トーキングヘッド主体。自宅・夜のデスク・部屋着＝生活感を隠さない
        - 学びを全画面テロップで共有（"ADS CAN BE A GOOD WAY TO GET YOUR FIRST FEEDBACK"）
        - **進捗の証拠はユーザーの声のスクショ**（青カード）。数値グラフではない
        - 実測: cuts 11.67/分・リズム37.80・-17.8 LUFS・LRA 6.0・無音0.44%（テンポで引く）
        - **【2026-07-25 n増検証の結果・重要】この「DAYカード＋学びテロップ」の文法は
          同型3本を追加実測した結果 *再現しなかった*（n=4で1本のみ）。Zacker氏個人の
          編集スタイルであり、build in public ジャンルの標準ではない。**
          「Day連番シリーズであること」はタイトル・企画の構造であって、
          必ずしも画面上のDAYカードとして実装されるわけではない、というのが実測の結論。
          → **この文法を使うこと自体は有効**（視聴者に進行を伝える装置として機能する）が、
            「ジャンルの型だから」ではなく「意図して選ぶ演出」として扱うこと。
    (2) variant_build_live（P1 Ufuk Dede型 / P2c David Cifuentes型）★n増で再現を確認
        - パステルグラデ背景（P1）または**デスクトップそのまま**（P2c）+ **円形webcam PiP**、
          隣に作りかけのプロダクト画面
        - ランディングページ→アプリUI→スマホモックと、作っている物そのものを見せ続ける
        - **【最重要・進捗の証拠】P2cは Stripe ダッシュボードの生画面をそのまま流す**
          （Billing overview の売上$3,000超、Customers 一覧）。デザインしたグラフではなく
          **本物の管理画面を見せる**のが最も強い証拠になる。ブラウザのUI・OSのメニューバー・
          タブが映ったままで、**加工しないことが信頼性の担保**として機能している
        - 実測: P1 cuts 0.17/分・-20.9 LUFS・LRA 12.3・無音5.01%
                P2c cuts 0.09/分（全編でハードカット1回のみ）・-23.2 LUFS・LRA 5.8・無音18.79%
        - **n増で再現した唯一の変種**（P1/P2cが独立に同じ「円形PiP+画面録画」構造に到達）
        - **wipe_explainerと構造は似るが中身が「他人のツール解説」でなく「進行形の自作品」**

    (2b) variant_desk_monologue（P2b Luke Urban型）★n増で発見した新変種
        - 暗い部屋・デスクの定点カメラ・黒パーカーで淡々と語るだけ。**テロップが一切ない**
        - 30日連載シリーズ（#BuildSell30）でありながら画面上に連番表示すら出さない
        - 実測: cuts 2.51/分・リズム9.80・**-38.3 LUFS**（全実測中で最小）・LRA 6.4・
          **無音30.04%**（全実測中で最大。230回の無音区間＝考えながら話す間をそのまま残す）
        - True Peakは-0.9 dBFSで音自体は入っており、**発話がまばらなだけ**（機材不良ではない）
        - **生々しさの極北**。応援を集める最小構成がここまで削れることを示す実例
    (3) variant_field_interview（S2 S1 / S2b S2 / S3b S3型）
        ★★**n=3で最も強く確定した変種。日本で「密着ドキュメンタリー」を作るならこれが標準**
        - 1日密着＋インタビュー。3本とも早朝〜夜の時系列で1日を追う構成
        - **3本すべてに共通する装置セット（そのまま実装仕様として使える）**:
          ①**全編フル字幕**（白文字・黒縁・画面下部中央）
          ②**チャンネルロゴ常駐**（S2=右上/S2b=左下/S3b=右上。位置は自由だが必ず出す）
          ③**行動ラベル／章タグ**（画面上部の隅に小さく常駐）。時系列の進行を実況する
             S3b実測:「掃除終了」「掃除後のお食事」「お客様のお出迎え」「テイクアウト」「今後の目標」
             S2b実測:「経歴について」「営業時代の活動について」「今後の展望」「視聴者メッセージ」
             → **S3bは行動、S2bは質問トピックでラベリング**。どちらも「今どこか」を示す
          ④**「Q.」アイコン付き質問カード**（角丸バナー。インタビュアーの問いを明示）
             S3b実測:「引退後もココイチは伸び続けている?」S2b実測:「川元さんの印象について」
          ⑤**人物ステータス／名前テロップ**
             S2b実測: 左上に「採用担当マネージャー / 26歳」を常駐。S3b実測: 登場人物の氏名テロップ
          ⑥**末尾CTA**（S2=自社プログラム告知＋QR、S3b=「1日ありがとうございました!」の締め）
        - 追加で確認された装置: 冒頭の赤枠フックカード（S3b「たった一言『ありがとう』
          経営者こそ言うべきワケ」）、「POINT」バナー（赤ラベル＋白背景の要点箱書き）、
          手書き風の色付き強調（S3bのピンク「セクハラだ」）
        - 挫折・本音を字幕で明示的に言語化するのも3本共通
          （S2「何回も潰れかけました」/ S2b「現状維持は衰退って言葉もほんまにそうやなと思う」）
        - **実測値（n=3）**:
          cuts 3.21-9.19/分（S3b=3.21 / S2=4.62 / S2b=9.19）
          LUFS -13.1〜-21.1（幅8LU・再現せず）
          **無音率 0.86-1.29%（S2b=0.86 / S2=1.24 / S3b=1.29）＝3本で極めて安定。再現する数値**
        - → **装置セットと無音率(約1%＝間を詰める)は再現する。カット率とLUFSは再現しない**

    ■ シネマティック型（応援＝感動して推す／視聴者は観客）
    (4) variant_life_chapters（S3 / S3c / S3d）
        ★★**日本の王道・n=3で確定。実装仕様としてそのまま使える**
        **再現した装置（3本共通）**:
        - **人生の時系列を章で刻み、章名を画面隅に常駐表示する**
          S3実測:「3歳、原体験のルーツ」「0〜15歳、津田ヤンキーの原点」「成人式で感じた孤独」
          S3c実測:「○○という人間を作った環境」「大学に行かなかった理由」
                   「青年時代に影響を受けた人」「バンド活動&メジャーデビュー」
                   「ビジネスを始めたきっかけ」
          → **章名は「年齢」でも「テーマ」でもよいが、必ず時系列順に並べる**
          S3d実測:「鉄・力の先に見えるもの」「輝きと品質を生む」「立ちはだかる試練」
                   「プロジェクトの結実」（＝時系列というより物語の起承転結で刻む型）
        - **番組ロゴを画面隅に常駐**（S3=右上「△△△△〜Documentary〜」/ S3c=右上「LIFE IS」/
          S3d=左上「」）**3本とも例外なく常駐**
        - **章の変わり目に全画面カード**（S3=茶背景+明朝体「成人式で感じた孤独」/
          S3d=黒背景+白文字+オレンジのアクセントライン「越川工業の原点」）※S3cのみ不使用
        - **アーカイブ素材で原点を可視化**（S3=幼少期の写真をヴィネット処理 /
          S3d=若い頃の集合写真・工場全焼後の焼け跡写真 / S3c=年表グラフィック）
          → **手段は違うが3本とも「過去を目で見せる」装置を必ず持つ**
        - **感情ワードだけを色で抜く**（S3=黄/赤/水色の3色使い分け、S3c=水色系ほぼ一色。
          S3dは白字中心で色抜きは控えめ。「地の字幕は白、感情の核だけ色」の原則は共通だが
          色数はチャンネル差が大きい）
        - 大きめの白文字強調で決定的な発言を見せる
          （S3c実測:「俺は激しい音楽を奏でるミュージシャンになる」
                    「解雇だなんていう判断をした自分に嫌気がさした」）
        - 第三者証言のインサート（S3d実測: 右上にオレンジ枠のインタビューPiPを重ねる）
        - **実測値（n=3）**:
          **cuts 3.96-6.47/分（S3c=3.96 / S3d=4.20 / S3=6.47）＝3本とも近く、再現する**
          LUFS -15.7〜-20.4（S3=-15.7 / S3c=-16.0 / S3d=-20.4。2本一致・1本外れ）
          LRA 7.7-11.6／無音5.44-11.74%（S3=5.44 / S3d=5.48 が一致、S3c=11.74のみ高い）
          尺29-58分（**長尺前提**）
          → **カット率約4-6.5/分は目標値に使える。LUFSと無音率は2/3一致で参考値**

        **S3cで新たに発見した強力な装置（S3には無かった）**:
        - **横軸の年表グラフィック**（「○○のこれまで」。1975年生まれ→1993→1998→
          2004→2007→2012→2017→2019→2021 と主要な出来事を年号付きで並べ、現在地を強調表示）
          → **人生年表型の決定版と言える可視化**。章立てだけでは伝わらない「全体像の中の今」
            を一枚で示せる。この変種を採用するなら入れる価値が高い
        - インタビュアーのプロフィールカード（氏名+肩書+経歴3行）を序盤に提示

        **再現しなかった要素（チャンネル固有）**:
        - 原点回帰ロケ（S3は実家近くの海・母校・公民館を歩きながら語る。S3cはスタジオ対談、
          S3dは工場・現場での撮影）。**ロケ形式は自由。章立てと過去の可視化があれば成立する**
        - 撮影形式そのものが3本バラバラ（S3=本人が地元を歩く / S3c=スタジオ2人対談 /
          S3d=職場に密着）。**この変種の本質は撮影ではなく「構成」にある**
    (5) variant_cinematic_recall（S1/S1b P-sample型）★n=2で視覚文法の再現を確認
        - 黒背景+白文字の全画面カードで感情のピボット／転換点を作る
          （S1実測:「しかし、うまくもいかない」→「だから、今挑戦できる」
            S1b実測:「大学の講義で出会った、スタートアップの世界」）
        - **レターボックス（上下黒帯）** — シネマティックな画面比率（2本とも実測）
        - 幼少期の写真をヴィネット処理で挿入＝原点の可視化（S1）
        - **ブランドロゴカード（金文字「Focus On」）を冒頭・中盤・末尾に挿入**（2本とも実測）
        - ミッションステートメントを提示し、**キーワードだけ黄色で抜く**
          （S1b実測:「フェアで持続可能な、誇れるモノづくりを。」の"モノづくり"が黄）
        - 人物プロフィールカード（社名・役職・氏名＋経歴テキスト）を序盤に配置（S1b実測）
        - 字幕は控えめ・小さめ。ミッション到達で締める
        - 実測: S1 cuts 6.10/分・-24.3 LUFS・LRA 12.4・無音5.44%
                S1b cuts 17.42/分・-20.8 LUFS・LRA 9.7・無音13.68%

        **【2026-07-25 n増検証の結論】同一チャンネルの別作品で
        「視覚文法は完全に再現、数値は全く再現しない」**という結果になった。
        レターボックス・黒背景カード・ブランドロゴ・黄キーワード抜き・控えめ字幕は
        2本で一致したが、cuts_per_minは6.10→17.42（2.9倍）、無音率は5.44%→13.68%と乖離した。
        → **この変種を適用する際は「意匠」だけを踏襲し、カット率・LUFS・無音率は
          素材の性質（ロケーション数・インタビューの切り返し量）に応じて決めること。**
        wipe_explainerのn増と同じ構図（意匠は再現・数値は非再現）。
    (6) variant_cinematic_recall_en（P3 Kevin Park型）
        - (5)と同系統だが当事者発信。三脚固定・浅い被写界深度・ティール基調の統一グレーディング
        - B-roll（トラック群・作業風景・空撮・機窓）を多用
        - 実測: cuts 14.82/分・**-25.9 LUFS**（6本中最小）・無音4.99%・尺6分半（短尺）

  emotional_arc: |
    **6本すべてに「落として上げる」構造が実在した**（この系統の必須要素）。実装の型:
    - 全画面テキストカードで落とす（S1「しかし、うまくもいかない」/ S3「この町で生まれたの詰んでる?」）
    - 字幕で痛みを言語化する（S2「何回も潰れかけました」）
    - 失敗を隠さず尺を割く（P2は自分のweaknessを全画面で宣言）
    **順調な話だけでは応援されない。落差が感情を作る**というのが6本共通の設計。

  rawness_policy: |
    **この系統だけが持つ逆説**: 既存15スタイルは全て「作り込む」方向に最適化されているが、
    この系統では**作り込みすぎると「応援」ではなく「消費」になる**。

    **【2026-07-25 n増検証で強く裏付けられた】** build in public 系4本のうち3本が
    極端に生々しい側に寄っていた（無音率5.01% / 18.79% / 30.04%、カット率0.09-2.51/分）。
    唯一きれいに編集されたZacker型（無音0.44%・カット11.67/分）の方が例外である。
    **「編集しないこと」がこの系統では手抜きではなく選択**だと実測が示している。
    特にP2c（Stripeダッシュボードの生画面をそのまま流す）は、加工しないこと自体が
    証拠の信頼性を担保する設計になっている。

    生々しい型（型1・2・2b・3）では以下を意図的に残すこと:
    - 手ブレ・webcam画質・散らかったデスク・部屋着・夜の暗い照明
    - 言い淀み・沈黙（無音率5%前後を許容。既存ドキュメンタリーの0.13-1.22%とは正反対）
    - 完成していないプロダクト画面（バグや未実装のままでよい）
    逆にシネマティック型（4・5・6）は徹底的に作り込む。**中間が最も弱い**（生々しさも
    美しさも中途半端になる）ため、どちらかに振り切ること。

  audience_involvement: |
    「一緒に作り上げていく」を成立させる実装（型Pで実測）:
    - **Day連番**（DAY 1, DAY 3…）で「今どこにいるか」を明示＝次回への期待を作る
    - **学びの共有テロップ**＝視聴者にも持ち帰りがある（一方的な自慢話にしない）
    - **ユーザーの声のスクショ提示**＝進捗が第三者に検証可能な形で示される
    - **弱さの宣言**（"AND THIS IS MY WEAKNESS"）＝助けたくなる余白を残す
    型S（第三者密着）にはこの装置が無く、視聴者は観客に留まる。
    **「一緒に作る」を狙うなら型P、「感動して推してもらう」なら型S**。

