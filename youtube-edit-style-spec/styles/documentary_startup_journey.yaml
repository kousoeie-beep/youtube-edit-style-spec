apply_notes: |
  youtube-edit-style-specパイプラインでの適用方法:

  【まず変種を選ぶ】6変種のどれかを最初に決めること。数値レンジ（cuts 0.17-14.82、
  LUFS -13.1〜-25.9）は変種をまたぐと無意味になる。**このyamlの全体レンジを目標値に
  使ってはいけない**。

  【既存スタイルとの使い分け】
  - `business_talk`（BT1）とは別物。あちらは**ピッチの対決**で単発完結。
    こちらは**時間の経過が物語の骨格**＝連載構造を前提とする
  - `documentary_immersive`とも別物。あちらは**その場の体験**で、事業が育つ過程は扱わない
  - `wipe_explainer`と構造が似るのは variant_build_live のみ。ただし中身が
    「他人のツール解説」か「進行形の自作品」かで意味が反転する
  - `documentary_cinematic`のvariant_host_presentと (5)(6) は撮影が似るが、
    あちらは**完成した物語の解説**、こちらは**当事者の現在進行形**

  【ZETTAIで使う場合の推奨・2026-07-25 n増を踏まえて更新】
  自社の事業を「ゼロから応援してもらう」なら **variant_build_live (P1/P2c型) を土台に、
  variant_day_log の演出を足す** のが最も現実的。理由:
  - build_live は **n=2で再現が確認された唯一の変種**＝ジャンルの型として信頼できる
  - 必要なのは「画面録画＋円形webcam PiP」だけ。**編集がほぼ要らない**
    （P2cは全編でハードカット1回のみ）。撮影機材・照明・グレーディングも不要
  - **進捗の証拠は本物の管理画面をそのまま映す**（Stripe/GA/Supabaseのダッシュボード等）。
    デザインしたグラフより、加工していない生画面の方が信頼される
  - そこに Day連番カード（黒背景+白大文字）と学びテロップを足せば「一緒に進んでいる」
    感覚が出る。ただしこれは**ジャンルの型ではなく意図して選ぶ演出**である点に注意

  **日本語で・人に密着して撮るなら variant_field_interview (3) を使う。**
  n=3で確定した唯一の変種であり、以下6点をそのまま実装仕様として使える:
  ①全編フル字幕 ②チャンネルロゴ常駐 ③行動ラベル/章タグを画面隅に常駐
  ④「Q.」アイコン付き質問カード ⑤人物ステータス/名前テロップ ⑥末尾CTA
  **無音率は約1%（間を詰める）**が3本で安定しており、これは目標値として使ってよい。
  カット率(3.21-9.19)とLUFS(-13.1〜-21.1)は再現しないので素材に応じて決める。

  逆に、シネマティック型（型5・6）は照明・レンズ・グレーディング・BGM選曲まで必要になり、
  かつ**意匠は再現するが数値は再現しない**（n=2で確認）。最初の1本には勧めない。
  life_chapters (4) は **n=3で確定済み**（S3/S3c/S3d）。章タグ常駐・番組ロゴ常駐・
  過去の可視化装置が3本すべてに存在し、カット率3.96-6.47/分も再現する。安心して採用してよい。

  【音響の注意】6本ともTrue Peakが0.0〜2.4dBFSと張り付いている（参考動画がそうだから
  といって真似しないこと）。納品時は必ず -1.0dBFS 以下に抑える。

  【未確認・今後の検証課題（正直に明記）】
  1. ~~各変種がn=1~~ → **2026-07-25のn増でほぼ解消**。現在の到達状況:
     - field_interview: **n=3・確定**（装置セット6点＋無音率約1%が再現）
     - build_live: **n=2・確定**（円形PiP+画面録画構造が再現）
     - cinematic_recall: **n=2・意匠のみ確定**（数値は非再現）
     - day_log: n=4で1本のみ＝**ジャンルの型ではないと確定**
     - desk_monologue: n=1（n増の過程で新発見）
     - **life_chapters: n=3・確定**（S3 / S3c / S3d）
     → **2026-07-25に当初bot検出で取得失敗したが、解除後に再実行して完了済み**。
       章タグ常駐・番組ロゴ常駐・過去の可視化装置が3本すべてに存在し、
       カット率3.96-6.47/分も再現した（variant_split (4) 参照）。
     **→ これで7変種すべてのn増が完了した。**
  1b. ~~Internet Made Coder(6TQg96fFM0A)~~ → **取得不能と確定**（3回試行、最大262KB）。断念
  2. BGMの有無・種類は6本とも未聴取。劇伴の設計はこの系統の感情設計に直結するため、
     実際に狙う変種が決まったら聴取して確認すべき
  3. テロップの入退場アニメーションのフレーム単位検証は未実施
  4. サムネイル・タイトルの型は未取得（応援を集めるにはサムネの設計も効くはずだが未検証）
  5. 「連載構造」を前提とするスタイルだが、**シリーズ全体をまたぐ設計（第1話と第10話で
     何を変えるか）は単発動画の実測では捉えられていない**。これはこの系統の本質に
     関わる未解決の課題
