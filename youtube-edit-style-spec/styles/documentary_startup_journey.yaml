    # 実測: S3b「引退後もココイチは伸び続けている?」/ S2b「川元さんの印象について」
    # 左端に円形の「Q.」アイコン（赤系）、右に白背景の角丸バナーで質問文
    size: {width: 900, height: 168}   # 【2026-07-27 R11】132 → 168。**icon_px 112 が padding28 の内寸76pxを36px超過**していた
