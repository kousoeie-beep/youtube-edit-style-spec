style_id: documentary_startup_journey
source: |
  実測サンプル: n=15。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（cuts_per_min/visual_rhythm_per_min/LUFS/LRA/TruePeak/無音回数=全13本ffmpeg実測、
  テロップ様式・章カード・色使い・ロケーション構成=全13本タイル目視）/
  推定（テロップの入退場アニメーション種別=サンプリング間隔の制約でサブ秒フェードは検出限界、
  BGM有無=聴取未実施、フォント名=360p制約で特定不可）/
  **限界（2026-07-25のn増で一部解消）**:
  - `variant_build_live` は **n=2で再現を確認**（P1/P2cが独立に「円形PiP+画面録画」構造へ到達）。
    この変種だけは「ジャンルの型」と言ってよい
  - `variant_day_log`（DAYカード＋学びテロップ）は **n=4で1本のみ＝再現せず**。
    Zacker氏個人のスタイルと判明した（下記variant_split参照）
  - `variant_desk_monologue` はn増で新たに発見（n=1）
  - **`variant_field_interview` は n=3 で最も強く確定**（S2/S2b/S3b）。6つの装置セットが
    3本すべてに存在し、無音率も0.86-1.29%と安定。**日本で密着ドキュメンタリーを作る際の
    実装仕様としてそのまま使える唯一の変種**
  - `variant_cinematic_recall` は n=2 で**意匠のみ再現**（数値は非再現）
  - **`variant_life_chapters` も n=3 で確定**（S3/S3c/S3d）。章タグ常駐・番組ロゴ常駐・
    過去の可視化装置が3本すべてに存在し、カット率も3.96-6.47/分と近い。
    **7変種すべてのn増が完了した**
  - **rawness_policy（作り込むほど応援されない）は n=6 で強く裏付けられた**
    （build in public 6本中5本が極端に生々しい側に分布）

  【自己検証メモ】当初は「型S=第三者が撮る／型P=当事者が発信」という発信主体の軸で
  2分割する設計だったが、実測の結果**発信主体よりも「作り込み度」の方が支配的な軸**である
  ことが判明した。P3(当事者発信)はS1(第三者撮影)とシネマティックな作りが酷似し、
  数値もLUFS -25.9/-24.3、無音4.99%/5.44%とほぼ一致する。一方P1・P2(当事者発信の生々しい型)は
  同じ型Pでありながら全く別の見た目になる。**設計仮説を実測が修正した**ため、
  variant_splitは発信主体ではなく作り込み度を第一軸に据えて記述する。

  【P1の切断誤検知について】P1は当初「実デコード55%」と判定されたが、これは
  measure.shの判定ロジックの誤検知だった（最終ハードカット時刻を基準にしていたため、
  カットが極端に少ないコンテンツで誤警報）。無音検出が1043秒/公称1044秒まで到達しており
  完全な動画と確認済み。判定ロジックは silencedetect 最終時刻ベースへ修正済み。

format:
  aspect: "16:9"
  duration_sec: "392-3514（P3=392が最短、S3=3514が最長。尺の幅が極端に広い）"
  cuts_per_min: "0.17-14.82（P1=0.17 / S2=4.62 / S1=6.10 / S3=6.47 / P2=11.67 / P3=14.82）"
  visual_rhythm_per_min: "0.69-37.80（P1=0.69 / S3=8.38 / S2=9.72 / P3=19.71 / S1=21.32 / P2=37.80）"
  camera: "変種依存。生々しい型=手持ち/webcam/画面録画、シネマティック型=三脚固定+浅い被写界深度"
  broll_usage: "変種依存。シネマティック型は多用（原点回帰ロケ・作業風景・情景）、
    画面共有ライブ型はほぼ不使用（プロダクト画面そのものが視覚コンテンツ）"

palette:
  background_hex: "素材依存。ただし章カード・テキストカードは以下が実測された"
  brand_hex:
    - "#000000（P2のDAY連番カード背景・全画面黒／S1の感情ピボットカード背景・実測）"
    - "#FFFFFF（両型ともテキストカードの主文字色・実測）"
    - "#FFE800系（S3の感情強調テロップ黄・S2のフック引用テロップ黄縁・実測、近似）"
    - "#00BCD4系（S3の「間違ってたんだな」等の水色強調・実測、近似）"
    - "#E53935系（S3の「詰んでる?」等の赤強調／P2のDay数字の赤・実測、近似）"
    - "#4A90D9系（P2のユーザー声引用カード背景・青／P1のプロダクトUIのアクセント紫青・実測、近似）"
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#FFFFFF"      # 白: 地の文・全画面ステートメント（brand_hex実測）
    color_bg: ["#000000", "#4A90D9"]  # #000000=P2のDAY連番カード背景/S1感情ピボットカード背景（brand_hex実測）、
      # #4A90D9=P2のユーザー声引用カード背景・青（brand_hex近似）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: ["#FFE800", "#00BCD4", "#E53935", "#4A90D9"]  # 黄=感情の核・ポジティブな決意、
      # 水色=気づき・転換、赤=痛み・危機/Day数字、紫青=P1プロダクトUIのアクセント（brand_hex実測・近似、emphasis_rolesとの対応も明記済み）
    color_stroke: "#FFE800"    # S2のフック引用テロップ黄縁（brand_hex近似）
    color_primary: null
    color_glow: null
  emphasis_roles:
    黄: "感情の核・ポジティブな決意（S3「大切な場所」の『大切』だけ黄／S2のフック引用の縁取り）"
    赤: "痛み・危機・Day数字（S3「詰んでる?」／P2のDayカウンタ）"
    水色: "気づき・転換（S3「間違ってたんだな」の『間違って』）"
    白: "地の文・全画面ステートメント"

telop_layers:
  - role: keyword               # 【最重要】時間軸カード。この系統を成立させる骨格。
    # 実測2形態: (a)P2の「DAY 3」全画面黒背景+白大文字（英語圏build in public型）
    #            (b)S3の「3歳、原体験のルーツ」「成人式で感じた孤独」章カード（日本の人生年表型）
    # (a)はエピソード進行、(b)は人生の時系列。どちらも「時間が進んでいる」感覚を作る装置
    font_px: 150   # 【2026-07-27 R9追加】実測文言「DAY 3」「3歳、原体験のルーツ」（最長10字）から導出。
      # 全画面カードの左右に160pxずつ空けると文字ブロック幅1600px、10字なら1字160pxが上限。
      # 余裕を取って150（10字＝1500px）。【2026-07-27 R9追加】yaml自身が挙げる実測文言から導出した値であって、
    max_chars: 10   # 【2026-07-27 R9追加】「3歳、原体験のルーツ」が10字
    max_width_px: 1600   # 【2026-07-27 R9追加】1920 − 左右160×2
    max_lines: 1   # 【2026-07-27 R9追加】時間軸カードは1行の大文字
    overflow_policy: split_event   # 【2026-07-27 R9追加】11字以上ならカードを分ける（フォントを落とさない）
    char_width_px: 150   # 【2026-07-27 R9・掃引】このroleの**折返しを律速するのは和文**なので、
      # 1字の送り = font_px（全角）。欧文が混ざっても実幅はこれより狭くなるので安全側。
      # 「宣言が無い＝既定で全角」と同じ値だが、**掃引したことを明示するために書く**
      # （書かないと「見落としたのか、全角でよいのか」が次の実装者に伝わらない）
      # （「DAY 3」は半角だが「3歳、原体験のルーツ」が全角で、こちらが律速する）
    position: {centerX: 0.5, centerY: 0.5}
    size: {width: 1920, height: 1080}   # 【2026-07-27追加】「全画面カード」と散文で
      # 書いていたが寸法が無く、**QC FAIL 3件中2件が遮蔽の誤検出で埋まり本物1件が
      # 埋もれる**構造になっていた。investigative の全画面3roleには入っていたのに
      # 本ファイルには入っていなかった（ファイル間の非対称）
    opaque_fullscreen: true      # 上記sizeで全画面が保証されるため宣言できる
    persistent: false
    style: 全画面カード（黒背景+白大文字 / 茶背景+明朝体）
    z_order: 9   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    entrance: hard_cut            # 実測（P2のDAYカードは前後がハードカット、fade_sec=0）
    exit: hard_cut                 # 実測（同上）
  - role: caption               # 発話字幕。変種で密度が大きく割れる
    # フル字幕型（S2/S3・日本語勢）: 全発話をカバー、白文字黒縁、下部中央
    # 控えめ型（S1/P3・シネマティック勢）: 要点のみ、薄い白文字
    # 学び共有型（P2）: 発話字幕ではなく「ADS CAN BE A GOOD WAY TO GET YOUR FIRST FEEDBACK」
    #   のような教訓を全画面下部に大書きする（視聴者への持ち帰り）
    max_lines: 2                 # 【2026-07-27追加】行数上限が無く**3行字幕がyaml適合**だった。
      # 実測で3行時の上端667pxがCTAバナーと**67px衝突**する。
      # cta_banner 0.60 の導出も2行前提なので、行数を縛らないと前提が崩れる
    max_width_px: 1500           # 【2026-07-27 R4追加】幅の縛りが無かった。
      # しかも `max_lines` はあるが `max_chars` が無いため**lintの検査からも外れて**いた
      # （掃引条件の穴の2つ目の入口）
    max_chars: 16                # 1500px ÷ font92 ≒ 16字
    font_px: 92   # 【2026-07-27 R9追加】caption_font「フル字幕型=基準プリセット既定値」をフィールド化（規約⑩）
    stroke_px: 12   # 【2026-07-27 R9追加】同上の「黒フチ12px」
    size: {width: 1524, height: 292}   # 【2026-07-27 R10訂正】幅1548 は**自分で書いた式「1500 + フチ12×2」が返さない値**（正しくは1524）
      # 高さ = 行高134×2 + フチ12×2（max_lines の最大値で導出）。
      # **cta_banner の導出はこの寸法に依存しており、書かない限り5回目も外れる**
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    char_width_px: 92   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    max_chars_total: 32   # 【2026-07-27 R10】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値。実測できたら上書きすること
      # 1500 ÷ 92 = 16.30 → 1行16字、2行で32字
    position: {centerX: 0.5, centerY: 0.83}   # 【2026-07-27 R8・連鎖再導出】0.88は2行時に§5繰り上げ(28px)が働き**宣言値が使われなかった**。
      # max_linesの最大値で導出: 2行下端(影込) = cY×1080+134+12+12 ≤ 1064 → cY ≤ 0.8389。
      # 0.83で2行上端747.4/下端1054.4＝下余裕25.6px。**繰り上げが不要になり宣言値が実際に使われる**
    persistent: false
    style: 白文字+黒縁（フル字幕型は太め、シネマティック型は細め）
    z_order: 4   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    entrance: hard_cut            # 推定（サブ秒フェードは検出限界）
    exit: hard_cut                 # 推定
  - role: nameplate             # 番組ロゴ/チャンネルロゴの常駐
    # 実測: S3=右上「△△ △△ 〜Documentary〜」、S2=右上「STARTUP CHD1EL」
    # シネマティック型（S1/P3）とbuild in public型（P1/P2）は常駐ロゴを持たない
    variant: [variant_field_interview, variant_life_chapters]   # 【2026-07-27 R9追加】z=7 の同値を許す根拠（「変種が排他だから競合しない」）が
      # **散文にしかなかった**。フィールド忠実に実装すると build_live の pip が
      # field_interview のクリップに混入し、cta_banner と 220×211px（35.8%）交差して
      # **CTAのQR領域が100%消える**（実測・目視）。pip は layer_kind: video なので
      # QCは overlaps=0 を返し、盲点と同時に発火する
    font_px: 36   # 【2026-07-27 R9追加】size.height 70 から逆算（行高52 + padding12×2 = 76 ≒ 70）。
      # **書かないと実装者がフォントを発明し、上の「右端1891.6px」の検算が崩れる**
    char_width_px: 23   # 【2026-07-27 R11訂正】18は「font_pxの約半分」という**推定**だった。
      # 実測: "STARTUP CHD1EL" 15字 = 343.0px → **22.87px/字**（切り上げ23）。
      # 「実測」と書けない数値を置くと必ず外れる（schema.md R10追記）
    max_chars: 15   # 【2026-07-27 R11】356 ÷ 23 = 15.5。実測例 "STARTUP CHD1EL" がちょうど15字
    max_width_px: 356   # 【2026-07-27 R9追加】size.width 380 − padding12×2
    max_lines: 1   # 【2026-07-27 R9追加】
    padding_px: 12   # 【2026-07-27 R9追加】
    overflow_policy: shorten_text   # 【2026-07-27 R11訂正】常駐ロゴは時間分割できない。split_event は実行不能な指示だった
    max_chars_ja: 9   # 【2026-07-27 R11新設】和文なら 356 ÷ font36 = 9.9 → 9字。
      # **もう一つの実測例「△△ △△ 〜Documentary〜」は476pxで max_width_px 356 を120px超過する**。
      # persistent: true なので split_event では救えない → **文言の短縮でしか解けない**
    position: {centerX: 0.88, centerY: 0.054}   # 【2026-07-27 R10・4辺検算】上端が12.5pxだった（size.height を70→77にしたため）。0.054 = 58.3px で上16.8px
      # 0.90 では **右へ12pxはみ出し**、"STARTUP CHD1EL" の末尾が切れた（実測）。
      # 0.88 = 1689.6px、下記sizeの半幅190px＋影12pxで右端1891.6px（画面内）
    size: {width: 380, height: 77}   # 【2026-07-27 R10・高さの収容検査を新設したら出た】幅の検査はR4からあったのに
      # **高さには一度も検査が無かった**。箱が中身より低いと、実装者はフォントを落とすか
      # はみ出させるかを勝手に選ぶ。
      # 70 では font36 の行高53 + padding12×2 = 77 が入らない
    persistent: true
    style: プレーン（半透明白）
    z_order: 7   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    entrance: hard_cut            # 実測（開始と同時に完成形）
    exit: hard_cut
  - role: chapter_tag           # 【2026-07-27 role分離】旧: role: sidebar。
    # 【変種ラベルの誤りを訂正】旧記述は「variant_life_chapters のみ」と断定していたが、
    # **これは誤りだった**。同ファイルの person_status が「章タグと併置する場合は常駐運用も
    # あり（S2bは常駐）」と書いており、z_order_policy も「人物ステータス(3)と章インジケーター(2)を
    # 同じ隅に積む場合」と field_interview 前提で書いている。S2b は field_interview の実測対象
    # そのものであり、**章タグは field_interview でも使われる**。
    # 再実装検証（yamlだけを読ませる）で、実装者がどちらを採るか一意に決められなかったため、
    # 「進捗の証拠カード」(variant_day_log/P2)とのrole共有を解消して独立roleにした。
    # 旧記述: 7変種は適用時にいずれか1つを選ぶ排他構造（structure_grammar.variant_split参照）のため
    # 同時表示されない。正当な変種スコープの重複であり分離不要。
    # 章インジケーター（**座標の実測はS3のみ**。ただし装置としては field_interview でも
    # 使われる＝上記の変種ラベル訂正を参照。field_interview側の座標は未実測）
    # 画面左上に小さく現在の章「0〜15歳、津田ヤンキーの原点」を常時表示。
    # 長尺（58分）を人生年表として構造化するための道標
    font_px: 23                  # 【2026-07-27 R3追加・lintが検出】フォント指定が無く、
      # lintが基準プリセット既定値の92pxで計算して「4字しか入らない」と正しく警告した。
      # 実測では**18字で幅414px**＝font 23px相当。小さめの隅バッジである
    max_width_px: 420            # 【2026-07-27 R3追加】size.width と同値。
      # 数値で書かないと lint の幅検査が効かない
    max_chars: 18                # 【2026-07-27 R3追加】yaml自身が実測として挙げる章ラベル
      # 根拠は**全角18字＝414px ≤ 420px**（最悪ケース）の一点に絞る。
      # 【2026-07-27 R8】旧記述は20字の例示（実測400px）を根拠に議論していたが、
      # **例示自体を規約準拠の15字「0〜15歳、津田ヤンキーの原点」（315px）へ統一した**ので
      # 20字/442px/400px という数字は全て不要になった。新しい文言は発明しないこと
    max_lines: 1
    size: {width: 456, height: 70}   # 【2026-07-27 R10・高さの収容検査を新設したら出た】幅の検査はR4からあったのに
      # **高さには一度も検査が無かった**。箱が中身より低いと、実装者はフォントを落とすか
      # はみ出させるかを勝手に選ぶ。
      # 69 では font23 の行高34 + padding18×2 = 70 に1px足りない
      # schema.md の `size.width >= max_width_px + padding*2` を破っていた。
      # 実害は逆向きで、20字例示(400px)は収まるのに**規約準拠の全角18字(414px)の方が
      # 座布団を12pxはみ出す**（目視確認）。456 = 420 + padding18×2
      # 0.04/0.135 の導出は「chapter_tag 69px / person_status 109px」前提だったが、
      # **その数値がフィールドに無かった**ため再実装で83/144pxになり、
      # **pixel_collision 0.968 で衝突が復活**した。導出に使った寸法は必ず書く
    overflow_policy: split_event   # 【2026-07-27 R6 一括掃引】`max_lines: 1` だけでは折返しは止まらない。
      # 折返し器は max_chars で改行するので**結果の各行は制約を満たしたまま2行になる**
      # （ai_tool_avatarで実測。**documentary_immersive が退行したという私の当初の報告は誤り**で、
      #  R6のFAILは検証者が意図的に作った違反対照窓＝14字「max_lines:1 違反の対照」だった。
      #  掃引そのものは正しい——10ファイルが本当にこのフィールドを欠いていた）。
      # 超過は折り返さず**複数のテロップイベントへ分割する**
    anchor: left   # 【2026-07-27 R8追加】centerX は anchor+margin_left からの近似値
    margin_left: 24   # 【2026-07-27 R8追加】person_status と左端を揃える
    padding_px: 18   # 【2026-07-27 R8追加】size.width 456 = max_width_px 420 + 18×2 の 18
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
