      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    char_width_px: 23   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.133, centerY: 0.05}   # 【2026-07-27 R9】0.04 は**上端の余裕7.0px**という境界解だった。
      # 上端(影込) = cY×1080 − 69/2 − 3 ≥ 16 → cY ≥ 0.0495。
      # 0.05 = 54px（上端16.5px / 下端(影込)100.5px）。
      # 【R8の注記を訂正】「左端7pxの境界解を解消」と書いたが、**7pxは上端の値**で
      # 左端が7pxだったことは一度もない（旧値で36.6px）。R8で取り違えたまま入れた。
      # centerX 0.133 による左端揃え（実測25px）は正しいので据置
      # 「中心の比率」ではない（schema.md）。0.133 で実左端24.4px / 実右端495.4px
    persistent: true
    style: プレーン（小文字・低コントラスト）
    z_order: 2   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    variant: [variant_life_chapters, variant_field_interview]   # 【2026-07-27追加】
      # 単一変種ではない。上記の訂正理由を参照
    entrance: fade                # 推定
    exit: fade                     # 推定
  - role: sidebar               # 【変種: variant_day_log(P2)のみ】
