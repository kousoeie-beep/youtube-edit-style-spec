      # **QCは overlaps=0 を返す**ので目視でしか分からない）
    position: {centerX: 0.42, centerY: 0.323}   # 【2026-07-27 R11・上下の連立】0.323 = 348.8px（上端261.8px＝person_status 下端245.2pxに
      # 16.6px / 下端444.8px＝cta_banner 上端461.8pxに17.0px）。
      # **size.height を 132→168 にした1回の変更が、上下2roleの再導出を要求した**
      # person_status（下端245.2px）とのすきまが13.4px、cta_banner とも11.6pxに落ちた。
      # 0.325 = 351.0px（上端264.0px＝person_status に18.8px / 下端450.0px）
      # 0.30=324px、上端255.0px＝**クリアランス21.1px**。
      # R6ではここが92×23pxで交差し Q.カードの左上角が欠けていた
    persistent: false
    style: カード（白背景+角丸+左に円形Q.アイコン）
    z_order: 5   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    entrance: hard_cut            # 未計測（推定。fade_sec=0と仮定）
    exit: hard_cut                 # 未計測（推定）
  - role: person_status         # 【2026-07-25 適用検証で追加】人物ステータス/名前テロップ
    # variant_field_interview の6点セットの1つ。氏名＋肩書（＋年齢）。
    # ※ role: nameplate は「番組ロゴの常駐」に割り当て済みのため、
    #   人物の名前テロップには**別roleが必要**（適用検証で判明した欠落）
    # 実測: S2b「採用担当マネージャー / 26歳」を左上に常駐、S3b=登場人物の氏名テロップ
    size: {width: 509, height: 110}   # 【2026-07-27 R9】493 は max_width_px 493 + padding8×2 = 509 を収容できていなかった
      # （箱が中身より小さい）。行高50+44 + padding8×2 = 110
    max_width_px: 493            # 【2026-07-27追加】**左に15.9pxはみ出していた**。
      # centerX0.13=249.6pxで収まる最大幅は493.2px。
      # ※このはみ出しは**4辺検算が素通しになる型**だった。キャンバスでクリップされた後の
      #   bboxを見ると L=0 が「OK」と返るため検算にかからず、QCも画面外は見ない。
      #   **パディング付きキャンバスで名目bboxを測る**か目視でしか出ない
    max_lines: 2
    variant: variant_field_interview   # 【2026-07-27 R6追加】散文が「変種スコープの重複」と
