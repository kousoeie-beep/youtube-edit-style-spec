    max_width_px: 700   # 【2026-07-27 R8追加】
    overflow_policy: split_event   # 【2026-07-27 R8追加】max_lines:1 のため
    icon_px: 112   # 【2026-07-27 R9追加】左端の円形 Q. アイコンの径。**現行の関係式
