    # 進捗の証拠カード（P2で実測）
    # ユーザーの声のスクリーンショットを青いカードで全画面提示
    #（例「I used to spend around 40 minutes... Now I can find and export everything in 3 minutes!」）
    # 数値グラフではなく「実際に喜んでいる人の言葉」で進捗を見せるのがこの系統の特徴
    variant: variant_day_log   # 【2026-07-27 R6 訂正・私が作った退行】R6で variant_field_interview を付けたが、
      # **同roleの見出し「変種: variant_day_log(P2)のみ」と真逆**だった。
      # lintの「散文に排他とあるのにフィールドが無い」を黙らせるために付けた値で、
      # 中身を確かめていなかった（investigative でも同じことをした）
      # 書いているのに variant フィールドが無く、排他の欠落に見えていた
    position: {centerX: 0.5, centerY: 0.55}
    persistent: false
    style: カード（青背景+白文字+引用符）
    z_order: 8   # 【2026-07-27 R8】z_order全面付け替え（person_status の注記参照）
    entrance: hard_cut            # 推定
    exit: hard_cut
