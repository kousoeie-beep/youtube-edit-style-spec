style_id: ai_tool_avatar
source: |
  実測サンプル: n=3。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（カット律/視覚リズム/LUFS/LRA/TruePeak/無音回数=ffmpeg実測、レイアウト構成比率・
  配色HEX・エンドカードの3本完全一致=タイル目視+ImageMagickヒストグラム法で実測）/
  推定（テロップの入退場アニメーション種別=静止画タイルサンプリングのため断定不可、
  BGM有無=聴取未実施、フォント名=360p解像度のため特定不可、n=3だが単一チャンネルのみ
  のため「AI活用系解説チャンネル」というジャンル全体への一般化はlow-medium）

  【自己検証メモ】赤コールアウト/デルタ強調色は3本共通で#DF10-E210系（±数値ずれは
  ヒストグラム量子化・アンチエイリアシングによる誤差の範囲内と判断）で再現性を確認した。
  エンドカード（技術評論社「ゼロからわかるDifyの教科書」広告）はピクセル単位で3本完全
  一致しており、固定素材の使い回しであることを実測で確認済み（捏造ではなく実際に3本とも
  同一フレームが検出された）。

format:
  aspect: "16:9"
  duration_sec: 1574-2046      # 実測（26:14-34:06。3本とも「じっくり解説」尺で30分前後が標準）
  cuts_per_min: 1.55-3.41      # 実測（scene0.3。v1=1.555/v2=2.059/v3=3.411。v3のみ高めなのは
    # Cowork操作デモでのUI画面遷移（タブ切替・パネル展開等）がハードカットとして検出される
    # ため。動画1本内でも「解説カードモード」区間はほぼ0カット、「画面共有デモモード」
    # 区間でカット率が上がる二層構造）
  visual_rhythm_per_min: 10.68-14.42   # 実測（scene0.08。v1=13.11/v2=10.68/v3=14.42。
    # ハードカットが少ない一方、キャプション差し替え・赤コールアウト枠の出現/消失・
    # 比較テーブルの数値更新が「情報リビール駆動」で常時ソフト変化を作っている）
  camera: static                # 実測（生身の人物カメラは3本とも一度も確認されず。実写は
    # 存在せず、全編が「静止イラストのネコキャラ」または「画面録画（ブラウザ/アプリUI）」
    # のいずれか。カメラワーク自体が存在しないジャンル）
  broll_usage: occasional       # 実測（v1=マイクスタンド等の実物商品写真1箇所、v2=埋め込み
    # 動画サムネイル風インサート1箇所、v3=Anthropic公式マーケティング画像1箇所。
    # いずれも本編テーマに関連する挿入で、頻度は低い）

palette:
  background_hex: "ほぼ純黒〜暖色極暗（#0C0B0C〜#151515、解説カード/ダークモードUI）。
    画面共有パートはアプリのネイティブ配色をそのまま使用するため素材依存（ChatGPT等の
    ライトモードでは白背景#FDFDFD付近も頻出）"   # 実測ヒストグラム（解説カード部分）+目視（画面共有部分）
  brand_hex: ["#DF1014(赤・比較テーブルの増減強調/UIコールアウト枠。3本共通で確認)", "#D9A055〜#F4B15D(ゴールド・定期レビューリボン/バッジ、v1で確認)", "#354463(紺・価格帯$20ティア背景、v2)", "#A16130(茶/木目調・価格帯$8ティア背景、v2)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#FFFFFF"      # キャプション本体の白地（emphasis_rolesの記述から変換・原文にHEX記載なし、
      # 色分けなしの単色運用と明記）
    color_bg: ["#354463", "#A16130"]  # 価格帯$20ティア背景・紺/価格帯$8ティア背景・茶木目調（brand_hex実測）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: "#DF1014"    # 数値の増減（下降）/UIコールアウト矩形枠、3本共通実測。
      # 上昇側の淡緑行背景は色名のみでHEX未記載のため未マップ
    color_stroke: "#000000"    # キャプション本体の黒縁（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_primary: "#D9A055〜#F4B15D"  # 定期レビュー系バッジ・リボン、自チャンネル継続企画の
      # ブランディング色と明記（brand_hex実測・レンジ）
    color_glow: null
  emphasis_roles:
    数値の増減(価格/プラン変更): "赤=下降または変化を示す矢印・数値／緑がかったペール
      グリーンの行背景=上昇側（「良い/悪い」ではなく方向性でのみ色分け。v1実測、
      赤(#DF1014系)は確信度高、行背景の淡緑は文字とのアンチエイリアシング混色で
      推定寄り）"
    UIコールアウト(注目要素の強調枠): 赤矩形（#DF1014系、v2/v3で確認。囲む対象は
      価格ティアの行全体や入力欄など文脈により可変）
    定期レビュー系バッジ・リボン: ゴールド/タン（v1のみ確認。「3ヶ月ごとの定期レビュー」
      という自チャンネルの継続企画ブランディング色）
    キャプション本体: 色分けなし。常に白地+黒縁の単色袋文字（強調色は専ら解説カード
      内部で使われ、字幕自体には色の意味論を持たせていない。これは他ジャンル
      （news_commentary等）と異なる特徴）

telop_layers:
  - role: sidebar             # 解説パネル（モードA・「解説カードモード」の主役）: 画面左
    # 55-60%を占める静止インフォグラフィック。内容は動画により価格比較表/ティア別
    # サービス一覧/ハブ&スポーク図解など可変。1テーマにつき数十秒〜数分持続。実測
    position_mode: content_dependent   # 【2026-07-27追加】**この座標は固定値ではない**。挿入する内容・文脈によって位置が変わる。
      # 散文が「文脈により可変」と書いているのにpositionが固定値1つしか持たず、
      # 実装者が固定配置してしまう。下記positionは代表値
    text_content: none   # 【2026-07-27 R9追加】価格比較表・ティア一覧・ハブ&スポーク図解などの
      # **静止インフォグラフィック素材そのもの**で、ラベルは素材側に焼き込まれている。
      # yaml側で組む文字は無い（「size だけあって中身が無い」検査からの明示的な除外）
    position: {centerX: 0.32, centerY: 0.5}
    size: {width: 1100, height: 500}   # 【2026-07-27 再修正・検算が誤っていた】
      # 旧560の根拠「band[240,820]、2行字幕の上端825px」は**実測と違った**。
      # 実測は band[260,820]、2行高は250pxでなく**268px**（フチ12pxと影を数えていなかった）。
      # 結果、2行字幕で**47.0px侵入**（pixel 0.99〜1.00）。1行なら通るので、
      # **max_lines:2 が許した使い方で破綻**していた。
      # 高さ500px → band[290,790]。**1行字幕**の実測上端**895〜900px**に対し105〜110pxのクリアランス
      # 【2026-07-27 R8訂正】旧「898〜903px」は**影（左上−3px）を数えていない値**だった。
      # 3px狭くなるがクリアランスは100px超あるので実害はない
      # （2026-07-27 R5訂正。旧「2行字幕の上端807px」は max_lines:2 時代の値で、
      #  1行化した現在は4周にわたり未更新のままだった）
    reserved_top_px: 0           # 【2026-07-27 撤回】210は**空振りだった**。
      # badge は y[44.4,137.4]、カードは y[260,820] で**122.6px離れており交差ゼロ**＝
      # そもそも守る相手がいなかった。にもかかわらず本文領域を560→350pxへ削り、
      # **両カードで行が脱落した**（実出力で1行しか描けていない）。
      # 直したつもりが壊しただけだったので0へ戻す。
      # badge×タイトルの重なりは元から発生していないと実測で確定している。
      # 【旧記述】badge悪化の真因への対処:
      # カード上部210pxは badge（定期レビュー系リボン）の予約帯とし、
      # **パネル内のタイトルはこの下から始める**。
      # badgeのcenterXを動かす対処は悪化させただけで、必要だったのは予約帯だった
      # （タイトルをy=210へ下げると被覆0.0%と実測）
    persistent: false
    style: カード
    z_order: 1                 # 【2026-07-26 遡及追加】モードAの背景主軸パネル
    entrance: hard_cut         # 推定（フェード等の入場アニメは静止画タイルでは未検出。
      # カードの切り替わりはハードカットと同時に起きる傾向を確認）
    exit: hard_cut              # 【2026-07-26 遡及追加】未計測（推定、次テーマへの切替と同時）
  - role: nameplate            # 【モード: A（解説カードモード）のみ・2026-07-27 監査3対応で明示】
    # 下記「ネコキャラ（小・PiP）」（モードB）と同一role名を共有するが、dual_modeにより
    # モードA/Bはハードカットで排他的に切り替わり同時表示されない（animation_dictionary_mapping
    # 参照）。同一キャラクターの大小2状態という性質上、正当なモードスコープの重複であり
    # 分離不要と判断した。
    # ネコキャラ（大）: モードAで画面右40%に静止イラストとして
    # 常駐。吹き出し付きの場合あり。実測（3本とも同一デザインのネコキャラ「ai_tool_avatar系」）
    text_content: none   # 【2026-07-27 R9追加】ネコキャラ（大）の静止イラスト。文字組みを持たない
    position: {centerX: 0.82, centerY: 0.55}
    persistent: true
      # 【2026-07-27 意味の限定】これは「**そのモードが有効な区間の中では常駐**」の意味であり、
      # 全編での常駐ではない。両エントリが persistent: true を持つため、
      # フィールドを素直に読んだ実装者が**大小2匹のネコを30秒間同時表示**した
      # （矛盾を解いたのは variant でも mutually_exclusive_with でもなく散文だけだった）
    style: プレーン
    z_order: 2                  # 【2026-07-26 遡及追加】
    entrance: hard_cut          # 推定
    exit: hard_cut               # 【2026-07-26 遡及追加】未計測（推定、モードB移行と同時に消える）
    variant: mode_A              # 【2026-07-27追加】「【モード: A のみ】」という日本語コメントは
      # モードスコープを表現できないためフィールド化
    size: {width: 620, height: 700}   # 【2026-07-27追加・実害の本体】ネコ大(mode_A)。
      # **排他を撤回して幾何で解く判断をしたのに、実害の大きいこのroleに size を与えて
      # いなかった**（sidebarにだけ与えていた）。実測 pixel_collision 0.786/0.834/0.995/0.996。
      # centerX0.82=1574.4px、幅620pxで x[1264,1884]。
      # 【2026-07-27 訂正・算数が矛盾していた】旧記述は「caption の右端1512pxとは
      # 重ならない」としていたが、**1264 < 1512 なので重なる**（実測271.6px）。
      # caption は centerX0.5・max_width_px1104 で x[408,1512]。
      # → **mode_A では caption を x1264 より左に収める**必要がある
      #   （旧記述は x1248 と x1264 の2閾値を併記していた。ネコ大の左端 1264 が正）。
      #   centerX 0.5 のままでは実装不能なので、**上記 caption の variant_geometry に従う**
      #   （mode_A: centerX 0.34 / 幅1040 / 11字）。
      #   ※旧記述にあった「max_width_px 1104 で成立」は**反証済み**。1104では重なる。
      # centerY0.55=594px、高さ700pxで y[244,944]。**1行字幕**の上端895〜900px（影込。R8訂正）とは重ならない（2026-07-27 R5訂正。旧「2行字幕の上端807px」は
      # max_lines:2 時代の値で4周未更新だった）。ただし分割せず折り返した場合は重なるため、
      # **captionは mode_A では x1264 より左に収める**こと（**この「1104で成立」は反証済み**。mode_Aでは1040+11字。上記 variant_geometry 参照）
    mutually_exclusive_with: nameplate   # 【2026-07-27追加】もう一方のnameplateエントリ
      # （モードB=ネコキャラ小PiP）とハードカットで排他切替。同時表示されない
  - role: nameplate            # 【モード: B（画面共有デモモード）のみ・2026-07-27 監査3対応で明示】
    # 上記「ネコキャラ（大）」（モードA）と同一role名を共有するが、モードA/Bは同時表示されない。
    # 正当なモードスコープの重複であり分離不要。
    # ネコキャラ（小・PiP）: モードB「画面共有デモモード」で
    # 画面右下フチ合わせ（余白ほぼゼロ）の小型オーバーレイとして常駐。実測（幅約17%×
    # 高さ約40%、右端下端ともフレーム端に接している。wipe_explainerのPiPパターンAに近い
    # 「フチ合わせ型」だが、ズームは確認されず静的固定）
    color_shadow: "none"   # 【2026-07-27 R8追加】この丸窓PiPは**画面の右下隅にフチ合わせで置く装置**であり、
      # 共通デフォルトのドロップシャドウ（右下+12px）を当てると
      # **右へ9.9px・下へ12px はみ出す**（centerX 0.914 / centerY 0.8 / size 326x432 から実測）。
      # schema.md「影を使わないroleでは検算に影を足さない」の対象。
      # **影を付ける運用に変えるなら、この座標も同時に内側へ動かすこと**
    text_content: none   # 【2026-07-27 R9追加】ネコキャラ（小・PiP）の静止イラスト。文字組みを持たない
    edge_bleed: true   # 【2026-07-27 R10追加】yaml自身が「画面右下フチ合わせ（余白ほぼゼロ）、右端下端ともフレーム端に接している」と実測記述している装置。4辺検算からの明示的な除外
    position: {centerX: 0.914, centerY: 0.80}
    size: {width: 326, height: 432}   # 【2026-07-27 二値矛盾の解消】幅は
      # telop_layers が17%、apply_notes が22%と**食い違っていた**。
      # 22%で作ると**右へ45.9pxはみ出して実際に切れた**（枠の角丸消失を目視）。
      # centerX 0.914 と整合するのは17%なので**17%が正**。326px = 1920×17%
    persistent: true
      # 【2026-07-27 意味の限定】これは「**そのモードが有効な区間の中では常駐**」の意味であり、
      # 全編での常駐ではない。両エントリが persistent: true を持つため、
      # フィールドを素直に読んだ実装者が**大小2匹のネコを30秒間同時表示**した
      # （矛盾を解いたのは variant でも mutually_exclusive_with でもなく散文だけだった）
    style: プレーン
    z_order: 2                  # 【2026-07-26 遡及追加】ネコキャラ(大)と同レベル（排他運用のため
      # 実際に数値が競合することはない）
    entrance: hard_cut          # 実測（モード切替はハードカットと同時。フェード等は未検出）
    exit: hard_cut               # 【2026-07-26 遡及追加】実測（モードA復帰と同時にハードカットで消える）
    variant: mode_B              # 【2026-07-27追加】画面共有デモモード
    mutually_exclusive_with: nameplate   # 【2026-07-27追加】モードA（ネコキャラ大）と排他
  - role: caption              # セリフ字幕（発話追従型のフルセンテンス字幕、要点抽出でなく
    # 発話をほぼそのまま**1行**で表示（2026-07-27 R4訂正。旧「1〜2行」は max_lines:1 と矛盾））: 白地・太字・黒縁の袋文字。背景が明るい画面
    # （画面共有のライトモードUI等）に重なる場合のみ半透明の黒座布団が自動的に敷かれる
    # ことを確認（暗い背景では座布団なし）。実測
    overflow_policy: split_event   # 【2026-07-27 R5追加】role直下にも置く。
      # variant_geometry の中だけだと `max_chars`（role直下）と階層が食い違い
      # パーサから対応が取れない
    variant_geometry:            # 【2026-07-27追加】モードごとに字幕の幾何が変わる。
      # 前回「x1264より左に収めること」と書いたが centerX 0.5 のままでは実装不能だった
      # ※ overflow_policy は下記の通り**role直下にも置いた**。
      #   ここ（variant_geometry内）だけだと、`max_chars: 12` が role直下にあるのに
      #   ポリシーは入れ子の中という**非対称**になり、パーサから対応が取れない
      overflow_policy: split_event   # 【2026-07-27 R4追加・実測で必要と判明】
        # `max_lines: 1` + `max_chars: 11` でも**折返しは止まらなかった**。
        # 12字・14字の発話が **max_charsを1文字も違反しないまま2行**になった
        # （折返し器が11字で改行すると各行は11字以下なので制約を満たしてしまう）。
        # → **max_chars を超えるテキストは折り返さず、複数のテロップイベントへ分割する**。
        #   「収まらないなら分ける」であって「収まらないなら折り返す」ではない。
        #   これは発話の区切りを編集側で決める作業で、レンダラの自動折返しに任せない
      mode_A: {centerX: 0.34, max_width_px: 1040, max_chars: 11}   # ネコ大(x1264-1884)を避ける。
        # 中心652.8px、幅1040pxで右端1172.8px。ネコ左端1264pxに91pxのクリアランス。
        # 【2026-07-27 R3・lintが検出】**max_chars 11 を明記**。上位の max_chars 12 は
        # 12×92=1104px で **1040に入らず2行に折り返され max_lines:1 に違反**していた
        # （下端超過→centerY繰り上げ→sidebarとの間隙が109→18pxへ連鎖する）。
        # **私が修正の中で同じ欠陥型を再生産していた**
      mode_B: {centerX: 0.5, max_width_px: 1104}    # 【2026-07-27 R3 訂正】
        # 旧記述「ネコ小PiP(x1371-1697)とは右端1512pxで重なる→下記参照」は**2重に誤り**:
        # ①PiPの実算は **x[1591.9, 1917.9]**（220.9pxずれていた）で、
        #   字幕右端1512pxとは**重ならない**。縮める必要は無かった
        # ②「→下記参照」の**参照先が存在しなかった**（ダングリング参照）
    position: {centerX: 0.5, centerY: 0.88}
    persistent: false
    style: 袋文字
    max_width_px: 1104           # 【2026-07-27 確定】フォント92×12字。旧「未計測」から。
    max_lines: 1                 # 【2026-07-27 再修正・私の一括スクリプトの誤り】
      # 旧2は role名の慣習で機械的に配った値。
      # このroleは **max_chars 12 × フォント92 = 1104px = max_width_px と完全一致**する
      # 1行設計であり、2行にすると上端が上がって上位要素の座標導出が崩れる
      # （ai_biz_pitchで同じ誤りが3roleの導出を全部壊した）                 # 【2026-07-27追加】yaml自身が「1〜2行」と規定している。
      # 【2026-07-27 R5 全面訂正】旧記述は「**max_chars12 × 2行 = 24字が上限**」と
      # **誤った数値を命令文のまま**残しており、同一role内に「11字で分割」と
      # 「24字まで載せてよい」という**矛盾する2つの分割指示が併存**していた。
      # 正しくは **mode_A 11字 / mode_B 12字が1イベントの上限**（max_lines: 1 のため）。
      # 超過は `overflow_policy: split_event` に従い**折り返さず分割**する。
      # 以下は旧記述（誤り）。実測で
      # **26字の発話が3行になって規定に違反**した。
      # → **max_chars（mode_A:11 / mode_B:12）を超える発話は複数のcaptionイベントに分割する**
      # ※旧記述の「24字」は max_lines:2 時代の値で、1行化した現在は誤り（2026-07-27 R4訂正）。
      # 字幕を長くするのではなく、発話の区切りで分けるのが正しい
      # 折返し幅が無いとmax_charsは「そのフォントサイズでのみ有効な脆い定数」になる。
      # 実素材で折返し幅を測ってから数値に置き換えること（schema.mdの規約）
    max_chars: 12   # 【2026-07-27 R8注記追加】mode_B の 12×92 = **1104 = max_width_px ちょうど**で、
      # **余裕0.00px の境界解**である。フォントの丸めが1px動けば折り返して
      # max_lines:1 に違反する。注記が無かったので明記する。
      # （mode_A は 11×92=1012 ≤ 1040 で28pxの余裕がある）
      # 旧22は**フォント92で1行2024px＝画面幅の105.4%**となり物理的に成立しない。
      # 実測で26字のセリフが21字に折り返され**左右各18px切断**された
      # （「実」の左フチ・「き」の右側が欠ける、目視確認）。
      # さらにモードBではネコPiPと pixel_collision 1.0 で衝突し、
      # **実効上限は12字**だった（モードAでも解説パネルと1.0で衝突）。
      # 22字という数字は観測されたセリフ長であって、画面に収まる字数ではなかった
    # 【2026-07-27 撤回】ここには mutually_exclusive_with: [sidebar, nameplate] と
    # 書いていたが、**structure_grammar.dual_mode と両立しなかった**。
    # 実測: dual_modeに従うと**684/900フレーム＝76.0%が排他違反**、
    # 排他に従うと**captionが全編どこにも出せない**（sidebarはモードA主軸、
    # PiPはモードB常駐のため）。発話中の4秒が字幕なしになる区間を実演で確認済み。
    # さらにrole名 `nameplate` での一括指定は mode_A/mode_B 両方にかかるが、
    # **幾何の実態は正反対**だった（mode_A=340.6px衝突・pixel 1.0 /
    # mode_B=60.9px余白で衝突なし）。
    # → **排他ではなく幾何で解く**。上記sidebarに size を与えて caption の帯域を空けた。
    #   mode_B（PiP）とは元から衝突していないので排他不要。
    #   **常時表示が要求されるroleを排他の対象にしてはいけない**という教訓を得た
      # caption × sidebar が **pixel_collision 1.0（モードA全域）**、
      # caption × ネコPiP が **1.0（モードB）**。どちらのモードでも字幕が潰れる。
      # 2026-07-26に追記された「captionはモードA/B両方で表示」は、
      # **先行実装が同じ衝突を実測して回避していた組み合わせを、
      # 幾何を変えずに義務化してしまった**もの。共存させるなら幾何を変える必要がある
    z_order: 4                  # 【2026-07-26 遡及追加】発話内容の視認性を最優先するため前面
    entrance: pop                # 推定（静止画タイルでは瞬間切り替わりに見えるが、
      # サブ秒のフェードは検出限界のため断定不可）
    exit: pop                    # 推定
  - role: keyword               # UIコールアウト枠自体（テキストでなく赤矩形の図形強調。
    # telop_layers本来の想定（テキスト層）とは性質が異なるが、機能的に強調テロップと
    # 同格のため本ロールで記録）: 価格ティア行・入力欄・メニュー項目など、その時点で
    # 話題にしている要素を囲む。実測
    position_mode: anchored_to_target   # 【2026-07-27追加】**この座標は固定値ではない**。指し示す対象（UI要素・チャートの棒・画面内の物体）の
      # 位置に追従する。散文は「対象により可変」「固定位置ではない」と書いているのに
      # positionが固定値1つしか持たず、**散文と構造化フィールドが矛盾**していた。
      # 実害: documentary_cinematicのkeywordが固定値のまま棒グラフを潰し
      # 「労働」の棒を91.8%被覆した。下記positionは代表値であり、
      # 実装は対象の実座標から算出すること
    position: {centerX: 0.35, centerY: 0.45}   # 目視（対象要素により大きく可変、固定位置ではない）
    persistent: false
    style: プレーン
    z_order: 3                    # 【2026-07-26 遡及追加】モードB（画面共有デモ）限定で出現
    entrance: pop                 # 推定
    exit: pop                      # 【2026-07-26 遡及追加】未計測（推定、対象要素の切替と同時に消える）
  - role: badge                 # 【2026-07-26 スキーマ修正で追加】定期レビュー系バッジ・リボン:
    # ゴールド/タン配色、「3ヶ月ごとの定期レビュー」という自チャンネルの継続企画ブランディング色。
    # v1（月5万円課金するAIサービス）のみで確認、v2/v3では未検出のため低頻度要素。実測
    position: {centerX: 0.5, centerY: 0.08}   # 【2026-07-27 差し戻し】0.32へ動かしたが
      # **悪化した**。タイトルとの矩形重なりが 24.9%→**48.2%**に倍増、
      # QCのbbox_ratioも94.6%→**100.0%**（実測）。
      # **真因はcenterXではなく「解説パネル上部にbadgeの予約帯が無いこと」**だった。
      # パネル内のタイトルを y=210 まで下げると被覆 **0.0%** になることが実測されている。
      # → 座標を元に戻し、下記sidebarに reserved_top_px を設ける形で解く。
      # 【旧記述】旧0.5は
      # 同じ行の注記「**解説パネル上部**」と矛盾していた（パネル中心は0.32）。
      # 実測で**カードタイトル「月額比較」を金色プレートで潰した**
      # （bbox 94.6% / pixel_collision 1.0）。注記の側を正としてパネル中心へ寄せる。
      # 【旧記述】未計測（推定、解説パネル上部のブランディング
      # 領域を想定）
    persistent: false             # v1限定・低頻度要素であり常駐運用ではない
    style: リボン/バッジ（ゴールド〜タン配色）
    z_order: 2                    # 解説パネル(sidebar,1)の上、常駐ネコキャラ(nameplate,2)と同レベル
    entrance: hard_cut             # 未計測（推定、他要素と同様ハードカット同時表示と仮定）
    exit: hard_cut                  # 未計測（推定）

z_order_policy: |
  【2026-07-27 監査3対応】nameplate roleは「ネコキャラ大」(モードA)と「ネコキャラ小PiP」
  (モードB)の2装置で共有されているが、dual_modeによりモードA/Bはハードカットで排他的に
  切り替わるため同時表示は起きない。同一キャラクターの2状態という性質上、分離せず
  telop_layers本体に【モード: A/B】ラベルを追加して明示するに留めた。

  モードA（解説カード）は解説パネル(sidebar,1)を背景の主軸とし、定期レビューバッジ(badge,2)・
  ネコキャラ大(nameplate,2)をその上に重ねる。モードB（画面共有デモ）はネコキャラ小PiP
  (nameplate,2)とUIコールアウト枠(keyword,3)が重なりうるため、UIコールアウトを前面とする。
  セリフ字幕(caption,4)はモードA/B共通で発話内容の視認性を最優先し常に最前面。
  ※本ポリシーはz_order欄が無かった旧テンプレート版からの遡及追加（2026-07-26）であり、
  数値は各roleの視覚的な役割から論理的に割り当てた推定値。実測によるレイヤー同時表示の
  検証は未実施。

caption_font: |
  未計測（360p解像度制約）。【2026-07-26 遡及追加】採用すべきデフォルト: セリフ字幕は
  基準プリセット既定値（フォント92／黒フチ12px）を採用。UIコールアウト枠・定期レビューバッジは
  文字要素ではなく図形/画像強調のためフォントサイズの対象外。不透明度100%（半透明運用は
  背景輝度>0.65時の自動座布団のみ）。

animation_dictionary_mapping:
  解説カード(sidebar)の切替: hard_cut（カードのフェードイン/スライドイン等は検出されず、
    次のテーマのカードが瞬間的に表示される）   # 推定（静止画タイル由来、confidence中）
  ネコキャラ 大⇔小(モードA⇔モードB): hard_cut（サイズ変化はスケールアニメでなく、
    ハードカットと同時に「大きい静止イラスト」と「小さいPiP」が排他的に切り替わる。
    wipe_explainerのPiP入退場と同じ「即時出現/消滅」パターン）   # 実測寄り
  セリフ字幕の差し替え: in.pop / out.pop（推定。サブ秒トランジションは検出限界）
  赤コールアウト枠の出現/消滅: in.pop（推定。対象要素の切り替わりと同時に瞬間出現する
    傾向を確認）
  比較テーブルの数値更新(2月→5月の変化表示等): 静止カード内の差分ハイライト方式
    （アニメーショングラフ・カウントアップ演出は不使用。数値は最初から完成形で表示）   # 実測
  不使用: shake / bounce / spring / char_pop / motion_path 等の派手な動き語彙は
    3本とも未検出。落ち着いたトーンの解説チャンネルとして一貫（推定・n=3の範囲）

transitions:
  default: hard_cut            # 実測（3本全編でディゾルブ・ワイプ形状トランジション未検出）
  accent: []                   # 実測範囲では装飾トランジション無し

audio:
  bgm: none〜conditional        # 推定（confidence low。silencedetect -35dBが発話間で
    # 頻繁にヒットし無音区間が実際にノイズフロア付近まで沈むため、常時のBGMベッドが
    # 敷かれている可能性は低いと考察。ただし聴取確認は未実施のため断定はしない）
  voice_lufs_target: -19.8〜-20.1   # 実測（Integrated。v1=-20.1/v2=-20.0/v3=-19.8と
    # 3本ともほぼ同一値。YouTube標準の-14 LUFSより6LU前後低い、控えめなマスター音量）
  lra: 1.8-2.1                  # 実測（3本ともLRAが極めて狭い=強めのコンプ/リミッターで
    # 声のダイナミクスをかなり平坦化していると推測される）
  true_peak: -2.1〜-2.9          # 実測（dBFS）
  se_style: unknown              # 未検証（聴取未実施）
  ducking: unknown               # 未検証（BGM有無自体が未確定のため判定不可）

pacing:
  gap_keep_sec: 0.5-1.0          # 実測（-35dB/0.5s基準。v1: 76回・総57.9秒(2.83%)・
    # 平均0.762秒・最長4.06秒／v2: 88回・71.62秒(4.55%)・平均0.814秒・最長3.19秒／
    # v3: 132回・98.37秒(5.08%)・平均0.745秒・最長3.54秒。1秒超の間も
    # 7-16回/本残っており、無音を機械的に詰め切らない「落ち着いた間」の設計）
  filler_policy: unknown          # 推定（keep_character寄り。字幕が発話追従の完全文
    # スタイルであることから口語表現をある程度残していると推測されるが、実際の
    # 音声聴取・字幕文言の精査は未実施）
  hook: title_first               # 実測（0秒から解説カード（タイトル・価格比較表等）と
    # ネコキャラが画面に完成形で表示され、チャンネルロゴのバンパーや前置き挨拶なしに
    # 即座に本題が視覚化される。0-30秒区間ではハードカットが0〜1回のみで、フック区間
    # ですら「速いカット」ではなく「静止画面+キャプションの高速差し替え」でテンポを
    # 作っている点がwipe_explainer等のB-rollフラッシュ型フックと明確に異なる）
  operation_wait_policy: unknown  # 未確認（ai_tool_avatar_3のCowork操作デモでAIの処理待ち時間を
    # 実写のまま見せているか編集で圧縮しているかは、音声聴取・タイムコード精査を
    # 伴う追加検証が必要。今回のサンプリング間隔では判定不可）

structure_grammar:                # v2拡張候補（このチャンネル固有の二層構造）
  dual_mode: |
    全編が「モードA=解説カード（静止インフォグラフィック+大ネコキャラ、
    価格比較・概念整理向き）」と「モードB=画面共有デモ（アプリ/ブラウザ画面録画+
    小型ネコPiP、操作手順向き）」の2モードの反復で構成される。モード切替は必ず
    ハードカットと同時に起き、クロスフェードや中間状態は存在しない。動画のテーマにより
    2モードの配分比率が大きく変わる（価格比較中心のv1/v2はモードA比率が高く、
    機能チュートリアル中心のv3はモードB比率が高い）。実測（3本のタイル目視による構成マップ）。
    【2026-07-26 遡及追加・基準4対応】captionロール（セリフ字幕）はモードA/モードBの
    どちらでも発話に同期して表示される（発話追従型のため、解説カード/画面共有デモの区別なく
    常時機能する。実測: hookタイルではモードA中にもセリフ字幕相当のキャプションが確認できる）。
    UIコールアウト（keyword）はモードB（画面共有デモ）限定で出現し、モードAでは使用されない。
    定期レビューバッジ（badge）はモードAの解説パネル上でのみ確認され、モードBでは未検出。
  top_letterbox: モードB（画面共有）区間の画面上端に高さ約8%（360p換算で約30px）の
    純黒帯が一貫して存在する。ブラウザのタブ/ウィンドウ枠を隠すトリミングと推測されるが、
    確定的な理由は未検証   # 実測（複数フレームのピクセルスキャンで確認）

packaging:
  thumbnail_style: 未取得
  chapter_style: なし（テロップ常駐型のチャプター表示・章タイトルバーは3本とも確認され
    ず。モードA⇔モードBの切り替わりが実質的な話題の区切りとして機能している。
    YouTube公式チャプター機能の使用有無は未確認）
  endcard: true                  # 実測。3本で完全に同一のシーケンス（同一素材の使い回しを
    # ピクセル単位で確認）: ①挨拶キャプション+解説カードモードへの回帰（フック素材の
    # 再登場によるブックエンド構成）→②出版社「技術評論社」サイトの画面共有デモ
    # （自著「ゼロからわかるDifyの教科書」の紹介、小型ネコPiP付き）→③書影+
    # 「絶賛発売中！詳しくは概要欄をみてね」のフルスクリーン広告カード（ピンク/赤の
    # 書影+黒太字+チャット風UIモックアップ「Difyの入門ガイドです！」）。
    # v3のみ直前にAnthropic公式マーケティング画像"Power through tedious tasks"の
    # 短いインサートあり

apply_notes: |
  youtube-edit-style-specパイプラインでの適用方法・実装上の注意点:

  【二層構造（モードA/B）の再現が最優先】このチャンネルの最大の特徴は「解説カード＋
  大ネコキャラ」と「画面共有＋小型ネコPiP」の2モードをハードカットで切り替える構成。
  「完コピ」を狙うなら、まず素材を2種類に仕分ける前処理が必要:
  1. **モードA（解説カード）**: 静止画像1枚を画面左55-60%にフルハイトで配置し、
     右40%に静止ネコキャラ画像+吹き出しテロップを重ねる。実装は単純な2レイヤー
     オーバーレイで十分（アニメーションは不要、hard_cutで次のテーマ画像に差し替え）。
     解説カード自体（価格比較表・ティア図解等）はPalmier側では静止画像として別途
     用意する必要があり、動的に自動生成するパイプラインは本実測の範囲外
     （ai_tool_avatar側は恐らくFigma/Canva等で事前デザインしたスライド素材と推測されるが未確認）。
  2. **モードB（画面共有デモ）**: 既存のscreen_tutorial実装（フルウィンドウ画面録画）を
     ベースに、右下フチ合わせで小型ネコPiP（幅22%×高さ40%目安、右端・下端に余白ほぼ
     ゼロ）を固定オーバーレイする。wipe_explainerのPiPパターンA実装（overlayフィルタで
     x=in_w-ow, y=in_h-ohに固定配置）がそのまま流用できる。画面上端の黒帯（高さ約8%）も
     screen_tutorial側でcropまたはpad処理として追加する。
  - ネコキャラ素材そのもの（大小2サイズ、複数ポーズ）は今回のチャンネルの固有イラスト
    資産であり、実装時は別途イラスト発注または既存のPalmier素材内に代替アセットが
    あるか確認が必要。

  【キャプション実装】発話追従の完全文字幕＋色分けなしの単色袋文字という組み合わせは
  base_preset（デフォルト）の「短いキーワード抜き出し+黄色強調」とは異なる設計。本スタイルを
  適用する場合はキャプション生成ロジックを「要点抜き出し」でなく「発話ほぼそのまま」
  モードに切り替える必要がある。半透明黒座布団の自動追加は既存のPalmierパイプライン
  実装（背景輝度>0.65で自動追加）がそのまま使えそうな挙動が実測でも確認できた
  （ai_tool_avatar側もライト背景時のみ座布団を敷いている）。

  【赤コールアウト枠】UI要素や表の特定行を赤矩形で囲む手法はscreen_tutorialの
  「赤円/赤矩形枠/赤矢印」実装（callout_mode）を流用可能。色は#DF1014系で統一されており、
  screen_tutorialの既存赤との差し替えで対応できる可能性が高い。

  【未確認・今後の検証課題（正直に明記）】
  1. **解説カード内アニメーションの有無**: 数値のカウントアップ、行のハイライトが
     時間差で追加されていく等の動きは、45秒/15秒間隔のサンプリングでは検出限界。
     1本を対象にフレームバイフレーム（wipe_explainer相当の精度）で再検証すれば
     確定できる可能性がある。
  2. **BGM有無**: silencedetectの挙動からBGMベッドが薄い/無いと推測したが、実際の
     音声聴取による確認は行っていない（confidence low）。
  3. **operation_wait_policy（v3のAI操作待ち時間の扱い）**: 早送り・カットの有無を
     タイムコード精査で確認していない。
  4. **フォント名・角丸半径等の微細な数値**: 360p解像度のため特定不可（wipe_explainer
     と同様の制約）。
  5. **n=3だが単一チャンネルのみ**: 「ai_tool_avatar系サンプル」固有の癖か、AI活用系
     解説チャンネル全体に共通する文法かは、他チャンネルでの追加実測が必要
     （aidaigaku_*, ai_biz_pitch_* の同時取得素材が手元にあり、次点の実測候補として有力）。
