style_id: kirinuki
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: 実測（カット律/視覚リズム/LUFS/LRA/無音/テロップ構造=全項目ffmpeg実測+タイル目視、既存資産と高い整合） / 推定（entrance遷移の細部・360p配色）

format:
  aspect: 16:9               # 実測（横画面配信を顔中心クロップで使用）
  typical_duration: 10-20分
  cuts_per_min: 0.36          # 実測（scene0.3: 5カット/13.7分。カメラ転換ほぼ無し=1ショット固定）
  visual_rhythm_per_min: 36.9  # 実測（scene0.08: 505イベント/13.7分。既存資産の30-33/分と高い整合＝テロップ切替のジャンプカット文法）
  camera: static              # 実測
  broll_usage: none           # 実測（視覚変化はテロップ層が全担）

palette:
  background_hex: 元配信映像そのまま   # 実測
  brand_hex: ["#000000(見出し帯・黒地白文字)", "#B33FA1(チャンネルロゴバッジ・推定近似)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text:                  # 【2026-07-27 R5 注記】**この dict 形式は現状このファイルだけ**。
      # 15スタイルで color_text の型が str 8 / list 3 / None 2 / dict 1 の**4通り**に散っており、
      # color_roles の目的（横断での機械的差し替え）が型ディスパッチ4分岐になる。
      # dict が最も情報量が多いので他ファイルもこれへ寄せるのが望ましいが、
      # 全ファイル一斉変更は退行リスクが高いため保留する（schema.md に型の規定が無いのが根本）。
      # 【R4 再構成の経緯】リスト形式では
      # **どの要素がどのroleの色か機械可読でなかった**ため、role名をキーにする
      title_bar: "#FFFFFF"       # 論点見出しの白文字（brand_hex実測）
      caption: "未計測"          # **全発話フル字幕の青太字**。画面で最も面積・時間を占める
        # 主役なのにHEXがどこにも無い。360p素材のため実測できていない。
        # **null（＝色指定なし）ではなく "未計測" と書いて発明を可視化する**
    # 【旧記述】R3 統合時のメモ:
      # #FFFFFF = 論点見出しの白文字（brand_hex実測、見出し帯の黒地白文字に対応）
      # 未計測 = **通常字幕の青太字**。画面で最も面積・時間を占める主役なのに
      #   HEXがどこにも無く、実装者ごとに違う値になる。360p素材のため実測できていない。
      #   **null（＝色指定なし）ではなく "未計測" と書いて発明を可視化する**
      #   （color_bg と同じくリストで複数用途を持つ形式に合わせた）
    color_bg: ["#000000", "#FFFFFF"]  # #000000=論点見出しの黒帯地色（brand_hex実測）、
      # #FFFFFF=通常字幕の半透明白座布団（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: null
    color_stroke: "#FFFFFF"    # 通常字幕の「白系縁取り薄」（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_primary: "#B33FA1"   # チャンネルロゴバッジ（brand_hex推定近似）
    # 【2026-07-27 R3 重複キーの解消】ここに `color_text: "未計測"` を足したが、
    # **上に既存の color_text があり上書きしていた**（私の5度目の重複キー事故）。
    # 内容は上のリストへ統合した。
    color_glow: null
  emphasis_roles:
    通常字幕: 青太字（白系縁取り薄）+ 半透明白座布団   # 実測目視（既存資産の白字とは配色差。チャンネル差と判断）
    論点見出し: 黒帯白文字、話題が変わるごとに文言差し替え

telop_layers:
  - role: title_bar          # 論点見出し常駐: 現在の論点を要約・リライトした一言（「得しないなら言わない」等）を常時表示、話題転換で差し替え=チャプター兼文脈補完。実測
    font_px: 70                  # 【2026-07-27 R6】z_order_policy の安全幅ルール
      # 「帯の右端が centerX0.87（=1670.4px）を超えない」から逆算。
      # centerX0.5 なので半幅710.4px以下＝幅1420px以下、20字なら font 71 が上限。70を採る
    max_width_px: 1400   # 【境界解・2026-07-27 R7実測】20字 × font70 = 1400 で**余裕0.0px**。
      # 破れる条件: font_px を71以上にする。安全幅ルール（右端 ≤ centerX0.87=1670.4px）は
      # 20字の最悪ケースで満たすことを実レンダリング＋目視で確認済み（帯がロゴバッジに届かない）
    overflow_policy: split_event   # 【2026-07-27 R6 一括掃引】`max_lines: 1` だけでは折返しは止まらない。
      # 折返し器は max_chars で改行するので**結果の各行は制約を満たしたまま2行になる**
      # （ai_tool_avatarで実測。**documentary_immersive が退行したという私の当初の報告は誤り**で、
      #  R6のFAILは検証者が意図的に作った違反対照窓＝14字「max_lines:1 違反の対照」だった。
      #  掃引そのものは正しい——10ファイルが本当にこのフィールドを欠いていた）。
      # 超過は折り返さず**複数のテロップイベントへ分割する**
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    char_width_px: 70   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.5, centerY: 0.076}   # 【2026-08-01 R12】上 0.7px → 18.0px。4辺検算が `size` 宣言ありのroleしか見ておらず、11周この役は一度も検査されていなかった
      # 【2026-07-27 見切れ修正・導出値】
      # 旧0.03=32.4pxは、caption_fontの目安44-56px（ブロック高さ約65px）に対し
      # 上端が**マイナスになり必ず切れる**。**推奨フォントのどの値でも回避不能**だった。
      # 0.06=64.8pxで上端32.3px（画面内）。
      # ※position解釈規約が下端しか見ていなかったため素通りしていた欠陥
    max_height_px: 120           # 【2026-07-27追加】centerY0.076での上端検算の前提
    persistent: true
    style: 帯
    z_order: 1                  # 【2026-07-27 z_order遡及追加】画面上端の横長バナー。
      # nameplate(3、右上ロゴバッジ)とY座標が近接(centerY差0.02=約22px)しており、
      # 帯の幅次第では右端がロゴと重なる可能性がある（下記z_order_policy参照）。
      # nameplateより背面に置き、重なった場合はロゴが優先して見えるようにする
    # 【2026-07-27 R6 重複キーの解消】旧「未計測」を削除。上の数値が正（8度目の同型事故）
    max_lines: 1         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 見出し/バッジ系は1行が前提（2行になると帯の高さが倍になり近接要素を潰す）。
      # 収まらない文言は行を増やすのではなく**文言を短くする**こと
    max_chars: 20
    entrance: pop            # 実測（瞬時差し替え）
  - role: nameplate          # チャンネルロゴ丸バッジ: 右上に常駐する円形アイコン。実測
    size: {width: 96, height: 96}   # 【境界解・2026-07-27 R7実測】上端の余裕**3.0px**。破れる条件: 直径を102px超にする
      # **「直径102pxを超えると上端が切断される」という上限がどこにも書かれていなかった**。
      # centerY0.063=68.0pxなので、上端を画面内(影の左上3px込み)に保つ上限は直径102px。
      # 96pxを既定とする（未計測の導出値。実素材で再計測すること）
    text_content: none   # 【2026-07-27 R9追加】ロゴ画像そのもので文字組みを持たない。「size だけあって中身が無い」検査からの明示的な除外（円形チャンネルロゴアイコン）
    position: {centerX: 0.94, centerY: 0.063}   # 【2026-08-01 R12】centerX 0.95 は**右15.0px**（16px規定に1.0px不足）。0.94=1795.2pxで右25.8px
      # 【2026-07-27 R10】旧 centerY 0.05 は**上3.0px**（同ブロックが「境界解・上端の余裕3.0px」と
      # 自認していたのに直っていなかった）。0.063 = 68.0px で上17.0px
      # 定めているのに機械照合が無く、手検算で毎周どこかが抜けていた。
      # 旧 0.05 は**上3.0px**（同ブロックが「境界解・上端の余裕3.0px」と
      # 自認していたのに直っていなかった）。0.062 で上16.0px
    persistent: true
    style: カード
    z_order: 3                  # 【2026-07-27 z_order遡及追加】常駐ブランド要素のため
      # 最前面固定。title_bar(1)と近接するため、実装時は下記z_order_policyの
      # 安全幅ルールに従うこと
  - role: caption            # 全発話字幕: 下部2行、発話カバー率ほぼ100%の無間隙連続。実測
    max_width_px: 1472   # 【境界解・2026-07-27 R7実測】16字 × font92 = 1472 で**余裕0.0px**。
      # 破れる条件: フォントを1px上げる（16字=1488px）/ フォントファイルを替えて字送りが変わる。
      # ※18字の発話で「16字＋2字」の**2文字だけの孤立行**が出ることを目視確認。
      #   衝突ではないが見栄えが悪いので、実運用では発話の区切りで分割すること
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    position: {centerX: 0.5, centerY: 0.836}   # 【2026-08-01 R12】下 3.7px → 18.3px。4辺検算が `size` 宣言ありのroleしか見ておらず、11周この役は一度も検査されていなかった
    persistent: false
    style: 袋文字+座布団
    z_order: 2                  # 【2026-07-27 z_order遡及追加】画面下部の発話字幕で
      # 上部のtitle_bar/nameplateとは領域が分離しており衝突なし
    # 【2026-07-27 R6 重複キーの解消】旧「未計測」を削除。上の数値が正（8度目の同型事故）
    max_lines: 2         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 実測で、幅だけ縛ると**行数が増えて事態が悪化する**ことが4スタイルで確認された
      # （japan_vlog 3行31px→4行86px侵入 / wipe captionのPiP重なり15.9%→31.0% /
      #  investigativeの見出しが3行化してkeywordを100%被覆）。
      # 3行以上必要な発話は**複数のテロップイベントに分割する**
    max_chars: 16
    entrance: pop
    exit: pop

caption_font: |
  未計測（n=1・360p目視のため原寸不明）。採用すべきデフォルト:
  - caption（全発話字幕・青太字+白系縁取り薄+半透明白座布団）: chaenデフォルト
    （フォント92/黒フチ12px）をベースに、色のみ青太字へ変更（apply_notesの
    「呼び出し時の色指定で対応」方針を踏襲）。フチは黒でなく白系薄縁を推奨
  - title_bar（論点見出し常駐・黒帯白文字）: 目安44-56px相当
  - nameplate（チャンネルロゴ丸バッジ）: フォントというよりロゴ画像素材（サイズ未計測）
  いずれも未計測の推定値であり、実装時は完成フレームでの目視比較を必須とする

z_order_policy: |
  title_bar（論点見出し常駐帯、centerX0.5,centerY0.03）とnameplate（チャンネルロゴ
  丸バッジ、centerX0.94,centerY0.063）は画面上端で近接している。title_barは横長の帯
  （幅は文字数に応じ可変だが、経験的に画面幅の70-90%程度に及ぶ想定）であり、帯の
  右端がnameplateの左端（画面幅の約91-99%域）まで到達する場合は座標衝突が起きうる。
  本ファイルはPillow実測を行っておらずtitle_barの実寸は未計測のため、確定的な
  centerY修正は行わず、代わりに安全幅ルールを設ける:
  **title_barの帯は右端がcenterX0.86（=nameplate左端1756.8pxの手前）を超えない幅で描画する**
  【2026-08-01】nameplateを0.95→0.94へ動かしたのでこの上限も0.87→0.86へ追随させた。
  元の0.87はnameplate左端1776px由来で、動かした時点で根拠が消えていた（派生値の未追随）
  こと。この安全幅を守れば、nameplateをz_order3（最前面）に置いても実質的に
  重ならない。caption（全発話字幕,2）は画面下部でtitle_bar/nameplateとは領域が
  完全に分離しており衝突なし。

animation_dictionary_mapping:
  字幕切替: pop（瞬時差し替え、モーション系語彙ゼロ=低コスト量産型）   # 実測
  論点見出し切替: pop
  不使用: slide_in / shake / float / typewriter 等すべて   # 実測（既存資産と一致）

transitions:
  default: hard_cut          # 実測（トピック転換も見出し差し替えのみ）
  accent: []                 # 実測

audio:
  bgm: none                  # 実測（無音区間がノイズフロアまで落ちる=BGM不在。声のみ）
  voice_lufs_target: -15.2   # 実測（既存資産-10.9〜-13.7よりやや静かだがconversational-standardクラスタの範囲内）
  lra: 5.3                   # 実測
  se_style: none             # 実測
  ducking: false

pacing:
  gap_keep_sec: 0.4-0.8       # 実測寄り（silencedetect -35dB/0.5s: 55回/13.7分=高頻度の短い間欠。詰めるが完全ゼロにはしない）
  filler_policy: keep_character   # 実測（「えっと」等の口調を残す）
  hook: cold_open             # 実測（0秒から質問文で開始、OP無し）

packaging:
  thumbnail_style: "未取得（既存資産参照: 右=本人顔+左=巨大テキスト3行+クリフハンガー記法が同ジャンル定番）"
  chapter_style: "title_bar文言差し替え=チャプター。生の質問文でなく回答予告型にリライト（主張化リライト）"   # 実測寄り
  endcard: 未確認（13.7分内では検出なし）

apply_notes: |
  Palmierパイプラインでの適用:
  - cuts_per_min 0.36は既存chaenデフォルト(1.2-4.9)より大幅に低い＝カメラ切替をほぼ行わず、テロップ切替(visual_rhythm 36.9/分)だけで視覚変化を作る量産型ジャンル。カット編集は最小限に抑える。
  - 全発話字幕(カバー率ほぼ100%)は「引用・抜き」でなく「フル字幕」モード。SKILL.mdの字幕品質v2(音声強調→複数パス照合→不確信語省略)をそのまま全量適用する。
  - 論点見出し(title_bar)は「生の質問文」でなく「回答予告型のリライト」が既存資産・本実測共に確認された文法。テロップ生成時はLLMで質問→断定文への言い換えを行うステップを追加する。
  - このチャンネル固有の字幕色は青太字（既存資産の白字とは異なる）。プリセット適用時は動画のcolor_role指定でこの差分を吸収する（style_id内にサブバリアントを持たせず、呼び出し時の色指定で対応）。
