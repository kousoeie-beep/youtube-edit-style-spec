      # **startup.pip は同じ状況を color_shadow: "none" で解いており、規約の掃引が片方で止まっていた**
    position: {centerX: 0.87, centerY: 0.863}   # 【2026-07-27 R10・4辺検算】下端が**−1.4px（画面外）**だった。0.863 = 932.0px で下17.0px。
      # layer_kind: video でQCの検査対象外なので、この誤りは4辺検算でしか見つからない
    layer_kind: video            # 【2026-07-27追加・検証者の提案を採用】このroleは
      # **動画レイヤー**であり overlap_qc の検査対象から自動的に除外される
      # （アルファを静的に取れないため）。実測で生成20レイヤーに対し
      # element_count=19 となり、**PiP絡みの衝突8件がQCに1件も現れなかった**。
      # QCの盲点は既知でも「どのroleが盲点に落ちるか」がyamlから読めなかったので
      # 機械可読な印を付ける。**このroleは必ずフレーム目視で確認すること**。
      # 実測bbox: x=1497-1843 / y=831-1069
    persistent: true
    style: プレーン
    z_order: 3                  # 【2026-07-27 z_order遡及追加】ST1固有の常駐PiP。
      # caption(注釈カード,7 centerX0.3)とX座標が大きく離れており(centerX0.87)衝突なし。
      # lower_third(3、ST2固有)とは別チャンネルの装置で同時表示は想定されない
    entrance: pop
  - role: lower_third        # 常駐ナレーションキャプション: 発話に同期した字幕を画面下部に常時表示（白文字黒縁 or 白カード黒文字）。ST2で実測、顔出し中も画面共有中も途切れず続く
    variant: variant_st2   # 【2026-07-27追加】**変種が未定義だったのが本ファイル最大の欠陥**。
      # 再実装検証で、別変種のroleどうしを同時表示として検算してしまい
      # 衝突18件のうち12件がこの誤りに由来していた。散文には
      # 「ST1=純粋画面共有 / ST2=顔出し⇄画面共有切替 / AI活用系=スマホ実機俯瞰」
      # と3変種が書かれているのに、フィールドに落ちていなかった。
      # 各roleのコメントにある「〇〇で実測」から変種を確定した
    max_width_px: 1500           # 【2026-07-27 R4追加】幅の縛りが無く、実測で
      # **1857px＝画面幅の96.7%**になり2文字だけの孤立行ができた
      # （ai_biz_pitchでschema.mdに記録したのと画素単位で同じ欠陥）
    font_px: 92   # 【2026-07-27 R8追加】caption_font 依存を断つ（規約⑩。誰かが caption_font を触ると黙って破れる）
    size: {width: 1572, height: 340}   # 【2026-07-27 R9訂正】旧 1596x320 は**自分の式とも padding_px とも合わなかった**。
      # 幅: 1500 + padding24×2 + フチ12×2 = **1572**（1596は24px過大）
      # 高さ: 行高134×2 + padding24×2 + フチ12×2 = **340**（320は padding14 前提の値）
      # フィールドが2つの異なる幾何を指しており、**yamlだけでは一意に決まらなかった**
      # （検証者は「どちらもyaml準拠」の解を2つ描いて時間分離せざるを得なかった）
    padding_px: 24   # 【2026-07-27 R8追加】
    stroke_px: 12   # 【2026-07-27 R9追加】style「袋文字+座布団」の必須項目。上の高さの導出に使っている
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    char_width_px: 92   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    max_chars_total: 32   # 【2026-07-27 R10】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値。実測できたら上書きすること
      # 1500 ÷ 92 = 16.30 → 1行16字、2行で32字
    position: {centerX: 0.5, centerY: 0.80}   # 【2026-07-27 R9】高さが340になったので 0.82 では下余裕12pxの境界解になる。
      # 下端(影込) = cY×1080 + 170 + 12 ≤ 1064 → cY ≤ 0.8167。
      # 0.80 で下端1046px（下余裕34px）。1行時は帯高206px・下端979px（余裕101px）
      # （実効cY 0.8407＝宣言値が使われない）。1行時ですら下余裕3pxの境界解だった。
      # 0.82なら1行990.6px(余裕89.4)/2行1057.6px(余裕22.4・繰り上げ不要)
    persistent: false
    style: 袋文字+座布団
    z_order: 3                  # 【2026-07-27 z_order遡及追加】ST2固有の常駐的字幕。
      # ticker(4、画面右上0.82,0.12)とはY座標が大きく離れており(centerY0.80 vs 0.12)衝突なし
    max_chars: 16                # 【2026-07-27 R5・lintの穴を塞いで検出】旧20は**一度も拘束しない死に値**
      # だった（20字×font92=1840px > max_width_px 1500px で、1行に入るのは16字）。
      # **幅を足したときに文字数を直していなかった**。3スタイルで同型
    max_lines: 2         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 実測で、幅だけ縛ると**行数が増えて事態が悪化する**ことが4スタイルで確認された
      # （japan_vlog 3行31px→4行86px侵入 / wipe captionのPiP重なり15.9%→31.0% /
      #  investigativeの見出しが3行化してkeywordを100%被覆）。
      # 3行以上必要な発話は**複数のテロップイベントに分割する**
    entrance: pop
    exit: pop
  - role: ticker             # トピックバッジ(常駐): 現在の解説テーマを画面右上に小バッジで常駐表示（例:『仮想デスクトップ』+『優秀』スタンプ）。ST2で実測、話題転換まで維持
    variant: variant_st2   # 【2026-07-27追加】**変種が未定義だったのが本ファイル最大の欠陥**。
      # 再実装検証で、別変種のroleどうしを同時表示として検算してしまい
      # 衝突18件のうち12件がこの誤りに由来していた。散文には
      # 「ST1=純粋画面共有 / ST2=顔出し⇄画面共有切替 / AI活用系=スマホ実機俯瞰」
      # と3変種が書かれているのに、フィールドに落ちていなかった。
      # 各roleのコメントにある「〇〇で実測」から変種を確定した
    font_px: 44   # 【2026-07-27 R8追加】size/max_width_px/max_chars/max_lines が**4つとも無い**唯一のroleだった
    max_width_px: 480   # 【2026-07-27 R8】全角14字なら幅672pxで**右端1922px＝画面外**だった
    max_chars: 10   # 【2026-07-27 R8】全角10字@44 = 440px ≤ 480
    max_lines: 1   # 【2026-07-27 R8追加】
    overflow_policy: split_event   # 【2026-07-27 R8追加】
    size: {width: 536, height: 93}   # 【2026-07-27 R8】centerX0.82=1574.4px、右端 ≤ 1920−12(影) → 半幅≤333.6 → 上限667。安全側で536
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    char_width_px: 44   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.82, centerY: 0.12}
    persistent: true
    style: カード
    z_order: 4                  # 【2026-07-27 z_order遡及追加】常駐要素で前面寄り。
      # chapter_tab(4、AI活用系固有)とは別チャンネルの装置のため同時表示は想定されない
    entrance: pop

caption_font: |
  未計測（360p制約のため原寸不明・複数チャンネル混在のため単一値に断定できない）。
  採用すべきデフォルト:
  - lower_third（常駐ナレーションキャプション・ST2）: 基準プリセット既定値
    （フォント92/黒フチ12px）をそのまま採用可（白文字黒縁の一般的な字幕形式のため）
  - caption（注釈・補足キャプションカード・ST1、白カード+黒文字）: 黒フチではなく
    白カード背景で可読性を確保する設計のため、本文フォントは目安44-56px相当
    （カード内に複数行の説明文を収める前提）
  - chapter_tab/ticker（手順番号バッジ/トピックバッジ）: 目安40-50px相当
  - title_bar（冒頭アジェンダカード）: 箇条書きリストのため1行あたり目安36-48px相当
  いずれも未計測の推定値であり、実装時は完成フレームでの目視比較を必須とする

z_order_policy: |
  【2026-07-27 role分離に伴い更新（監査3対応）】旧keyword（操作対象ハイライト）は
  「円」と「矩形枠」という機能の異なる2装置を同一role名に相乗りさせていた。callout_mode:
  precise_bbox内で両者は時間排他が文書化されておらず（連続操作の軌跡表示と要素の説明保持が
  重なりうる）、click_highlight_circle/click_highlight_boxへ分離した（telop_layers本体
  参照）。両者とも位置がvariableのため分離後も座標検算はできず、実装時の個別確認が
  引き続き必要。

  本スタイルはチャンネル間で装置構成が大きく異なる多変種スタイル（ST1=
  title_bar/click_highlight_circle/click_highlight_box/caption(注釈カード)/nameplate(顔出しPiP)、ST2=
  click_highlight_circle/click_highlight_box/lower_third/ticker、AI活用系=chapter_tab/sidebar(プロンプト
  カード)）。異なるチャンネル固有のロール同士（例: nameplateとlower_third、
  chapter_tabとticker）は実際には同時表示されない設計であり、z_order番号が同値・
  近似していても比較対象にならない（documentary_immersive/documentary_startup_journey
  と同じ扱い）。
  同一チャンネル内で実際に同時表示されるペアは以下の通り、座標が離れており
  pixel衝突は検出されなかった:
  - ST1: caption(注釈カード,centerX0.3)とnameplate(顔出しPiP,centerX0.87)
    はX座標が大きく離れている
  - ST2: lower_third(centerY0.80)とticker(centerY0.12)はY座標が大きく離れている
  唯一衝突リスクがあるのはclick_highlight_circle/click_highlight_box(位置variable)で、クリック対象
  座標に追従するため理論上どの固定要素とも近接しうる。実装時は対象UI要素が画面端
  （下部のlower_third帯・右上のticker/nameplate等）に近い場合、個別にハイライト
  座標と固定要素のbboxが重ならないか確認すること。
  【2026-07-27 R4訂正】旧記述は「title_bar（冒頭アジェンダカード,**5**）と
  sidebar（プロンプト全画面カード,**5**）は同じ層で**同値**」としていたが、
  **数値も結論も誤り**になっている。現在は **title_bar=8 / sidebar=9 で同値ではない**。
  z_order を全面付け替えした際に、この散文を追随させていなかった。
  **policy本文を信じてfieldsを無視した実装者は、R3の退行を完全に再現する**
  （真っ黒なカードの上に中身が空の赤枠が浮く状態）。
  以下は現行の正しい記述:
  title_bar（冒頭アジェンダカード,8）とsidebar（プロンプト全画面カード,9）はどちらも
  「全画面カード」層だが**別値**で、sidebarが前面。SKILL.mdの完全遮蔽許容パターンに従い、表示中は他要素
  （click_highlight_circle/click_highlight_box/caption/chapter_tab/nameplate等）を覆い隠す想定。

animation_dictionary_mapping:
  操作ハイライト(円・矩形枠・矢印): in.pop（瞬時出現・バウンス無し）/ out.pop or out.fade   # 実測（1秒刻み細密タイルで確認。バウンス/スケールアニメは不使用、静的な出現・消滅のみ）
  注釈カード・アジェンダカード・プロンプトカード: in.fade / out.fade                       # 実測寄り
  手順番号バッジ・トピックバッジ: in.pop（差し替え時は瞬時切替）                            # 実測
  顔出しワイプ⇄画面共有の切替(ST2型): ハードカット（同時オーバーレイでなく別トラックの排他切替）   # 実測
  不使用: crop_zoom / dolly_zoom / punch_in 等の映像ズーム語彙全般   # 重要な否定的発見。下記apply_notes参照

transitions:
  default: hard_cut          # 実測（4本ともディゾルブ・ワイプ形状トランジション未検出）
  accent: []                 # 実測範囲では装飾トランジション無し。ハイライト円/矩形枠の出入りが体感テンポを作る

audio:
  bgm: conditional            # 推定（LRA/LUFSパターンからの推定、聴取未実施）。純粋画面共有型(ST1)はLRA3.4と会話標準クラスタでBGM無しの可能性が高く、ST2/AI活用系はテンポの明るさから軽いBGMベッドの可能性。confidence: low-medium
  voice_lufs_target: -14.7〜-23.1   # 実測（4本レンジ。純粋画面共有=-16.4/-14.7、イラスト解説ハイブリッド=-23.1と最も静か、AI活用系=-18.2）
  lra: 2.5-5.1                # 実測（全4本とも会話標準〜やや狭いクラスタ。抑揚を大きく残さず聞き取りやすさを優先）
  se_style: ui_pops            # 推定（クリック音・操作音のSEが定番のジャンルだが本実測では波形からは確証できず。confidence: low）
  ducking: false

pacing:
  gap_keep_sec: 0-1.0          # 実測（純粋画面共有=silencedetect 8回/12min=操作待ち時間や説明の間をやや残す寄り。顔出し⇄画面共有切替型・AI活用系=1回/10-11min・イラスト解説ハイブリッド=0回=ほぼ完全に無音を詰める）
  filler_policy: keep_character   # 実測（「えっと」等の口調・言い淀みは残す。話芸で押すというより手順の実演で押す）
  hook: title_first           # 実測（ST1=目次カード提示→操作開始／ST2=挨拶+話題提示（『仮想デスクトップ使ってますか？』）→ベネフィット訴求（『世界観が変わるほど』）→実演／AI活用系=完成イメージのステップリスト提示→実演の順で、いずれも「何をこれから見せるか」を先出ししてから操作に入る）
  operation_wait_policy: リアルタイム維持+注釈で埋める   # 実測（ST1は入力待ち・処理待ちをカットせず、赤円/矩形枠/補足カードで「間」を情報量に転換する。ST2/AI活用系は待ち時間自体が少ない素材のため無音カットで対応）

packaging:
  thumbnail_style: 未取得
  chapter_style: ST1=冒頭アジェンダカードの項目がそのまま章順 / AI活用系=手順番号バッジの差し替えがチャプター / ST2=トピックバッジの差し替えがチャプター相当   # 実測
  endcard: AI活用系で実測（公式LINE登録CTAカード、概要欄誘導のテロップ付き）。ST1・ST2は分析区間内では未確認

apply_notes: |
  youtube-edit-style-specパイプラインでの適用方法:

  【最重要の否定的発見】ズームは使わない: brief段階では「ズーム文法（どこを・いつ・どの倍率で寄るか）」を主要抽出項目と想定していたが、4本すべてを1秒刻み細密タイルで検証した結果、実際のクロップズーム/パンチインは一件も検出されなかった。操作箇所の強調は全て「フル解像度の画面キャプチャに赤系オーバーレイ図形を重ねる」方式で行われている。したがって本プリセット適用時はSKILL.mdの既存ズーム実装（crop w/h の時間可変式・下端アンカー・オーバーレイ後段合成）を流用**しない**のがデフォルト。ズーム演出を足したい場合は基準プリセット式パンチイン実装を流用可能だが、それは本ジャンルの「素直さ」を壊すオプション演出として扱うこと。

  【操作枠/矢印のコード描画方法（callout_mode: precise_bbox / arrow_label 専用の数値レシピ）】: この数値レシピ自体は7本の追加実測でも否定されていない（callout_mode: noneのチャンネルではそもそも描画自体を行わない。screen_tutorial_yaml改訂案.md 6節）。既存のPillow PNG-overlay方式（字幕焼き込みと同じ仕組み）をそのまま流用し、テロップの代わりに図形を描画する。
  - 赤円（クリックポイント、callout_mode: precise_bbox）: `ImageDraw.ellipse` で半径18-24px・線幅3-4px・塗りつぶし無し（円環のみ）。クリック座標はBrief側でPalmier上の操作記録またはこうすけ指定のx,y(正規化座標)から取得し、pop-in→0.4-0.6s静止→fadeで消灯。
  - 赤矩形枠（UI要素の囲み、callout_mode: precise_bbox）: `ImageDraw.rounded_rectangle` で角丸8px・線幅4-5px。対象要素のbboxに+8pxパディングを加えて描画。要素の説明が続く間は保持（1.5-4s程度）。対象はUI要素1個〜数個・特定の1行に限定し、パネル全体・画面領域全体には使わないこと。
  - 赤矢印（要素↔ラベル接続、callout_mode: arrow_label）: `ImageDraw.line` で始点(ラベル側)→終点(UI要素側)を結び、終点に `ImageDraw.polygon` で三角矢じり（一辺12-15px）を追加。既存の強調テロップ実装と同じオーバーレイ座標系・被りQCゲート（overlap_qc.py）を通すこと。矢印の接続先は「対象が画面内で明確に特定できる場合」のみとし、大きい領域を漠然と指す用途には使わない。
  - いずれも「フルキャンバス透過PNGの多段overlayは激遅」の既存知見（SKILL.md）に従い、描画領域のみをbboxクロップしてoverlay座標指定すること。
  - callout_mode: noneを選ぶ場合（基準プリセット・KEITO型、AIエージェント実演・チャット欄の実演など）は上記いずれの図形描画も行わず、explanation_layer（caption / slide_card）とnarrationのみで説明を担う。

  【ワイプ合成のPiP方式（2サブパターン）】:
  - **常駐PiP型（ST1で実測）**: 画面共有全体に対し、右下(centerX 0.87, centerY 0.88, 幅18%×高さ22%目安)に顔出しワイプを終始オーバーレイし続ける。実装は既存のPiP合成（`overlay` フィルタでx/y固定・アルファなしの矩形窓）をそのまま流用可能。ズーム同様「オーバーレイはズームの後段」原則を守るが、本ジャンルはズーム不使用なのでベース合成として扱ってよい。
  - **交互切替型（ST2 2本で実測）**: 顔出し単体ショットと画面共有単体ショットが同時に存在せず、ハードカットで排他的に切り替わる。実装はPiP合成でなく、Palmierのトラック単位でのクリップ差し替え（`transitions.default: hard_cut`のみ）で十分。誤って両ソースを同時オーバーレイしないこと。
  - 呼び出し時にkousukeが「顔出しは常時」「顔出しは要所だけ」のどちらを指定していない場合は、常駐PiP型（ST1型）をデフォルト採用する。理由: kousuke本人の用途（PC画面を見せながら『こういう風に使ってます』と説明）はST1型の「操作しながら常に自分も映っている」構図に近いと判断（vault CLAUDE.mdの自律実行ルール＝brief未記載時は最小影響の選択肢を採用）。

  【手順番号・アジェンダ・プロンプトカードの実装】: 既存のカード型テロップ（business_talkの企画趣旨カード、educational_explainerのまとめカード等）の実装をそのまま流用可能。アジェンダカードは動画冒頭に1回、手順番号バッジは`chapter_tab`役割で章送りごとに差し替え、プロンプト全画面カードは`sidebar`役割で操作デモの合間に挿入する。

  【カット文法】: 待ち時間（入力中・処理中）はデフォルトで**カットしない**（ST1型を基準とする）。ただし1.5秒を超える完全な無音・無操作区間が続く場合は既存のデッドエア除去ロジック（-35dB/0.5s基準）を適用してよい。ST2・AI活用系のように顔出しとの切り替えでテンポを作る場合は、待ち時間そのものをカット対象にする。

  【色運用の注意（修正済み: 旧記載「4本中3本で赤」は実測ログと不一致だったため訂正）】: 基準プリセット既定値は「強調=黄」だが、callout_mode: precise_bbox/arrow_labelを使う場合の赤は既存4本のうちST1・ST2の2チャンネルで確認された配色であり、呼び出し時に色指定が無い場合のフォールバックとして維持する（黄色に寄せる場合は明示指定を要求する）。ただし「操作対象=赤がジャンル文法として支配的」という断定は撤回する――追加実測3本（音速パソコン教室=黄緑のclick_ripple、基準プリセット=紫のcursor_halo、KEITO=callout_mode:noneで色自体使わない）を含む実測7本中、赤で意図的に囲むチャンネルは2/7に過ぎない。したがって「赤」はこのジャンルの必須色ではなく、callout_mode: precise_bbox/arrow_labelを選んだ場合に限られたデフォルト色である。

  【呼び出し時の実務的判断軸（screen_tutorial_yaml改訂案.md 11-3節、Codex提案・PM Opus Decision採用）】: 「AIコーディングエージェントか伝統的PC手順か」という素材カテゴリだけでcallout_mode等を自動選択するのではなく、以下5項目を呼び出し時のチェックリストとして判断すること。
  1. **クリック必要性**: 視聴者が実際にクリック位置を再現する必要があるか。必要ならcallout_mode: precise_bboxまたはpointer_aid補助の検討価値が上がる。単に「何が起きたか」を見せるだけならcallout_mode: noneでも足りる。
  2. **発話内容の種別**: 発話がUI要素そのものを指しているか（「このボタンを押す」等）／画面状態の変化を説明しているか／概念・方針を説明しているか。UI要素を明示的に指す発話にはprecise_bbox、状態変化の説明にはcaption/slide_card、概念説明にはslide_card単体が適合しやすい。
  3. **可読性**: 最終書き出しサイズ（Brief指定の解像度・アスペクト比）で対象UI要素・テキストが判読可能か。判読困難ならframing_mode: static_inset（静的インセット拡大、動的ズームではない）を検討する。読める場合は追加しない（不要な複雑化を避ける）。
  4. **画面録画か実写か**: OS標準の画面録画ソフトによるキャプチャか、実写でモニターを撮影した素材か。実写の場合はカメラの微動・傾き・反射等の実測上の制約（本ジャンルのIMG_2290検証で確認済み）を踏まえ、bboxに余裕を持たせる・複数キーフレームで追従する等の対応を検討する。
  5. **座標データ取得可否**: クリック座標ログ・DOM上のbbox情報等が取得できるか。取得できない場合、pointer_aid（cursor_halo/click_ripple）の後編集での正確な再現コストは説明価値に見合わないことが多く、callout_mode側の対応（precise_bboxで目視計測したbboxを使う、またはnoneで説明層に任せる）を優先する。
