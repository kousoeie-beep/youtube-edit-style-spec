style_id: screen_tutorial
source: |
  実測サンプル: n=4。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: 実測（カット律/視覚リズム/LUFS/LRA/無音=既存4本ffmpeg実測、操作可視化手法=1秒刻み細密タイルで実装方式まで実測確認。追加3本はcallout_mode/pointer_aidの分布確認が主目的でffmpeg数値実測は未実施） / 推定（配色HEXは360p目視近似、BGM有無は聴取未実施のためLRA/LUFSパターンからの推定、n=1-2/系統のためサブパターン一般化はmedium）

  【暫定観測モデルである旨】n=7（実質的な独立チャンネル数は5〜6）は、旧来の単一ルール
  「操作対象=常に赤で囲む」を反証するには十分だが、下記emphasis_rolesの直交4軸モデルを
  確定スキーマとして断定する根拠にはならない。今後の追加実測で軸の区分・デフォルト値が
  更新されうる暫定観測モデルとして扱うこと（Codex Challenge・PM Opus Decision、
  screen_tutorial_yaml改訂案.md 11-2節）。

format:
  aspect: "16:9"    # 要クォート: 未クォートだとPyYAMLがsexagesimal(60進)表記と解釈し
    # 整数969になる（Codexコード品質レビュー Fix Loop 1周目 指摘1対応）
  typical_duration: 7-25分（操作手順を一通り説明する尺。ST1のような長尺連続講座は10-15分区切りで章立て運用が実務的）
  cuts_per_min: 0.17-13.58    # 実測7本の全観測レンジ（旧: 0.17-11.6、既存4本のみの値と
    # 追加実測後の値が矛盾していた記載を解消）。5クラスタに分岐（カット率と注釈方式
    # [callout_mode等]は別パラメータとして扱い、同一クラスタとして関連づけない）:
    # (a)純粋PC画面共有(ST1)=0.17-1.7 (b)AI解説・スライド主体/callout_mode:none系
    # (基準プリセット/KEITO)=0.94-2.31 (c)顔出し⇄画面共有切替型(ST2)=3.8-5.5
    # (d)イラスト解説ハイブリッド(ST2)=11.6 (e)タイトルカード・アウトドアインサート
    # 多用(音速パソコン教室)=13.58。(b)(e)は追加実測3本由来でffmpeg数値実測は未実施
    # （目視・波形概算）
  visual_rhythm_per_min: 1.7-26.6   # 実測（scene0.08）。ハードカットが少ない画面共有型でも、操作の度に発生する画面の書き換え（セル入力・メニュー展開・カーソル移動）が視覚リズムを作る
  camera: mixed              # 実測（PC画面フルスクリーン⇄顔出しワイプ⇄顔出しのみの3系統を素材が混在。スマホ実機俯瞰デモは終始固定）
  broll_usage: occasional    # 実測（AI活用系のみ指示プロンプト全画面カード挿入=occasional。ST1/ST2はB-roll無し=none。ジャンル全体としてはoccasional寄りで登録）

palette:
  background_hex: アプリ/OS実画面そのまま（Excel=緑リボン#217346系、Windows設定=青#0078D4系）   # 実測目視
  brand_hex: ["#FF0000/#E81123(callout_mode: precise_bbox/arrow_label 使用時のデフォルト色。円・矩形枠・矢印はこの用途で赤系統に統一されるが、あくまで呼び出し時未指定の場合のフォールバックであり、ジャンル全体で赤が必須という意味ではない。実測7本中『意図的に赤で囲む』チャンネルはST1・ST2の2チャンネルのみ)", "#FFFFFF(注釈カード背景・白地黒文字)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）。
    # 【注記】本ファイルのemphasis_rolesは「語:色」の単純対応でなく直交4軸モデル
    # （callout_mode/pointer_aid/framing_mode/explanation_layer）で構成されているため、
    # 下記の色対応はbrand_hexとemphasis_roles本文中のcallout_mode説明文から抽出した
    color_text: "#000000"      # 注釈カード（白地）の黒文字（brand_hex実測、arrow_labelモードの
      # 「白カード+黒文字+矢印」にも対応）
    color_bg: ["#FFFFFF", "#000000"]  # #FFFFFF=注釈カード白地（brand_hex実測）、
      # #000000=slide_cardの黒背景（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # ※この影は4辺の検算で**右下に12px・左上に3px**張り出す（2026-07-27 実測で再訂正）。
      #   当初 offset4+blur3=7px と素朴計算したが、Pillowのぼかしは半径以上に広がり
      #   実測は右下+11〜12px。さらに**ぼかしは左上にも広がる**ので3pxの項が要る。
      #   検算式にこの項が抜けていて常時過小評価していた（schema.md参照）。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: ["#FF0000", "#E81123"]  # callout_mode(precise_bbox/arrow_label)のデフォルト色、
      # および slide_cardの赤チェックマーク箇条書き（brand_hex実測。呼び出し時未指定の場合の
      # フォールバックであり、ジャンル全体の必須文法ではない旨に留意）
    color_stroke: null
    color_primary: null
    color_glow: null
  emphasis_roles:
    # 直交4軸の暫定観測モデル（screen_tutorial_yaml改訂案.md 11-1節、Codex Challenge・
    # PM Opus Decision確定分）。旧版の「サブパターンA〜D排他的分岐」「操作対象=赤」と
    # いう断定的記述は撤回した（4分類は互いに排他的でないことがCodex Challengeで
    # 指摘された。例: 基準プリセットはpointer_aid=cursor_halo同時にcallout_mode=noneであり、
    # A/D軸とB/C軸は独立している）。
    # 【4軸限定】本キーは callout_mode / pointer_aid / framing_mode / explanation_layer
    # の4キーのみで構成する（Codexコード品質レビュー Fix Loop 1周目 指摘2対応:
    # 「直交4軸」と謳いながら旧版はここに「トピックバッジ・章番号」を含む5キー構成に
    # なっており矛盾していた）。トピックバッジ・章番号は下記 auxiliary_annotations
    # （4軸モデルとは独立の既存要素）を参照すること。
    callout_mode: |
      none | precise_bbox | arrow_label ―― 意味的コールアウトの有無・方式。
      - none: 円・矩形枠・矢印を一切使わない。基準プリセット（カーソルハイライトのみ、意図的
        コールアウト0回）・KEITO（図形注釈が一切なし）で実測。
      - precise_bbox: UI要素1個〜数個・特定の1行など対象を絞ったピンポイント矩形枠
        （角丸8px・線幅4-5px・+8pxパディング、下記apply_notes参照）。ST1・ST2由来。
        パネル全体・画面領域全体を囲む用途には使わない――IMG_2290 Phase Aで「CART画面
        領域」「AIログパネル全体」を丸ごと囲んだ判断は、実測7本のいずれの文法にも
        一致しないミスマッチだったと結論づけられている（Phase Bで撤回・precise_bboxを
        パネル内の特定1行のみに絞る形へ修正済み）。単体では意味を持たず、必ず
        explanation_layer（caption等）or 発話とセットで使うこと。
      - arrow_label: 白カード+黒文字+矢印でUI要素と接続する図解式ラベル（既存telop_layers
        `caption` role）。ST1由来。
      デフォルト色は赤（呼び出し時未指定の場合のフォールバック。旧版の「操作対象=赤」と
      いう断定的記述は撤回。実測7本中『意図的に赤で囲む』チャンネルはST1・ST2の
      2チャンネルのみで、ジャンル全体の必須文法ではない）。
    pointer_aid: |
      native | cursor_halo | click_ripple ―― ポインター視認性補助の方式。**編集スタイル
      の構成要素としてではなく、収録時の補助機能の実測事実として記録するに留める。
      animation_dictionary_mappingには追加しない（本編集で模倣すべき演出リストではない）。**
      - native: 特別な補助なし。
      - cursor_halo: 常時カーソルに追従する視認性補助（紫等）。基準プリセットで実測。discrete
        な出現/消滅という概念がなく、UI要素を指し示す機能はない。
      - click_ripple: クリック座標に自動発火する極小エフェクト（黄緑等、~40px径、
        0.3-0.5秒で消滅）。音速パソコン教室で実測、録画ソフト（Camtasia等）の標準機能で
        ある可能性が高く、クリック座標ログなしでは後編集での正確な再現コストが説明価値に
        見合わない。
      クリック座標ログ等が取得できず「操作教育上クリック位置の可視化が必須」という明示
      要件がある場合のみ、別途オプションとして検討する。
    framing_mode: |
      full_source | app_window | static_inset ―― 画面の切り取り方（新規軸）。
      - full_source: フルウィンドウ表示（部分クロップ・ズームなし）。KEITO・基準プリセットで実測。
      - app_window: 対象アプリウィンドウ相当の切り取り。既存4本の画面共有はこれに近い。
      - static_inset: 判読困難な箇所を動的ズームでなく固定倍率で拡大表示するカット
        （IMG_2290 Phase Bで許可された手法。実際に必要かどうかは呼び出し時の目視確認で
        判断し、読める場合は追加しない）。既存のcrop_zoom/punch_in等の映像ズーム語彙とは
        別物（下記animation_dictionary_mapping「不使用」参照）。
    explanation_layer: |
      narration | caption | slide_card ―― 説明の担い手（新規軸）。既存telop_layersと
      対応付ける:
      - narration: 発話のみ。
      - caption: 白カード+矢印等の図解キャプション（既存telop_layers `caption` role）。
      - slide_card: 黒背景+赤チェックマーク箇条書き等のスライドカード（KEITOで実測）。
        既存telop_layersでは`title_bar`（アジェンダカード）・`sidebar`（プロンプト
        全画面カード）の運用パターンで代替可能。
  auxiliary_annotations:
    # emphasis_roles（直交4軸モデル）とは別階層の補助要素（Codexコード品質レビュー
    # Fix Loop 1周目 指摘2対応: 4軸モデルの説明と矛盾しないよう、emphasis_rolesから
    # 分離した）。4軸のいずれとも独立して付加・非付加を選べる既存要素であり、
    # 4軸モデルの一部ではない。
    トピックバッジ・章番号: 白地に色付き縁または色帯（ST2は紫/青系トピックバッジ、AI活用系は黒地白番号バッジ）。emphasis_rolesの4軸とは独立の既存要素（telop_layers `ticker`/`chapter_tab`）として維持する。

telop_layers:
  - role: title_bar          # 冒頭アジェンダ/目次カード: ST1で実測。動画開始直後、本編前に「これから解説する手順」を箇条書きカードで全提示（例:『新しいワークシートを作成しよう』『セルの入力をしよう』…『保存して終了しよう』の8項目リスト）。実測
    variant: variant_st1   # 【2026-07-27追加】**変種が未定義だったのが本ファイル最大の欠陥**。
      # 再実装検証で、別変種のroleどうしを同時表示として検算してしまい
      # 衝突18件のうち12件がこの誤りに由来していた。散文には
      # 「ST1=純粋画面共有 / ST2=顔出し⇄画面共有切替 / AI活用系=スマホ実機俯瞰」
      # と3変種が書かれているのに、フィールドに落ちていなかった。
      # 各roleのコメントにある「〇〇で実測」から変種を確定した
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit: fade   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.5, centerY: 0.5}
    size: {width: 1920, height: 1080}   # 【2026-07-27追加】**寸法フィールドが1つも無く、
      # 実装者が発明した結果このカードは画面の31.4%しか覆わず遮蔽が成立しなかった**。
      # 「全画面カード」と散文で言うだけでは全画面にならない。
      # opaque_fullscreen を名乗るならキャンバス全面であることを寸法で示す必要があり、
      # overlap_qc も被覆率98%未満の宣言を却下するようになった
    opaque_fullscreen: true     # 上記sizeで全画面が保証されるため宣言できる
    persistent: false
    style: カード
    z_order: 8   # 【2026-07-27 R3】全画面カードはコールアウトより前面。
      # 旧z=5では**真っ黒なプロンプトカードの上に中身が空の赤枠と赤丸**が浮いた（pixel 1.0）                  # 【2026-07-27 z_order遡及追加】全画面カードのため最前面。
      # SKILL.mdの「全画面不透明カードによる完全遮蔽」許容パターンに従う（下記
      # z_order_policy参照）。sidebar(プロンプトカード)とは**排他利用**
      # ※2026-07-27 R4訂正: 旧記述は「同格（どちらもz=5）」としていたが、
      #   現在は title_bar=8 / sidebar=9 で**同値ではない**
    entrance: fade
  - role: click_highlight_circle   # 【2026-07-27 role分離修正】旧: role: keyword。下記
    # 「操作対象ハイライト(矩形枠)」と同一role名を共有していたが、円と矩形枠は同じ
    # callout_mode:precise_bboxの下でも別々の描画物であり、連続操作の軌跡表示（複数円）と
    # 「今説明しているUI要素」の矩形囲みが同時に画面へ出うる（一方が排他的という記述が
    # 原本に無い）ため機能の異なる2装置が1roleに相乗りしている状態だった
    # （監査3横断論点・screen_tutorialは変種split外で発生した事例）。分離した。
    # 操作対象ハイライト(円、callout_mode: precise_bbox相当): クリック/選択した座標に小さな赤円を一瞬表示。連続操作では複数の円が軌跡のように残ることもある（ST1で実測・0.5-1s程度の短時間表示、単発）。callout_mode: noneを選ぶ場合（explanation_layer:narration/caption/slide_cardのみで説明を担う場合）はこのroleを使わない
    position_mode: anchored_to_target   # 【2026-07-27追加】**この座標は固定値ではない**。指し示す対象（UI要素・チャートの棒・画面内の物体）の
      # 位置に追従する。散文は「対象により可変」「固定位置ではない」と書いているのに
      # positionが固定値1つしか持たず、**散文と構造化フィールドが矛盾**していた。
      # 実害: documentary_cinematicのkeywordが固定値のまま棒グラフを潰し
      # 「労働」の棒を91.8%被覆した。下記positionは代表値であり、
      # 実装は対象の実座標から算出すること
    mutually_exclusive_with: click_highlight_box   # 【2026-07-27 R6追加】
      # 円と矩形は同じ「操作対象の強調」で、同一対象に両方は出さない
      # （z_order 5/6 を分けたのは重なった場合の保険）
    anchor_targets: [UIボタン, メニュー項目, セル参照ボックス, 表の1行, タスクバーアイコン]   # 【2026-07-27 R9追加】`anchored_to_target` と宣言しただけでは座標の入手先が無い。
      # ai_tool_avatar が無関係な窓枠と顔を赤枠で囲んだのと同じことが起きる
    anchor_source: 実装時に人が目視計測したbboxをBriefで指定（クリック座標ログは取得できない前提）   # 【2026-07-27 R9追加】
    anchor_padding_px: 8   # 【2026-07-27 R9追加】apply_notes の「+8pxパディング」をフィールド化
    line_width_px: 5   # 【2026-07-27 R9追加】
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    intentional_overlap_with: [caption]   # 【2026-07-27 R10】相互記載。**片側だけだと、この図形だけを読んだ実装者は
      # 「注釈カードが意図的に重なる」と知らないまま組む**。矢印はこの図形の直上（z 7 > 5/6）
    position: {centerX: variable, centerY: variable}   # クリック座標に追従。固定位置なし
    persistent: false
    style: プレーン
    z_order: 6   # 【2026-07-27 R3】circleをboxより前面に。旧は両方6で**同値**となり
      # 前面が**ffmpegの入力順で決まって**いた（yamlからは決まらない）                  # 【2026-07-27 修正・実測で完全埋没】旧z=1 では
      # 手順番号バッジ(chapter_tab, z=4)の下に入り、**bbox100%/実ピクセル100%で
      # 完全に埋没**した（目視では暗赤の影が透けるのみ）。
      # 操作対象を指す装置が他のテロップに隠れては用をなさないので、
      # 常駐テロップ群(3-4)より前面に置く。全画面カード(title_bar=8 / sidebar=9)より背面だが、
      # 全画面カード表示中は画面共有自体が隠れるので同時表示しない                  # 【2026-07-27 z_order遡及追加】画面共有コンテンツ内の
      # UI要素そのものに重畳する注釈。**旧z=1（全レイヤー中最背面）から
      # 2026-07-27に box=5 / circle=6 へ変更済み**。位置がvariableなため
      # 固定要素との衝突は原理的に保証できず、実装時に対象箇所が画面端の固定UI
      # （nameplate/lower_third/chapter_tab/ticker）と重ならないか個別確認すること
    entrance: pop
    exit: fade
  - role: click_highlight_box      # 【2026-07-27 role分離修正】旧: role: keyword。上記
    # click_highlight_circleと同一role名を共有していたため分離。位置が両方ともvariable
    # （実行時のクリック座標/UI要素座標に依存）のため、円と矩形枠が同時表示される場合の
    # pixel衝突は数値検算不可（判定保留）。実装時は対象UI要素の実座標をもとに個別確認すること。
    # 操作対象ハイライト(矩形枠、callout_mode: precise_bbox): セル参照ボックス・タスクバーアイコン・右クリックメニュー項目・パネル内の特定1行など「これから触れる/今説明しているUI要素1個〜数個」を赤の角丸矩形枠(太さ3-5px)で囲む。要素の説明が終わるまで数秒間保持。ST1・ST2由来。パネル全体・画面領域全体を囲む用途には使わない（IMG_2290 Phase Aのミスマッチ、上記palette.emphasis_roles.callout_mode参照）。callout_mode: noneのチャンネル（基準プリセット・KEITO実測）ではこのroleを使わない＝ジャンル全体で必須の装置ではない
    position_mode: anchored_to_target   # 【2026-07-27追加】**この座標は固定値ではない**。指し示す対象（UI要素・チャートの棒・画面内の物体）の
      # 位置に追従する。散文は「対象により可変」「固定位置ではない」と書いているのに
      # positionが固定値1つしか持たず、**散文と構造化フィールドが矛盾**していた。
      # 実害: documentary_cinematicのkeywordが固定値のまま棒グラフを潰し
      # 「労働」の棒を91.8%被覆した。下記positionは代表値であり、
      # 実装は対象の実座標から算出すること
    mutually_exclusive_with: click_highlight_circle   # 【2026-07-27 R6追加】
      # 円と矩形は同じ「操作対象の強調」で、同一対象に両方は出さない
      # （z_order 5/6 を分けたのは重なった場合の保険）
    anchor_targets: [UIボタン, メニュー項目, セル参照ボックス, 表の1行, タスクバーアイコン]   # 【2026-07-27 R9追加】`anchored_to_target` と宣言しただけでは座標の入手先が無い。
      # ai_tool_avatar が無関係な窓枠と顔を赤枠で囲んだのと同じことが起きる
    anchor_source: 実装時に人が目視計測したbboxをBriefで指定（クリック座標ログは取得できない前提）   # 【2026-07-27 R9追加】
    anchor_padding_px: 8   # 【2026-07-27 R9追加】apply_notes の「+8pxパディング」をフィールド化
    line_width_px: 5   # 【2026-07-27 R9追加】
    intentional_overlap_with: [caption]   # 【2026-07-27 R10】相互記載。**片側だけだと、この図形だけを読んだ実装者は
      # 「注釈カードが意図的に重なる」と知らないまま組む**。矢印はこの図形の直上（z 7 > 5/6）
    position: {centerX: variable, centerY: variable}   # 対象UI要素の実座標に追従
    persistent: false
    style: プレーン
    z_order: 5   # 【2026-07-27 R3・全面付け替え】                  # 【2026-07-27 修正・実測で完全埋没】旧z=1 では
      # 手順番号バッジ(chapter_tab, z=4)の下に入り、**bbox100%/実ピクセル100%で
      # 完全に埋没**した（目視では暗赤の影が透けるのみ）。
      # 操作対象を指す装置が他のテロップに隠れては用をなさないので、
      # 常駐テロップ群(3-4)より前面に置く。全画面カード(title_bar=8 / sidebar=9)より背面だが、
      # 全画面カード表示中は画面共有自体が隠れるので同時表示しない                  # 【2026-07-27 z_order遡及追加】上記赤円ハイライトと同じ
      # 「画面内容への直接注釈」層。同時に複数の矩形/円が出る場合もこの層内で完結する
    entrance: pop
    exit: pop
  - role: caption            # 注釈・補足キャプションカード: 「なぜそう呼ぶか」「なぜこの手順か」等の説明を白カード+黒文字で表示し、赤矢印でUI要素と接続する図解式ラベル（例:『補足：現在B4が選択されているので「セルB4」と呼びます』＋列ヘッダーB・行ヘッダー4それぞれへの赤矢印）。ST1で実測、初心者向け解説の固有要素
    variant: variant_st1   # 【2026-07-27追加】**変種が未定義だったのが本ファイル最大の欠陥**。
      # 再実装検証で、別変種のroleどうしを同時表示として検算してしまい
      # 衝突18件のうち12件がこの誤りに由来していた。散文には
      # 「ST1=純粋画面共有 / ST2=顔出し⇄画面共有切替 / AI活用系=スマホ実機俯瞰」
      # と3変種が書かれているのに、フィールドに落ちていなかった。
      # 各roleのコメントにある「〇〇で実測」から変種を確定した
    intentional_overlap_with: [click_highlight_box, click_highlight_circle]   # 【2026-07-27 R8追加】矢印はハイライト図形の**直上**に描く（z=7 > 5/6）。
      # 宣言が無いとQCが毎回FAILを出し本物の衝突が埋もれる
    font_px: 50   # 【2026-07-27 R9追加】caption_font の「44-56px」をフィールド化（規約⑩）
    max_chars: 18   # 【2026-07-27 R9追加】900px ÷ 50px = 18字
    padding_px: 28   # 【2026-07-27 R9追加】
    size: {width: 956, height: 202}   # 【2026-07-27 R10訂正】190 は**自分で書いた式「行高73×2 + padding28×2」が返さない値**（正しくは202）
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    char_width_px: 50   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    max_chars_total: 36   # 【2026-07-27 R10】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値。実測できたら上書きすること
      # 900 ÷ 50 = 18.00 → 1行18字、2行で36字
    position: {centerX: 0.3, centerY: 0.72}   # 【2026-07-27 衝突修正・導出値】
      # 旧0.85は2行になると下端が lower_third(0.80) の描画帯へ入り
      # **pixel_collision 0.999〜1.000** で潰した（ai_biz_pitch/immersiveと同型）。
      # ※本roleは variant_st1、lower_third は variant_st2 で**本来同時表示されない**。
      #   変種未定義のまま検証したため衝突として出た。現在は実害ではないが
      #   座標に余裕が無いのは事実なので上げておく
    max_width_px: 900            # 【2026-07-27追加】折返し幅が無く2行化を制御できなかった
    max_lines: 2         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 実測で、幅だけ縛ると**行数が増えて事態が悪化する**ことが4スタイルで確認された
      # （japan_vlog 3行31px→4行86px侵入 / wipe captionのPiP重なり15.9%→31.0% /
      #  investigativeの見出しが3行化してkeywordを100%被覆）。
      # 3行以上必要な発話は**複数のテロップイベントに分割する**
    persistent: false
    style: プレーン
    z_order: 7   # 【2026-07-27 R3】注釈カードはコールアウトより前面。
      # 旧z=2では赤枠の左辺がカードを縦に貫き「「」を分断し、
      # yaml L234の「矢印はハイライトの上」という**明文要件の真逆**だった                  # 【2026-07-27 z_order遡及追加】矢印で操作対象ハイライト
      # (click_highlight_box=5 / click_highlight_circle=6)と接続する装置のため、それより前面(7)に置く（矢印・カード文字が
      # ハイライト図形の上に描画される必要がある）。nameplate(3、ST1の顔出し
      # ワイプ,centerX0.87)とはX座標が離れており(centerX0.3)衝突なし
    entrance: fade
    exit: fade
  - role: chapter_tab        # 手順番号バッジ(常駐): 現在のステップ番号+説明文を画面左上に常駐表示し、ステップが進むたびに差し替え（例:『1.デイリーニュース』→『2.同時に起動』…。
    # **2026-07-27 訂正**: 旧例文『1.デイリーニュースを受け取る』は**15字で自分の max_chars 14 に
    # 違反していた**。例文が制約を破っていると実装者は制約を軽く見る）。AI活用系で実測、チャプター兼進捗表示を兼ねる
    variant: variant_ai_demo   # 【2026-07-27追加】**変種が未定義だったのが本ファイル最大の欠陥**。
      # 再実装検証で、別変種のroleどうしを同時表示として検算してしまい
      # 衝突18件のうち12件がこの誤りに由来していた。散文には
      # 「ST1=純粋画面共有 / ST2=顔出し⇄画面共有切替 / AI活用系=スマホ実機俯瞰」
      # と3変種が書かれているのに、フィールドに落ちていなかった。
      # 各roleのコメントにある「〇〇で実測」から変種を確定した
    overflow_policy: split_event   # 【2026-07-27 R6 一括掃引】`max_lines: 1` だけでは折返しは止まらない。
      # 折返し器は max_chars で改行するので**結果の各行は制約を満たしたまま2行になる**
      # （ai_tool_avatarで実測。**documentary_immersive が退行したという私の当初の報告は誤り**で、
      #  R6のFAILは検証者が意図的に作った違反対照窓＝14字「max_lines:1 違反の対照」だった。
      #  掃引そのものは正しい——10ファイルが本当にこのフィールドを欠いていた）。
      # 超過は折り返さず**複数のテロップイベントへ分割する**
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    char_width_px: 45   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.20, centerY: 0.06}   # 【2026-07-27 R3・検算済みの提案を採用】
      # 旧0.18/0.05は **pad_x=24 という未記載の条件下で余裕3.6pxしかなかった**。
      # 0.20/0.06 + 下記sizeで4辺とも余裕を確保する
    size: {width: 694, height: 90}   # 【2026-07-27 R3追加】上記検算の前提
    # 【2026-07-27 注意・未解決】**現行の centerX0.20 / centerY0.06**（旧0.18/0.05）は
    # なお**画面録画のメニューバー帯
    # そのもの**で、素材側のUIと重なる。yamlに回避機構が無い。
    # 素材のメニューバー高さは可変なので座標では解けず、**素材側で上部を
    # クロップするか、バッジを下げるか**を実装時に選ぶ必要がある
    persistent: true
    style: 帯
    z_order: 4                  # 【2026-07-27 z_order遡及追加】常駐要素で前面寄り。
      # AI活用系固有のロールでticker(4、ST2固有)とは別チャンネルの装置のため
      # 同時表示は想定されない（下記z_order_policy参照）
    font_px_max: 45              # 【2026-07-27追加・実測】caption_font は40-50pxを許容するが、
      # **46-50pxを選ぶと左に2.5〜31.5pxはみ出す**（max_chars14でも）。
      # 45px以下を選んだ実装者にだけ効く状態だったので上限を明記する
    max_width_px: 630            # 【2026-07-27追加】centerX0.18=345.6pxに対し
      # 半幅315pxで左端30.6px。画面内に収まる上限
    max_lines: 1         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 見出し/バッジ系は1行が前提（2行になると帯の高さが倍になり近接要素を潰す）。
      # 収まらない文言は行を増やすのではなく**文言を短くする**こと
    max_chars: 14                # 【2026-07-27 修正】旧22は**centerX0.18と両立しない**。
      # 全角22字=990pxで帯の左端が**−173px**、実測20字で
      # **手順番号「2.ア」が画面外へ消えた**（目視確認）。
      # centerY側は完全に無罪で、縦だけ見ていれば素通りしていた
      # ＝centerXのはみ出し検算を規約に入れた直接のきっかけ
    entrance: pop
  - role: sidebar            # 指示プロンプト/コマンド全画面カード: 実際に入力したプロンプト文・コマンド文をそのまま全画面白カードで提示してから操作デモに戻る（例:「私の趣味は漫画を読むことです。毎朝7時に、その日の新刊発売情報を教えて下さい。」）。AI活用系で実測、コピペ可能な形での手順保存に相当
    variant: variant_ai_demo   # 【2026-07-27追加】**変種が未定義だったのが本ファイル最大の欠陥**。
      # 再実装検証で、別変種のroleどうしを同時表示として検算してしまい
      # 衝突18件のうち12件がこの誤りに由来していた。散文には
      # 「ST1=純粋画面共有 / ST2=顔出し⇄画面共有切替 / AI活用系=スマホ実機俯瞰」
      # と3変種が書かれているのに、フィールドに落ちていなかった。
      # 各roleのコメントにある「〇〇で実測」から変種を確定した
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.5, centerY: 0.5}
    size: {width: 1920, height: 1080}   # 【2026-07-27追加】**寸法フィールドが1つも無く、
      # 実装者が発明した結果このカードは画面の23.5%しか覆わず遮蔽が成立しなかった**。
      # 「全画面カード」と散文で言うだけでは全画面にならない。
      # opaque_fullscreen を名乗るならキャンバス全面であることを寸法で示す必要があり、
      # overlap_qc も被覆率98%未満の宣言を却下するようになった
    opaque_fullscreen: true     # 上記sizeで全画面が保証されるため宣言できる
    persistent: false
    style: カード
    z_order: 9   # 【2026-07-27 R3】全画面カードのため最前面。title_bar(8)との同値も解消
      # title_bar(アジェンダカード)とは**排他利用**（一方は冒頭のみ、他方は
      # 操作デモの合間に随時挿入）。※旧記述の「どちらもz=5で同格」は撤回済み
    entrance: fade
    exit: fade
  - role: nameplate          # 顔出しワイプ(常駐PiP型): 画面共有中も常時右下に小さく顔を表示し続ける。ST1で実測（PC画面フルスクリーンに対しワイプは終始オーバーレイ、位置固定）
    variant: variant_st1   # 【2026-07-27追加】**変種が未定義だったのが本ファイル最大の欠陥**。
      # 再実装検証で、別変種のroleどうしを同時表示として検算してしまい
      # 衝突18件のうち12件がこの誤りに由来していた。散文には
      # 「ST1=純粋画面共有 / ST2=顔出し⇄画面共有切替 / AI活用系=スマホ実機俯瞰」
      # と3変種が書かれているのに、フィールドに落ちていなかった。
      # 各roleのコメントにある「〇〇で実測」から変種を確定した
    size: {width: 346, height: 238}   # 【2026-07-27 R9追加】コメントにあった実測bbox（x=1497-1843 / y=831-1069）をフィールド化。
      # **layer_kind: video でQCの検査外なので、size が無いと寸法の誤りを
      # 機械で捕まえる手段が一つも無い**
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    color_shadow: "none"   # 【2026-07-27 R11追加】`layer_kind: video` の丸窓PiPに袋文字用のドロップシャドウは無い。
