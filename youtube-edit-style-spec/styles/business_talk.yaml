z_order_policy: |
  志願者ステータスカード(1)を最背面の常駐要素とし、通常の下部発話字幕dialogue_caption(2)・
  虎ネームプレート(3)・質問チャプターテロップ(4・対談亜種限定)をその上に重ねる。ショック
  テロップ(5)は決定的発言を示す最重要強調のためさらに前面。状況説明カード(6)と企画趣旨
  カード(6)は全画面を占有するカードのため他レイヤーを完全に覆う最前面とし、表示中は他要素と
  同時表示しない設計にすること（実測範囲でも全画面カードと他テロップの同時表示は確認されて
  いない）。
  ※本ポリシーはz_order欄が無かった旧テンプレート版からの遡及追加（2026-07-26）であり、
  数値は各roleの視覚的な役割から論理的に割り当てた推定値。実測によるレイヤー同時表示の
  検証は未実施。
  ※【2026-07-27 dialogue_caption新設に伴う追記】dialogue_caption・nameplate・sidebarの
  3者はいずれも画面下部の同じ帯域に位置しうるが、実装検証（business_talk.md §2）で
  sidebar左端1328px・nameplate右端664pxに対しdialogue_caption安全幅628px/484pxを適用した
  結果、overlap_qc実測でoverlaps=[]（element_count=14・PASS）を確認済み。**z_order番号の
  上下関係よりも、この安全幅の遵守（628px/484pxを超えて折返さない）の方が衝突回避の実質的な
  担保である**点に注意（3者は水平方向の帯域分離で衝突を避ける設計であり、z_order自体は
  「どれが前面か」を定義するだけで衝突防止の主機構ではない）。

caption_font: |
  【2026-07-27 R5・優先順位】**`font_px` を持つ role には本セクションを適用しない**。
  現在 `font_px` を持つのは sidebar(60) / nameplate(name 40, sub 28) / question_tab(70)。
  以下の記述はそれ以外の role の既定値として読むこと。
  ※この3roleに本セクションの「70-80px相当」を適用すると、
    nameplate では pixel_collision 0.9824 の衝突が復活する（R2〜R4で3周再現した数値）。
  未計測（冒頭12分セグメント、360p相当の解像度制約）。【2026-07-26 遡及追加】採用すべき
  デフォルト: ショックテロップ・状況説明カードともに基準プリセット既定値（フォント92／黒フチ
  12px／不透明度100%）を採用可能。ネームプレート・志願者ステータス・質問チャプター
  テロップは本文よりひと回り小さめ（70-80px相当、未計測の目安）を推奨。

  【2026-07-27 dialogue_caption新設に伴う追記・最重要】通常の下部発話字幕（dialogue_caption）
  は**基準プリセット既定値の92pxではなく、実案件`DJI_0029_biztalk`実測のFONT_SIZE=60pxを採用する**。
  実装検証（business_talk.md §2「フォントサイズ依存性」）により、92pxを採用すると同じ発話文で
  行数が大幅に増える（60pxなら2-3行のところ92pxでは4-5行になる例を確認）ことが判明しており、
  下部レイアウトの見栄えが悪化する。628px/484pxという安全幅はこの60px前提で導出された数値
  であり、フォントサイズを変更する場合は行数増加を許容できるレイアウト再検証が必要。
  黒フチ・不透明度は他roleと同じ基準（フチ幅は座布団併用のため細め、不透明度100%）を暫定
  デフォルトとする（座布団自体の不透明度・角丸は未計測、実案件のBAND_PAD_X=40px・
  ストローク3pxのみ確認済み）。

animation_dictionary_mapping:
  ショックテロップ・志願者カード: in.pop（瞬時、バウンス無し）        # 実測
  企画趣旨カード・状況説明カード: in.fade / static hold              # 実測寄り
  ネームプレート: in.fade → 静止 → out.fade                          # 実測寄り
  リアクションカット: 高頻度の切り返し（志願者⇄虎⇄反応クローズ）が体感テンポの主成分   # 実測

transitions:
  default: hard_cut          # 実測（ディゾルブ・ワイプ不使用。カット数が多くリズムを作る）
  accent: []                 # 実測範囲では装飾トランジション無し

audio:
  bgm: none                  # 実測（12分セグメント中BGM無し。緊迫した会話音声のみ）
  voice_lufs_target: -15.4   # 実測（ebur128 Integrated）
  lra: 5.7                   # 実測（会話標準クラスタに合致、抑揚を大きく残さない）
  se_style: none              # 未検出（本セグメント範囲）
  ducking: false

pacing:
  gap_keep_sec: 0.3-0.6      # 実測寄り（silencedetect -35dB/0.5s: 19回/12分。間はほぼ残さず次のリアクションへ繋ぐ）
  filler_policy: keep_character   # 志願者の動揺・虎の口調をそのまま活かす
  hook: title_first          # 実測（開始直後に企画趣旨カードで文脈提示→即プレゼン開始）
  structure: 企画趣旨カード→プレゼン→質疑応答(高頻度カット)→判定→退出/合格の急展開   # 実測

packaging:
  thumbnail_style: 未取得
  chapter_style: 志願者ステータスカードの氏名差し替えが章送り相当（1志願者=1章）   # 実測寄り
  endcard: 未確認（12分セグメント内では検出なし。FULL版では合格/否決の結果表示あり得る）

apply_notes: |
  Palmierパイプラインでの適用:
  - カット律11.5/分は高め。素材の間を詰めすぎず、リアクションカット（志願者→虎→反応）の切り返しリズムを再現するのが優先。
  - 志願者ステータスの常駐サイドバー（氏名/年齢/希望額）はのCTAバナーと役割が近い＝帯レイヤーの流用可能（persistent, 位置のみ右下に変更）。
  - ショックテロップ（赤太字オーバーレイ）は基準プリセット式の「強調＝黄」ではなく「警告・対立＝赤」に寄せる。パンチライン規則（1トピック1回・同時刻の通常字幕と復唱禁止）はSKILL.mdの既存ルールをそのまま適用。
  - 【対談・インタビュー亜種への切替】ゲスト単独インタビュー寄りの落ち着いた対談（ReHacQ的、または既存スキーマのtalk_podcast_business_taidan）を求められた場合は、cuts_per_minを0.8-6.9に下げ、名板をfade in→静止→fade outの控えめ運用に、質問チャプターテロップ（左上白箱疑問形見出し＝telop_layersの`question_tab`ロール）を追加する。両亜種は同じジャンルの中の「緊迫型」と「対話型」として使い分ける。
  - 【2026-07-26 スキーマ修正】上記の質問チャプターテロップに対応するtelop_layers roleが存在しなかった欠落を解消し、`question_tab`を新規追加した（z_order、本追記時点では3。2026-07-27のdialogue_caption追加により4へ繰り上げ済み）。亜種選択時のみ使用し、緊迫型（メイン実測対象）では出現しない。

  【2026-07-27 最優先修正: dialogue_caption roleの新設】
  実装者レポート（style_verify_20260725/reports/business_talk.md）により、**通常の下部発話字幕
  （会話テロップ本体）に対応するtelop_layers roleがこれまで一つも存在しなかった**ことが判明した。
  既存の`caption`roleは実際には「状況説明カード」（全画面の実況カード）であり別物で、
  SKILL.mdが定義する「字幕安全幅628px/484px」はこの発話字幕のためのものだったにもかかわらず、
  構造化スキーマ上どのroleにも対応していなかった。SKILL.mdの「変種固有の装置には必ず対応する
  roleを作る」という既存ルール（項目7）が、business_talkの最も基本的な要素にまで及んでいた
  欠落であり、`dialogue_caption`role（z_order 2）を新設して解消した。

  併せて、実装検証で判明した以下の実測値をyamlに反映した:
  - **フォントサイズ**: 通常字幕は60px（基準プリセット既定値92pxではない。実案件`DJI_0029_biztalk`
    実測。92px採用時は行数が大幅に増える弊害を実装検証で確認済み）
  - **安全幅628px/484pxの出典・導出式**: `DJI_0029_biztalk/work/fix_biztalk_captions.py`
    （SIDEBAR_LEFT=1328・NAMEPLATE_RIGHT=664・BAND_PAD_X=40からの計算式）
  - **実測マージン**: サイドバー+ネームプレート同時表示時で15pxしかない（「安全」ではあるが
    余裕は極めて薄い設計であることを実装検証で確認済み）
  - **座布団仕様**: 放送風の半透明黒座布団、BAND_PAD_X=40px・BOTTOM_MARGIN=120px・ストローク3px

  なお、以下は実装検証でも未解決・未検証のまま残っている（正直に明記）:
  - cuts_per_min 11.5/分は素材を実際にカット編集していないため検証不能（検証手法全体の限界）
  - サイドバーの志願者交代（hard_cut差し替え）挙動は未検証（30秒クリップでは志願者交代シーンを
    含められなかったため）
  - z_order_policyの「時間排他」と「重ね順排他」のどちらを実装者が意図すべきかは依然未確定
    （今回の実装検証では時間分離を採用したが、これは実装者判断であり正本ではない）
  - voice_lufs_target(-15.4)とlra(5.7)は**この素材では同時達成不可能**（single-pass dynamic
    loudnormの構造的限界。SKILL.md「LUFSとLRAは同時に満たせない」節を参照。本修正の対象外
    のため数値自体は変更していない）
