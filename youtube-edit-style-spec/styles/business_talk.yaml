    max_chars: 9
    max_width_px: 636            # 【2026-07-27 R4 再導出】旧660は外形。折返し幅636+padding24=660
      # 【旧記述】幅の上限が無く、実測で
      # **左に106px切断され「なぜ」の「な」が消失**した。
      # centerX0.18=345.6pxなので、左端を画面内(16px余白)に保つ上限は幅659px
    max_lines: 2         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
