      # 収まらない文言は行を増やすのではなく**文言を短くする**こと
    persistent: false
    style: プレーン（白箱+疑問形見出し）
    z_order: 4                 # 【2026-07-27 dialogue_caption追加に伴い3→4へ繰り上げ】
    entrance: fade              # 未計測（推定。対話型亜種は緊迫型よりトランジションが
      # 控えめと記述されているためfadeを採用、fade_sec未計測）
    exit: fade                   # 未計測（推定）
  - role: keyword            # ショックテロップ: 決定的発言を赤太字で映像に直接重ねる（「全員垢BANされます」等）。実測
    position: {centerX: 0.5, centerY: 0.15}
