style_id: business_talk
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: 実測（カット律/LUFS/LRA/無音=ffmpeg実測・冒頭12分） / 推定（配色HEXは360p目視近似、n=1のためジャンル一般化はmedium）

format:
  aspect: 16:9
  typical_duration: 45-55分（FULL版）。ハイライト抜粋なら3-15分
  cuts_per_min: 11.5              # 実測（scene0.3: 138カット/12分。志願者⇄虎の切り返し+リアクションカットが高密度）
  camera: mixed                    # 実測（スタジオ固定2ショット+虎個別クローズの往復）
  broll_usage: none                 # 実測（12分セグメント内は無し。長尺本編では資料スライド挿入もあり得るが本セグメントでは未検出）

palette:
  background_hex: "#E8E4DE"        # 推定（スタジオ壁・カーテン背景、彩度低いオフィス色）
  brand_hex: ["#111111(黒背景タイトルカード)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#FFFFFF"      # 文脈説明カード/志願者ステータスの白文字
      # （emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_bg: "#111111"        # 黒背景タイトルカード/文脈説明カード黒背景/志願者ステータス黒帯（brand_hex実測）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: "#CC1414"    # ショック・パンチライン赤太字（emphasis_rolesにHEX記載あり）
    color_stroke: "#000000"    # 【2026-07-27】nullから確定値へ。caption_fontが
      # 「基準プリセット既定値（フォント92／黒フチ12px）」と明記しており黒で確定していたのに、
      # color_rolesがnullのままで実装者が散文を読む羽目になっていた
    color_primary: null
    color_glow: null
  emphasis_roles:
    ショック・パンチライン: "#CC1414（赤太字、映像に直接オーバーレイ）"
    文脈説明カード: 黒背景+白文字（企画趣旨・志願条件の説明）
    志願者ステータス: 白文字黒帯（氏名・年齢・希望額/残額）

telop_layers:
  - role: sidebar            # 志願者ステータスカード: 氏名+年齢+希望額/残額を右下に常駐。セグメント（志願者）が変わるまで維持。実測
    position: {centerX: 0.82, centerY: 0.83}   # 【2026-07-27 見切れ修正】
      # 0.90 では3行時に**下へ60px切断**され、全フレームで「残額 1000万円」が欠けた（実測）。
      # 下記sizeの高さ**296px**で 0.83=896.4px、**実測下端1044px＋影11px＝1056px**（画面内）
      # 【2026-07-27 R8訂正】旧記述「高さ260px／下端1026.4＋影12＝1038.4」は
      # size が 260→312→296 と3度変わったのに**一度も追随していなかった**（実測bboxと一致）
    font_px: 60                  # 【2026-07-27追加・3すくみの解消】このroleに
      # caption_font の「70-80px相当」を**適用してはいけない**。70pxだと幅522px >
      # max_width_px **455** で成立せず、高さも3行**341px**（lh(70)×3+32）で箱に入らない。
      # 【2026-07-27 R8訂正】旧記述の「493」「357px」はどちらも旧値
      # **60pxなら幅・高さとも成立する**（実測で切断が消えることを確認済み）。
      # ＝caption_font と max_width_px の矛盾は、このroleについては60pxで解消する
    size: {width: 487, height: 296}   # 【2026-07-27 R4 再導出】折返し幅455+padding32=487。
      # 高さは font60×3行(264) + padding32 = 296。
      # 【旧記述】旧260は**3行が入らなかった**
      # （60pxでの3行必要高は**296px**＝lh(60)=88×3+32、70pxなら**341px**）。
      # 【2026-07-27 R8訂正】旧記述の「312px／357px」は実測と食い違っていた。
      # 実測で文字が箱を73pxはみ出し
      # 「残額 1000万円」がカード外の生映像に浮いていた
    padding_px: 16               # 【2026-07-27 R4追加】未定義で実装者が発明していた
    max_width_px: 455            # 【2026-07-27 R4 再導出】旧493は**外形の値を折返し幅として
      # 書いていた**（規約①違反）。padding16×2と影3pxを入れると左端1324.9pxで
      # **SIDEBAR_LEFT=1328 に3.1px足りない**＝628/484の唯一の根拠が実描画で成立していなかった。
      # 折返し幅455 + padding32 = 外形487 → 左端(影込)1327.9px で**1328が初めて成立する**。
      # 【旧記述】dialogue_caption の
      # 安全幅628pxは **SIDEBAR_LEFT=1328** を定数として使うが、その1328は
      # 「本roleの左端が1328pxにある」＝ centerX0.82(1574.4px) から半幅246.4px
      # ＝**幅493px以下**という前提に等しい。この前提がどこにも宣言されていなかった。
      # 本roleがこれより広がると、字幕側が正しく484/628を守っても衝突する
    max_lines: 3         # 【2026-07-27 再修正・3すくみの解消】旧2では
      # **「残額 1000万円」が行ごと消滅**した（守ると情報が落ちる＝悪化）。
      # 散文が「氏名+年齢+希望額/残額」の4項目を要求し、sizeのコメントも
      # 「3行が入る想定」と書いていたのに max_lines だけ2で、**3つが矛盾**していた。
      # 3行＋font 60px＋**size高さ296px**で三者を一致させる（2026-07-27 R5訂正。312はR4の値）。
      # 実測で、幅だけ縛ると**行数が増えて事態が悪化する**ことが4スタイルで確認された
      # （japan_vlog 3行31px→4行86px侵入 / wipe captionのPiP重なり15.9%→31.0% /
      #  investigativeの見出しが3行化してkeywordを100%被覆）。
      # 3行以上必要な発話は**複数のテロップイベントに分割する**
    persistent: true
    style: カード
    z_order: 1                # 【2026-07-26 遡及追加】常駐の背景基準面
    entrance: pop
    exit: "N/A（常駐のため、志願者交代時にhard_cutで差し替わると推定。未計測）"   # 【2026-07-26 遡及追加】
  - role: dialogue_caption   # 【2026-07-27 新設・最優先修正】通常の下部発話字幕（会話テロップ本体）。
    # 旧yamlにはこのroleが存在せず、実装者レポート（style_verify_20260725/reports/business_talk.md
    # §6-1）が「SKILL.mdの字幕安全幅628px/484pxはこの装置のためのものなのに、構造化スキーマ上
    # どのroleも対応していない」と指摘した最重要欠落。既存の`caption`roleは実際には「状況説明カード」
    # （全画面ステートカード）であり別物なので、混同を避けるため新規role名で分離する。
    # 出典: 過去の実案件 `DJI_0029_biztalk/work/fix_biztalk_captions.py`（2026-07-12〜13の本番
    # プロジェクト、overlap_qc.pyでの被り検出→修正のフルサイクルを経験済み）のジオメトリを正本とする。
    position: {centerX: 0.5, centerY: 0.85}   # 実案件のBOTTOM_MARGIN=120px（画面下端1080pxから120px、
      # すなわち帯の下端がy=960pxに来る設計）から算出した1行想定の代表値。centerYの数値そのものを
      # 固定値として扱わず、**実装は「下端マージン120px固定」を優先し、行数（1〜3行）に応じてcenterYを
      # 上へ繰り上げる**こと（SKILL.md「positionの解釈規約」#5の下端優先原則に準拠。実案件レポートでは
      # 3行折返しのケースを確認済み＝position: {centerX, centerY}は代表値にすぎない）。
    persistent: false
    style: 帯（放送風の半透明黒座布団。BAND_PAD_X=40px・ストローク3px。実案件実測）
    max_chars: "10（628px時）/ 8（484px時）"   # 【2026-07-27 R4追加】動的幅に対応する上限。
      # 実測で32字が4行化し max_lines:3 に違反した（実効centerY 0.715へずれる）
    overflow_policy: split_event   # 【2026-07-27 R4追加】超過分は折り返さずイベント分割する
    max_lines: 3                 # 【2026-07-27追加】行数上限が無く、実測で**5行・高さ477px**まで
      # 伸びた。その結果 centerY:0.85 は§5の繰り上げで0.750/0.669へ動き、
      # **一度も使われない値**になっていた
    width_eval_timing: interval_union   # 【2026-07-27追加】**幅の評価時点が未定義だった**。
      # 字幕区間の途中でネームプレートが出入りする場合、素直に「開始時刻で判定」して628を採ると
      # **42×131px重畳**する。**区間が少しでも交差するなら狭い方(484)を採る**（保守側）と決める
    max_width_px: "動的628px（サイドバーのみ同時表示時）/ 484px（サイドバー+ネームプレート同時表示時）。
      導出式（`fix_biztalk_captions.py`）: SIDEBAR_LEFT=1328, NAMEPLATE_RIGHT=664, BAND_PAD_X=40として
      SAFE_W_NORMAL=2*(1328-960-40-4)-20=628、SAFE_W_NAMEPLATE=2*(960-664-40-4)-20=484。
      実装検証（business_talk.md §2）ではサイドバー+ネームプレート同時表示時の実測マージンが
      **15pxしかない**ことを確認済み＝「安全」ではあるが余裕は極めて薄い設計。overlap_qc実行で
      element_count=14・overlaps=[]（PASS）を確認したうえでの実測値であり、机上の推定値ではない"
    z_order: 2                 # 【2026-07-27 新設】サイドバー(1)より前面、ネームプレート(3)より背面
      # （下記z_order_policy参照。既存roleのz_order番号は本追加に伴い1つずつ繰り上げた）
    entrance: hard_cut          # 実案件実測（カード単位でハードカット切替。字幕焼き込み系の標準挙動）
    exit: hard_cut               # 実案件実測（同上）
  - role: nameplate          # 虎(審査員)ネームプレート: 発言開始時に氏名+社名+役職を表示、短時間で消灯。実測
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.245, centerY: 0.85}   # 【2026-07-27 R8】0.25では実測右端665pxで、志願者ステータス帯の左限界664pxを**1px超過**。
      # 3案（幅344 / 安全幅482 / centerX 0.24）のうち**最小影響の centerX を動かす案**を採る。
      # 0.245 = 470.4px、半幅173 → 右端643.4px（余裕20.6px）・左端297.4px
    # 【2026-07-27 R5・優先順位の明記】このroleは `font_px_*` を持つので、
    # **caption_font の「70-80px相当」より下記の値が優先する**（schema.md の規約）。
    # 散文に従って70pxで組むと pixel_collision 0.9824＝R2〜R4と小数3桁まで同値を再現する。
    # sidebar にだけ「適用禁止」と書いてあり本roleに無かったのは**規約ではなく偶然**だった。
    # 【境界解の警告】下記の導出は**すべて境界解**（右端は影12px込みで665＝NAMEPLATE_RIGHT 664
    # を1px超過、高さ175=175）。**フォントか丸めを1px動かすと同時に破れる**。
    # R4の導出が実測11pxの影で計算したためのずれ。実素材では余裕を取り直すこと。
    font_px_name: 40             # 【2026-07-27 R4追加】氏名。**sidebarで使った font_px 明示の
      # 解法を、同型のこのroleに適用していなかった**（3周にわたり同一数値
      # 108×199px / pixel 0.98277 を再現し続けた）
    font_px_sub: 28              # 社名・役職
    padding_px: 16
    max_width_px: 314            # 【2026-07-27 R4 再導出】旧368は**外形**で、
      # 折返し幅として読むと padding を足して右端676px＝NAMEPLATE_RIGHT 664 を12px超過した。
      # 折返し幅314 + padding32 = 外形346 → 計算上の右端661。
      # **【2026-07-27 R8訂正】実測の右端は665で NAMEPLATE_RIGHT 664 を1px超過する**。
      # 664に収める案（実測導出）: (a) width 344 / 折返し 312、
      # (b) SAFE_W_NAMEPLATE を482へ、(c) centerX 0.24 にして余裕19px。
      # **現状は1px超過のまま**。実素材で採否を決めること
    max_lines: 3                 # 氏名/社名/役職の3行
    size: {width: 346, height: 175}   # font40+28×2 + padding32
      # 【旧記述】dialogue_caption の
      # 安全幅484pxは **NAMEPLATE_RIGHT=664** を定数として使うが、その664は
      # centerX0.25(480px) から半幅184px＝**幅368px以下**という前提に等しい。
      # 再実装検証では、yamlの文言（フォント70-80px・氏名+社名+役職）どおりに組むと
      # 右端が**781px＝前提を117px超過**し、484pxに縛った字幕と
      # **104×142px 実重畳（pixel_collision 0.9993）**した。
      # 逆に664に収まるようフォントを逆算すると **44px**（2026-07-27 実測で訂正。
      # 旧記述の「21px」は**再現しなかった**＝名札の文言長に依存する値であって定数ではない）。
      # いずれにせよ caption_font の「70-80px相当」とは両立しない。
      # **同じ矛盾が下記 sidebar にもある**（70pxで幅522px > max_width_px 493、
      # 493を守るには60px）。両方とも実素材で実寸を測り、
      # caption_font 側か max_width_px 側かどちらを改めるかを決める必要がある。
      # ＝**この前提と caption_font の「70-80px相当」は両立しない**。
      # 【2026-07-27 R8訂正】**この矛盾は規約⑩（role の font_px は caption_font より優先）で
      # 解決済み**。旧記述の「未解決の矛盾として明記する」は撤回する。
      # ただし**散文に従って70pxで組むと今も pixel_collision 0.9824494675070636
      # ＝3周連続で16桁一致の衝突が再現する**。規約が変えたのは「70pxを選ばない」ことであって
      # 「70pxが安全になった」ことではない
    # 【2026-07-27 R4 重複キーの解消】ここにあった `max_lines: 1` は、
    # 上で設定した `max_lines: 3`（氏名/社名/役職の3行）を後勝ちで無効化していた。
    # lintが即検出。**私が同じ事故を作るのは6度目**。
    # 旧記述の「見出し系は1行が前提」は、氏名+社名+役職の3行構成を要求する
    # 本roleの散文と矛盾していたので3行を採る
    persistent: false
    style: プレーン
    z_order: 3                # 【2026-07-27 dialogue_caption追加に伴い2→3へ繰り上げ】
    entrance: fade
    exit: fade
  - role: question_tab       # 【2026-07-26 スキーマ修正で追加】対談・インタビュー亜種専用:
    # 質問チャプターテロップ（左上白箱+疑問形見出し）。apply_notesの「対談・インタビュー
    # 亜種への切替」段落に明記されているが、緊迫型（メイン実測対象）のtelop_layersには
    # role未登録だった欠落。亜種選択時のみ使用し、緊迫型では出現しない
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    char_width_px: 70   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    max_chars_total: 18   # 【2026-07-27 R10】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値。実測できたら上書きすること
      # 636 ÷ 70 = 9.09 → 1行9字、2行で18字
    position: {centerX: 0.183, centerY: 0.16}   # 【2026-07-27 R10・4辺検算をlintに実装したら出た】schema.mdはR3から4辺検算を必須と
      # 定めているのに機械照合が無く、手検算で毎周どこかが抜けていた。
      # 旧 0.18 は**左12.6px**。0.183 で左18.4px
      # max_width_px 660 で左106px切断は消えたが、**3行化して上へ69px切断**され
      # 「なぜ今」の上半分が欠けた（実測）。max_lines を 2 に縛ったうえで、
      # 0.16=172.8px、高さ**230px**で**実測上端58px**（影込み55px）。
      # 【2026-07-27 R8訂正】旧記述の「高さ約240px／上端52.8px」は size 230 と食い違っていた
    size: {width: 660, height: 230}   # 【2026-07-27 R4】font70×2行(154)+padding24+余裕
    # 【2026-07-27 R5・優先順位の明記】このroleも `font_px` を持つので caption_font より優先する
    font_px: 70                  # 【2026-07-27 R4追加・レンジを廃止】caption_font の
      # 「70-80px」のうち**80pxは padding 0〜40 のどこでも成立しない**（実測）。70pxに固定する
    padding_px: 12               # 【2026-07-27 R4追加】未定義で**合否が反転**していた
