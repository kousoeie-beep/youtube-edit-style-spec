  - role: caption            # 状況説明カード: 全画面黒背景+赤白文字で急展開を実況（「退出者が続出 前代未聞の展開に…」）。実測
    # 【2026-07-27 注記】このroleは「発話字幕」ではなく全画面ステートカードを指す。通常の下部発話
