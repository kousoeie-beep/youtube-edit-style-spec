style_id: ai_biz_pitch
source: |
  実測サンプル: n=3。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（cuts_per_min/visual_rhythm_per_min/LUFS/LRA/True Peak/無音回数・秒数=
  ffmpeg実測、テロップ層構成・配置・CTAバナー等の存在=タイル目視で複数箇所確認） /
  推定（配色HEXは360p圧縮+JPEG化タイルからのピクセルサンプリング近似、テロップの
  入退場アニメーション種別は2-45秒間隔のサンプリングのため断定不可、n=3のため
  日本語生成AI解説チャンネル全体への一般化はmedium）。捏造を避けるため、確認できな
  かった項目は下記apply_notesおよび各フィールドに「未確認」「未検証」と明記した。

format:
  aspect: "16:9"                # 実測（640x360）
  duration_sec: 1232-2230       # 実測。20-37分と幅があり、尺は情報量依存で可変
  cuts_per_min: 10.28-12.90     # 実測（3本: 12.53/10.28/12.90、平均11.90。長尺の
    # ai_biz_pitch_2がやや低めだが3本とも10-13/分のレンジに収まり比較的安定）
  visual_rhythm_per_min: 24.93-25.64   # 実測（scene0.08。3本ともほぼ25/分で著しく
    # 安定=尺に依らないチャンネル固有のテンポ規格と考えられる）
  camera: mixed                 # 実測（静止トーキングヘッド主体+画面共有カットアウェイ
    # +丸窓ワイプ+稀にストックB-roll映像+ニュース記事スクリーンショット引用）
  broll_usage: occasional       # 実測（ストック映像2-3箇所/本、記事引用1-2箇所/本、
    # アプリロゴ差し込みカード複数/本。B-roll単体で押し切る構成ではない）

palette:
  background_hex: "石目調グレー壁+観葉植物+白系フロアランプの実写スタジオ（3本で同一セットを確認）"   # 実測目視
  brand_hex: ["#70A090(チャンネルバッジ、複数フレームでピクセルサンプリング一致)", "#E52020(ショック赤文字塗り、近似)", "#D9A030(赤文字の金/生成り縁取り、近似)", "#4CC463(ポジティブ強調テロップの緑ネオングロー、近似)", "#F5E000(キーワード黄ハイライト帯、近似)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: null           # 通常字幕の地の文字色が原文に明記されていない
      # （用途ごとに赤塗り/白〜黄グラデ/白抜きと異なり、単一の地の文字色が読み取れない）
    color_bg: "#F5E000"        # キーワード語強調の背景ハイライト（マーカー風、単語単位。brand_hex近似）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
      # 記載あるが色の言及なし。推測での色指定は行わない
    color_accent: "#E52020"    # ショック・驚き訴求の赤塗り文字（brand_hex近似）
    color_stroke: "#D9A030"    # 赤文字の金/生成り縁取り（brand_hex近似）
    color_primary: "#70A090"   # チャンネルバッジ（brand_hex実測一致）
    color_glow: "#4CC463"      # ポジティブ強調テロップの緑ネオングロー（brand_hex近似）
  emphasis_roles:
    ショック・驚き訴求: 赤塗り文字+金/生成り縁取り+白アウター縁（「またNotebookLMがアップデートされました」等）。フック・要点提示で多用
    ポジティブ・メリット訴求: 白〜黄グラデーション塗り+緑ネオングロー状ストローク（「AIで人生に選択肢を」等）。塗り一色でなくグラデ+グロー構成
    キーワード語強調: 通常字幕中の特定フレーズのみ黄色矩形ボックスで背景色付け（マーカー風。文字色変更でなく背景ハイライト方式）
    UI操作対象の強調: 赤矩形枠 or 赤下線（画面共有パート限定。screen_tutorial系と同じ「強調は赤一色」文法）
    チャンネルアイデンティティ: 白抜き文字+ピル型バッジ（背景`#70A090`系）+豆電球アイコン、ドロップシャドウ付き

telop_layers:
  # 【2026-07-27 role分離修正・最重要】このセクションはz_order（重なり順）追加までは
  # 別パス（監査「監査3_role網羅性.md」が指摘した欠落への対応）で既に着手されていたが、
  # 肝心のrole重複自体は未解消のまま残っていた。旧`keyword`は4装置（ショック赤文字/
  # ポジティブ強調/黄ハイライト/アプリロゴ挿入カード）、旧`sidebar`は3装置（用語定義/
  # ニュース引用/CTAバナー）、旧`caption`は2装置（標準字幕/リアクション相槌）を兼ねていた。
  # このスタイルにはvariant_split（変種分岐）が無いため、「変種が違うから同時に出ない」
  # という他ジャンルの言い訳が使えず、実際に同一動画内で共存しうる装置が同じrole名を
  # 共有していた。機能ごとに固有role名へ分離する（z_order・座標・既存の衝突検討コメントは
  # 直前のパスで確定済みの値を継承し、役割名のみを分離・明確化する）。
  - role: title_bar            # チャンネルバッジ: 「ai_biz_pitch系サンプル」+豆電球アイコンの丸ピルバッジ。トーキングヘッド・画面共有問わずほぼ全編で右上に常駐。実測。単一装置のみでrole重複は無い
    size: {width: 411, height: 113}   # 【2026-07-27 R8追加】上の導出に使った寸法。実測（R8ビルドの合成後PNGを自分で再実測した値。overlayのx,yに実描画bboxを足して算出）。
      # 旧記述の「高さ約10%＝108px」は推定値で、実測とは5pxずれていた
    position: {centerX: 0.87, centerY: 0.0727}   # 【2026-07-27 R10・宣言矩形で解き直した】これまでの導出は**実測インクのオフセット**を
      # 使っていたが、実装者が読むのは `size` の箱である。箱は centerY に対して対称なのに
      # 実インクは非対称なので、実測基準で16pxを取っても**宣言矩形では4px**になっていた。
      # 以後この系統は「size の箱 + 影（右下+12 / 左上−3）」で統一する。
      # 0.0727 = 78.5px（上端16.0px＝画面端ちょうど / 下端147.0px）
      # 【3周連続で同じ誤り】R8→R9→R10 と、この1組で影を過小に数え続けた。
      # 注記の「上下 ∓4.1px」は size.height を二等分しただけで、規約の右下+12/左上−3 ではない
      # **R8で「影を数えていない」と自分で指摘した誤りを、同じ周回の新しい導出で繰り返した**。
      # 0.065 = 70.2px（上端17.8px / 下端130.8px、nameplate 上端152.0pxに21.2px）
      # yamlの注記「余裕はわずか6px」も影とリング線幅を数えていない値だった。
      # 0.07で下端136px＝16px確保（上端23pxで画面内）（R8ビルドの合成後PNGを自分で再実測した値。overlayのx,yに実描画bboxを足して算出）
    persistent: true
    style: 帯
    z_order: 10                  # 【2026-07-27 z_order遡及追加】常駐要素で前面寄り。
      # 下記z_order_policyのnameplate座標衝突チェック参照
    entrance: pop              # 推定（サンプリング間隔の制約で断定不可）
    exit: pop                   # 未計測（推定、entranceと対称と仮定）
  - role: nameplate             # 丸窓ワイプ: 画面共有パート中、ホストの顔を円形マスクでクロップし右上に重ねる小型PiP。薄色リング縁取り。実測。単一装置のみでrole重複は無い
    layer_kind: video            # 【2026-07-27追加】このroleは**動画レイヤー**であり
      # overlap_qc の検査対象から自動的に除外される（アルファを静的に取れないため）。
      # screen_tutorialの検証では生成20レイヤーに対し element_count=19 となり、
      # **PiP絡みの衝突8件がQCに1件も現れなかった**。QCの盲点は既知でも
      # 「どのroleが盲点に落ちるか」がyamlから読めなかったので機械可読な印を付ける。
      # **このroleは必ずフレーム目視で確認すること**
    size: {width: 320, height: 320}   # 【2026-07-27 R10追加】半径150 + リング線幅10×2。**layer_kind: video でQC検査外なので、
      # size が無いと寸法の誤りを機械で捕まえる手段が一つも無い**
    position: {centerX: 0.87, centerY: 0.3019}   # 【2026-07-27 R10・宣言矩形で解き直した】これまでの導出は**実測インクのオフセット**を
      # 使っていたが、実装者が読むのは `size` の箱である。箱は centerY に対して対称なのに
      # 実インクは非対称なので、実測基準で16pxを取っても**宣言矩形では4px**になっていた。
      # 以後この系統は「size の箱 + 影（右下+12 / 左上−3）」で統一する。
      # 0.3019 = 326.1px（上端163.1px＝title_bar 下端147.0pxに16.1px）
      # 0.2977 = 321.5px、上端168.5px（title_bar 下端144.1pxに**24.4px**）
      # 変更。title_bar(centerY0.065・2026-07-27 R9で0.08から変更)と同じ右上コーナーに位置し、推定寸法（title_bar高さ
      # 約10%＝108px、nameplate円形PiPは**半径150px（直径300px）**、いずれも
      # 【2026-07-27 矛盾解消】旧記述は「直径約28%幅相当＝半径150px前後」と、
      # 直径538px(=1920×0.28)と直径300px(=半径150)という**両立しない2値を併記**していた。
      # 再実装検証で、28%解釈を採ると右端が1939pxとなり**画面外へ19pxはみ出す**ことが
      # 判明したため、**半径150px（直径300px）が唯一自己整合する値**と確定した。
      # ただし直径300pxでもtitle_bar下端との余裕は**わずか6px**しかなく、
      # title_barのフォントを1段上げるだけで破綻する（caption_fontが「40-50px相当」と
      # 幅を持たせているため、50pxを採ると破綻側に倒れる）。実寸の再計測が必要。
      # 以下は旧記述の経緯:
      # Pillow実測ではなく一般的なバッジ/PiPサイズからの仮定値）で検算すると
      # 【2026-07-27 R9・現行値で再計算】title_bar下端(centerY0.065×1080+60.6=130.8px)
      # < nameplate上端(centerY0.3019×1080-163=163.1px) ＝ クリアランス16.1px。
      # 【R10訂正】旧記述は「centerY0.28 / −150.4 / 152.0px / 21.2px」で、
      # **nameplate の座標も、影の項も、両方が古かった**（半径150+リング/ぼかし3で −153）
      # 【旧記述】title_bar下端(centerY0.08×1080+54=140.4px) > nameplate上端(centerY0.2977×1080-153
      # =44.4px)となり衝突が疑われた。centerYを0.28へ下げ、nameplate上端
      # (0.28×1080-150=152.4px)がtitle_bar下端(140.4px)を上回るよう調整。
      # ※本ファイルはPillowピクセルスキャンによる実寸測定を行っておらず、上記は
      # 一般的なサイズ仮定に基づく試算。実装時に実フレームでの再検証を推奨する
    persistent: false           # 画面共有区間限定で持続
    style: プレーン
    z_order: 12                  # 【2026-07-27 z_order遡及追加】常時映る顔なので、
      # title_bar(5)より前面固定とし、仮に位置調整後もわずかに重なる場合は顔が
      # バッジより優先して見えるようにする
    entrance: pop               # 推定
    exit: pop                    # 未計測（推定、entranceと対称と仮定）
  - role: shock_keyword           # 【2026-07-27新設】旧: role: keyword（ショック赤文字テロップ、
    # フック/要点用）。赤塗り+金縁+白アウター縁の極太フキダシ文字。画面中央〜やや下に1-2行。実測
    mutually_exclusive_with: [app_logo_card, glossary_card, news_citation_card, positive_keyword, promo_cta_banner, reaction_character]   # 【2026-07-27 R8追加】**reaction_character が抜けていた**。
      # shock_keyword と positive_keyword は position(0.5,0.66)・font112・max_chars16・z6 まで
      # 一致する双子なのに、R6は positive にだけ排他を足して**こちらを取り残した**。
      # 実測交差 x[70,460] y[660,792] = 390×132px（R8ビルドの合成後PNGを自分で再実測した値。overlayのx,yに実描画bboxを足して算出）。
      # 目視では「またノートブックが〜」の先頭3字が吹き出しに潰れて読めない
      # z_order も同値**で、排他が破れた瞬間に100%重畳する。散文では「交互使用で同時表示なし」と
      # 書かれていたが**フィールドが無かった**（schema.md がこのペアを名指しで危険例に挙げている）。
      # 実フレーム検査で、between()を閉区間のまま使うと frame 210 で1フレーム同時表示になる。
      # **区間は半開 [t0,t1) で実装すること**
    font_px: 112                 # 【2026-07-27 R4】positive_keyword と同一スロットのため同値
    max_width_px: 1792
    size: {width: 1816, height: 188}   # 【2026-07-27 R10・高さの収容検査を新設したら出た】幅の検査はR4からあったのに
      # **高さには一度も検査が無かった**。箱が中身より低いと、実装者はフォントを落とすか
      # はみ出させるかを勝手に選ぶ。
      # font112 の行高164 + フチ12×2 = 188
      # **実描画外形は1809pxで7px食い違う**。positive にある測定基準注記が本roleに無かったので明記:
      # **この size は alpha>0 基準の外形**。1px でも幅か縁が増えると破れる
      # 同ファイルが positive_keyword で使った関係式 `1792+24=1816` を**7px下回っていた**
    overflow_policy: split_event   # 【2026-07-27 R6 一括掃引】`max_lines: 1` だけでは折返しは止まらない。
      # 折返し器は max_chars で改行するので**結果の各行は制約を満たしたまま2行になる**
      # （ai_tool_avatarで実測。**documentary_immersive が退行したという私の当初の報告は誤り**で、
      #  R6のFAILは検証者が意図的に作った違反対照窓＝14字「max_lines:1 違反の対照」だった。
      #  掃引そのものは正しい——10ファイルが本当にこのフィールドを欠いていた）。
      # 超過は折り返さず**複数のテロップイベントへ分割する**
    stroke_px: 12   # 【2026-07-27 R10追加】**`style: 袋文字` なのに宣言が無く、R8→R9→R10の3周とも未解消だった**。
      # とくに base_caption のフチ幅は**この系統4roleすべての座標導出の分母**であり、
      # フチ1pxで外形が縦2px変わる。base_preset既定の12pxを明示する
    char_width_px: 112   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.5, centerY: 0.574}   # 【2026-07-27 R10】base_caption 箱の上端742.0pxからの再導出。
      # 0.574 = 619.9px、下端725.9px（クリアランス16.1px）。双子は同値にする
      # 使っていたが、実装者が読むのは `size` の箱である。箱は centerY に対して対称なのに
      # 実インクは非対称なので、実測基準で16pxを取っても**宣言矩形では4px**になっていた。
      # 以後この系統は「size の箱 + 影（右下+12 / 左上−3）」で統一する。
      # base_caption 箱の上端774.2pxからの再導出。0.603 = 651.2px、下端757.2px。
      # **双子は同一スロットを排他利用する設計なので両方を同じ値にする**
      # 0.617 = 666.4px、下端772.4px＝クリアランス16.4px。
      # **双子は同一スロットを排他利用する設計なので、片方だけ動かしてはいけない**
      # positive は下端803.1px（クリアランス17.0px）、shock は size が小さいぶん余る。
      # **双子は「同一スロットを排他利用する」設計なので、片方だけ動かしてはいけない**
      # 旧0.72では **size と max_width_px を足すだけでは解けなかった**。
      # 4辺検算式での base_caption 上端836.0px（実インク866pxと30px違う）を基準に
      # clearance 8pxを置くと下端≤828.0px、0.72=777.6pxなので使える高さは**50.4pxしかなく**、
      # caption_font 下限のfont100でも16字満載の下オフセットは+85.4px。**centerYの変更が必須**。
      # 0.66 で y[627,813]、基準A余裕 **+23.0px**
    persistent: false
    # 【2026-07-27 R4 重複キーの解消】ここにあった `max_width_px` は、上で設定した値を後勝ちで無効化していた。lintが即検出（**7度目**）。
    max_lines: 1         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 見出し/バッジ系は1行が前提（2行になると帯の高さが倍になり近接要素を潰す）。
      # 収まらない文言は行を増やすのではなく**文言を短くする**こと
    max_chars: 16
    style: 袋文字
    z_order: 6                  # ポジティブ強調テロップと同一スロット(centerX0.5・**旧**centerY0.72→現行0.66)を
      # 排他利用するため同値。下記説明カード群(2)より前面、base_caption/reaction(4)より背面
    entrance: pop               # 推定（フェード痕跡は確認できず、瞬間出現に近い見え方）
    exit: pop                    # 未計測（推定、entranceと対称と仮定）
  - role: positive_keyword        # 【2026-07-27新設】旧: role: keyword（ポジティブ強調テロップ）。
    # 白〜黄グラデ塗り+緑ネオングロー。ポジティブな主張・メリット訴求文で使用。実測。
    # 【座標重複は意図的】shock_keywordと同一位置(0.5,0.72)だが、両者は「驚き訴求」と
    # 「ポジティブ訴求」という異なる文脈で使い分けられる交互使用のテロップであり、同一発言に
    # 同時に両方が出ることは無い（実測範囲でも両方同時のフレームは未確認）。座標をずらす必要はない
