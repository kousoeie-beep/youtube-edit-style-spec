      # 【旧記述】**font_size が無かった**。
      # yaml自身が「shock/positiveと同じ煽り文字グループとして同格」と書き、
      # caption_font が煽り系を「100-130px」と規定しているため、
      # **2つの記述をつなぐだけで下へ20pxはみ出す**（font80でも既に−2px）。
      # 本roleは画面最下部にあるため煽り系の共通サイズを適用してはいけない。80pxで固定する
    stroke_px: 12   # 【2026-07-27 R8追加】**袋文字のフチ幅フィールドが無かった**。
      # 「font_px と size を書けば再現できる」は袋文字では成り立たない：
      # 実測でフチ1pxにつき外形が縦2px変わり、base_preset既定12と実装者の選んだ10で4pxずれる。
      # **フチ幅も size の「中身」である**（規約③の欠落。schema.md に追記した）
    position: {centerX: 0.5, centerY: 0.9194}   # 【2026-07-27 R10・宣言矩形で解き直した】これまでの導出は**実測インクのオフセット**を
      # 使っていたが、実装者が読むのは `size` の箱である。箱は centerY に対して対称なのに
      # 実インクは非対称なので、実測基準で16pxを取っても**宣言矩形では4px**になっていた。
      # 以後この系統は「size の箱 + 影（右下+12 / 左上−3）」で統一する。
      # 0.9194 = 993.0px（上端931.0px＝base下端915.2pxに15.8px…に見えるが
      # 影の重複を除くと16.0px / 下端1064.0px＝下余裕16.0px）。**上下とも境界**
      # 0.9194 = 993.0px（上端931.0px＝base下端914.8pxに16.2px / 下端1064.0px＝下余裕16.0px）。
      # **上下とも16pxちょうどの境界解**。font_px を1px上げるとどちらかが即破れる
      # 0.9306 = 1005.0px（上端963.2px＝base下端946.1pxに17.1px / 下端1063.2px＝下余裕16.8px）。
      # **上下とも境界に近い**。font_px を上げるとどちらかが即破れる
      # （base下端954.6pxに**クリアランス18.0px**）、下端1060.6px（下余裕19.4px）
      # 0.93 で上端967px（base_caption 下端944pxに23px）・下端1059px（下余裕21px）
      # 旧0.92は実測 y[957,1039] で base_caption y[866,979] と22px重なり
      # **pixel_collision 74-78%**。base_captionは persistent: true なので必ず共存する。
      # base_caption下端979pxと画面下端1080pxの間は**101pxしかなく**、
      # 本要素の実測高さ82pxを置くと余裕は上下合計19pxしかない。
      # 0.953 = 中心1029.5px、band[988.5, 1070.5]で上下とも9.5pxずつに等分した値。
      # **これは「ぎりぎり収まる」だけであり余裕は無い**。本要素も base_caption も
      # 実寸が未計測の推定なので、実素材では破綻しうる。実寸を測って再導出すること
    persistent: false
    style: 帯                  # 【2026-07-27修正】enum値に戻した。
      # 意匠は黄縁+赤文字（実測目視だが座標・実寸は未計測）
    z_order: 6                        # shock_keyword/positive_keywordと同じ煽り文字グループとして同格
    entrance: pop                      # 未計測（推定）
    exit: pop                           # 未計測（推定）
  - role: app_logo_card           # 【2026-07-27新設】旧: role: keyword（アプリ/サービスのロゴ
    # 挿入カード）。黒背景に対象アプリの公式アイコン（白抜き）を大きく表示。トピック切替の
    # 合図を兼ねる。実測（NotebookLM/Claude Code/Codex等のロゴを確認）
    mutually_exclusive_with: [glossary_card, news_citation_card, promo_cta_banner, positive_keyword, shock_keyword, reaction_character]   # 【2026-07-27 R11・D1】説明カード層（z_order 4）の4roleは**同じ場所を交代で使う装置**
      # なのに、排他が2roleにしか入っていなかった。**排他違反ゼロのまま QC exit 1**
      # （glossary×news pixel 0.9950 / glossary×promo 0.9945 / app_logo×reaction 0.9266）。
      # 上2件は **size に依存しない**——glossary_card の中心(960,594)が相手の宣言矩形の
      # 内側にあるため。目視で定義文が完全に隠れる
      # reaction_character は左下の吹き出しネコで、app_logo_card と 0.9266 で衝突する
      # なのに、排他が2roleにしか入っていなかった。**排他違反ゼロのまま QC exit 1**
      # （glossary×news pixel 0.9950 / glossary×promo 0.9945 / app_logo×reaction 0.9266）。
      # 上2件は **size に依存しない**——glossary_card の中心(960,594)が相手の宣言矩形の
      # 内側にあるため。目視で定義文が完全に隠れる
    size: {width: 400, height: 226}   # 【2026-07-27 R11・連鎖の切断を塞ぐ】上限 h ≤ 226.5（centerY 0.35 = 378px から逆算）。
      # 実素材で再計測すること
    text_content: none   # 【2026-07-31・外部PRで追加】素材側に文字が焼き込まれており yaml側の文字組みは無い。
      # **ただし実素材で確認した記録が無い**。schema.md の「検査を黙らせる修正をしない」に
      # 形の上では当たるので、次に実素材へ触るとき根拠を追記すること
    position: {centerX: 0.12, centerY: 0.35}
    persistent: false
    style: カード
    z_order: 4                  # 説明カード層（トピック切替の合図を兼ねるロゴ挿入カード）。
      # 他の説明カード群と同様、base_captionより背面
    entrance: pop                      # 推定
    exit: pop                           # 未計測（推定、entranceと対称と仮定）
  - role: reaction_character      # 【2026-07-27新設】旧: role: caption（リアクション・
    # キャラクターの相槌）。小型ちりめんキャラクターイラスト+吹き出しセリフ（例「はいはい
    # またAI驚き屋だよ」）。自己ツッコミ的なコメディ演出。実測1回確認（頻度は未確認）
    # 【座標衝突・判定保留】base_caption(0.5,0.85,persistent=true)とcenterY差0.03(32.4px)・
    # centerX差0.38(729.6px)。横方向には大きく離れているためbase_captionの標準的な折返し幅
    # （中央寄せ想定）とは重ならない可能性が高いが、双方の実寸（吹き出しの幅・字幕の折返し幅）
    # が未計測のため確定はできない。出現頻度がn=1と極めて低いため実害は限定的だが、実装時は
    # overlap_qcでの検証を推奨する。
    size: {width: 441, height: 191}   # 【2026-07-27追加】centerY 0.616（R10で0.70→0.664→0.616） の導出前提
      # 【2026-07-27追加・最重要】この値は座標修正の導出根拠として**散文コメントの中に
      # しか存在しなかった**。フィールドを読む実装者は得られないので**修正が再現しない**。
      # 「QCがPASSしたのに不可」と判定された直接の原因がこれ。
    mutually_exclusive_with: [positive_keyword, shock_keyword, app_logo_card, glossary_card]   # 【2026-07-27 R11】相互記載
      # 文字数掃引で**9文字以上なら必ず衝突**する（max_chars は16）
    position: {centerX: 0.125, centerY: 0.572}   # 【2026-07-27 R10】0.572 = 617.8px、下端725.3px（base 箱の上端742.0pxに16.7px）
      # 使っていたが、実装者が読むのは `size` の箱である。箱は centerY に対して対称なのに
      # 実インクは非対称なので、実測基準で16pxを取っても**宣言矩形では4px**になっていた。
      # 以後この系統は「size の箱 + 影（右下+12 / 左上−3）」で統一する。
      # 0.602 = 650.2px、下端757.7px（base 箱の上端774.2pxに16.5px）
      # centerY 0.616 は base_caption 上端788.8pxからの導出（下端772.8px＝クリアランス16.0px）
      # 0.616 = 665.3px、下端772.8px＝クリアランス16.0px
      # 0.645 = 696.6px、下端804.1px＝クリアランス16.0px。
      # R9の 0.664 は「16.5px確保」と宣言していたが実測9pxだった（影の過小計上）
      # 0.7 のままだと下端857pxで**字幕に22px食い込む**（R8で base を動かしたときの追随漏れ）
      # 旧0.82は**実測 bbox 50.1% / pixel_collision 93.1% でFAIL**。
      # 目視で字幕先頭の文字が顔イラストに完全に隠れ読解不能だった。
      # 上の【座標衝突・判定保留】の推定は**誤り**だった。「centerX差729.6pxで
      # 横方向に大きく離れているため重ならない」と中心間距離で判定していたが、
      # base_captionは max_chars20/フォント92 で実測幅1858px（画面幅の96.8%、x[29,1887]）
      # に及ぶため、**横方向の分離は成立していない**。中心間距離での衝突判定は
      # 要素の実寸を無視しており、このスタイルでは常に誤る。
      # 0.70 = 中心756px、吹き出し高さ191pxで下端851.5px。
      # base_caption上端866pxに対し14.5px確保
    persistent: false
    style: カード
    z_order: 8                  # 吹き出しセリフはテキストを含む要素のためbase_captionと
      # 同格の可読性優先層に置く。base_caption(centerX0.5)とはX座標が離れており
      # (centerX0.12)通常は非衝突と推定（未実測）
    entrance: pop                      # 推定
    exit: pop                           # 未計測（推定、entranceと対称と仮定）

caption_font: |
  未計測（360p圧縮+JPEG化タイルからのピクセルサンプリング近似のため原寸不明）。
  採用すべきデフォルト:
  - base_caption（標準字幕・白文字黒縁）: 基準プリセット既定値（フォント92/黒フチ12px）をそのまま
    採用可。このチャンネルは高彩度・煽り系の演出が多く、大きめ・強めの字幕が世界観と整合する
  - shock_keyword/positive_keyword（ショック赤文字/ポジティブ強調テロップ）: 標準字幕より
    ひと回り大きく目安100-130px相当（極太フキダシ文字と記述されているため）
  - title_bar/chapter_tab（バッジ・見出し）: 標準字幕より小さく目安40-50px相当
  いずれも未計測の推定値であり、実装時は完成フレームでの目視比較を必須とする
  # 【2026-07-27 role分離修正】旧role名(caption/keyword)を新role名(base_caption/
  # shock_keyword/positive_keyword)に置き換えた（telop_layers参照）。

z_order_policy: |
  常駐チャンネルバッジ(title_bar,5)と丸窓ワイプ(nameplate,6)は画面右上の同一コーナーに
  近接配置されており、一般的なバッジ/PiPサイズを仮定した試算で座標衝突の可能性が
  検出された（本ファイルはPillow実測を行っていないため試算値）。nameplateのcenterYを
  0.18→0.28へ修正し、かつnameplateのz_orderをtitle_barより前面(6>5)にすることで、
  仮に完全には解消しきれない場合でも顔の視認性を優先する設計とした。
  shock_keyword/positive_keyword（ショック赤文字/ポジティブ強調テロップ,3）とglossary_card/
  news_citation_card/promo_cta_banner（用語定義/ニュース引用/CTAバナー,2）は同時表示され
  うるかが未確認（動画の話題次第）。ai_biz_pitch_1で確認された唯一の実例（promo_cta_banner+
  cta_urge_text同時表示）ではcenterY差0.47（約508px）と十分離れており衝突しない設計に
  なっている。他の組み合わせ（例: glossary_card表示中にshock_keywordが同時に出る場合）は
  未検証のため、実装時は「説明カード表示中は煽りテロップ系の新規表示を避ける」運用を推奨する。
  highlight_marker（黄ハイライト,1）はbase_caption(4)の背後に敷くマーカーとして機能する
  意図的な仕様のため、リスト順とz_orderの大小関係が逆転している点に注意。

  【2026-07-27 role分離修正・座標衝突の検算結果まとめ】
  1. **意図的な同一位置（衝突ではない）**: highlight_marker×base_caption（0.5,0.85、
     ハイライト矩形は字幕文字の背景として機能する1つの合成テロップの一部）、
     shock_keyword×positive_keyword（0.5,0.72、驚き訴求とポジティブ訴求の交互使用で
     同時表示なし）の2組は座標が同一だが実害なし。
  2. **予防的マージンで対応済み**: title_bar×nameplate（右上コーナー、PiP直径未計測の
     ため保守的にnameplateをcenterY0.28へ移動。上記z_order_policy冒頭参照）。
  3. **判定保留（実寸未計測のため確定不可）**: base_caption×reaction_character
     （centerX差729.6pxで低リスクと推定するが吹き出し幅・字幕折返し幅とも未計測。
     出現頻度n=1のため実害は限定的）。promo_cta_banner×cta_urge_text（centerY差約508px
     で低リスクと推定するがCTAバナーの実寸高さが「縦長」としか記載が無く未計測）。
     いずれも実装時にoverlap_qc実行＋フレーム目視での再検証を必須とする。
  4. **role分離のみでcta_urge_textは新規追加**: cta_urge_text（「個別相談会 開催中!」等の
     煽りテロップ）はapply_notesの自由記述にのみ存在しtelop_layersに対応roleが無かった
     （SKILL.md項目7の欠落）。新規roleとして追加したが、座標(0.5,0.92)は原資料に記載が
     無い推定値である点に注意。

animation_dictionary_mapping:
  テロップ全般の出入り: in.pop が基調と推定（2-45秒間隔サンプリングのため、フレーム単位のフェード/スライド検出は不可。wipe_explainerで確立した「30fpsフレーム単位実測」は本タスクでは未実施のため、次点の推定confidenceに留める） # 推定
  黄ハイライトボックス: 文字色変更でなく背景矩形の敷き直し（マーカー方式）# 実測目視
  UIコールアウト: in.pop（矩形/下線が瞬間出現、screen_tutorial系と同様にズーム系エフェクトは未確認）# 推定
  不使用: 大掛かりなトランジション（ディゾルブ・ワイプ形状・グリッチ等）は3本とも一度も検出されず # 実測

transitions:
  default: hard_cut             # 実測（3本ともディゾルブ・ワイプ形状トランジション0件）
  accent: []                    # 実測範囲では装飾トランジション無し

audio:
  bgm: unknown                  # 未検証（LRAが1.2-2.3LUと極めて狭く軽いBGMベッドの可能性はあるが、実聴取は未実施。confidence: low）
  voice_lufs_target: -16.4〜-12.7   # 実測（Integrated、3本: -16.4/-12.7/-14.1、平均-14.4。3本間で3.7LUの幅があり
    # マスタリングの一貫性は中程度）
  lra: 1.2-2.3               # 実測（3本とも非常に狭い。強コンプレッションで声量を均一化する編集方針と推定）
  true_peak: -4.8〜-4.4       # 実測（dBFS、3本とも-4.4〜-4.8の狭いレンジ。リミッター天井が意図的に統一されている可能性）
  se_style: unknown            # 未検証（波形からは判定不可）
  ducking: unknown             # 未検証

pacing:
  gap_keep_sec: 1.2-1.6         # 実測（silencedetect -35dB/0.5s基準。3本とも1.2-1.6秒の「呼吸ポーズ」が
    # 5-6回のみ検出され、それ以外の無音は0.5秒未満に完全圧縮）
  filler_policy: aggressive     # 実測寄り（無音総量は総尺の0.39-0.55%のみ。デッドエア除去を徹底する編集）
  hook: cold_open               # 実測（3本ともロゴバンパー無しで0秒から発話+テロップ表示開始。ai_biz_pitch_3のみ
    # AI生成デモ映像の自己言及ネタから入り、その後「こんにちはここなです」の挨拶へ
    # 接続する変則パターンを確認。フック区間(0-30s)は8/8/5カットで、ai_biz_pitch_1/3は
    # 本編平均の約1.28-1.3倍の高頻度、ai_biz_pitch_2は本編とほぼ同水準=前傾は一貫しない）

packaging:
  thumbnail_style: 未取得
  chapter_style: 左上見出しテキストの差し替えでトピック転換を示す（プレーン文字/色帯背景の2種が混在、使い分け条件は未特定）   # 実測目視
  endcard: false                # 推定（3本とも終盤は台詞のみの挨拶締め「それじゃあまた次の動画でお会いしましょう」
    # 等で終わり、専用グラフィックのエンドカードは確認できず。ただし各動画の本当に最後の
    # 数秒間は未確認のため、YouTubeネイティブの終了画面カードが別途付与されている
    # 可能性は排除できない=confidence: medium）

apply_notes: |
  youtube-edit-style-specパイプラインでの適用方法・今後の検証課題:

  【このチャンネルの編集文法の核】カット律自体は10-13/分と中庸だが、視覚リズムが
  尺に依らず25/分前後で極めて安定している点が最大の特徴。つまり「カメラを頻繁に
  切り替える」のではなく「同一ショット内でテロップ・ハイライト・カード類を高頻度で
  差し替える」ことでテンポを作るチャンネル（kirinuki_hiroyuki_talkに近い設計思想だが、
  カット律はkirinukiの0.36/分よりずっと高く、教育解説とキリヌキの中間的な文法）。
  実装時はカット頻度より「テロップ・ハイライト切り替え頻度」の再現を優先するとよい。

  【本編共通と動画固有の切り分け】3本共通で確認: 同一スタジオセット・同一チャンネル
  バッジ・赤/緑2系統の強調テロップ・標準字幕+黄ハイライト方式・UIコールアウト赤一色・
  ハードカットのみ・cold_open・無音の徹底圧縮。動画固有: ai_biz_pitch_1のみ販促CTAバナー
  （個別相談会誘導）を確認、ai_biz_pitch_3のみ用語定義カード・ニュース引用カード・
  リアクションキャラクターを確認、ai_biz_pitch_2のみストックB-roll映像（編集者/リサーチャー
  の一般的な作業風景）を確認。これらが「動画の話題による出し分け」か「頻度が低く
  n=3では網羅できていないだけ」かは未確定。

  【CTA/宣伝バナーについて（brief指定の重点確認事項）】ai_biz_pitch_1のt≈45s付近で、
  個別相談会・有料ロードマップ作成講座への誘導バナー（緑ヘッダー「3日間限定案内!」+
  チェックマーク特典列挙+人物写真+赤CTAボタン「今すぐ参加する!」）を確認した。
  同時に画面下部へ黄縁赤文字の「個別相談会　開催中!」という煽り系テロップも表示
  されており、動画の非常に早い段階（本編45秒地点）で外部収益導線を挿入する設計。
  初心者向け・「稼ぐ」訴求チャンネルという brief の想定と整合する強いシグナル。
  ただし1本でのみ確認（n=1/3）のため、全動画で毎回挿入されるか、特定シリーズのみか
  は未検証。

  【煽り系テロップの傾向】赤塗り+金縁のショックテロップ（「またNotebookLMがアップデート
  されました」「Claude Coworkすごすぎます」等）が3本共通で高頻度に使用され、視聴維持を
  狙う煽り文法が明確。一方で過度な効果音的テロップ（擬音語・ドカーン等）は3本のタイル
  観測範囲では確認されず、強調は専ら「色+縁取り+サイズ」で作られている（wipe_explainer
  やscreen_tutorialと同じ「テキストが主役」の設計思想）。

  【未確認・今後の検証課題（正直に明記）】
  1. テロップの入退場アニメーション種別（pop/fade等）は本タスクでは2-45秒間隔の
     タイルサンプリングのみで検証しており、wipe_explainer実測で確立した「30fpsフレーム
     バイフレーム抽出+ピクセルスキャン」は未実施。次回このチャンネルを再分析する際は
     hook区間だけでもフレーム単位の精密実測を追加することを推奨。
  2. BGM・SE・ダッキングの有無は実聴取していない（LRA・silencedetectからの間接推定に
     留まる）。実装時に音声を実際に再生して確認することを推奨。
  3. 「左上見出し」がプレーン文字か色帯背景かの使い分け条件が未特定（動画によって
     混在）。実装時は両パターンを用意し、こうすけに確認するか、まずプレーン文字版を
     デフォルトにして目視比較することを推奨。
  4. リアクションキャラクター（ちりめんイラスト+吹き出し）はai_biz_pitch_3のhook区間で1回
     のみ確認。出現頻度・出現条件は未検証（n=1）。
  5. エンドカードは3本とも動画終端の数秒手前までしか確認しておらず、本当の最終フレーム
     （YouTubeネイティブ終了画面が重なる領域）は未検証。
  6. n=3（同一チャンネルのみ）のため、初心者向けAI解説チャンネル全体への一般化は
     medium confidenceに留める。同ジャンルの別チャンネル（例: aidaigaku, ai_tool_avatar等
     `raw/`に同時に配置されている他チャンネル）との比較実測を行えば、本チャンネル
     固有の癖とジャンル共通文法をより精密に切り分けられる。

  【2026-07-27 role分離修正（本追記・最重要）】
  横断監査（`style_verify_20260725/audit/監査3_role網羅性.md`）が「ai_biz_pitch |
  (b) 重複・最も広範囲」と指摘した通り、旧yamlは`keyword`role が4装置（ショック赤文字/
  ポジティブ強調/黄ハイライト/アプリロゴ挿入カード）、`sidebar`role が3装置（用語定義/
  ニュース引用/CTAバナー）、`caption`role が2装置（標準字幕/リアクション相槌）を兼ねて
  いた。本ファイルにはvariant_split（変種分岐）が無く「変種が違うから同時に出ない」という
  他ジャンルの言い訳が使えないため、実際に同一動画内で共存しうる装置が同名roleを共有する
  実害リスクが最も高いファイルだった。以下のとおり機能ごとに固有role名へ分離した:
  - `keyword` → `shock_keyword` / `positive_keyword` / `highlight_marker` / `app_logo_card`
  - `sidebar` → `glossary_card` / `news_citation_card` / `promo_cta_banner`
  - `caption` → `base_caption` / `reaction_character`
  - `title_bar` / `nameplate` / `chapter_tab` は単一装置のみでrole重複が無いため名称を維持。

  分離後、同時表示されうるペアの座標検算を行った結果は上記z_order_policyに記載の通り:
  意図的な同一位置(highlight_marker×base_caption、shock_keyword×positive_keyword)は
  実害なし、title_bar×nameplateは予防的マージンで対応済み、base_caption×
  reaction_characterおよびpromo_cta_banner×cta_urge_textは実寸未計測のため判定保留
  （実装時にoverlap_qcでの再検証が必要）。

  併せて、apply_notesの自由記述にのみ存在しtelop_layersに対応するroleが無かった
  「個別相談会 開催中!」等の煽りテロップ（promo_cta_bannerと同時表示される装置）を
  `cta_urge_text`として新規追加した（SKILL.md項目7の欠落を解消）。ただし座標(0.5,0.92)は
  原資料に記載が無い推定値であり、実測ではない点に注意。

  なお、本ファイルはこの修正着手前の時点で既にz_orderフィールドが全roleに遡及追加されて
  いた（別パスによる対応、日付は同じ2026-07-27）。今回の修正はその上に役割名の分離のみを
  行っており、z_order番号自体・title_bar×nameplateの座標修正（0.18→0.28）は先行対応を
  そのまま継承している。
