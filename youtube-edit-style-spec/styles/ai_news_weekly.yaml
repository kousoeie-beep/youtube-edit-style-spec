style_id: ai_news_weekly
source: |
  実測サンプル: n=3。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（カット律/視覚リズム/LUFS/LRA/TruePeak/無音回数=ffmpeg実測、キャプションバー・
  チャプタータグ・アバターPiPの位置座標=Pillowピクセルスキャンで実測、配色HEX=
  ImageMagickヒストグラム法で実測、エンディング素材の3本完全一致=タイル目視で確認）/
  推定（テロップの入退場アニメーション種別=静止画タイルサンプリングのため断定不可、
  BGM有無・SE有無=聴取未実施、フォント名=360p解像度のため特定不可、丸角半径等の微細
  数値=360p制約、n=3だが単一チャンネルのみのため「AI活用系ニュース速報チャンネル」
  というジャンル全体への一般化はlow-medium）

  【自己検証メモ】voice_lufs_targetが3本ともI=-19.1 LUFSで完全一致（LRAも3.2-3.4LUと
  ほぼ同一）。手動調整でこの精度の一致は考えにくく、バッチ処理型のラウドネス正規化
  パイプラインの存在を強く示唆する所見として記録する。エンディングの青いネットワーク/
  地球アニメーションループは3本の最終11秒を1秒刻みでタイル比較し、視覚的に同一素材の
  使い回しであることを確認した（wipe_explainer/ai_tool_avatarと同様、捏造ではなく
  実際に3本とも酷似したフレームが検出された。ピクセル単位の完全一致検証は今回未実施の
  ため「酷似」の表現に留め、ai_tool_avatarの「完全一致」ほど強い主張はしていない）。

format:
  aspect: "16:9"
  duration_sec: 672-1216            # 実測。11:12-20:16で幅があり、v2のみ突出して長い
    # （Fable 5活用事例10選という列挙型テーマのため）
  cuts_per_min: 0.18-4.39            # 実測（scene0.3。v1=0.179/v2=2.665/v3=4.386）。
    # ただし単純な平均値は実態を表さない二極構造: v1は671.66秒中ハードカットわずか2回
    # （t=132.0s, t=219.3s）＝ほぼ全編ワンカットの画面共有ロングテイク。v2はhook区間
    # （0-30秒）だけで44/54カット＝88.0/分の高密度B-rollモンタージュが起き、本編
    # （30秒以降）は10カット/1186秒＝0.506/分まで急減する「フック集中型」。v3はhook
    # 区間（0-30秒）はハードカット0だが、t=54.7-66.1s・t=101-110s・t=149-153s・
    # t=607-650s付近に密集バーストが散発し、それ以外の区間（例: t=153-337sの184秒間）
    # はハードカット0という「間欠バースト型」。総じて画面共有ロングテイクが基調で、
    # B-rollモンタージュ/複数スクリーンショット列挙の瞬間だけカット率が跳ね上がる
  visual_rhythm_per_min: 2.95-25.96  # 実測（scene0.08。v1=2.95/v2=20.18/v3=25.96）。
    # v1が突出して低いのは、v1がほぼ純粋な画面共有チュートリアル（VS Code操作）で
    # ソフトな視覚変化（グラフ・カード切替）も少ないため。v2/v3はB-roll・ランキング
    # 表・複数アプリスクリーンショットの提示が多く、ソフト変化が頻発する
  camera: static                     # 実測（生身の人物によるカメラワークは3本とも
    # 存在しない。全編が「画面録画（アプリ/ブラウザUI）」「静止/軽微アイドルの円形
    # アバターPiP」「静止B-rollタイトルカード」のいずれかの組み合わせで構成される）
  broll_usage: occasional〜heavy     # 実測（v1はB-rollほぼ皆無＝画面共有ロングテイクの
    # 前後にアバター単体の挨拶が付くのみでoccasional寄り。v2/v3は動画開始直後に
    # アンティーク調イラスト・製品タイトルカード・ベンチマーク表スクリーンショット等
    # の高頻度モンタージュがありheavy。同一チャンネルでも動画テーマ（チュートリアル型
    # か列挙・ニュース型か）でB-roll比率が大きく変わる）

palette:
  background_hex: "画面共有アプリのネイティブ配色に依存（素材依存、固定背景色は存在
    しない）。B-rollタイトルカード/資料カードはほぼ純黒〜濃紺（#0A0A0Fに近い暗色）を
    背景に使用"   # 実測目視（360pのため近似）
  brand_hex: ["#052BE2(キャプションバー地色・青。v1/v2の独立ヒストグラム実測で
    ほぼ完全一致=#052BE2と#0029DE・高confidence)", "#D1592D(タイトルカード見出し
    文字/アイコン配色・オレンジ。ヒストグラム実測)", "#A70508(UIコールアウト赤矩形枠、
    ヒストグラム実測)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#FFFFFF"      # ナレーション同期キャプション/チャプタータグの白太字
      # （emphasis_rolesの記述から変換・原文にHEX記載なし、両者共通運用）
    color_bg: ["#052BE2", "#000000"]  # #052BE2=キャプションバー地色（brand_hex実測）。
      # ※brand_hexに併記の #0029DE は**同一要素をv2で独立測定した値**であり別ロールではない
      # （v1=#052BE2 / v2=#0029DE がほぼ一致したことが高confidenceの根拠）。
      # color_rolesには代表値としてv1の#052BE2のみを載せる。2026-07-27の横断監査で
      # 「#0029DEが未マップ」と指摘されたため、重複登録ではなく本注記で解消した。
      # #000000=チャプター/動画情報タグの不透明黒地（emphasis_rolesの記述から変換・
      # 原文にHEX記載なし）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: "#D1592D"    # タイトルカード見出し文字色（brand_hex実測）
    color_stroke: "#A70508"    # UIコールアウトの赤矩形枠、塗りなし細線（brand_hex実測）
    color_primary: null
    color_glow: null
  emphasis_roles:
    ナレーション同期キャプション: 青#052BE2地+白太字（全チャンネル共通の意味づけ、
      強調色分けは無し=キャプション自体は単色運用）
    チャプター/動画情報タグ: 不透明黒地+白太字（キャプションと役割分離、常に
      画面右上の同一スロットに表示）
    UI要素の指し示し（コールアウト）: 赤矩形枠（塗りなし・細線、#A70508系）。
      screen_tutorial/ai_tool_avatarの赤コールアウトと同系統だが色相がやや
      異なる（ai_tool_avatar=#DF1014系、本チャンネル=#A70508系。ともに純赤寄りで近縁）
    タイトルカード見出し: オレンジ#D1592D太字（濃紺〜黒背景、アイソメトリック風
      イラスト・アイコンと組み合わせる）

telop_layers:
  - role: title_bar            # チャプター/動画情報タグ: 画面右上の単一スロットに
    # 「動画について」「動画のもくじ」（デフォルト/導入時の状態）と「第◯章:{トピック}」
    # （章本編の状態）を排他的に切替表示する。冒頭・章の合間は前者、章本編に入ると
    # 後者に切り替わる。章の変わり目の一瞬だけ、同一文言がbelowのcaptionバーにも
    # エコー表示されることを確認（章転換の強調演出）。実測（Pillowピクセルスキャンで
    # 境界確認、v1 f_01: x428-636,y0-38 / 複数フレームでtitle_bar領域の左端x=428-460
    # 付近でばらつきあり=文字数に応じた可変幅ピルと判断）
    slot_states: ["動画について", "第◯章:{トピック}"]   # 【2026-07-27 R6追加】
      # このroleは**単一スロットで2状態を排他的に切り替える**。
      # 「排他的」という語は**role内の状態切替**を指しており、
      # 他roleとの `mutually_exclusive_with` とは別concept。フィールドで区別する
    overflow_policy: split_event   # 【2026-07-27 R6 一括掃引】`max_lines: 1` だけでは折返しは止まらない。
      # 折返し器は max_chars で改行するので**結果の各行は制約を満たしたまま2行になる**
      # （ai_tool_avatarで実測。**documentary_immersive が退行したという私の当初の報告は誤り**で、
      #  R6のFAILは検証者が意図的に作った違反対照窓＝14字「max_lines:1 違反の対照」だった。
      #  掃引そのものは正しい——10ファイルが本当にこのフィールドを欠いていた）。
      # 超過は折り返さず**複数のテロップイベントへ分割する**
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
    exit_sec: 0.2
      # 【2026-08-02】pop は「定義上0秒」として検査から外していたが誤り。
      # hard_cut は本当に0秒だが、**pop はアニメーションなので0秒ではない**。
      # 0.2 は【導出値・要実測】。同ファイル内の fade 0.35 より短い一般的なポップの尺。
      # entrance と対称と仮定（schema.md の既定。未計測）
    char_width_px: 62   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.822, centerY: 0.062}   # 【2026-07-27 R10・4辺検算をlintに実装したら出た】schema.mdはR3から4辺検算を必須と
      # 定めているのに機械照合が無く、手検算で毎周どこかが抜けていた。
      # 旧 0.83/0.06 は**右2.4px・上14.8px**。0.822/0.062 で右17.8px・上17.0px
      # 0.05=54pxでは高さ94pxのピル（上端7px）が画面外へ出る。
      # 0.06=64.8px、上端17.8px。影の左上−3pxを引いても14.8pxで画面内
    anchor: right_edge           # 【2026-07-27追加】**centerXは近似値であり、実体は右端アンカー**。
      # 上記のPillow実測（v1 f_01: x428-636、右端636@640 = 1908@1920）は
      # 「右端から12px」を示している。文字数で幅が変わるピルなので中心は動く。
      # 実装は右端固定で組むこと（centerX 0.83はその近似）
    size: {width: 624, height: 94}   # 【2026-07-27 R4追加】**外形**。
      # Pillow実測（v1 f_01: x428-636@640 → 624@1920）はピルの**外形**を測った値である
    max_width_px: 576            # 【2026-07-27 R4 訂正】624を**外形と折返し幅の両方の意味で
      # 使っていた**（同一ファイル内で由来と定義が食い違っていた）。
      # 折返し幅 = 外形624 − padding24×2 = 576
    max_lines: 1         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 見出し/バッジ系は1行が前提（2行になると帯の高さが倍になり近接要素を潰す）。
      # 収まらない文言は行を増やすのではなく**文言を短くする**こと
    font_px_max: 62   # 【境界解・2026-07-27 R7実測】上端の余裕**14.8px**。
      # 破れる条件: font_px_max を64にする / centerY を 0.05 に戻す
      # 許容する。**【2026-07-27 R5 訂正】この根拠は前提が変わって成立しなくなった**
      # （旧: 64pxだと10字=640px > max_width_px 624。現在は max_chars 9 / 折返し幅576 で
      #  9字@64px=576 ≤ 576 となり**64pxでも入る**）。
      # それでも62pxを維持するのは、64pxだと**余裕0pxの境界解**になるため。
      # ※右端は影込みでちょうど1920（余裕0）。ここも境界解である。roleごとのフォント上限を書かないと
      # 「caption_fontのレンジ上端を選んだ実装者」だけが破綻する
    max_chars: 9                 # 【2026-07-27 R4】折返し幅576 ÷ font62 = 9.3字
      # 【旧記述】10（外形624基準）。旧max_chars 20は実現不能だった:
      # centerX0.83 × max_chars20 × フォント56-64px は**同時に成立しない**。
      # 検算上の上限は約10字で、**20字は右へ279px流出**する。実測で
      # 「第一章 クロードコードの導入と初」で切れ末尾4字が消えた。
      # しかも**同一ファイル内のPillow実測（幅624px）が「約10字」を示しており、
      # max_chars 20 は自分自身の実測と2倍食い違っていた**
    max_height_px: 94            # 【2026-07-27 再修正】旧60は**font 56-64pxと両立しない**
      # （asc+descだけで82-94px）。実測で**上端が7px切断**され、目視でピルの角丸が
      # 水平に切れていた。font上限64px時の実高94pxを採り、centerYの側を下げて収める
    persistent: true
    style: 帯                  # 角丸ピル、不透明黒地
    z_order: 3                  # 【2026-07-27 z_order遡及追加】常駐要素(persistent:true)。
      # モードA中はcaption(4)より背面に置く（発話字幕の可読性優先）が、keyword(1)や
      # nameplate(2)よりは前面。下記z_order_policy参照
    # 【2026-07-27 重複キーの解消】ここには旧 `max_width_px: 未計測` と `max_chars: 20` が
    # あり、上で設定した 624 / 10 を**YAMLの後勝ちで無効化していた**（パーサ実測で確認）。
    # 修正コメントだけ残って値が1つも生きていない状態だった。旧値を削除する。
    # 同型の事故を japan_vlog でも起こしており、**重複キー検出を横断掃引に入れた**。
    entrance: pop               # 推定（静止画タイルでは瞬間切替に見えるが、サブ秒の
    entrance_sec: 0.2
      # 【2026-08-02】pop は「定義上0秒」として検査から外していたが誤り。
      # hard_cut は本当に0秒だが、**pop はアニメーションなので0秒ではない**。
      # 0.2 は【導出値・要実測】。同ファイル内の fade 0.35 より短い一般的なポップの尺。
      # フェードは検出限界のため断定不可）
  - role: caption               # ナレーション同期キャプション: 画面下部中央に
    # ほぼ全フレームで出現する短文キャプション。発話に同期した短いフレーズ単位
    # （要点抜き出し寄り、全発話フル字幕ではない）。実測（Pillowピクセルスキャンで
    # v1 f_02: x176-464,y322-348＝centerX0.5固定・幅は文字数に応じ可変、高さ約7.2%）
    max_width_px: 1500           # 【2026-07-27 R3追加】「未計測」のままだと**折返し幅を
      # 発明し直すたびに行数が変わり、centerY 0.86 の妥当性ごと変わる**。
      # 画面幅の78%を上限とする導出値（実測ではない。実素材で再計測すること）
    overflow_policy: split_event   # 【2026-07-27 R9・掃引】**max_chars は行数を止めない**。歯止めは
      # overflow_policy にしかない（R9で investigative の caption が62字→4行・
      # 各行17字以下・**違反ゼロ**のまま95px見切れた）。規約はR8時点で
      # 存在していたのに掃引が1箇所で止まっていた
    position: {centerX: 0.5, centerY: 0.836}   # 【2026-08-01 R12】下 -7.1px（画面外）→ +18.3px。4辺検算が `size` 宣言ありのroleしか見ておらず、11周この役は一度も検査されていなかった
      # 【2026-07-27 見切れ修正】
      # **旧** centerY 0.93 は `max_lines: 2` と**構造的に両立しなかった**（現行は0.86）。
      # 2行字幕が**32.4px切断**され（実フレームで目視確認）、font 48〜56の全域で
      # パディング0でも入らない。max_lines を後から足したのに
      # **下端検算をやり直していなかった**（narrated_jpと同じ失敗）。
      # 0.86 = 928.8px、2行約200px+フチ+影12pxで下端1040.8px（画面内）
    persistent: true            # 実測（45秒間隔サンプリングでほぼ全フレームに出現。
      # 完全な意味での100%常駐かは未確認だが出現率は極めて高い）
    style: 帯                  # 角丸、青#052BE2地+白太字
    z_order: 4                  # 【2026-07-27 z_order遡及追加】発話キャプションは最優先で
      # 読まれる必要があるためtitle_bar(3)より前面。sidebar(5、全画面カード)表示中は
      # 完全遮蔽パターンにより不可視化される想定
    # 【2026-07-27 重複キーの解消】ここにあった `max_width_px: 未計測` は、
    # 上で設定した 1500 を後勝ちで無効化していた。lintが即検出したので削除。
    # **私が同じ事故を作るのは4度目**（lintを作った直後に踏んだ）。
      # 折返し幅が無いとmax_charsは「そのフォントサイズでのみ有効な脆い定数」になる。
      # 実素材で折返し幅を測ってから数値に置き換えること（schema.mdの規約）
    max_lines: 2         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 実測で、幅だけ縛ると**行数が増えて事態が悪化する**ことが4スタイルで確認された
      # （japan_vlog 3行31px→4行86px侵入 / wipe captionのPiP重なり15.9%→31.0% /
      #  investigativeの見出しが3行化してkeywordを100%被覆）。
      # 3行以上必要な発話は**複数のテロップイベントに分割する**
    max_chars: 16                # 【2026-07-27 R5・lintの穴を塞いで検出】旧20は**一度も拘束しない死に値**
      # だった（20字×font92=1840px > max_width_px 1500px で、1行に入るのは16字）。
      # **幅を足したときに文字数を直していなかった**。3スタイルで同型               # 目視推定
    entrance: pop                # 推定（静止画タイルでは瞬間切替、動きの種類は
    entrance_sec: 0.2
      # 【2026-08-02】pop は「定義上0秒」として検査から外していたが誤り。
      # hard_cut は本当に0秒だが、**pop はアニメーションなので0秒ではない**。
      # 0.2 は【導出値・要実測】。同ファイル内の fade 0.35 より短い一般的なポップの尺。
      # サブ秒のため検出限界外）
    exit: pop                    # 推定
    exit_sec: 0.2
      # 【2026-08-02】pop は「定義上0秒」として検査から外していたが誤り。
      # hard_cut は本当に0秒だが、**pop はアニメーションなので0秒ではない**。
      # 0.2 は【導出値・要実測】。同ファイル内の fade 0.35 より短い一般的なポップの尺。

  - role: nameplate             # 話者アバター（円形PiP）: 実写と思われる人物の
    # 円形クロップ映像。イントロ（挨拶）とアウトロ（別れの挨拶）付近では出現するが、
    # 画面共有デモが主役の区間（本編の大部分）では非表示になる間欠的な要素。
    # 表示時は直上に「※動画内の情報は動画作成時のものです」という小さな免責キャプション
    # が常に併記される。実測（Pillowピクセルスキャンでv1 f_01: x550-635,y270-360付近
    # ＝centerX0.925/centerY0.87、幅約13%）
    layer_kind: video            # 【2026-07-27追加】このroleは**動画レイヤー**であり
      # overlap_qc の検査対象から自動的に除外される（アルファを静的に取れないため）。
      # screen_tutorialの検証では生成20レイヤーに対し element_count=19 となり、
      # **PiP絡みの衝突8件がQCに1件も現れなかった**。QCの盲点は既知でも
      # 「どのroleが盲点に落ちるか」がyamlから読めなかったので機械可読な印を付ける。
      # **このroleは必ずフレーム目視で確認すること**
    exit: hard_cut   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    position: {centerX: 0.925, centerY: 0.87}
    persistent: false            # 実測（v1の45秒間隔フルタイル15枚中、アバターが
      # 確認できたのは冒頭・末尾の2枚のみ。中間13枚は画面共有のみでアバター非表示）
    style: プレーン              # 円形クロップ
    z_order: 2                  # 【2026-07-27 z_order遡及追加】caption(4)とY帯が一部
      # 重なる（caption y966-1044px vs nameplate y810-1080px@1920x1080換算）が、
      # 実測bbox(Pillowスキャン)ではX座標が分離しており衝突なし
      # （caption右端x≈1392px vs nameplate左端x≈1650px）。下記z_order_policy参照
    entrance: hard_cut            # 推定（フェード等は検出されず、モード切替と
      # 同時に瞬間出現/消滅する挙動）
  - role: sidebar                # B-rollタイトルカード/資料カード: フルスクリーンの
    # 静止画（製品ロゴ入りアイソメトリック風イラスト、ベンチマーク表スクリーンショット、
    # 他サイトのUIキャプチャ、アンティーク調イラスト等）。テーマ導入や複数事例の列挙時
    # に多用される。実測
    exit: hard_cut   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
      # entrance と対称と仮定（schema.md の既定。未計測）
    text_content: none   # 【2026-07-27 R9追加】このroleは**静止画そのもの**（製品ロゴ入りイラスト、
      # ベンチマーク表のスクショ、他サイトのUIキャプチャ）で、yaml側で組む文字を持たない。
      # 「size だけあって中身が無い」検査からの明示的な除外
    position: {centerX: 0.5, centerY: 0.5}
    persistent: false
    style: カード
    z_order: 5                  # 【2026-07-27 z_order遡及追加】全画面カードのため最前面。
      # SKILL.mdの「全画面不透明カードによる完全遮蔽」許容パターンに従い、表示中は
      # title_bar/caption/nameplate/keywordを覆い隠す想定（下記z_order_policy参照）
    entrance: hard_cut             # 実測寄り（ハードカットでの差し替えが基本。ただし
      # scene0.3閾値で検出されない緩やかな移行区間が複数の45秒サンプル間で疑われる
      # ＝下記apply_notes参照、未確定）
    size: {width: 1920, height: 1080}   # 【2026-07-27追加】`opaque_fullscreen: true` を書くなら
      # size の併記が**必須**（schema.mdの規約）。宣言だけでは1ピクセルも覆えず、
      # 実測で被覆率 business_talk 14.4% / educational_explainer 23.1% /
      # screen_tutorial 31.4% となり overlap_qc が全部却下した
    opaque_fullscreen: true   # 【2026-07-27 訂正】当初 `mutually_exclusive_with: all` と
      # 書いたが**誤りだったので撤回した**。再実装検証で、厳格解釈（常駐要素を時間分割で
      # 消す）と緩い解釈（z_orderで覆うだけ）の出力が**1画素も違わない**こと、
      # および**排他宣言を持たない全画面要素も同じく下を消す**ことが実測された。
      # ＝あのフィールドは実装を変えないinertな宣言だった。
      # 遮蔽は「全画面かつ不透明」＋z_orderで自動的に決まるので、
      # **要素自身の性質**として宣言する（フレームを見れば検証できる）。
      # 実装者への意味: この要素の下は描画を省略してよい
      # ※ただし title_bar(persistent:true) が全画面カードの上に残るかは**未確認**と
      # 本ファイルが自認している。実装時はフレーム目視で確定させること
  - role: keyword                 # UIコールアウト（赤矩形枠）: 画面共有内の特定の
    # テキスト/UI要素（コマンド入力欄、価格表の行、強調したい設定項目等）を赤矩形の
    # 細線枠で囲む。screen_tutorial/ai_tool_avatarと同系統の手法。実測（v1のVS Code
    # デモで複数箇所確認: 「code」コマンド入力欄、画面右上のフォルダーボタン付近）
    position_mode: anchored_to_target   # 【2026-07-27追加】**この座標は固定値ではない**。指し示す対象（UI要素・チャートの棒・画面内の物体）の
      # 位置に追従する。散文は「対象により可変」「固定位置ではない」と書いているのに
      # positionが固定値1つしか持たず、**散文と構造化フィールドが矛盾**していた。
      # 実害: documentary_cinematicのkeywordが固定値のまま棒グラフを潰し
      # 「労働」の棒を91.8%被覆した。下記positionは代表値であり、
      # 実装は対象の実座標から算出すること
    exit: pop   # 【2026-07-27 R9追加】**exit フィールド自体が欠落**していた。
    exit_sec: 0.2
      # 【2026-08-02】pop は「定義上0秒」として検査から外していたが誤り。
      # hard_cut は本当に0秒だが、**pop はアニメーションなので0秒ではない**。
      # 0.2 は【導出値・要実測】。同ファイル内の fade 0.35 より短い一般的なポップの尺。
      # entrance と対称と仮定（schema.md の既定。未計測）
    position: {centerX: 0.35, centerY: 0.45}   # 目視（対象要素により大きく可変、
      # 固定位置ではない）
    persistent: false
    style: プレーン
    z_order: 1                  # 【2026-07-27 z_order遡及追加】画面共有コンテンツ内の
      # UI要素そのものを囲む注釈のため全レイヤー中最背面。位置がvariable（クリック対象
      # 座標に追従）なため、title_bar/captionの固定帯と偶発的に重なる可能性はゼロでは
      # ないが、通常は画面中央〜UI要素上に出るため常時は想定していない。実装時に
      # 対象箇所が画面下部/右上に近い場合は個別に重なりを確認すること
    entrance: pop                   # 推定
    entrance_sec: 0.2
      # 【2026-08-02】pop は「定義上0秒」として検査から外していたが誤り。
      # hard_cut は本当に0秒だが、**pop はアニメーションなので0秒ではない**。
      # 0.2 は【導出値・要実測】。同ファイル内の fade 0.35 より短い一般的なポップの尺。
caption_font: |
  未計測（360p制約により原寸不明）。Pillowピクセルスキャンで得た相対寸法から逆算した
  推定値（実測ではなく計測値からの逆算である旨を明記）:
  - caption（ナレーション同期・青#052BE2帯）: 実測高さ約7.2%(≒78px@1080)の帯に収まる
    白太字。帯の上下パディングを考慮すると本文フォントは目安48-56px相当と推定
    （chaenデフォルト92pxよりかなり小さい、帯型キャプションのため黒フチも不使用と推定）
  - title_bar（チャプター/動画情報タグ・黒帯ピル）: 実測高さ約10.6%(≒114px@1080)の帯。
    同様に本文は目安56-64px相当と推定
  上記はいずれも実測ではなく推定値であり、実装時は完成フレームでの目視比較を必須とする。
  黒フチは不使用（帯の背景色自体で可読性を確保する設計のため、chaenデフォルトの
  黒フチ12pxはこのスタイルには適用しない）

z_order_policy: |
  モードA（画面共有ロングテイク）中はtitle_bar(3)+caption(4)+keyword(1、UI要素強調時
  のみ)が同時表示されうる。captionは発話内容そのもので最優先の可読性が必要なため
  title_barより前面(4>3)、keyword(1)は画面共有コンテンツに直接重畳する注釈のため
  両者より背面に置く。
  nameplate(2、話者アバターPiP)はイントロ/アウトロ区間でtitle_bar/captionと同時表示
  されうるが、実測（Pillowピクセルスキャン）でX座標が分離しておりpixel衝突は無い
  （caption右端x≈1392px vs nameplate左端x≈1650px、1920px基準換算）。
  モードB（B-rollモンタージュ）で使うsidebar(5、全画面カード)は最前面固定とし、
  SKILL.mdの「全画面不透明カードによる完全遮蔽」の許容パターンに従い他要素を覆い隠す。
  ただし、モードB中にtitle_bar(persistent:true)が全画面カードの上に重ねて表示され
  続けるか非表示になるかは45秒間隔サンプリングでは判別できておらず未確認
  （apply_notes参照）。安全側としてsidebar表示中は他要素を非表示にする実装を
  デフォルトとする。

animation_dictionary_mapping:
  title_bar/captionのテキスト差し替え: in.pop（推定。静止画タイルでは瞬間切替に
    見えるが、サブ秒のフェードは検出限界のため断定不可）
  アバターPiPの出現/消失: hard_cut（実測寄り。画面共有⇄アバター表示の切替は
    フェード等のトランジションを伴わず瞬間的に起きる。ai_tool_avatarの
    大ネコキャラ⇔小PiPの切替と同じ「即時排他切替」パターン）
  B-rollタイトルカードの差し替え: hard_cut（実測寄りが基本）。ただし45秒間隔の
    粗いサンプリングでは検出できない範囲でクロスフェード等が使われている可能性が
    残る（scene0.3のハードカット数が視覚変化の総量に対して少なすぎる区間が
    v1中盤等で見られたため。要フレームバイフレーム再検証）   # 推定・未確定
  赤コールアウト枠の出現/消滅: in.pop（推定。対象要素の切り替わりと同時に瞬間
    出現する傾向）
  不使用: shake / bounce / spring / char_pop / motion_path 等の派手な動き語彙は
    3本とも未検出（推定・n=3の範囲。落ち着いたトーンの解説チャンネルとして一貫）

transitions:
  default: hard_cut              # 実測（3本全編でディゾルブ・ワイプ形状トランジション
    # の明確な検出はゼロ）
  accent: []                     # 実測範囲では装飾トランジション無し。ただし上記
    # animation_dictionary_mappingの通り、ソフトな移行区間の存在は完全には否定できない
    # （推定・要検証）

audio:
  bgm: conditional                # 推定（confidence low。LRAが3.2-3.4LUと極めて狭く、
    # 常時薄いBGMベッドが敷かれている可能性はあるが聴取確認は未実施）
  voice_lufs_target: -19.1        # 実測（Integrated。v1=-19.1/v2=-19.1/v3=-19.1と
    # 3本完全一致。YouTube標準-14 LUFSより5LU前後低い、控えめなマスター音量。
    # ai_tool_avatar（-19.8〜-20.1）と近い値域＝AI解説系チャンネルに共通する
    # 音量傾向の可能性がある、ai_biz_pitch_*等の追加実測で検証余地あり）
  lra: 3.2-3.4                    # 実測（3本ともほぼ同一。ある程度のダイナミクスは
    # 残しつつ強めに管理された値域）
  true_peak: -3.5〜-4.9            # 実測（dBFS。v1=-4.9/v2=-3.5/v3=-4.8）
  se_style: unknown                # 未検証（聴取未実施）
  ducking: unknown                 # 未検証

pacing:
  gap_keep_sec: 0.5-1.0            # 実測（-35dB/0.5s基準。v1: 209回・153.72秒
    # (22.9%)・平均0.735秒・最長8.13秒・1秒超19回／v2: 347回・248.75秒(20.5%)・
    # 平均0.717秒・最長11.45秒・1秒超24回／v3: 277回・202.32秒(23.9%)・平均0.730秒・
    # 最長17.84秒・1秒超18回。3本とも総尺の20-24%が無音区間＝間を機械的に詰め切らない
    # 「落ち着いた」ペーシング）
  filler_policy: unknown           # 未検証（聴取・字幕精査未実施のため口語の残し方は
    # 不明）
  hook: cold_open〜title_first      # 実測（v1は0秒から画面共有+アバターの挨拶で
    # 即座に本題へ＝cold_open。v2/v3は0秒からB-rollモンタージュ+製品タイトルカード
    # （「Claude Fable 5」「NOW SHOWING FABLE 5」等）が先行し、ハードカット密度も
    # hook区間で跳ね上がる＝title_first寄り。動画テーマ（チュートリアル型か
    # 新機能・ランキング紹介型か）でフックの型が変わる）

structure_grammar:                  # v2拡張候補（ai_tool_avatarのdual_mode概念を
  # 踏襲した本チャンネル固有の構造）
  dual_mode: 全編が「モードA=画面共有ロングテイク（VS Code/ターミナル/ブラウザの
    連続録画、ハードカットほぼ無し、アバターPiP非表示）」と「モードB=B-rollモンタージュ
    （タイトルカード・ベンチマーク表・複数スクリーンショットの高速差し替え、
    ハードカットが密集）」の2モードで構成される。モードBはフック区間（動画冒頭）と
    章の切れ目・列挙型セクション（活用事例10選等）に集中する傾向があり、モードAが
    総尺の大部分を占める「画面共有が主役」の構成である点はwipe_explainer/
    screen_tutorialと共通する   # 実測（3本のタイル目視+scene0.3タイムスタンプ分布）
  chapter_slot_switching: 画面右上の単一スロットが「動画について/動画のもくじ」
    （デフォルト状態）と「第◯章:{トピック}」（章本編状態）を排他的に切替表示する
    仕組み。章の切れ目では同一文言が下部captionバーにも一瞬エコーされ、視聴者に
    章転換を二重に印象付ける   # 実測

packaging:
  thumbnail_style: 未取得
  chapter_style: 実測（上記chapter_slot_switching参照。YouTube公式チャプター機能の
    併用有無は未確認）
  endcard: true                    # 実測寄り（3本とも終端11秒を1秒刻みでタイル比較し、
    # 青いネットワーク/地球のデジタルアニメーションループが酷似したフレームで検出
    # された＝共通ブランドバンパー素材の使い回しの可能性が高い。ピクセル単位の完全
    # 一致検証は未実施のため「酷似」に留める。直前（t=600-650秒付近）に話者アバター+
    # captionでの別れの挨拶があり、その後にこのバンパーへ切り替わる構成。動画本体に
    # 焼き込まれた明示的なチャンネル登録CTAグラフィックは3本とも検出されず＝
    # YouTubeネイティブの終了画面（動画外レイヤー）に依存する設計の可能性がある）

apply_notes: |
  chaen-youtube-editパイプラインでの適用方法・実装上の注意点:

  【週4-5回更新のニュース速報型に見合った低コスト定型フォーマットという仮説の裏付け】
  brief判断基準にあった仮説（画面共有・資料提示の割合が高く、更新頻度に見合った軽量な
  編集になっている可能性）は、以下の実測結果から支持されると考える:
  1. v1は671.66秒中ハードカットわずか2回＝ほぼワンカットの画面共有ロングテイクで
     構成でき、カット編集の工数がほぼゼロで成立する
  2. B-rollは全て「テンプレート化されたアイソメトリック風タイトルカード」「他サイトの
     スクリーンショット」の組み合わせで、実写ロケや新規イラスト制作を必要としない
  3. エンディングは3本で酷似した同一素材ループ（毎回のエンディング制作コストがほぼ
     ゼロ）
  4. voice_lufs_targetが3本完全一致（-19.1）という精度は、バッチ処理型の自動
     ラウドネス正規化パイプラインの存在を示唆する
  5. チャプタータグ・キャプションバー・赤コールアウト枠・アバターPiPのいずれも
     位置・配色が固定された定型テンプレートパーツの反復使用で、動画ごとに新規の
     デザイン判断がほぼ発生しない設計になっている

  【実装時の優先順位】完コピを狙う場合、まず(a)画面右上のtitle_bar（動画情報/章タグ
  排他切替）と(b)画面下部中央のcaptionバー（青#052BE2固定）の2層を実装するのが
  最優先。この2層だけで動画尺の大部分（モードA=画面共有ロングテイク区間）を再現
  できる。次点でB-rollタイトルカード（モードB、章冒頭・列挙セクション用）と赤矩形
  コールアウト（screen_tutorial/ai_tool_avatarの実装をそのまま流用可能）を追加する。
  アバターPiP（実写・円形クロップ）は間欠的な要素のため優先度は低い。

  【未確認・今後の検証課題（正直に明記）】
  1. **B-rollタイトルカードの入退場アニメーション**: hard_cutと推定したが、45秒間隔の
     粗いサンプリングでは検出できない範囲でクロスフェード等が使われている可能性が
     残る（scene0.3のハードカット数が視覚変化の総量に対して少なすぎる区間が複数
     見られた）。1本を対象にフレームバイフレーム（wipe_explainer相当の精度）で
     再検証すれば確定できる可能性がある。
  2. **BGM/SE有無**: 聴取未実施のため断定できない（confidence low）。
  3. **フォント名・角丸半径・title_barの正確な不透明度**: 360p解像度のため特定不可
     （wipe_explainer/ai_tool_avatarと同様の制約）。
  4. **n=3だが単一チャンネルのみ**: 「ai_news_weekly系サンプル」固有の癖か、AI活用系ニュース速報
     チャンネル全体に共通する文法かは、他チャンネルでの追加実測が必要。同時取得の
     ai_biz_pitch_*素材が次点候補として手元にある（ai_tool_avatarは実測済み、
     ai_news_weeklyが2チャンネル目）。
  5. **エンドカード素材の完全一致検証**: ai_tool_avatarではピクセル単位の完全
     一致を確認したが、本チャンネルはタイル目視での「酷似」確認に留めており、
     厳密なピクセル差分検証は未実施。
  6. **アバターの実写/イラスト判定**: 360p解像度のため、実写を円形クロップした
     ものか高精細なイラスト/VTuberレンダリングかを完全には区別できていない
     （目視では実写寄りに見えるが確信度は中程度）。
