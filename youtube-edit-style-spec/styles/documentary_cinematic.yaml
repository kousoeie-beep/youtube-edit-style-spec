apply_notes: |
  chaen-youtube-editパイプラインでの適用方法・実装上の注意点:

  【視覚文法はA1・A2・A3の3本すべてで実測済み（2026-07-25）】telop_layers/palette/
  animation_dictionary_mapping は3変種それぞれの実測に基づく。
  **ただし3本が3つの異なる変種に分かれたため、各変種はn=1**。
  特定の変種で完コピを求められた場合は、同型チャンネルの追加実測を推奨する
  （「A系＝シネマ解説」というジャンル全体への一般化は依然として不可）。

  【LUFSは単一目標値にしない】A1=-18.3/A2=-20.3/A3=-24.7とばらつきが大きい
  （最大6.4LU差）。これはYouTube推奨-14LUFSからの距離もそれぞれ異なる（A1が最も近く、
  A3が最も遠い＝最も控えめ）。「A系はLUFS-20付近」のような単一の目標値を機械的に採用せず、
  素材の性格（速報性の高い時事解説か、じっくり系の調査ものか）に応じて選ぶこと。
  True Peakも同様にA1/A2はほぼ0dBFS張り付き、A3は-9.9dBFSと大きく開く。

  【A3の最大の特徴: ナレーション主導・顔出しゼロ】確認できた範囲でA3は資料映像・B-roll・
  簡易3Dモーショングラフィックスのみで構成され、話者の顔が一度も映らない。既存10スタイルの
  多く（基準プリセット/talk_show_sample等）が「話者の顔出し」を前提にしているのに対し、
  **A系（少なくともA3）は"見せる素材"が主役でパーソナリティは声のみ**という点が最大の差分。
  適用時は顔出しワイプやトーキングヘッドのカット割りロジックを使わず、資料映像の連続提示
  ロジックを主軸にすること。

  【字幕の扱いが未確定】A3のタイルでは発話追従字幕が一度も検出できなかった。これは
  「字幕を焼いていない」可能性と「45秒間隔のサンプリングで見落とした」可能性の両方があり、
  どちらか断定できない。chaen-youtube-editパイプラインで本スタイルを適用する際は、
  字幕を焼くかどうかをこうすけに確認するか、まずchaenデフォルト設定（フォント92/黒フチ12px）
  で実装して目視比較することを推奨する。

  【既存10スタイルとの最大の差分】educational_explainer（ホワイトボード解説）に近い
  「資料提示型」ではあるが、常駐アウトラインが無く、テロップの色による意味論的強調も
  ほぼ皆無（chaenデフォルトの黄色強調文化と対照的）という点が既存スタイルには無い特徴。
  編集時は「派手な強調テロップを足したくなる衝動を抑え、資料映像自体の情報量で見せる」
  判断基準として使うとよい。

  【未確認・今後の検証課題（正直に明記）】
  1. ~~A1・A2のタイル絵コンテが存在せず実測できていない~~
     → **2026-07-25に両方のタイルを生成・目視して解消済み**。A1=顔出しホスト型（アンティーク
       地図モーショングラフィックス主役）、A2=専門家インタビュー型（データチャート＋スポンサー
       ロゴ常駐）と確定し、telop_layersにもroleを追加した。**3変種への分岐はこの検証で判明した**
  2. 字幕の有無そのものが未確定（45秒間隔サンプリングの限界）。**未解決**
     ※A1では「常時の発話字幕は確認されなかった（引用素材由来の字幕は存在する）」ところまでは
       確認したが、A3で字幕が本当に無いのかサンプリングで外しただけなのかは依然不明
  3. BGM・SE・ducking・filler_policyは聴取未実施のため全て未検証。**未解決**
  4. ~~n=3（うち視覚文法はn=1相当）~~
     → **視覚文法もn=3に到達済み**（A1/A2/A3の3本とも目視確認）。ただし
       **3本が3つの異なる変種に分かれた**ため、「各変種はn=1」という別の限界が残る。
       特定の変種を採用する場合は同型の追加実測を推奨する（ジャンル全体への一般化は依然low）
