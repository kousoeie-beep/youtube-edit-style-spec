z_order_policy: |
  【2026-07-27 role分離に伴い更新（監査3対応）】旧nameplate/sidebar/captionの重複を
  archival_map_graphic/archival_insert_card/quote_card/sponsor_embed/sponsor_logo/
  channel_logoへ分離した（telop_layers本体参照）。

  解説カードとCTAカードは実測上ほぼ同時表示されない（排他的）ため、
  リスト順=重なり順の原則を適用しても実害は出にくい。将来サブタイトルレイヤーを
  追加する場合は、字幕を最前面（z_order最大）に置くことを推奨（chaen既定文法との整合）。
  A1/A2/A3は互いに排他的な変種であり同時に画面へ出ることは無いため、z_order数値は
  各変種の内部でのみ比較すればよい（変種をまたいだ同一数値の衝突は起きない）。

  A1内部はarchival_map_graphic/archival_insert_card(z_order1-2)を背面、
  quote_card/sponsor_embed(z_order3-4)を前面とする（テキストカードが資料映像の
  上に重なる構成のため）。archival_map_graphicとarchival_insert_cardは同じ
  「資料映像の全画面〜大型提示」を担うが被写体が異なる別装置であり、実測範囲では
  交互に切り替わる（同時表示は未確認）ため時間排他運用とする。quote_card/sponsor_embedが
  archival_*と実際に同時オーバーレイされるか（サイズ未計測のため）は判定保留とし、
  実装時はoverlap_qc実行＋フレーム目視での確認を必須とする。

  A2内部はsidebar(データチャート,1)の上に黄色ハイライト数値(keyword,2)を重ね、
  sponsor_logo/channel_logo(3)を常駐の最前面固定とする。sponsor_logoとchannel_logoは
  「小ロゴ」としか記述が無くサイズ未計測のため正確な衝突判定は不可（判定保留）だったが、
  原本コメントが位置に「右上/左上」の幅を持たせていたため、sponsor_logoをcenterX0.10
  （左上）へ、channel_logoをcenterX0.90（右上）に据え置き、画面の反対側へ分離することで
  衝突を確実に回避する設計とした（telop_layers本体のsponsor_logoコメント参照）。

