style_id: documentary_cinematic
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（cuts_per_min/visual_rhythm_per_min/LUFS/LRA/TruePeak/無音回数=A1・A2・A3全3本で
  ffmpeg実測）/ 目視実測（telop_layers・配色・構成・スポンサー枠の有無=**A1・A2・A3の3本全て**
  （2026-07-25にA1/A2を追加生成・目視して解消）、タイル絵コンテ
  目視。テキスト焼き込みキャプションは**A3のタイルでは1枚も確認できなかった**＝ナレーション
  主導で常時字幕を焼き込まない編集方針の可能性が高いが、360p級の縮小タイルでは小さい字幕の
  見落としも否定できないため中confidence）

  **【2026-07-25 更新・旧記述の訂正】** かつてここには「A1=A1・A2=A3の
  テロップ文法はA3から類推した仮説であり実際に確認していない／視覚文法が確定したのは実質n=1」
  と書いていたが、**その後A1・A2のタイルを追加生成して目視済み**であり、この記述は誤りだった。
  現在は **A1・A2・A3の3本とも視覚文法を実測確認済み**で、3変種に分岐することが確定している
  （下記 variant_split 参照）。**n=3で視覚確定**。

  【自己検証メモ】A3の全タイル（hook・full 45秒刻み全編・end）を目視したが、話者の顔出しは
  一度も確認されなかった（音声ナレーションのみ、資料映像・現場B-roll・簡易モーショングラフィックス
  が視覚の全てを構成する）。

  **【2026-07-25 追加検証で矛盾を解消】** 上記の「A1/A2が顔出しを含む可能性との矛盾」は、
  A1のタイルを後日生成して目視した結果 **矛盾ではなく実在するサブパターン分岐**と確定した。
  A1(A1)は**顔出しあり**（机の前で話す話者ショットが全編に複数回挿入される）。
  A3(A2)は**顔出しゼロ**。すなわち **A系は「顔出しの有無」で2分岐する**（下記
  variant_split参照）。実測せず放置していれば「A系＝顔出しゼロ」という誤った一般化を
  登録するところだった。

variant_split: |
  A系（シネマティック解説）は話者の顔出し有無で2つの下位パターンに分岐する。
  適用時はどちらかを先に選ぶこと。単一スタイルとして扱うと破綻する。

  (1) variant_host_present（A1=A1型・顔出しあり）
      - 机/書斎セットでの話者ショットを全編に周期的に挿入し、地図・資料の解説と往復する
      - 視覚の主役は**アンティーク調（セピア/テラコッタ）の地図モーショングラフィックス**。
        国旗バッジ、点線の接続線、人物カットアウトを地図上に配置して関係性を図解する（実測）
      - 引用カード（紙テクスチャ背景に白文字のセンター配置）、白黒アーカイブ映像、
        新聞記事・ニュースサイトのスクリーンショットをインサート（実測）
      - **スポンサー枠が本編に埋め込まれる**（実測: 話者ショット中に "40% OFF VANTAGE" の
        テロップとQRコードを同時表示）。編集時にスポンサー区間の設計が要る
      - 常時の発話字幕は確認されなかった（引用素材由来の字幕は存在する）
      - 実測値: cuts 7.21/分・リズム21.26・-18.3 LUFS・LRA 4.2・無音0.74%

  (2) variant_narration_only（A3=A2型・顔出しゼロ）
      - 話者の顔出しが一度も無く、資料映像・B-roll・モーショングラフィックスのみで構成
      - 実測値: cuts 11.97/分・リズム16.85・**-24.7 LUFS**（YouTube標準-14より10LU低い）・
        LRA 3.0・無音0.69%
      - 顔出しワイプやトーキングヘッドのカット割りロジックを使わないこと

  (3) variant_expert_interview（A2=A3型・専門家インタビュー主導）
      - **2026-07-25 タイル目視で確定**。(1)(2)のどちらにも当てはまらない第3のパターン。
      - ホストの顔出し解説ではなく、**専門家インタビューのトーキングヘッド**が視覚の柱
        （書棚を背景にしたリモート収録風の複数話者。ナレーターは画面外）
      - **データチャートを多用**（棒グラフ・横バーチャート。出典クレジットを小さく併記し、
        キー数値を黄色ハイライトで強調する。例: "$100,000,000,000"）
      - 研究室・製品接写・アーカイブ白黒映像などのB-rollを高頻度で差し替える
      - **スポンサーブランディングが画面隅に常駐**（実測: "PRESENTED BY Colgate Total" の
        小ロゴが右上/左上に継続表示）。A1の区間埋め込み型とは異なり常時表示型
      - チャンネルロゴ（A3）が右上に常駐
      - 実測値: cuts 16.37/分（A系最多）・リズム33.31・-20.3 LUFS・LRA 8.2・無音0.31%

  → **A系は単一スタイルではなく上記3変種を持つ**。適用時は「顔出しホスト型 /
    ナレーションのみ型 / 専門家インタビュー型」のどれかを最初に決めること。
    3変種でLUFSが-18.3〜-24.7、cutsが7.21〜16.37とばらつくのはこの構造差に起因する。

format:
  aspect: "16:9"
  duration_sec: "630-2371（A1=2370.5/A2=630.4/A3=847.1。尺のレンジが最も広いグループ。
    A2は10分強の短尺時事解説、A1は40分弱の長尺調査もの）"   # 実測
  cuts_per_min: "7.21-16.37（A1=7.21/A2=16.37/A3=11.97）"   # 実測
  visual_rhythm_per_min: "16.85-33.31（A1=21.26/A2=33.31/A3=16.85）"   # 実測
  camera: "**変種で3分岐（3本とも実測済み）**。A1=顔出しホスト型（机/書斎セットの話者
    ショットを周期的に挿入し地図解説と往復）／A3=narration_driven（話者の顔出しが一度も無く
    資料映像・B-roll・3Dモーショングラフィックスのみ）／A2=専門家インタビュー主導
    （書棚背景のリモート収録トーキングヘッドが柱、ナレーターは画面外）"
  broll_usage: "frequent（A3実測: 住宅建設現場の実写B-roll、3D家屋ワイヤーフレーム
    アニメーション、間取り図解、市街地空撮・3Dマップが途切れず連続。A1実測: アンティーク調
    地図モーショングラフィックス・白黒アーカイブ映像・新聞記事スクショ。A2実測: データチャート・
    研究室/製品接写・アーカイブ白黒映像を高頻度で差し替え。**3変種とも B-roll 主導である点は共通**）"

palette:
  background_hex: "A3実測（目視）: 濃紺〜黒の解説カード背景（#0F1E2E系、グリッド線装飾付き）。
    B-roll実写部分はチャンネル/題材依存で素材色そのまま。
    A1実測: アンティーク調のセピア/テラコッタ系（地図グラフィック）＋紙テクスチャ（引用カード）。
    A2実測: 白背景のデータチャート＋黄色のキー数値ハイライト"
  brand_hex: ["#0F1E2E系(A3の解説カード背景・目視推定)", "#FFFFFF(白・カード内白線ワイヤーフレーム)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: ["#FFFFFF", "#000000"]  # #FFFFFF=解説カードの白線ワイヤーフレーム
      # （brand_hex実測、テキストではなく線画だが近い役割として計上）、
      # #000000=スポンサーCTAの黒文字（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_bg: ["#0F1E2E", "#FFFFFF"]  # #0F1E2E=解説カードの濃紺グリッド背景（brand_hex推定・系）、
      # #FFFFFF=スポンサーCTAの白背景（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # ※この影は4辺の検算で**右下に12px・左上に3px**張り出す（2026-07-27 実測で再訂正）。
      #   当初 offset4+blur3=7px と素朴計算したが、Pillowのぼかしは半径以上に広がり
      #   実測は右下+11〜12px。さらに**ぼかしは左上にも広がる**ので3pxの項が要る。
      #   検算式にこの項が抜けていて常時過小評価していた（schema.md参照）。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: "未計測"      # 【2026-07-27 訂正】旧記述は null で、根拠を
      # 「色による強調ロールは無く、線画そのものが情報伝達の主役」としていたが、
      # **これはA3(解説カード変種)にしか当てはまらない**。
      # A2には keyword role が実在し「データチャート内のキー数値を**黄色ハイライト**で
      # 強調する（例: "$100,000,000,000"）」と実測されている。
      # 変種をまたいで1つの色ロールに畳んだために矛盾が生じていた。
      # 黄色のHEXは未計測なので "未計測"（"none" ではない）
    color_stroke: "#000000"    # 【2026-07-27 訂正】旧記述は null。しかし
      # apply_notes が発話字幕に「フォント92/**黒フチ12px**」を指示しており黒で確定していた。
      # 実装者が色ロールを見ても分からず散文を読む羽目になっていた
    color_primary: null
    color_glow: null
  emphasis_roles:
    解説カード(家屋ワイヤーフレーム/間取り図解): "白線イラストを濃紺グリッド背景に配置。
      色による強調ロールは無く、線画そのものが情報伝達の主役（A3実測、目視）"
    スポンサーCTA(SPONSOR_Aブランドカード): "白背景+黒文字+QRコード、A3チャンネル固有の
      定型フォーマット（本編途中に複数回・末尾に集中的に反復配置。実測）"

telop_layers:
  # 【重要】A3のタイル(hook/full 45秒刻み/end、計約20枚)を目視した範囲では、話者ナレーションに
  # 追従する字幕テキスト（発話字幕・キーワード字幕）そのものは一度も検出できなかった。
  # ※このコメントは**A3(A2)についてのみ**の記述である。2026-07-26にA1/A2のroleを
  #   追加したため、以下のリストには解説カード系以外の要素（A1の地図グラフィックス・引用カード、
  #   A2のデータチャート等）も含まれる。各roleのコメントで対象変種を確認すること。
  # 字幕が存在しない可能性と、
  # 45秒間隔のサンプリングで字幕表示区間を単に外した可能性の両方があり得るため、
  # 「字幕なし」と断定はせず、以下は「確認できたテロップのみ」の記録とする。
  - role: narration_infographic   # 【2026-07-27 R8・role分離】旧: role: sidebar[A3]。
    # 解説カード（家屋ワイヤーフレーム/間取り図解）: 画面全体または
    # 【分離した理由】`speech_caption` は排他をrole名 `sidebar` で指定しており、
    # schema.md の「role名で一括指定すると全エントリにかかる」に従うと**A3のカードにも
    # 排他がかかる**。ところがA3の装置は sidebar と caption の2つだけで、
    # speech_caption はその両方と排他 ＝ **A3では字幕の置き場が0になる**。
    # apply_notes が「まず chaen デフォルトで実装して目視比較せよ」と書いているのと
    # 正面から矛盾していた（R8で発覚）。schema.md は「常時表示が要求されるroleを
    # 排他で消さず、幾何で解く」と定めているので、**別role名にして排他から外し、
    # 下部の字幕帯を空けた寸法を与える**（A1/A2で2度行った分離と同じ手当て）。
    # 大部分を占める静止〜準静止インフォグラフィック。3Dモデルの微小な回転・レンダリング
    # ライン増加等の緩慢なアニメーションを伴う。実測（A3のみ）。A1/A2は別roleに分離済み
    # （下記archival_map_graphic/archival_insert_card/sidebar[A2]参照）。A1/A2/A3は互いに
    # 排他的な変種のため同一role名でも同時表示されない（2026-07-27 監査3対応・変種スコープ明示）
    variant: variant_narration_only   # 【2026-07-27追加】変種スコープを明示
    mutually_exclusive_with: [sidebar, caption]   # 【2026-07-27 R9】caption（A3のスポンサーCTAカード）を追加。
      # 幾何で 620×163px（小さい側の61%）交差しており、**主役の図解の上に
      # CTAカードが乗る**。R8で speech_caption の置き場は分離で確保したので、
      # ここを排他にしても字幕は失われない（それがR8の分離の目的だった）
    size: {width: 1920, height: 720}   # 【2026-07-27 R11】760 → 720。**分母だった speech_caption の上端が確定した**ので再導出。
      # 帯 = 上余白16px 〜 字幕の箱の上端756.0px − 16px = [16, 740]（724px）→ 720
      # R8の導出は下端（字幕を侵さない）しか解いておらず、**4辺検算をしていなかった**。
      # 帯 = 上余白16px 〜 speech_caption 2行上端800px − 16px = [16, 784]（768px）→ 760
      # speech_caption(centerY 0.838 / max_lines 2 / font_px 92・R11でフィールド化)の2行上端は
      # 950.4 − 134 − 12(フチ) − 3(影) = **801.4px**（R10実測は最悪グリフで799px）。
      # 【旧記述・R9で撤回済み】「785px以下 ＝ centerY 0.356 のとき下端784.8px。
      #   高さ800はその制約から決めた」——**この導出は下端しか解いておらず上端が
      #   −15.5pxで画面外だった**。3行上の [16, 784] からの再導出が現行値
    color_shadow: "none"   # 【2026-07-27 R9追加】画面幅いっぱい（1920px）の図解なので、共通デフォルトの
      # ドロップシャドウを当てると左右とも画面外に出る
    edge_bleed: true   # 【2026-07-27 R10・4辺検算】画面幅いっぱい（1920px）に敷くのが設計の図解。
      # `color_shadow: "none"` と対で、左右0pxは意図した値である
    text_content: none   # 【2026-07-31・外部PRで追加】素材側に文字が焼き込まれており yaml側の文字組みは無い。
      # **ただし実素材で確認した記録が無い**。schema.md の「検査を黙らせる修正をしない」に
      # 形の上では当たるので、次に実素材へ触るとき根拠を追記すること
    position: {centerX: 0.5, centerY: 0.35}   # 【2026-07-27 R11】0.35 = 378.0px（上端18.0px / 下端738.0px、字幕の箱の上端756.0pxに18.0px）
      # 【2026-07-27 R10】主語の無い断片が残っていたので補う:
      # **旧 centerY 0.5 は**字幕帯を239px侵していた（排他で隠していたので露見しなかった）
    persistent: false
    style: カード
    z_order: 1                # このスタイルで確認された最前面レイヤー（他レイヤーと同時
      # 表示される場面がタイル上で確認できなかったため、実質単独表示。数値は将来レイヤー
      # 追加時の相対比較用の暫定値）
    entrance: hard_cut          # 未計測（45秒間隔サンプリングのため、フェード等のサブ秒
      # トランジションは検出限界。前後のB-rollとの切り替わりがハードカットに見えることから
      # の推定。fade_sec=0と仮定するが要検証）
    exit: hard_cut               # 同上・未計測
  - role: speech_caption        # 【2026-07-27 新設・再実装検証で発覚した欠落】
    # **発話字幕を置くroleが存在しなかった**。role名 `caption` は下記のスポンサーCTAカードに
    # 占有されており、apply_notesは「フォント92/黒フチ12pxで実装せよ」と促すのに
    # 置き場所が無い状態だった。documentary_startup_journeyの `nameplate` 事案と完全に同型
    # （role名が別装置に取られていて必要な装置を定義できない）。
    # 実害: 検証者が字幕を自前配置した結果、t=28.0で**スポンサーCTAカードの
    # 価格+URL帯 58,991px のうち 34,484px＝58.5% を潰した**
    # （「$30/year」「sponsor.example/…」が読めない）。真因は座標ではなくroleの欠落。
    intentional_overlap_with: [archival_map_graphic]   # 【2026-07-27 R8追加】相互記載。字幕は地図の**直上**（z 5 > 1）に来る
    max_chars: 15   # 【2026-07-27 R8追加】1400 ÷ chaen既定font92 = 15.2。
      # **font_px を持たないroleなので既定92で導出している**。実素材で font を決めたら
      # この値も導出し直すこと
    overflow_policy: split_event   # 【2026-07-27 R8追加】3行必要な発話は折り返さず分割する（従来コメントにしか無かった）
    font_px: 92   # 【2026-07-27 R11追加】caption_font の chaen デフォルト。**下の size の分母**
    stroke_px: 12   # 【2026-07-27 R11追加】同上
    size: {width: 1424, height: 292}   # 【2026-07-27 R11・連鎖の切断を塞ぐ】**size が無いため、narration_infographic の
      # size.height 760 の分母（字幕2行の上端）が実装ごとに3通りに割れていた**
      # （幾何中心＝画面外8px / 下端固定＝図解と−16.6px / もう1通りのみ成立）。
      # 幅 = max_width_px 1400 + フチ12×2、高さ = 行高134×2 + フチ12×2
    position: {centerX: 0.5, centerY: 0.838}   # 【2026-07-27 R11】0.88 は **schema.md §5 自身の事前検算を16.4px落ちる**値だった
      # （max_lines 2 で下端が画面外）。0.838 = 905.0px、箱の下端1051.0px＋影12 = 1063.0px
      # ＝下余裕17.0px。上端759.0px（影−3で756.0px）
    max_width_px: 1400           # 【2026-07-27 再々修正・647は悪化だった】
      # 647はフチ12px+影を数えておらず**なお26.9px重なる**（真の上限は593.2px）。
      # しかも647は**7字/行＝1テロップ14字上限**になり、18字の発話は3行、23字は4行に
      # 分割が必要で、caption_font の「フルセンテンス型」と両立しない。
      # **そもそも幅で解く必要がなかった**。排他（下記 mutually_exclusive_with）が
      # 実測で 0/750フレーム違反ゼロと確認されており、CTAカード類とは共存しない。
      # 幅は発話字幕として自然な1400へ戻す。
      # 【旧記述】647の導出:
