style_id: educational_explainer
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: 実測（カット律/視覚リズム/LUFS/LRA/無音=ffmpeg実測・冒頭12分、既存資産と同一チャンネルで非常に高い整合） / 推定（フォント名は360p特定不能）

format:
  aspect: 16:9
  typical_duration: 30-70分（テーマにより幅あり。マルチパート連載）
  cuts_per_min: 0.08           # 実測（scene0.3: 1カット/12分。既存資産0.5/分よりさらに低い＝導入部の長回し）
  visual_rhythm_per_min: 1.6   # 実測（scene0.08: 19イベント/12分。既存資産2.0-3.5より低いが同傾向＝図解カード差し替えが主成分）
  camera: static               # 実測（固定1系統・ホワイトボード込み引き構図）
  broll_usage: occasional      # 実測（国旗カード・書影引用カード・地図カードを論拠提示時に挿入）

palette:
  background_hex: "#2F3B33（黒板調背景・推定）"
  brand_hex: ["#8B5A2B(木製フレーム装飾・推定)", "#CC1F1F(タイトル赤文字)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: null           # 定義提示の白ピル見出し直下の説明文字色など、地の文の色が
      # 原文に明記されていない
    color_bg: ["#000000", "#FFFFFF"]  # #000000=タイトルカード黒背景、#FFFFFF=定義提示の白ピル見出し背景
      # （いずれもemphasis_rolesの記述から変換・原文にHEX記載なし）
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: ["#CC1F1F", "#8B5A2B"]  # #CC1F1F=タイトルカード赤太字（brand_hex実測）、
      # #8B5A2B=木製フレーム装飾のアクセント色（brand_hex推定）
    color_stroke: "#000000"    # 【2026-07-27】nullから確定値へ。caption_fontが
      # 「chaenデフォルト（フォント92／黒フチ12px）」と明記しており、**テロップの縁は黒で確定**。
      # ※旧記述がnullだった理由は「用語カテゴリの色分け枠（陸運=緑/海運=青/空運=赤）が
      #   色名のみでHEX未記載」だったからだが、それは category_box の枠線であって
      #   テロップの縁取りとは別物。混同していた。枠線色は依然として未計測
    color_primary: null
    color_glow: null
  emphasis_roles:
    タイトルカード: 黒背景+赤太字大玉（テーマ名を2-4文字で提示）
    定義提示: 白ピル見出し+直下に大きめ太字で説明文
    国・地域紹介: 国旗アイコン+ラベル（例:「イギリス かつての覇権国」）
    用語カテゴリ: 色分け枠（陸運=緑/海運=青/空運=赤）
    参考文献: 書影+著者名+出版社のカード

telop_layers:
  - role: running_outline    # 【2026-07-27 role分離修正】旧: role: sidebar。本ファイルには
    # variant_split が無く単一スタイル内で「国・地域紹介カード」「出典カード」と機能の異なる
    # 3装置が同一role名"sidebar"を共有していた（監査3・educational_explainer §b-1で指摘）。
    # 分離してrunning_outlineとした。
    # 常駐アウトラインボックス: 木製フレーム(picture-frame)装飾+黒板調背景で、テーマ名+要点箇条書きを画面左上に常時表示。既存資産に無い固有の視覚シグネチャ（実測・本チャンネルの統一意匠）
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    font_px_title: 44   # 【2026-07-27 R11追加】**実測ではなく内容量からの導出値**（size 自身が同じ但し書きを持つ）。
      # 実素材で再計測すること。ただし空欄のままだと実装者が別の値を発明して
      # 箱の意味が消えるので、導出の前提を明示して埋める
      # テーマ名（1行）。行高65
    font_px_item: 30   # 【2026-07-27 R11追加】**実測ではなく内容量からの導出値**（size 自身が同じ但し書きを持つ）。
      # 実素材で再計測すること。ただし空欄のままだと実装者が別の値を発明して
      # 箱の意味が消えるので、導出の前提を明示して埋める
      # 要点箇条書き（最大4行）。行高44
    frame_px: 20   # 【2026-07-27 R11追加】木製フレーム（picture-frame）の枠幅。size に含む
    padding_px: 20   # 【2026-07-27 R11追加】枠の内側の余白
    max_lines: 5   # 【2026-07-27 R11追加】テーマ名1行 + 箇条書き4行
    max_width_px: 400   # 【2026-07-27 R11追加】480 − frame20×2 − padding20×2
    max_chars: 13   # 【2026-07-27 R11追加】400 ÷ font_px_item 30 = 13.3（箇条書き1行の上限）
    char_width_px: 30   # 【2026-07-27 R11追加】和文が律速（全角）
    max_chars_total: 48   # 【2026-07-27 R11追加】テーマ名13字 + 箇条書き13×4 = 65 のうち、
      # 実容量は端数の切り捨てで48字（400÷30=13.33 → 1行13字、テーマ名は font44 で9字）
    overflow_policy: split_event   # 【2026-07-27 R11追加】章を分ける（フォントを落とさない）
    position: {centerX: 0.14, centerY: 0.167}   # 【2026-07-27 R11】高さが321になったので 0.165 では上端14.7px。
      # 0.167 = 180.4px、上端16.9px（影−3込み）
      # 定めているのに機械照合が無く、手検算で毎周どこかが抜けていた。
      # 旧 0.16 は**上11.8px**。0.165 で上17.2px（region_card 上端423.4pxとも干渉しない）
      # 旧0.12は**上へ28pxはみ出し、木製フレームの上辺が丸ごと欠落**した（拡大フレームで確認）。
      # **旧** centerY0.12=129.6px に対し実装高さ316pxで上端が−28.4pxだった（現行0.16）。
      # 許容される高さ上限は260pxだが、木製フレーム+黒板背景+テーマ名+箇条書きという
      # 内容量では260pxに収まらない。**座標側を下げる**のが正しい。
      # 0.16=172.8px、高さ316pxで上端14.8px（画面内）。
      # ※position解釈規約§5は当初**下端しか規定しておらず上端が抜けていた**。
      #   この実害を受けて4辺すべての検算を規約に追加した
    size: {width: 480, height: 321}   # 【2026-07-27 R11】316 → 321。内訳を書けるようにした結果、
      # frame20×2 + padding20×2 + 行高65（テーマ名）+ 行高44×4（箇条書き）= 321。
      # **316は内訳の無い丸めた値だった**
      # 内容量からの導出値。実素材で再計測すること
    persistent: true
    style: カード
    z_order: 1                # 【2026-07-26 遡及追加】常駐の背景基準面として最背面寄り
    entrance: fade              # 秒数未計測（推定）
    exit: "N/A（常駐のため通常は退場しない。動画終了時のみ消失、未計測）"   # 【2026-07-26 遡及追加】
  - role: title_bar          # テーマタイトルカード: 黒背景+赤太字の大玉見出し（「地政学」）で章冒頭に提示。実測
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    font_px: 280   # 【2026-07-27 R9追加】同ブロックの実測記述「4文字だと running_outline に108px食い込む」
      # から逆算した。running_outline の右端 = 0.14×1920 + 480/2 = 508.8px。
      # 食い込み108px ⇒ 文字ブロック左端 400.8px ⇒ 幅1118.4px ⇒ 1字あたり約280px。
      # **大玉見出し（「地政学」）なので画面高の4分の1級のディスプレイサイズになる**
    max_chars: 4   # 【2026-07-27 R9追加】caption_font が示す「2-4文字」の上限。4×280 = 1120
    max_width_px: 1120   # 【2026-07-27 R9追加】4字×280px
    max_lines: 1   # 【2026-07-27 R9追加】大玉見出しは1行
    overflow_policy: split_event   # 【2026-07-27 R9追加】5字以上ならカードを分ける（フォントを落とさない）
    char_width_px: 280   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.5, centerY: 0.5}
    size: {width: 1920, height: 1080}   # 【2026-07-27追加】**必須**。
      # opaque_fullscreen を宣言しながら寸法が無かったため、実装者が
      # `style: カード` を内容サイズで解釈し**被覆率23.1%**にしかならなかった。
      # caption_fontが許す「2-4文字」レンジで実装すると16.3%〜28.8%で、
      # **どれを選んでも98%に届かない**（overlap_qcが宣言を却下する）。
      # 「黒背景の大玉見出しカード」は画面全体を黒で覆う演出なので1920x1080が正しい。
      # 4文字だと running_outline に108px食い込むという問題も、全画面なら遮蔽として成立する
    persistent: false
    style: カード
    z_order: 5                # 【2026-07-26 遡及追加】全画面カードのため章の変わり目で他要素を
      # 完全に覆う最前面。表示中は他レイヤーと同時表示しない設計とする
    entrance: fade               # 秒数未計測（推定）
    exit: fade                    # 【2026-07-26 遡及追加】秒数未計測（推定）
    opaque_fullscreen: true   # 【2026-07-27 訂正】当初 `mutually_exclusive_with: all` と
      # 書いたが**誤りだったので撤回した**。再実装検証で、厳格解釈（常駐要素を時間分割で
      # 消す）と緩い解釈（z_orderで覆うだけ）の出力が**1画素も違わない**こと、
      # および**排他宣言を持たない全画面要素も同じく下を消す**ことが実測された。
      # ＝あのフィールドは実装を変えないinertな宣言だった。
      # 遮蔽は「全画面かつ不透明」＋z_orderで自動的に決まるので、
      # **要素自身の性質**として宣言する（フレームを見れば検証できる）。
      # 実装者への意味: この要素の下は描画を省略してよい
  - role: definition_pill    # 【2026-07-27 role分離修正】旧: role: keyword。下記
    # 「用語カテゴリ色分け枠」と同一role名を共有し、`report/educational_explainer.md`の
    # 衝突検算で「定義2段組と用語カテゴリ色分け枠はyaml記載の座標(centerY 0.7/0.75)のまま
    # 実装すると実測bboxで衝突が確定する（下端867 > 上端740）」と判明していた
    # （監査3・educational_explainer §b-2で指摘・実測で衝突確定の唯一の事例）。
    # definition_pillへ分離し、下記category_boxの座標も併せて移動して衝突を解消した。
    # 定義・要点テロップ: 白ピル見出し+直下太字説明文の2段組。パンチラインだけ抜き出す方式。実測
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.5, centerY: 0.7}
    persistent: false
    style: 袋文字
    z_order: 3                # 【2026-07-26 遡及追加】
    entrance: pop                # 秒数未計測（推定）
    exit: fade                    # 秒数未計測（推定）
    mutually_exclusive_with: [category_box, region_card]   # 【2026-07-27 非対称を解消】
      # region_card 側には definition_pill との排他が書かれているのに、
      # **こちら側には category_box しか書かれていなかった**。
      # role単位で読む実装者は region_card との排他を知らないまま実装する。
      # **排他は必ず両側に書く**（wipe_explainer でも同じ非対称が見つかった）。
      # 【旧記述】同時表示が確認されておらず、
      # 実測bboxで衝突が確定していたため排他フラグを明示（下記category_box参照）
  - role: region_card        # 【2026-07-27 role分離修正】旧: role: sidebar。「常駐アウトライン
    # ボックス」「出典カード」と機能の異なる3装置が同一role名を共有していたため分離。
    # 国・地域紹介カード: 国旗アイコン+ラベルで論拠となる国を提示。実測
    max_width_px: 1050           # 【2026-07-27 R4】上記sizeに合わせた折返し幅。
      # 【旧記述】1000 の導出:
      # 1100は**解釈で結果が真逆になった**。schema.md準拠（折返し幅）だと
      # 1033px<1100 で折り返さず**左37px切断が完全再現**、yaml注記準拠（カード外形幅）だと
      # 2行化して**左余裕+101pxで解消**した。
      # schema.md で **max_width_px＝折返し幅（座布団・padding・フチ・影を含まない）**と
      # 定義を確定させたので、折返し幅として成立する1000pxへ下げる
      # （1033pxの内容が2行に折り返され、外形は下記sizeに収まる）。
      # 【旧記述】**左へ37px切断**していた（2度実測）。
      # centerX0.3=576pxで収まる最大幅は1120px（余白16px+影3px）。
      # yaml自身の例示ラベルを92pxで組むとカード幅1221pxになり超過する。
      # ※このroleは max_chars も max_width_px も持たなかったため
      #   **max_lines 一括補完の掃引対象から構造的に外れていた**（掃引条件の穴）
    max_lines: 2
    size: {width: 1250, height: 400}   # 【2026-07-27 R4 再修正・関係式が不完全だった】
      # 旧の `1120 = 1000+48+72` は**国旗アイコンの幅を1pxも含んでいなかった**
      # （emphasis_roles は「国旗アイコン+ラベル」と明記している）。
      # 内容の必要寸法は実測 **1201x388** で、旧sizeでは**テキスト右端が座布団からはみ出す**。
      # 正しい関係: 折返し幅1050 + アイコン80 + 間隔16 + padding24×2 = 1194 ≤ 1250、
      # 高さ388 ≤ 400。
      # 【旧記述】外形。
      # `size.width ≥ max_width_px + padding×2 + フチ×2` の関係（1000+48+72=1120）。
      # **size が無いと修正が再現しない**（ai_biz_pitch/startupで実証済み）
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    font_px: 92   # 【2026-07-27 R10追加】同ブロックの導出が「例示ラベルを**92px**で組むとカード幅1221px」と
      # 書いており、実測1201x388もこの前提で出ている。**その92がフィールドに無かった**ため、
      # 別のフォントで組まれると size も max_width_px も根拠を失う
    icon_px: 80   # 【2026-07-27 R10追加】国旗アイコンの幅。size の関係式（1050+80+16+24×2=1194）に使っている
    padding_px: 24   # 【2026-07-27 R10追加】同上
    max_chars: 11   # 【2026-07-27 R10追加】1050 ÷ 92 = 11.4
    char_width_px: 92   # 【2026-07-27 R10追加】国名ラベルは和文（全角）が律速
    overflow_policy: split_event   # 【2026-07-27 R10追加】max_lines:2 を超えるならカードを分ける
    max_chars_total: 22   # 【2026-07-27 R10新設】max_width_px ÷ char_width_px に端数が出るため、
      # **max_chars × max_lines は総量の上限にならない**（行ごとに端数ぶん損をする）。
      # 端数を切り捨てた保守値を総量として置く。実測できたら上書きすること
      # 1050 ÷ 92 = 11.41 → 1行11字、2行で22字
    position: {centerX: 0.35, centerY: 0.58}   # 【2026-07-27 R5 再修正・私が作った退行】
      # size を 320→400 に広げた結果、**下端860 と category_box 上端842 が18px衝突**した
      # （R4の320では22pxクリアランスがあった＝今回の拡大が原因）。
      # **規約③-3「その値から導出した他roleの座標」を自分で破っていた**。
      # 0.58 = 626.4px。**影を入れた実描画の下端は838px**で category_box 上端842pxに
      # **クリアランス4px**（2026-07-27 R6実測）。旧記述の「826.4px／15.6px確保」は
      # **影の項が抜けていた**。4pxは境界解なので、フォントか padding を上げると即破れる。
      # 上は running_outline 下端330.8px に対し95.6px空く
      # 【旧記述】R4 修正:
      # 幅1250では centerX 0.3（=576px）だと左端が−49pxで画面外。
      # 0.35=672px、左端47px（影3pxを引いて44px）で画面内
    mutually_exclusive_with: definition_pill   # 【2026-07-27追加】
      # **排他宣言が無いこのペアの方が、宣言済みペアより重症だった**
      # （pixel_collision 99.9% > 排他ペアの95.8%）。目視で「イギリス」→「イギリ」、
      # 「かつての覇権国」→「かつての」しか読めない。
      # 1ペアだけ宣言したことで**残りが安全に見える構図**になっていた。
      # 排他を1つ書いたら、同じ領域を使う他のペアも必ず検算すること
    persistent: false
    style: カード
    z_order: 2                # 【2026-07-26 遡及追加】
    entrance: fade               # 秒数未計測（推定）
    exit: fade                    # 【2026-07-26 遡及追加】秒数未計測（推定）
  - role: citation_card      # 【2026-07-27 role分離修正】旧: role: sidebar。上記と同じ理由で分離。
    # 出典カード: 書影+著者+出版社の実物引用（信頼性担保）。実測
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.75, centerY: 0.15}
    persistent: false
    style: カード
    z_order: 2                # 【2026-07-26 遡及追加】
    entrance: fade               # 秒数未計測（推定）
    exit: fade                    # 【2026-07-26 遡及追加】秒数未計測（推定）
  - role: category_box       # 【2026-07-27 role分離修正】旧: role: keyword。上記definition_pill
    # と同一role名を共有し、実測bboxで衝突が確定していた（`report/educational_explainer.md`
    # 「下端867 > 上端740」・監査3 §b-2）。category_boxへ分離し、centerYを0.75→0.87へ
    # 引き下げて衝突を解消した（definition_pillの想定下端約866pxに対し、category_boxの
    # 新しい上端は0.87×1080=940px付近となり十分な余白を確保。documentary_narrated_jpの
    # person_nameplate修正と同型の対策）。実装時はoverlap_qc+フレーム目視で再検証すること。
    # 【2026-07-26 スキーマ修正で追加】用語カテゴリ色分け枠: 陸運=緑/
    # 海運=青/空運=赤の枠線+背景色区分。palette.emphasis_rolesに明記されているがtelop_layers
    # に対応エントリが無かった欠落。単色文字強調の既存keyword（定義提示テロップ）とは
    # 「背景色区分」という点で性質が異なるため別エントリとして追加。実測
    entrance_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.5, centerY: 0.87}   # 【2026-07-27 再検証】旧0.75からの変更は
      # **算術が誤っていた**。当時のz_order_policyは「definition_pill下端866 /
      # category_box上端940 → 十分な余白」と書いていたが、**940は中心であって上端ではない**
      # （半分の高さぶんを取り違えていた）。実測は下端927 / 上端836 = **91px衝突**。
      # さらにフォントメトリクスから、パディング0でも下端910 / 上端872.6 =
      # **どう実装しても最低37.4px衝突する**ことが確定した。
      # 同ファイルのcaption_fontが見出し104px+本文92px+フチを課すため高さの下限が309pxになり、
      # 866pxに必要な220pxを達成できないため。
      # → **座標では解けない。mutually_exclusive_with が唯一の解**であり、
      #   その宣言は実測で「実装を実際に変え、出力から検証できる」ことが確認されている
      #   （撤回した `all` と違い inert ではない）。座標値はこのまま維持する
    persistent: false
    style: 枠線+背景色区分（陸運=緑/海運=青/空運=赤）
    z_order: 3                 # 定義提示テロップと同じ視覚レイヤー階層
    entrance: fade               # 未計測（推定。用語カテゴリの提示と同時に出現すると仮定）
    exit: fade                    # 未計測（推定）
    mutually_exclusive_with: definition_pill   # 【2026-07-27追加】上記参照

z_order_policy: |
  【2026-07-27 role分離に伴い更新（監査3対応）】本ファイルにはvariant_splitが無く単一
  スタイル内でsidebar/keywordの2role名がそれぞれ機能の異なる3装置/2装置に相乗りしていた
  （§b-1/b-2）。running_outline/region_card/citation_card（旧sidebar）、
  definition_pill/category_box（旧keyword）へ分離した（telop_layers本体参照）。
  特にdefinition_pill/category_boxは`report/educational_explainer.md`の実測bboxで
  衝突が確定していた（下端867 > 上端740）ため、category_boxのcenterYを0.75→0.87へ
  移動し、mutually_exclusive_withフィールドで排他関係も明示した。

  running_outline(1)を最背面の基準面とし、region_card/citation_card(2)を
  その上に重ねる。definition_pillおよびcategory_box(3)はさらに前面で、
  発話内容の要点強調として最も視認性を確保する。テーマタイトルカード(5)は章の変わり目に
  全画面で表示され他要素を完全に覆うため最前面固定とし、表示中は他レイヤーを同時表示しない
  設計にすること（既存資産・本セグメントとも同時表示は未検出）。
  ※本ポリシーはz_order欄が無かった旧テンプレート版からの遡及追加（2026-07-26）であり、
  数値は各roleの視覚的な役割から論理的に割り当てた推定値。実測によるレイヤー同時表示の
  検証は未実施（definition_pill/category_boxの衝突のみ実装報告で実測確認済み）。

caption_font: |
  未計測（12分セグメント、360p相当の解像度制約のため実寸不明）。【2026-07-26 遡及追加】
  採用すべきデフォルト: chaenデフォルト（フォント92／黒フチ12px／不透明度100%）をそのまま
  採用可能。定義提示テロップの見出しピル部分は本文よりやや大きめ（100-110px相当）を推奨
  （未計測、目視の相対比較に基づく推定）。用語カテゴリ色分け枠は文字装飾でなく背景色区分の
  ため、文字サイズはkeyword（定義提示）と同等でよい。

animation_dictionary_mapping:
  テロップ出入り: in.pop / in.fade / out.fade（静的。バウンス・スライドは不使用）   # 実測（既存資産と一致）
  図解・地図: 静止カード差し替え式（色分け地域のみ静止画で変化、アニメーショングラフ不使用）   # 実測
  動きの主役: 演者の身体（ジェスチャー・板書ポインティング）＝編集モーション最小   # 実測（既存資産と一致）
  常駐アウトラインボックス: 開閉アニメ無し、静止表示のまま話題ごとに中身のみ差し替え   # 実測（本セグメントの新規観測）

transitions:
  default: hard_cut          # 実測（インサートカード⇄演者もカット接続）
  accent: []                 # 実測範囲では装飾トランジション無し

audio:
  bgm: none                  # 実測（声とルームトーンのみ）
  voice_lufs_target: -15.2   # 実測（既存資産-15.8〜-13.5と高い整合）
  lra: 4.8                   # 実測
  se_style: none              # 実測
  ducking: false

pacing:
  gap_keep_sec: 1.0以上（頻出）   # 実測寄り（silencedetect -35dB/0.5s: 51回/12分。既存資産の「総尺17.7-19%が無音」という『間を残す話芸型』傾向と一致）
  filler_policy: keep_character   # 実測（編集は『引かない・足さない』が既存資産と共通の原則）
  hook: cold_open             # 実測（0秒コールドオープン、定型口上から即テーマ提示）
  structure: タイトルカード→定義提示→論点別カード（国旗/地図/色分け用語）を積み上げる講義構成   # 実測

packaging:
  thumbnail_style: 未取得
  chapter_style: 既存資産と同様（板書1枚=チャプターカード兼用、YouTubeチャプター設定併用が定番）
  endcard: 未確認（12分セグメント内では検出なし。既存資産では次回予告+提供クレジットが定型）

apply_notes: |
  Palmierパイプラインでの適用:
  - カット律が極めて低い(0.08/分)ため、カット編集の出番はほぼ無い。テンポは「図解カードの差し替え頻度」と「演者の身体性（ジェスチャー・板書）」で作る前提を崩さないこと。
  - gap_keep_sec: 無音を1.0秒以上でも積極的にカットしない。デッドエア除去に慣れた自動編集ロジックが誤爆しやすいジャンルなので、無音除去のしきい値をこのプリセット使用時だけ緩める（既存資産の「総尺17.7-19%が無音」を参考に、除去対象は2秒超のみに制限）。
  - 常駐アウトラインボックス（木製フレーム+黒板調背景）は本実測で新規確認した固有要素。既存資産のtitle_bar/sidebar構成に「常駐アウトライン」を追加する形で運用する。**なお本ファイル内でのrole名は `running_outline`**（2026-07-27に汎用の `sidebar` から分離・改名）。grepで `sidebar` を探しても本スタイルの常駐アウトラインには当たらないので注意。
  - 定義提示テロップ（白ピル見出し+太字説明文の2段組）はチャエン式のキーワードテロップと役割は近いが、「見出し+本文」の2段構造が固有。素材生成時は1テロップにつき2レイヤー（見出しPNG+本文PNG）で構成する。
