style_id: entertainment_variety
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: 実測（カット律/視覚リズム/LUFS/LRA/無音=ffmpeg実測・冒頭10分） / 推定（配色HEXは360p目視近似、n=1のためジャンル一般化はmedium）

format:
  aspect: 16:9
  typical_duration: 15-35分（企画物）
  cuts_per_min: 1.7                # 実測（scene0.3: 17カット/10分。ルール説明パートはハードカットが少ない）
  visual_rhythm_per_min: 6.1        # 実測（scene0.08: 61イベント/10分。テロップ切替・カード差し替えが体感テンポを作る=ハードカットとの乖離が大きい）
  camera: static                    # 実測（スタジオ集合ショット中心。10分セグメント範囲）
  broll_usage: occasional           # 実測（ルールカード・小窓リアクションインサートあり。ロケ企画では増加想定）

palette:
  background_hex: "#E6E1D8（スタジオ壁・座布団）"   # 推定
  brand_hex: ["#F0C94A(ルールカード金ドット地)", "#E63950(バナー赤ピンク)", "#2E7D46(手書きマーカー緑)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: "#000000"      # ルール説明の白丸カード黒文字（emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_bg: ["#FFFFFF", "#F0C94A", "#E63950"]  # #FFFFFF=ルール説明の白丸カード背景（emphasis_rolesの記述から変換）、
      # #F0C94A=ルールカード金ドット地（brand_hex実測）、#E63950=煽り見出しのバナー帯地色・赤ピンク（brand_hex実測）。
      # 煽り見出し自体の「赤太字」がE63950と同一トーンかは原文から判別不能のため
      # 見出し文字色としては採用しない
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # ※この影は4辺の検算で**右下に12px・左上に3px**張り出す（2026-07-27 実測で再訂正）。
      #   当初 offset4+blur3=7px と素朴計算したが、Pillowのぼかしは半径以上に広がり
      #   実測は右下+11〜12px。さらに**ぼかしは左上にも広がる**ので3pxの項が要る。
      #   検算式にこの項が抜けていて常時過小評価していた（schema.md参照）。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: "#2E7D46"    # ツッコミ注釈の手書き風グリーンマーカー（矢印+下線、brand_hex実測）
    color_stroke: null         # ルール説明のボタン色分け（オレンジ=メンバー案/青=視聴者案）は
      # 色名のみでHEX未記載のため未変換
    color_primary: null
    color_glow: null
  emphasis_roles:
    ルール説明: "白丸カード黒文字（ボタン色分け: オレンジ=メンバー案/青=視聴者案）"
    煽り見出し: 赤太字（バナー帯上）
    ツッコミ注釈: 手書き風グリーンマーカー（矢印+下線、口語コメント）

telop_layers:
  - role: keyword            # 手書きマーカー注釈: 緑色の手描き風文字+矢印+下線で画面内の対象物にツッコミを添える（「(動画)開いてこれって…」）。実測・他ジャンル未確認の固有要素
    position_mode: anchored_to_target   # 【2026-07-27追加】**この座標は固定値ではない**。指し示す対象（UI要素・チャートの棒・画面内の物体）の
      # 位置に追従する。散文は「対象により可変」「固定位置ではない」と書いているのに
      # positionが固定値1つしか持たず、**散文と構造化フィールドが矛盾**していた。
      # 実害: documentary_cinematicのkeywordが固定値のまま棒グラフを潰し
      # 「労働」の棒を91.8%被覆した。下記positionは代表値であり、
      # 実装は対象の実座標から算出すること
    position: {centerX: 0.3, centerY: 0.5}
    persistent: false
    style: プレーン
    z_order: 1                  # 【2026-07-27 z_order遡及追加】画面内の対象物に直接
      # 重畳する注釈のため全レイヤー中最背面。sidebar(ルールカード,2)と同じX付近
      # (centerX0.3)だが、n=1の10分セグメントでは両者の同時表示は確認されておらず
      # 別セグメントの演出と推定（下記z_order_policy参照）
    entrance: pop            # 推定（タイル間隔からは瞬時出現に見える）
    entrance_sec: 0          # 【2026-07-27追加】animation_dictionary_mappingの
      # 「in.pop（瞬時切替、フェード痕跡なし）」から導出。散文にしか無かった値
    exit: pop                # 【2026-07-27追加】exitフィールド自体が欠落していた
    exit_sec: 0              # 未計測。in.popと対称と仮定した導出値
    mutually_exclusive_with: sidebar   # 【2026-07-27追加】再実装検証で
      # **keyword×sidebar が実測87.36%不可視・文字帯は100%消滅**（目視では矢印の
      # 先端だけが宙に浮く）と確定した。yamlは「実装時にこの前提が崩れる場合は
      # 再度衝突確認が必要」と散文で書きながら排他フィールドを持っていなかった。
      # 両者はcenterX0.3で同じ帯に入るため、同時に出してはいけない
    cushion:                     # 【2026-07-27 再修正・悪化を訂正／R3で実測4.59:1を確認】
      color: "rgba(255,255,255,0.85)"
      min_contrast: 4.5
      padding_px: 16             # 【R3追加】padding が未定義で実装者が発明していた
      corner_radius_px: 8        # 同上
      measure: |                 # 【R3追加】min_contrast の**測定手順が未定義**で、
        # 測り方によって値が動いた。以下に固定する:
        # レンダリング済みフレームの実画素で、
        # (1) グリフの不透明画素の平均相対輝度 L_text
        # (2) 座布団を敷いた領域の平均相対輝度 L_bg
        # を求め、(max+0.05)/(min+0.05) を比とする。
        # 設計値でなく**実フレームで測る**こと（R3実測 4.59:1、背景L=0.8730/文字L=0.1510）
      # 旧 `requires_cushion: true` は**悪化させた**。統制実験で
      # 座布団なし **2.45:1** → 黒座布団40%で **1.03:1**（目視でも判読不能）。
      # 原因は **environment-notes.md の座布団規定が白文字を前提**していること。
      # このroleの文字色 #2E7D46 は相対輝度0.157の**暗色**なので、
      # 黒座布団は背景を文字の輝度へ近づけてしまう。
      # **座布団は文字と反対の明度側を選ぶ**のが正しい。実測:
      #   白40%=2.98:1 / **白85%=4.13:1** / 白100%=4.66:1 / 黒70%=3.15:1
      # → 白85%を採用。**実測は 4.74:1（R5・レンダリング済みフレームの実画素、
      #   L_text 0.1519 / L_bg 0.9074）で min_contrast 4.5 を上回る**。
      #   ※旧記述の「4.13:1で4.5に届かないから白100%へ上げよ」は**誤り**だった
      #     （4.13はR3の別背景での値。同ブロック内に4.13と4.59が同居していた）。
      #     白100%は5.07:1になるが意匠を余計に潰すので**上げなくてよい**。
      #   座布団なしは 2.66:1 で不合格
      # 【規則】L_text ≥ 0.5 なら黒40%、L_text < 0.5 なら白85%以上
      # 【旧記述】素の映像に直接乗る唯一のroleであり、
      # 再実装検証で**コントラスト比1.66:1**（背景輝度0.710）と実測された。
      # environment-notes.md の座布団追加条件（背景輝度0.65超）を満たすため
      # 座布団または濃い縁取りが必須。caption_fontブロックはこのroleを対象外に
      # していたので見落とされていた
  - role: nameplate          # メンバー同時名札: グループショットで複数人の名前を同時に表示（各人物の近くに個別配置、色分け）。実測
    position_mode: per_subject   # 【2026-07-27追加・実害あり】**このroleの座標は固定値ではない**。
      # 散文が「各人物の近くに個別配置」と言っているのに position は固定値1つしか
      # 持っておらず、**散文と構造化フィールドが矛盾していた**。
      # 再実装検証で3枚を同じ座標に置いたところ、アルファ実ピクセルで
      # **nameplate_0が100.00%不可視（残存0px）/ nameplate_1が79.48%不可視**となり、
      # 目視でも名札は1枚しか見えなかった。下記positionは**単独表示時の代表値**であり、
      # 複数人ぶんを出すときは各人物の顔位置に応じてXを振り分けること
    max_instances: 未計測        # 【2026-07-27追加】同時に何枚まで出るかが未計測。
      # EV1は6人組なので最大6枚を想定すべきだが実測していない
    position: {centerX: 0.5, centerY: 0.05}   # 単独表示時の代表値（上記position_mode参照）
    persistent: false
    style: プレーン
    z_order: 3                  # 【2026-07-27 z_order遡及追加】下記z_order_policyの
      # title_bar座標調整（0.15→0.20）参照。本要素とtitle_barはいずれも画面上部に
      # 位置し近接するため、title_barより背面に置いても実害が出ないよう調整済み
    entrance: pop
    entrance_sec: 0
    exit: pop                # 【2026-07-27追加】exitフィールド自体が欠落していた
    exit_sec: 0
  - role: ticker             # 常設補足キャプション: 白丸ピル型で企画背景を常時提示（「EV1は隔週でネタ会議をしています」）。実測
    size: {width: 956, height: 121}   # 【2026-07-27 R10・高さの収容検査を新設したら出た】幅の検査はR4からあったのに
      # **高さには一度も検査が無かった**。箱が中身より低いと、実装者はフォントを落とすか
      # はみ出させるかを勝手に選ぶ。
      # 97 では font44 の行高65 + padding28×2 = 121 が入らない
      # 0.26 の根拠は「フォント44px時の幅945pxでも x0=27px で画面内」であり、
      # 620ではその検算が成り立たない（箱の値だけが取り残されていた）。
      # 956 = 折返し幅900 + padding28×2。x0 = 499 − 478 = 21px（影−3で18px、画面内）
    font_px: 44   # 【2026-07-27 R8追加】caption_font の目安36-44pxのうち**最大値**。
      # 座標の導出（上記 x0=27px）が44px前提なので、ここを書かないと
      # 実装者が36pxを選んで箱と中身がずれる
    max_width_px: 900   # 【2026-07-27 R8追加】
    max_chars: 20   # 【2026-07-27 R8追加】実測文言「EV1は隔週でネタ会議をしています」が20字。
      # 20×44 = 880 ≤ 900
    max_lines: 1   # 【2026-07-27 R8追加】1行のピル型バッジ
    overflow_policy: split_event   # 【2026-07-27 R8追加】max_lines:1 のため
    padding_px: 28   # 【2026-07-27 R8追加】size.width 956 = 900 + 28×2 の 28
    char_width_px: 44   # 【2026-07-27 R10・全域掃引】欧文roleでこれが無いと max_chars が実力の半分になり、
      # 逆に和文roleで書かないと「見落としたのか全角でよいのか」が伝わらない。
      # R9で規約化したのに掃引が2ファイルで止まっていた（role単位で止まった型のファイル単位の再演）。
      # 和文が律速するので 1字の送り = font_px（全角）
    position: {centerX: 0.26, centerY: 0.918}   # 【2026-07-27 R10】高さが121になったので 0.928 では下余裕5.3px。0.918 = 991.4px で下余裕16.1px
      # 定めているのに機械照合が無く、手検算で毎周どこかが抜けていた。
      # 旧 0.93 は**下15.1px**。0.928 で下17.3px（左は18.2pxで可）
      # 0.95 は caption_font の目安36-44pxの**全3値で下端がはみ出す**
      # （+0.5 / +3.5 / **+6.5px**、実測）。切れるのはピル本体ではなく**ドロップシャドウ**。
      # 影を4辺検算に入れていなかったのが原因。
      # 0.93 = 1004.4px。**ピル実高は97px**（旧コメントの「約60px」は誤り。
      # 同じコメントの「+6.5pxはみ出し」は97pxでしか成立せず自己矛盾していた）。
      # 97px+影12pxで下端1064.9px（画面内、余裕15px）   # 【2026-07-27 見切れ修正・導出値】
      # 旧0.22は再実装検証で**左端が画面外へ出た**。caption_fontが示す目安36-44pxのうち、
      # 40pxでx0=−10px、44pxで−50pxとなり**提示3値のうち2値が破綻**していた。
      # QCは画面境界を見ないので目視でしか見つからない種類の欠陥。
      # 0.26 = 中心499px。フォント44px時の幅945pxでもx0=27pxで画面内に収まる。
      # ※このpillの本来の意味は「左端から一定マージン」であって「中心が0.22」ではない。
      #   実装は左端アンカー（x0=32px固定）で組む方が正しい。centerXはその近似値
    persistent: true
    style: 帯
    z_order: 5                  # 【2026-07-27 z_order遡及追加】常駐要素のため最前面。
      # 画面下部左寄りに固定され、他要素（画面上部/中央/右下）とは領域が分離
    entrance: pop
    entrance_sec: 0
    exit: pop                # 【2026-07-27追加】exitフィールド自体が欠落していた
    exit_sec: 0              # 常駐要素のため通常は退場しない
  - role: title_bar          # 企画タイトルバナー: 赤ピンク帯+白太字の見出し（「EV1 ネタコンペ 開催してみた」）。実測
    position: {centerX: 0.5, centerY: 0.20}   # 【2026-07-27 衝突修正】旧centerY 0.15から
      # 変更。nameplate(centerY0.05)と画面上部で近接しており、一般的なバナー高さ
      # （目安15%＝162px）とnameplate名札高さ（目安8%＝86px）を仮定した試算で
      # nameplate下端(0.05×1080+43=97px)とtitle_bar上端(旧0.15×1080-81=81px)が
      # 重なる（97px>81pxで衝突）ことが疑われた。centerYを0.20へ下げ、title_bar上端
      # (0.20×1080-81=135px)がnameplate下端(97px)を上回るよう調整。
      # ※本ファイルはn=1・360p目視のみで実寸未計測。上記は一般的なバナー/名札サイズ
      # 仮定に基づく試算であり、実装時に実フレームでの再検証を推奨する
    persistent: false
    style: 帯
    z_order: 4                  # 【2026-07-27 z_order遡及追加】企画見出しは一時的だが
      # 目立たせる必要があるためnameplate(3)より前面
    entrance: pop
    entrance_sec: 0
    exit: pop                # 【2026-07-27追加】exitフィールド自体が欠落していた
    exit_sec: 0
  - role: sidebar            # ルール説明カード: 金ドット地背景+白丸カード、番号付きルール列挙+色分けボタン。実測
    position: {centerX: 0.3, centerY: 0.4}
    persistent: false
    style: カード
    z_order: 2                  # 【2026-07-27 z_order遡及追加】画面中央寄りのカードで
      # あり、右下のリアクションPiP(caption,4)と同時表示することが実測コメントで
      # 明記されている（下記z_order_policy参照）ため、それより背面に置く
    entrance: pop
    entrance_sec: 0
    exit: pop                # 【2026-07-27追加】exitフィールド自体が欠落していた
    exit_sec: 0
    mutually_exclusive_with: keyword   # 【2026-07-27追加】手書きマーカー注釈と排他
      # （上記keyword参照。実測87.36%不可視）
    # 【2026-07-27 解釈の分岐を明記】transitions.accent に「ルールカード全画面差し込み」と
    # あるが、本roleのpositionは(0.3,0.4)の**位置指定カード**である。
    # 再実装検証で解釈が2つに割れ、QC結果が正反対になった:
    #   - 位置指定カード解釈 → caption(右下PiP)との交差0px²（yamlの主張どおり衝突なし）
    #   - 全画面差し込み解釈 → bbox_ratio 100%×2件でFAIL（z_orderは正しく効き目視は成立するが
    #     intentional_overlap_with が無いため宣言できず、QCが本物の衝突と区別できない）
    # **既定は位置指定カード解釈**とする。全画面差し込みを使う場合は別roleとして
    # 定義し opaque_fullscreen: true を付けること
  - role: caption            # 小窓リアクションインセット: ルールカード表示中も出演者の反応を右下小窓で同時提示（PiP）。実測
    layer_kind: video            # 【2026-07-27追加】このroleは**動画レイヤー**であり
      # overlap_qc の検査対象から自動的に除外される（アルファを静的に取れないため）。
      # screen_tutorialの検証では生成20レイヤーに対し element_count=19 となり、
      # **PiP絡みの衝突8件がQCに1件も現れなかった**。QCの盲点は既知でも
      # 「どのroleが盲点に落ちるか」がyamlから読めなかったので機械可読な印を付ける。
      # **このroleは必ずフレーム目視で確認すること**
    position: {centerX: 0.85, centerY: 0.85}
    persistent: true           # 【2026-07-27 矛盾の解消】旧: false。しかし
      # animation_dictionary_mapping が「リアクションPiP: **常時ワイプ窓**」と明記しており、
      # **散文と構造化フィールドが矛盾していた**（再実装検証で発覚）。
      # 「常時」を正としてtrueへ。ただし全編を通じて常駐なのか、
      # ルールカード表示中のみ常駐なのかは未計測
    style: プレーン
    z_order: 4                  # 【2026-07-27 z_order遡及追加】ルールカード(sidebar,2)
      # と実測で同時表示が確認されている装置。座標が右下(0.85,0.85)とルールカード
      # (0.3,0.4)で大きく離れており衝突なし。独立した映像窓のため前面に置く
    entrance: pop            # 【2026-07-27追加】entrance/exit とも欠落していた唯一のrole。
      # animation_dictionary_mappingの「in.pop（瞬時切替）」から導出
    entrance_sec: 0
    exit: pop
    exit_sec: 0

caption_font: |
  未計測（n=1・360p目視のため原寸不明）。このスタイルには全発話をカバーする標準字幕
  ロールが存在せず（ticker/title_bar/nameplate/sidebarはいずれも短文の見出し・
  補足キャプション）、chaenデフォルト（フォント92/黒フチ12px）をそのまま適用する
  対象が無い。採用すべきデフォルト:
  - ticker（常設補足キャプション・白丸ピル）: 目安36-44px相当（常時表示のため
    控えめなサイズを推奨）
  - title_bar（企画タイトルバナー・帯）: 目安70-90px相当（大見出しのため大きめ）
  - nameplate（メンバー名札）: 目安36-44px相当
  いずれも未計測の推定値であり、実装時は完成フレームでの目視比較を必須とする

z_order_policy: |
  ルール説明カード(sidebar,2)と小窓リアクションインセット(caption,4)は実測コメントで
  「同時提示」と明記されている唯一の確認済みペア。座標が中央(0.3,0.4)と右下(0.85,0.85)
  で大きく離れており衝突しない。
  title_bar(企画タイトルバナー,4)とnameplate(メンバー名札,3)は画面上部で近接して
  おり、一般的なバナー/名札サイズを仮定した試算で座標衝突の可能性が検出された
  （本ファイルはn=1・360p目視のみで実寸未計測のため試算値）。title_barのcenterYを
  0.15→0.20へ修正して解消した。
  keyword（手書きマーカー注釈,1）とsidebar（ルールカード,2）はX座標が近い
  (いずれもcenterX0.3)が、n=1の10分セグメントでは両者の同時表示は確認されておらず、
  手書きマーカーは別セグメント（動画リアクション企画）の固有演出と推定している。
  実装時にこの前提が崩れる場合（同一セグメントで両方使う場合）は再度衝突確認が必要。

animation_dictionary_mapping:
  テロップ全般: in.pop（瞬時切替、フェード痕跡なし）        # 実測
  手書きマーカー注釈: 辞書外（marker_annotation→v3手法で再現要。矢印+下線+緑手書きフォントの合成）
  ルールカード: in.pop + 金ドット背景テクスチャ（静止画合成）  # 実測
  リアクションPiP: 常時ワイプ窓（トラックマット不使用、矩形切り出しでPalmier実装可）

transitions:
  default: hard_cut          # 実測（ディゾルブ/ワイプ不使用）
  accent: [ルールカード全画面差し込み]   # 実測（1-2秒のカード差し込みで話題転換）

audio:
  bgm: none                  # 推定（10分セグメント内BGM未検出。素の会話+リアクションで押す）
  voice_lufs_target: -19.1   # 実測（ebur128 Integrated。egachan実測-11.6〜-13.3より静か=企画による差）
  lra: 9.8                   # 実測
  se_style: ui_pops          # 推定（テロップ切替に単発SEの可能性、波形からは断定不可）
  ducking: false

pacing:
  gap_keep_sec: 0-0.3        # 実測寄り（silencedetect -35dB/0.5s: 2回のみ/10分=ほぼ無音なし。会話を途切れさせない）
  filler_policy: keep_character   # 実測（メンバーの素の反応・かけあいが主役）
  hook: cold_open            # 実測（挨拶なしでネタコンペのルール説明から即開始）
  structure: 企画趣旨バナー→ルール説明カード群→実演（グミ味当て/カリカチュア等の企画別セグメント）   # 実測（10分セグメント範囲）

packaging:
  thumbnail_style: 未取得
  chapter_style: 企画バナー差し替えがセグメント区切り   # 実測寄り
  endcard: 未確認（10分セグメント内では検出なし）

apply_notes: |
  Palmierパイプラインでの適用:
  - visual_rhythm(6.1/分)がcuts_per_min(1.7/分)の3.6倍＝ハードカットを増やすのでなく、テロップ・カード切替の頻度でテンポを作るのが本質。カット数を無理に増やさないこと。
  - 手書きマーカー注釈（緑色・矢印+下線）は既存アニメ辞書に無いユニーク要素。実装は「素材上に矢印PNG+下線PNG+手書き風フォントテキストをoverlay」の合成レシピをkeyframes側で新規登録する必要あり（v3手法検証候補としてhyperframes-animationスキルにも共有推奨）。
  - ルール説明カード（金ドット地+白丸カード+色分けボタン）はの資料スライド枠と役割は近いが、テクスチャ背景（ドット柄）が固有。素材側で用意するか、tileパターンPNGを重ねる方式で近似。
  - 既存資産のvariety_studio_sample（バラエティ系）とは、装飾密度・高いテロップ層数・無音ゼロ主義は共通するが、このサンプルは「常設情報バー+進捗カウンター」中心、EV1は「ルールカード+リアクションPiP+手書き注釈」中心。企画物か生放送アーカイブ型かで両者を使い分ける。
