style_id: documentary_immersive
source: |
  実測サンプル: n=1。出典チャンネル・動画IDは内部の対応表で管理する
  （style-learning/_sources.md・internal-only）。
  計測法: ffmpeg scene検出(0.3/0.08) + ebur128 + silencedetect(-35dB/0.5s) + タイル絵コンテ目視。
  **この仕様の再現に出典の実名は不要**。符号（S1/P2 等）で参照すること。
confidence: |
  実測（cuts_per_min/visual_rhythm_per_min/LUFS/LRA/TruePeak/無音回数=B1・B2・B3全3本で
  ffmpeg実測）/ 目視実測（telop_layers・配色・構成=B2・B3を初回に目視、B1は2026-07-25に
  追加目視。**3本とも視覚確認済み**）/ 推定（BGM有無=聴取未実施、テロップの入退場
  アニメーション種別=サンプリング間隔の制約でサブ秒フェードは検出限界、フォント名・
  実寸=360p制約で特定不可）

  【重要な自己検証】B2(英語圏ヴログ系)とB3(日本語TV職人ドキュメンタリー)は、同じ
  「体験密着」という括りでありながら**テロップ文法が別ジャンルと言えるほど異質**である
  ことをタイル目視で確認した。B2は最小限のフレーズキャプションのみ、B3は常駐ロゴバッジ+
  二段名札+ステータスカード+発話字幕という完全なTV番組フォーマット。この二極化は
  n=2（視覚確認できた2本）の範囲内での確定事実であり、捏造ではない。詳細はapply_notes参照。

format:
  aspect: "16:9"
  duration_sec: "1056-2542（B1=2423.4/B2=2541.7/B3=1055.8）"   # 実測
  cuts_per_min: "5.99-14.53（B1=14.53/B2=5.99/B3=13.63）"   # 実測
  visual_rhythm_per_min: "13.78-32.97（B1=32.97/B2=13.78/B3=27.84）"   # 実測
  camera: "handheld_pov（B2実測: 一人称視点の手持ち・車載カメラ主体、直接カメラ目線での
    語りかけが頻繁。B3実測: 三脚固定+手持ちの併用、漁船上の作業実況カメラと座談会シーンの
    固定カメラが混在。両者とも「その場に居合わせる」臨場感を志向するが撮影手法自体は
    ジャンル固有で異なる）"
  broll_usage: "occasional（B2: 走行中の車窓・街並みの流し撮りが会話の合間に挿入される程度。
    B3: 漁の作業工程・魚市場カットが本編の主要構成要素であり、broll_usageというより本編そのもの
    に近い。両者で頻度・役割の意味合いが異なるため単純比較不可）"

palette:
  background_hex: "素材依存（両者とも実写ロケーション映像そのものが背景であり、
    グラフィック的な背景色の概念が薄い）"
  brand_hex: ["#FFFFFF(B2フレーズキャプション文字色・目視)", "#000000系半透明(B2キャプション背景座布団・目視推定)",
    "#FFFFFF(B3名札の文字色／**ステータスカードは白「背景」**・目視)", "#E91E8C系(B3発話字幕テキスト・ピンク/マゼンタ、目視確認。
    磁性の強い色で他ジャンルと明確に異なる)"]
  color_roles:                 # AKARI Video由来の7ロール共通ボキャブラリ（2026-07-27追加）
    color_text: ["#FFFFFF", "#E91E8C"]  # #FFFFFF=B2フレーズキャプション文字色/B3名札文字色（brand_hex実測）、
      # #E91E8C=B3発話字幕テキスト・ピンク/マゼンタ（brand_hex実測・系）
    color_bg: ["#000000", "#FFFFFF"]  # #000000=B2キャプション背景座布団（brand_hex推定・系半透明）、
      # #FFFFFF=B3ステータスカードの白背景（emphasis_rolesの記述より）。
      # 【2026-07-27 決着】brand_hexが「ステータスカード文字色」としていたのは誤り。
      # B3(B3)のタイルを実際に目視した記録が「ステータスカード＝白背景+黄縁の
      # 角丸バナー」であり、emphasis_rolesの記述が正しい。brand_hex側の表記を訂正済み。
      # なお同じ#FFFFFFがB3の「名札の文字色」でもあるため、両方の用途を持つ色である
    color_shadow: "rgba(0,0,0,0.4)"   # 【2026-07-27 共通デフォルトを明示】
      # 15/15ファイルでnullだったが、これは「影なし」ではなく
      # **共通デフォルトが写されていなかっただけ**。
      # environment-notes.md の確定仕様（offset 4,4px・blur 3・不透明度40%）に対応する。
      # 実装者が別ファイルを探しに行かずに済むよう各ファイルへ明示する。
      # このスタイルが影を使わない場合は "none" と書いて逸脱を可視化すること
    color_accent: null         # B3ステータスカードの黄色縁取りは色名のみでHEX未記載
      # （白/黒以外は指示により推測変換不可のため未マップ）
    color_stroke: "#000000"    # B2の黒縁取り/B3発話字幕の黒〜濃色の縁取り併用
      # （emphasis_rolesの記述から変換・原文にHEX記載なし）
    color_primary: null
    color_glow: null
  emphasis_roles:
    B2フレーズキャプション: "白文字太字、黒縁取り。色による意味の使い分けは確認されず、
      単色運用（実測目視）"
    B3発話字幕: "ピンク/マゼンタの太字袋文字（黒〜濃色の縁取り併用）。TVバラエティ的な
      強調色運用で、chaenデフォルトの黄色強調とも他ジャンルの赤系警告色とも異なる、
      B3固有の配色文化（実測目視、ズームクロップで確認）"
    B3ステータスカード: "白背景+黄色縁取りの角丸バナー（「出港」「1つ目の漁場に到着」等の
      進行状況を示す短いラベル）。実測目視"

telop_layers:
  - role: caption              # 【変種: B2のみ・2026-07-27 監査3対応で明示】B3のcaption
    # 【2026-07-27 注意】B3のcaptionには実測に基づく max_chars:9 を設定したが、
    # **B2には設定していない**。B2変種で person_nameplate と共起するかを未計測のため、
    # 未検証の制約を書かない方針による。B2で下部に別要素を重ねる場合は、
    # 下記z_order_policyの帯域計算と同じ検算を実施すること。
    # （発話字幕、下記）と同一role名を共有するが、B2/B3は互いに排他的な変種のため同時表示
    # されない（jp_vs_en_visual_grammar_split参照）。正当な変種スコープの重複であり分離不要。
    # B2: フレーズキャプション。発話の要点を1〜数語で下部左寄せに
    # 表示。フルセンテンスではなく短いフレーズ抜き出し型（"PHILADELPHIA" "NOT AN EASY
    # PLACE" 等）。実測（hook区間で複数確認、full区間では話者が沈黙する走行シーン等で
    # キャプション無しの区間も多い＝発話追従で断続的にON/OFF）
    position: {centerX: 0.24, centerY: 0.90}
    persistent: false
    style: 帯なし・直接重畳
    z_order: 1
    variant: variant_B2   # 【2026-07-27追加】【変種: xx】という日本語コメントはパーサから読めないためフィールド化
    mutually_exclusive_with: caption   # 【2026-07-27追加】同一role名のもう一方の変種と排他。同時表示されない
    entrance: hard_cut          # 未計測（45秒/2秒間隔サンプリングのためサブ秒フェードは
      # 検出限界。前後の切り替わりが瞬間的に見えることからの推定、fade_sec=0と仮定）
    exit: hard_cut               # 未計測（同上）
  - role: person_nameplate      # 【2026-07-26 適用検証で修正】B3: 二段名札。
    # ※旧: role: nameplate だったが、同ファイル内で「常駐ロゴバッジ」にも nameplate が
    #   割り当てられており**別装置が同一roleを共有**していた。person_nameplate へ分離。
    # 上段に小さく所属（「九石大敷組合」）、
    # 下段に大きく氏名+年齢（「笹岡宣之(55)」）。実測（hook区間で複数フレーム確認、
    # 位置・書式が安定して再現）
    position: {centerX: 0.28, centerY: 0.78}   # 【2026-07-26 修正】旧0.86は字幕(0.90)と43px差しかなく
      # **構造的に衝突が確定していた**（適用検証でoverlap_qc FAIL・pixel_collision 99.8%を実測。
      # z_order上は字幕が前面に来るため、字幕表示中は名札が完全に不可視になっていた）。
      # 字幕2行(フォント92で約200px)の上端872pxより上に退避させるため0.78(=842px)へ変更。
    persistent: false
    style: プレーン（背景に薄い暗色座布団）
    z_order: 3
    variant: variant_B3   # 【2026-07-27追加】【変種: xx】という日本語コメントはパーサから読めないためフィールド化
    entrance: hard_cut           # 未計測（推定）
    exit: hard_cut                # 未計測（推定）
  - role: sidebar               # 【変種: B3のみ・2026-07-27 監査3対応で明示】B1のsidebar
    # （地図グラフィック、下記）と同一role名を共有するが、B1/B3は互いに排他的な変種のため
    # 同時表示されない。正当な変種スコープの重複であり分離不要。
    # B3: ステータスカード。白背景+黄縁の角丸バナーで
    # 「出港」「1つ目の漁場に到着」等、時系列の進行状況を示す短いラベル。実測
    position: {centerX: 0.15, centerY: 0.60}
    persistent: false
    style: カード
    z_order: 2
    variant: variant_B3   # 【2026-07-27追加】【変種: xx】という日本語コメントはパーサから読めないためフィールド化
    mutually_exclusive_with: sidebar   # 【2026-07-27追加】同一role名のもう一方の変種と排他。同時表示されない
    entrance: pop                 # 推定（他要素との入れ替わりのタイミングから瞬間出現と推測、
      # フレーム単位検証は未実施）
    exit: pop                      # 推定
  - role: caption               # 【変種: B3のみ・2026-07-27 監査3対応で明示】B2のcaption
    # （フレーズキャプション、上記）と同一role名を共有するが、B2/B3は互いに排他的な変種のため
    # 同時表示されない。正当な変種スコープの重複であり分離不要。
    # B3: 発話字幕（キーワード級の短文、フルセンテンスではなく
    # 抜き出し型）。ピンク/マゼンタ太字袋文字、画面下部中央〜やや左。実測（クロップズームで
    # 色・書式を確認）
    overflow_policy: split_event   # 【2026-07-27 R6 一括掃引】`max_lines: 1` だけでは折返しは止まらない。
      # 折返し器は max_chars で改行するので**結果の各行は制約を満たしたまま2行になる**
      # （ai_tool_avatarで実測。**documentary_immersive が退行したという私の当初の報告は誤り**で、
      #  R6のFAILは検証者が意図的に作った違反対照窓＝14字「max_lines:1 違反の対照」だった。
      #  掃引そのものは正しい——10ファイルが本当にこのフィールドを欠いていた）。
      # 超過は折り返さず**複数のテロップイベントへ分割する**
    position: {centerX: 0.35, centerY: 0.90}   # 【2026-07-26 注記】centerYを**幾何中心**として
      # 解釈すると、2行字幕(フォント92で約200px)+黒フチ12pxが下端1084pxとなり**約18px見切れる**
      # （適用検証で実測）。**centerYは「最終行のベースライン基準」または「下端基準」として
      # 解釈するか、2行以上になる場合はcenterYを0.86程度へ繰り上げること**。
      # 根本原因はyamlのposition解釈規約が未定義だったこと。**この検証がきっかけで
      # 規約が制定され、現在は style-learning/schema.md §5 に定義済み**（2026-07-27に
      # 確認して追記）。旧記述は本ファイル内の存在しない `position_semantics`
      # セクションを指すダングリング参照であり、「未定義」という主張も既に誤りだった。
    max_width_px: 900            # 【2026-07-27追加】max_charsが成立する前提条件。
      # max_chars は「フォント92・折返し幅900px」という前提の上でのみ有効な派生値であり、
      # 前提が書かれていないとフォントを変えた瞬間に9字が無意味になる（脆い定数になる）。
      # schema.md の規約に従い併記する
    max_lines: 1                 # 【2026-07-27 退行の修正】
      # **私の一括補完が入れた `max_lines: 2` はこのstyleを退行させた**。
      # 同ファイルの z_order_policy は「2行字幕は幾何的に成立しない／解は **max_lines: 1**（2026-07-27 R3訂正。旧記述「解は max_chars:9 の遵守」は**誤り**だった。14字を折り返すと9字+5字で**max_charsを1文字も違反しない**ため、文字数では止まらない。行数の制約は max_lines にしかない）」と
      # 書いており、**同じファイル内で正面から矛盾**していた。
      # 検算: 9字=828px(1行) / 10字=920px>900(2行) ＝ **max_chars:9 を守る限り行数は必ず1**。
      # つまり `max_lines: 2` は安全上限ではなく**破綻状態にだけ効く許可証**だった。
      # 実測で14字2行は名札を bbox 84.1%/pixel 98.87% で潰し「笹岡宣之(55)」が完全に消えた
      # ＝**フィールドを守ったまま同じ破綻を作れてしまう**状態。         # 【2026-07-27追加・規約違反の解消】幅を縛るなら行数も縛る。
      # 実測で、幅だけ縛ると**行数が増えて事態が悪化する**ことが4スタイルで確認された
      # （japan_vlog 3行31px→4行86px侵入 / wipe captionのPiP重なり15.9%→31.0% /
      #  investigativeの見出しが3行化してkeywordを100%被覆）。
      # 3行以上必要な発話は**複数のテロップイベントに分割する**
    max_chars: 9                 # 【2026-07-27 収束確認Cの実レンダリングで確定】
      # 従来この制約は「キーワード級の短文、フルセンテンスではなく抜き出し型」という
      # **散文でしか書かれておらず機械可読でなかった**ため、実装者が2行字幕を生成し
      # 名札を99.7%覆い隠す事故が起きた（下記z_order_policyの帯域計算を参照）。
      # 値の根拠: フォント92・折返し幅900pxで「漁場に到着しました」(9字)=843pxが1行に収まり、
      # 10字だと900pxを超えて2行に折り返すことを実測。**9字が1行に収まる上限**。
      # このstyleでは2行字幕は幾何的に成立しない（下記参照）ため、9字は
      # 「推奨」ではなく**守らなければ破綻する上限**である。
    persistent: false
    style: 袋文字
    z_order: 4                   # このジャンルで確認された最前面（発話内容が最優先で
    variant: variant_B3   # 【2026-07-27追加】【変種: xx】という日本語コメントはパーサから読めないためフィールド化
    mutually_exclusive_with: caption   # 【2026-07-27追加】同一role名のもう一方の変種と排他。同時表示されない
      # 視認される必要があるため、実装上も最前面に置くことを推奨）
    entrance: pop                  # 推定（サブ秒精度は未検証）
    exit: pop                       # 推定
  - role: logo_badge            # 【2026-07-26 適用検証で修正】旧: role: nameplate。
    # 二段名札と同一roleを共有していたため logo_badge へ分離。
    # B3: 常駐ロゴバッジ（番組ロゴ「B3」+副題テキストが
    # 画面上部に常時表示）。実測
    variant: variant_B3          # 【2026-07-27追加】**7role中これだけ variant が無かった**。
      # schema.md の「省略時＝全変種共通」に従うと B1/B2 区間にも「B3」ロゴが出る
      # （t=17.5 の実フレームで確認）。散文とも矛盾していた
    size: {width: 440, height: 133}   # 【境界解・2026-07-27 R7実測】**縦の余裕0.0px**（内寸109 = 2段の行高109）。
      # 破れる条件: font_px_logo/sub を1px上げる / フォントファイルを替えて行高が変わる。
      # R7で自分でレンダリングして目視確認済み（副題は座布団の中に収まり判読可）
      # 旧96の根拠「48+26+padding22=96（**R5訂正: これは旧size 96 時代の式**。現行は実測の行高70+39=109 + padding24 = 133）」は**フォント指定値の足し算**で、
      # 実寸の行高は **70+39=109px**（padding 0 でも13px超過）、幅も副題396px > 内幅356px。
      # 実描画は404x117になり、**副題が黒座布団の外に出て素の映像の上に乗った**。
      # padding 12 として内寸 416x109 → 副題396px ≤ 416 ✓ / 行高109 ≤ 109 ✓。
      # 【境界解の警告・2026-07-27 R5】**縦の余裕は0px**（行高109 = 内寸109）。
      # フォントを1px上げるか、フォントファイルを替えて行高が変わると即破れる。
      # 実測では副題インクが座布団に左22/上90/右25/下17pxの余白で内包されており
      # 現状は健全だが、余裕が無いことを承知して触ること。
      # **フォントを足したら size を検算し直す**（箱と中身のどちらか一方だけ決めると破綻する）。
      # 【旧記述】旧58は上端切断こそ直したが、
      # **58pxに散文どおり2段を収めるとロゴ27px・副題6pxまで縮み、副題が判読不能**になった
      # （拡大目視で確認）。切断は消えたが読めなくなったので改善になっていない。
      # 下記フォントが収まる96pxへ。**箱だけ決めると実装者が中身を潰して収める**
    font_px_logo: 48             # 【2026-07-27 R3追加】上段（番組ロゴ）
    font_px_sub: 26              # 【2026-07-27 R3追加】下段（副題）。48+26+padding22=96（**R5訂正: これは旧size 96 時代の式**。現行は実測の行高70+39=109 + padding24 = 133）
    exit_sec: 0.35   # 【2026-07-27 R9追加】**fade と書きながら秒数が無く、実装者が発明していた**。
      # schema.md の共通既定値 0.35 を明示する。これは実測ではなく既定値なので、
      # 実素材で計測できたら上書きすること
    position: {centerX: 0.5, centerY: 0.09}   # 【2026-07-27 R4 再々修正】
      # 高さ133pxになったため 0.06=64.8px では上端が−1.7pxで画面外。
      # 0.09=97.2px、上端30.7px（影の左上3pxを引いて27.7px）で画面内
      # 0.03=32.4px では高さ58pxのバッジが**上へ9px切断**される（実測）。
      # 0.04=43.2px。**高さ96pxなので上端は−4.8pxで画面外**。
      # 【2026-07-27 R3 再修正】centerY を 0.06 へ（64.8px、上端16.8px、影3pxを引いて13.8px）
    persistent: true
    style: プレーン
    z_order: 5                    # 常駐要素として最前面固定
    entrance: hard_cut             # 実測（動画開始と同時に完成形で表示、フェードなし）
