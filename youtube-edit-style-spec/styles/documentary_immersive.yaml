apply_notes: |
  chaen-youtube-editパイプラインでの適用方法・実装上の注意点:

  【最大の注意点: B系は一枚岩のスタイルではない】「体験密着」という括りは音響面
  （LUFS -13.7〜-16.8で比較的近い）では成立するが、**視覚文法はB2(英語圏ヴログ)と
  B3(日本語TV型)で別ジャンルと呼べるほど異なる**。適用時は必ず「どちらの系統に
  寄せるか」をこうすけに確認するか、対象素材の言語圏・チャンネル文化に応じて
  以下のいずれかを選ぶこと:
  1. **B2系（ミニマル・ヴログ型）**: フレーズキャプション（白文字・黒縁・単色）のみ、
     常駐要素なし。screen_tutorialやjapan_vlogに近い控えめな運用。
  2. **B3系（TV職人密着型）**: 常駐ロゴバッジ+二段名札+ステータスカード+色付き
     （ピンク/マゼンタ）発話字幕のフルセット。既存のai_biz_pitchやeducational_explainer
     の常駐アウトライン文化に近いテロップ密度。

  【音響は統一しやすい】LUFS-13.7〜-16.8・TruePeak0.7〜1.1dBFSと、A系ほどのばらつきが
  無い。体験密着系のマスタリング目標としては-14〜-15LUFS付近を暫定デフォルトとして
  採用してよい（3本中2本がこのレンジに収まる）。

  【既存10スタイルとの最大の差分】japan_vlog（ローランド実測）が「控えめなキャプション・
  広いLRA」という近い方向性を既に持っているが、B3のような『色付き発話字幕+進行状況
  ステータスカード』というTV番組的な情報設計は既存スタイルに無い新規パターン。
  「体験のリアルタイム性」をステータスカードで可視化する手法は、他ジャンル
  （出港/到着等の進行ラベル）にも転用可能な汎用テクニックとして記録に値する。

  【未確認・今後の検証課題（正直に明記）】
  1. ~~B1(B1)のタイル絵コンテが存在せず、視覚文法が完全に未確認~~
     → **2026-07-25にタイルを追加生成し目視で解消**。B1は本yamlの英語圏側の記述
     （ミニマルな単色キャプション）と整合することを確認した。実測で確認できたもの:
     ①場所・文脈ラベルの小さな白文字キャプション（例「Flight 576 to Corvo」画面左下）
     ②航路を示す地図グラフィック（都市名ラベル付き）
     ③スポンサー/CTA表示（「Click the link in the description ↓↓↓」＋QRコード）
     ④ビデオ通話画面のキャプチャをそのまま素材として使用
     ⑤ドローン空撮の情景ショット、手持ちPOV、現地の人物との同録会話
     ⑥常時の発話字幕は無し（B3=B3のフル字幕とは対照的）
     フォーマルなロワーサード（名前・肩書の帯）は確認されず、会話は字幕なしで進行する。
  2. B2/B3ともにサブ秒精度でのアニメーション検証（フェード有無等）は未実施。
  3. BGM・SE・ducking・filler_policyは聴取未実施のため全て未検証。
  4. **視覚文法もn=3に到達済み**（2026-07-25にB1を追加目視して解消）。ただし
     「英語圏2本(B1/B2)=ミニマル型 / 日本語1本(B3)=TV型」という構図のため**日本語側は依然n=1**。
     「体験密着系」というジャンル全体への一般化は
     現時点でlow-medium confidence。とりわけB3のような日本語TV型が『体験密着』ジャンルの
     どの程度を代表するかは1本のみでは判断不可。
