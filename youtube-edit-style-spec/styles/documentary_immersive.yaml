z_order_policy: |
  【2026-07-27 追記・実レンダリングで確定した幾何制約】
  B3系の下部左側は **status card / person_nameplate / caption の3要素が縦に密集**しており、
  字幕が2行になった瞬間に**どこに名札を置いても収まらなくなる**。1080pでの実測:

  | 要素 | 実測ボックス(y) | 備考 |
  |---|---|---|
  | status card (z=2) | 610-687 | 高さ77px |
  | person_nameplate (z=3) | 781-905 | 高さ124px |
  | caption 1行 (z=4) | 921-1033 | 名札下端との間隔16px ✅ |
  | caption 2行 (z=4) | 815-1061 | 名札に90px食い込む ❌ |

  2行字幕時に名札が入れる帯域は **status下端687 〜 字幕上端815 = 128px** しかなく、
  名札の高さ124pxを引くと余裕は**合計4px**。上下に最低限の余白すら取れない。
  実際に名札のcenterYを0.78→0.68へ下げて検証したところ、字幕との衝突は解消したが
  **今度はstatus cardに87px×14pxで衝突**し、トレードオフにしかならないことを確認した。

  → **したがって解は座標移動ではなく `caption.max_chars: 9` の遵守**である。
  上表の通り1行字幕なら現行座標(名札0.78)のままで16pxのクリアランスが確保でき、
  overlap_qc も PASS(要素12・衝突0・終了コード0)、目視でも氏名まで完全に可読。
  検証成果物: dist/documentary_immersive_v3_verify.mp4（v2は2行字幕での失敗記録として保存）

  【2026-07-27 監査3対応】caption(B2/B3)・sidebar(B1/B3)の同一role名重複はいずれも
  「互いに排他的な変種間の重複」であり欠陥ではないと判定した（telop_layers本体の各エントリに
  【変種: xx】ラベルを追加して明示済み）。B1とB2はともに「B2系（ミニマル・ヴログ型）」に
  分類される英語圏チャンネルだが実測ソースは別動画のため、B1のsidebar(地図グラフィック)と
  B2のcaption(フレーズキャプション)が同一プロジェクト内で共起するかは未検証（判定保留。
  両者ともサイズ実測が無く座標検算不可）。実装時にB1系の装置(sidebar/cta_banner)とB2系の
  caption を併用する場合はoverlap_qc実行＋フレーム目視での確認を必須とする。

  B3は複数レイヤーが同時表示される（名札+ステータスカード+発話字幕+
  常駐ロゴが画面内に同時に存在する場面を確認）。z_order値はリスト順=重なり順の原則に
  従い、発話字幕(4)を名札・カードより前面、常駐ロゴ(5)を最前面固定とする。B2は
  フレーズキャプション単独表示が基本でz_order競合は実質発生しない。B1はB3と同時表示
  されない別チャンネル（変種）のため、B1固有の地図グラフィック(sidebar,2)とCTAバナー
  (cta_banner,3)はB3のnameplate(3,5)/caption(4)群と数値が重なっても比較対象にならない。
  B1内部では地図グラフィックがCTAバナーより背面（地図の上にCTA帯が重なる想定）

